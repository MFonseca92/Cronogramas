<title>Central de Recursos — teste local</title>
<!-- Ícone embutido: sem isto o navegador pede /favicon.ico e leva 404 em toda
     abertura. Não quebra nada, mas suja o console e faz procurar defeito
     onde não tem. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  /* Aplicativo de tela cheia — sem o card centralizado com max-width que sobrava
     espaço morto nas laterais e "espremia" o layout de barra lateral. */
  html, body { margin: 0; height: 100%; background: #F4F7F7; font-family: 'Inter', sans-serif; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================================
 * CAMADA DE PERSISTÊNCIA — ÚNICO PONTO A TROCAR PRA IR PRA BANCO/SERVIDOR
 * ============================================================================
 * Todo o resto do app fala SÓ com `window.storage`. Nenhum componente acessa
 * localStorage direto. Trocar este bloco por chamadas HTTP é o que faz o app
 * virar multiusuário — nada acima daqui precisa mudar de forma.
 *
 * Contrato (4 métodos, todos assíncronos, todos podendo devolver null em erro):
 *   get(key, shared)            -> { key, value: <string JSON>, shared } | null
 *   set(key, value, shared)     -> { key, value, shared } | null
 *   delete(key, shared)         -> { key, deleted: true, shared } | null
 *   list(prefix, shared)        -> { keys: [...], prefix, shared } | null
 * `key` é o nome da coleção (ver KEYS lá embaixo: "crb2-bookings" etc.).
 * `value` é sempre a coleção INTEIRA serializada em JSON.
 * `shared: true`  = dado do setor (reservas, cadastros) — vai pro banco.
 * `shared: false` = preferência local da pessoa (tema, último login) — pode
 *                   continuar no navegador mesmo depois do servidor.
 *
 * ---------------------------------------------------------------------------
 * O QUE PRECISA MUDAR PRA 20+ PESSOAS AO MESMO TEMPO (sendo honesto):
 * ---------------------------------------------------------------------------
 * 1) HOJE NÃO É MULTIUSUÁRIO DE VERDADE. localStorage é por navegador: duas
 *    pessoas em duas máquinas veem dados DIFERENTES e nunca se encontram. Isso
 *    não é um ajuste de performance, é a mudança principal. Só some quando
 *    existir um servidor com banco único.
 *
 * 2) GRAVAÇÃO É COLEÇÃO INTEIRA (last-write-wins). Hoje salvar uma reserva
 *    reescreve TODAS as reservas. Com 20 pessoas, duas editando estudos
 *    diferentes ao mesmo tempo — a última grava por cima da outra e some
 *    alteração sem ninguém perceber. No servidor isso vira endpoint por
 *    registro (POST/PATCH/DELETE em /bookings/:id), não PUT da lista toda.
 *    O formato atual já ajuda: cada item tem `id` estável e as coleções são
 *    planas, então viram tabelas quase 1:1.
 *
 * 3) O POLLING DE 5s RELÊ TUDO. Serve pro localStorage (custo zero), mas
 *    contra servidor seriam ~20 pessoas x 12 recargas/min x todas as coleções.
 *    Trocar por: WebSocket/SSE empurrando só o que mudou, ou pelo menos
 *    ETag/If-None-Match + endpoint "mudou desde X". O código já concentra isso
 *    num lugar só (`loadAll`), então é troca localizada.
 *
 * 4) AUTENTICAÇÃO É DE MENTIRA. O PIN é comparado no cliente e fica salvo em
 *    texto puro. Serve pra "identificar quem é" numa rede interna confiável,
 *    NÃO pra proteger dado. No servidor: sessão/token, hash do PIN, e as
 *    permissões (canI) precisam ser checadas TAMBÉM no backend — o gate atual
 *    é só de interface e qualquer um contorna pelo console.
 *
 * 5) VELOCIDADE. Com banco, o que pesa é buscar tudo sempre. As telas já
 *    filtram por data/estudo, então os endpoints devem aceitar esses filtros
 *    (ex.: /bookings?from=&to=) em vez de devolver a base inteira. Índices
 *    óbvios: bookings(date), bookings(studyId), timepoints(studyId).
 *
 * ---------------------------------------------------------------------------
 * O ADAPTADOR DE SERVIDOR JÁ ESTÁ PRONTO AQUI EMBAIXO
 * ---------------------------------------------------------------------------
 * `serverStorage()` implementa o mesmo contrato falando com o servidor de
 * referência (Cronogramas/server.js, SQLite). Ele resolve os itens 1, 2, 3 e 5
 * acima; o item 4 (autenticação) continua pendente e depende de decisão de
 * ambiente — está descrito no cabeçalho do server.js.
 *
 * COMO LIGAR: abra o HTML pelo próprio server.js
 *   node server.js   e acesse http://localhost:8124
 * O servidor entrega este arquivo já com o backend configurado. Nenhuma
 * outra linha do app muda.
 *
 * O `localStorage.setItem("crb.backend", "http://servidor:8124")` também
 * existe, mas SÓ funciona quando a página já está na mesma origem do
 * servidor (por exemplo, pra apontar de um host pra outro dentro da rede
 * com a página servida por ele). Abrir o HTML de um arquivo local ou de
 * outro servidor e apontar pra cá NÃO funciona: o servidor não manda
 * cabeçalho CORS nem responde OPTIONS, de propósito — liberar CORS num
 * backend sem autenticação seria deixar qualquer página da internet ler e
 * escrever no banco de vocês. Sirva o HTML pelo próprio servidor.
 *
 * Pra voltar pro modo local: localStorage.removeItem("crb.backend").
 * ========================================================================= */

    const nsKey = (key, shared) => `crb-local:${shared ? "shared" : "private"}:${key}`;
    const localStorageAdapter = {
      async get(key, shared) {
        try {
          const raw = localStorage.getItem(nsKey(key, shared));
          if (raw === null) return null;
          return { key, value: raw, shared: !!shared };
        } catch { return null; }
      },
      async set(key, value, shared) {
        try {
          localStorage.setItem(nsKey(key, shared), value);
          return { key, value, shared: !!shared };
        } catch { return null; }
      },
      async delete(key, shared) {
        try {
          localStorage.removeItem(nsKey(key, shared));
          return { key, deleted: true, shared: !!shared };
        } catch { return null; }
      },
      // Cria a coleção só se ela ainda não existir, e devolve o que ficou
      // valendo. Num navegador só isso é trivial; contra servidor é o que
      // impede duas pessoas abrindo o sistema pela primeira vez ao mesmo tempo
      // de semearem a base duas vezes (ver serverStorage.create).
      async create(key, value, shared) {
        const existing = await this.get(key, shared);
        if (existing) return existing;
        return this.set(key, value, shared);
      },
      // Sem servidor não existe transação de verdade: aplica em sequência. Num
      // navegador só isso basta (não há outro cliente pra ver o meio do
      // caminho), mas fica explícito que a garantia é do backend.
      //
      // As REGRAS, porém, são as mesmas do servidor — inclusive rejeitar delta
      // que fura o mínimo. Sem isso o modo local aceitaria consumir 5 de um
      // estoque de 3 (virando 0) e o mesmo teste passaria aqui e falharia
      // contra o servidor, que é o pior tipo de diferença entre ambientes.
      async transaction(changes) {
        // Pré-condições valem aqui também, pela mesma razão do `min` do delta:
        // regra que passa no modo local e falha contra o servidor é o pior
        // tipo de diferença entre ambientes.
        for (const ch of changes) {
          for (const e of ch.expects || []) {
            const atual = await this.get(e.collection || ch.key, true);
            const lista = atual ? JSON.parse(atual.value) : [];
            const reg = lista.find((x) => x.id === e.id);
            // "ainda não pode existir" — usado pela semeadura da base vazia.
            if (e.absent) {
              if (reg) return { ok: false, conflicts: [e.message || `${e.id} já existe`] };
              continue;
            }
            if (!reg) return { ok: false, conflicts: [`${e.id} não existe em ${e.collection || ch.key}`] };
            const vazio = (v) => v === null || v === undefined;
            const valor = reg[e.field];
            if (!((vazio(valor) && vazio(e.equals)) || valor === e.equals)) {
              return { ok: false, conflicts: [e.message || `${e.field} de ${e.id} mudou desde que a tela leu`] };
            }
          }
        }
        for (const ch of changes) {
          for (const d of ch.deltas || []) {
            const atual = await this.get(ch.key, true);
            const lista = atual ? JSON.parse(atual.value) : [];
            const alvo = lista.find((x) => x.id === d.id);
            if (!alvo) return { ok: false, conflicts: [`registro ${d.id} não existe em ${ch.key}`] };
            const novo = Number(alvo[d.field] ?? 0) + Number(d.delta || 0);
            if (d.min != null && novo < Number(d.min)) {
              return { ok: false, conflicts: [`${d.field} de ${d.id} ficaria em ${novo}, abaixo do mínimo ${d.min}`] };
            }
          }
        }
        for (const ch of changes) {
          const atual = await this.get(ch.key, true);
          let lista = atual ? JSON.parse(atual.value) : [];
          if (ch.replaceWith) lista = ch.replaceWith;
          for (const d of ch.deltas || []) {
            lista = lista.map((x) => (x.id !== d.id ? x : { ...x, [d.field]: Number(x[d.field] ?? 0) + Number(d.delta || 0) }));
          }
          const r = await this.set(ch.key, JSON.stringify(lista), true);
          if (!r) return { ok: false, conflicts: [`falha ao gravar ${ch.key}`] };
        }
        return { ok: true };
      },
      async list(prefix, shared) {
        try {
          const scope = shared ? "shared" : "private";
          const found = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            const marker = `crb-local:${scope}:`;
            if (k && k.startsWith(marker)) {
              const realKey = k.slice(marker.length);
              if (!prefix || realKey.startsWith(prefix)) found.push(realKey);
            }
          }
          return { keys: found, prefix, shared: !!shared };
        } catch { return null; }
      },
    };

    /* ---------------------------------------------------------------------
     * Adaptador de servidor
     *
     * Mesmo contrato de 4 métodos, mas com duas diferenças que são o motivo
     * de ele existir:
     *
     * 1) GRAVAÇÃO POR REGISTRO. O app continua entregando a coleção inteira
     *    (nada acima daqui muda), mas o adaptador compara com a última cópia
     *    que leu e manda só o que de fato mudou: upserts dos registros
     *    alterados e deletes dos removidos. Duas pessoas mexendo em reservas
     *    diferentes deixam de se apagar, que é o problema real do modelo de
     *    "salvar a lista toda".
     *
     * 2) POLL BARATO. Cada coleção tem versão no servidor. O adaptador manda
     *    a versão que tem e recebe 304 vazio quando nada mudou — com 20
     *    pessoas recarregando a cada 5s, é isso que segura a conta.
     *
     * Preferência pessoal (shared:false — tema, último login) continua no
     * navegador: não faz sentido ocupar o banco com isso.
     * ------------------------------------------------------------------- */
    function serverStorage(baseUrl) {
      const base = baseUrl.replace(/\/+$/, "");
      // Última cópia conhecida de cada coleção: versão + registros por id.
      // É contra ela que o diff da escrita é calculado.
      const snapshots = new Map();
      const idOf = (item, i) => (item && item.id != null ? String(item.id) : `__idx_${i}`);
      // Coleção que não é lista (a matriz de permissões é um objeto só) vira um
      // registro único de id fixo, pro servidor não precisar saber a diferença.
      // O embrulho tem que ser desfeito na LEITURA também — sem isso o app lê a
      // caixa em vez do conteúdo e grava caixa dentro de caixa a cada escrita.
      const SINGLETON = "__singleton";
      const isWrapped = (items) => items.length === 1 && items[0] && items[0].id === SINGLETON && "value" in items[0];
      const unwrap = (items) => (isWrapped(items) ? items[0].value : items);
      const wrap = (parsed) => (Array.isArray(parsed) ? parsed : [{ id: SINGLETON, value: parsed }]);

      const readCollection = async (key) => {
        const snap = snapshots.get(key);
        const url = `${base}/api/${encodeURIComponent(key)}${snap ? `?since=${snap.version}` : ""}`;
        const r = await fetch(url, { credentials: "include" });
        if (r.status === 304 && snap) return snap;
        if (!r.ok) return null;
        const body = await r.json();
        const next = { version: body.version, items: body.items || [] };
        snapshots.set(key, next);
        return next;
      };

      return {
        async get(key, shared) {
          if (!shared) return localStorageAdapter.get(key, shared);
          try {
            const snap = await readCollection(key);
            // Coleção que nunca recebeu nada devolve null, igual ao
            // localStorage — é o que dispara o seed na primeira carga.
            if (!snap || (snap.version === 0 && snap.items.length === 0)) return null;
            return { key, value: JSON.stringify(unwrap(snap.items)), shared: true };
          } catch { return null; }
        },
        async set(key, value, shared) {
          if (!shared) return localStorageAdapter.set(key, value, shared);
          try {
            const items = wrap(JSON.parse(value));
            // Garante que temos com o que comparar antes de calcular o diff.
            if (!snapshots.has(key)) await readCollection(key);
            const before = new Map((snapshots.get(key)?.items || []).map((it, i) => [idOf(it, i), it]));
            const upserts = [];
            const seen = new Set();
            items.forEach((it, i) => {
              const id = idOf(it, i);
              seen.add(id);
              const prev = before.get(id);
              if (!prev || JSON.stringify(prev) !== JSON.stringify(it)) upserts.push({ ...it, id });
            });
            const deletes = [...before.keys()].filter((id) => !seen.has(id));
            if (!upserts.length && !deletes.length) return { key, value, shared: true };
            const r = await fetch(`${base}/api/${encodeURIComponent(key)}`, {
              method: "POST", credentials: "include",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ upserts, deletes }),
            });
            // O servidor é quem decide conflito de agenda. Recusa vem como 409 e
            // precisa CHEGAR na tela: engolir isso faria a pessoa achar que
            // gravou. Junto vem o estado atual, que já atualiza o snapshot.
            if (r.status === 409) {
              const body = await r.json();
              if (body.items) snapshots.set(key, { version: body.version, items: body.items });
              return { key, shared: true, rejected: true, conflicts: body.conflicts || [body.error || "conflito"] };
            }
            if (!r.ok) return null;
            const body = await r.json();
            snapshots.set(key, { version: body.version, items });
            return { key, value, shared: true };
          } catch { return null; }
        },
        // Semeadura à prova de dois clientes ao mesmo tempo. Grava com
        // `ifVersion: 0` ("só se ninguém tiver escrito ainda"); se outro
        // cliente chegou primeiro, o servidor devolve 409 com o conteúdo dele e
        // este cliente ADOTA esse conteúdo em vez de gravar o seu.
        //
        // Sem isso, duas pessoas abrindo o sistema pela primeira vez juntas
        // semeavam cada uma a sua base: como os IDs são gerados na hora, as
        // salas de uma não batiam com as atividades da outra e nada agendava.
        async create(key, value, shared) {
          if (!shared) return localStorageAdapter.create(key, value, shared);
          try {
            const snap = await readCollection(key);
            if (snap && (snap.version > 0 || snap.items.length > 0)) {
              return { key, value: JSON.stringify(unwrap(snap.items)), shared: true };
            }
            const items = wrap(JSON.parse(value));
            const r = await fetch(`${base}/api/${encodeURIComponent(key)}`, {
              method: "POST", credentials: "include",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ ifVersion: 0, upserts: items.map((it, i) => ({ ...it, id: idOf(it, i) })), deletes: [] }),
            });
            if (r.status === 409) {
              const body = await r.json();
              snapshots.set(key, { version: body.version, items: body.items || [] });
              // Dois 409 diferentes chegam aqui e NÃO podem ser tratados igual:
              //  - `conflicts` presente = o servidor recusou o conteúdo por
              //    violar uma regra (conflito de agenda). Precisa aparecer.
              //  - sem `conflicts` = outro cliente semeou primeiro; aí sim é só
              //    adotar o que ele gravou.
              if (body.conflicts) return { key, shared: true, rejected: true, conflicts: body.conflicts };
              return { key, value: JSON.stringify(unwrap(body.items || [])), shared: true };
            }
            if (!r.ok) return null;
            const body = await r.json();
            snapshots.set(key, { version: body.version, items });
            return { key, value, shared: true };
          } catch { return null; }
        },
        /* Grava em várias coleções de uma vez, tudo ou nada, no servidor.
         * Cada mudança é `{ key, replaceWith?, deltas?, expects? }`:
         *   replaceWith  a lista nova (o diff por registro sai daqui, igual ao `set`)
         *   deltas       operação incremental que o servidor aplica lendo o
         *                valor atual — é assim que o estoque não sofre lost update
         *   expects      pré-condição: `{ id, field, equals, collection? }`,
         *                checada DENTRO da transação. É o que impede a mesma
         *                operação de acontecer duas vezes quando duas pessoas
         *                clicam ao mesmo tempo. */
        async transaction(changes) {
          try {
            const payload = [];
            for (const ch of changes) {
              const mudanca = { collection: ch.key, upserts: [], deletes: [], deltas: ch.deltas || [], expects: ch.expects || [] };
              if (ch.replaceWith) {
                if (!snapshots.has(ch.key)) await readCollection(ch.key);
                const before = new Map((snapshots.get(ch.key)?.items || []).map((it, i) => [idOf(it, i), it]));
                const seen = new Set();
                // Coleção que não é lista (matriz de permissões) usa o mesmo
                // embrulho de registro único do `set`.
                wrap(ch.replaceWith).forEach((it, i) => {
                  const id = idOf(it, i);
                  seen.add(id);
                  const prev = before.get(id);
                  if (!prev || JSON.stringify(prev) !== JSON.stringify(it)) mudanca.upserts.push({ ...it, id });
                });
                mudanca.deletes = [...before.keys()].filter((id) => !seen.has(id));
              }
              // Uma mudança que SÓ tem pré-condição também vai: é o caso de
              // "só grave isso se aquilo ainda for verdade".
              if (mudanca.upserts.length || mudanca.deletes.length || mudanca.deltas.length || mudanca.expects.length) payload.push(mudanca);
            }
            if (!payload.length) return { ok: true };
            const r = await fetch(`${base}/api/tx`, {
              method: "POST", credentials: "include",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ changes: payload }),
            });
            if (r.status === 409) {
              const body = await r.json();
              payload.forEach((m) => snapshots.delete(m.collection)); // força releitura
              return { ok: false, conflicts: body.conflicts || [body.error || "conflito"] };
            }
            if (!r.ok) return { ok: false, conflicts: ["o servidor não aceitou a gravação"] };
            // A resposta traz só as versões; invalida os snapshots pra próxima
            // leitura trazer o estado real (inclusive os deltas aplicados).
            payload.forEach((m) => snapshots.delete(m.collection));
            return { ok: true };
          } catch {
            return { ok: false, conflicts: ["falha de conexão — nada foi gravado"] };
          }
        },
        async delete(key, shared) {
          if (!shared) return localStorageAdapter.delete(key, shared);
          const done = await this.set(key, "[]", shared);
          return done ? { key, deleted: true, shared: true } : null;
        },
        async list(prefix, shared) {
          if (!shared) return localStorageAdapter.list(prefix, shared);
          try {
            const r = await fetch(`${base}/api/collections`, { credentials: "include" });
            if (!r.ok) return null;
            const all = Object.keys(await r.json());
            return { keys: prefix ? all.filter((k) => k.startsWith(prefix)) : all, prefix, shared: true };
          } catch { return null; }
        },
      };
    }

    // Escolha do backend, nesta ordem:
    //   1. window.CRB_BACKEND — injetado pelo server.js ao servir esta página,
    //      então quando o app é aberto pelo servidor ele já nasce conectado;
    //   2. localStorage "crb.backend" — endereço apontado à mão;
    //   3. nada: segue no localStorage e o app funciona sozinho, sem servidor,
    //      exatamente como antes.
    // A decisão é síncrona de propósito: se dependesse de um fetch, o app
    // poderia começar a carregar do lugar errado antes da resposta chegar.
    (function chooseBackend() {
      let configured = window.CRB_BACKEND || null;
      if (!configured) { try { configured = localStorage.getItem("crb.backend"); } catch {} }
      window.storage = configured ? serverStorage(configured) : localStorageAdapter;
      window.__crbBackend = configured || "localStorage";
    })();

</script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useCallback, useMemo } from "https://esm.sh/react@18.3.1";
import {
  LayoutDashboard, Building2, Package, Users, CalendarClock, Wand2,
  Plus, Trash2, Pencil, X, Check, AlertTriangle, Sparkles, RefreshCw,
  ChevronLeft, ChevronRight, MapPin, Gauge, Stethoscope, Tag, Briefcase,
  ClipboardList, Star, Lock, Unlock, ShieldCheck, Search, GraduationCap,
  Info, CalendarRange, Layers, ThumbsDown, Sun, Moon, Boxes, History, Wallet,
  CalendarCheck, Settings, Timer, UserCog, LogOut, TrendingUp, Zap,
  CalendarDays, Umbrella, PartyPopper, Wrench, Bell, BellOff
} from "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1";
import {
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell
} from "https://esm.sh/recharts@2.12.7?deps=react@18.3.1,react-dom@18.3.1";
import ReactDOM from "https://esm.sh/react-dom@18.3.1/client";

/* ========================================================================
 * ÍNDICE — seções principais deste arquivo, em ordem, com a linha de cada
 * uma. Busque pelo título abaixo (Ctrl+F) pra pular direto pro bloco; cada
 * um tem seu próprio comentário-cabeçalho no código.
 *
 * ATENÇÃO: arquivo único sem build, então estes números envelhecem a cada
 * edição — este índice já esteve 1.200 linhas defasado, apontando KEYS na
 * l. 1061 quando ela estava na 2326, e um índice errado é pior que nenhum,
 * porque manda a pessoa pro lugar errado com ar de certeza. Se o número não
 * bater, o TÍTULO ainda bate: procure pelo nome. E, ao mover um bloco de
 * lugar, `node atualizar-indice.js` reescreve esta lista sozinho.
 *
 *   (Persistência: fica ANTES daqui, no primeiro <script> — é o único ponto
 *    a trocar pra ir pra banco/servidor. Vale ler antes de mexer no resto.)
 *
 *   Tokens (tema claro/escuro, CSS da splash/login) .............. l. 524

const genId = (p) => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const overlaps = (aS, aE, bS, bE) => aS < bE && bS < aE;
// Data em YYYY-MM-DD pelo calendário LOCAL. Com toISOString isso saía em UTC:
// no Brasil (UTC-3), depois das 21h a data já virava a de amanhã, então "hoje"
// mudava antes da meia-noite — reserva do dia sumia da agenda e "já realizada"
// aparecia cedo demais.
const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (dateStr, n) => { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + n); return fmtDate(d); };
const weekdayKey = (dateStr) => ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][new Date(dateStr + "T00:00:00").getDay()];
const weekdayLabel = (dateStr) => new Date(dateStr + "T00:00:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" });
const todayStr = () => fmtDate(new Date());
const nowHHMM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const DEFAULT_AVAIL = { mon: true, tue: true, wed: true, thu: true, fri: true, sat: false, sun: false, start: "08:00", end: "18:00" };
const WEEKDAYS = [
  { key: "mon", label: "Seg" }, { key: "tue", label: "Ter" }, { key: "wed", label: "Qua" },
  { key: "thu", label: "Qui" }, { key: "fri", label: "Sex" }, { key: "sat", label: "Sáb" }, { key: "sun", label: "Dom" },
];
// Horário por dia da semana: `availability.perDay[dia] = {start,end}` sobrepõe o
// horário geral (`availability.start/end`), pra quem abre em horários diferentes
// (ex.: sábado só de manhã). Sem perDay, cai no horário geral de sempre — por isso
// dado antigo continua funcionando sem migração.
function dayWindow(resource, dateStr) {
  const avail = resource?.availability || DEFAULT_AVAIL;
  const key = weekdayKey(dateStr);
  if (!avail[key]) return null; // não abre nesse dia
  const per = avail.perDay?.[key];
  const start = per?.start || avail.start, end = per?.end || avail.end;
  if (!start || !end) return null;
  return { start, end, startMin: toMin(start), endMin: toMin(end) };
}
function withinAvailability(resource, dateStr, start, end) {
  const w = dayWindow(resource, dateStr);
  if (!w) return false;
  return toMin(start) >= w.startMin && toMin(end) <= w.endMin;
}

/* ---------------------------------------------------------------------- */
/* CALENDÁRIO DE AUSÊNCIAS                                                  */
/*                                                                          */
/* A disponibilidade cadastrada (`availability`) é a REGRA: "a Ana trabalha  */
/* de segunda a sexta, das 8 às 18". O calendário é a EXCEÇÃO daquele ano:   */
/* férias, folga, feriado, festa da empresa, sala em reforma.                */
/*                                                                          */
/* São coisas diferentes de propósito. A regra quase nunca muda; a exceção   */
/* tem data de início e fim e não deveria obrigar ninguém a editar o         */
/* cadastro da pessoa em janeiro e desfazer a edição em fevereiro.           */
/*                                                                          */
/* Alcance:                                                                  */
/*   "todos"   feriado, festa da empresa — para o setor inteiro.             */
/*   "recurso" férias/folga de quem está em `targetIds`, ou uma sala e um    */
/*             equipamento parados pra manutenção.                           */
/* ---------------------------------------------------------------------- */
const ABSENCE_KINDS = [
  { id: "ferias", label: "Férias", scope: "recurso", tone: "accent" },
  { id: "folga", label: "Folga / afastamento", scope: "recurso", tone: "accent" },
  { id: "feriado", label: "Feriado", scope: "todos", tone: "gold" },
  { id: "evento", label: "Evento da empresa", scope: "todos", tone: "gold" },
  { id: "manutencao", label: "Manutenção / interdição", scope: "recurso", tone: "danger" },
];
const ABSENCE_KIND_META = Object.fromEntries(ABSENCE_KINDS.map((k) => [k.id, k]));

/* A ausência que atinge esse recurso nessa data (e, quando tem hora, nessa
 * faixa). Devolve a entrada inteira, não um booleano: é o que permite dizer
 * "a Ana está de férias até 30/09" em vez de só "indisponível". */
function absenceOn(calendar, resourceId, dateStr, start, end) {
  return (calendar || []).find((c) => {
    if (!c?.dateStart) return false;
    if (dateStr < c.dateStart || dateStr > (c.dateEnd || c.dateStart)) return false;
    // "todos" pega qualquer recurso, inclusive sala e equipamento: num feriado
    // ninguém vem, então não adianta a sala estar teoricamente aberta.
    if (c.scope !== "todos" && !(c.targetIds || []).includes(resourceId)) return false;
    // Ausência de dia inteiro derruba o dia. Com hora (ex.: confraternização
    // das 16h em diante), só atrapalha quem encosta naquela faixa.
    if (c.allDay === false && start && end && c.start && c.end) {
      return overlaps(toMin(start), toMin(end), toMin(c.start), toMin(c.end));
    }
    return true;
  }) || null;
}
function absenceLabel(c) {
  const meta = ABSENCE_KIND_META[c?.kind];
  const nome = c?.title || meta?.label || "indisponível";
  const ate = c?.dateEnd && c.dateEnd !== c.dateStart ? ` até ${c.dateEnd.split("-").reverse().join("/")}` : "";
  const hora = c?.allDay === false && c?.start ? ` (${c.start}–${c.end})` : "";
  return `${nome}${ate}${hora}`;
}
// Tempo que a atividade realmente ocupa a sala/equipe além da execução em si:
// preparo antes (montar, higienizar) e desmontagem depois. O intervalo mínimo
// (minGapMin) é diferente — é folga exigida ANTES da próxima atividade começar,
// e não bloqueia recurso, só espaça o cronograma.
function activityTimes(activity) {
  return {
    setup: Math.max(0, activity?.setupMin ?? 0),
    teardown: Math.max(0, activity?.teardownMin ?? 0),
    gap: Math.max(0, activity?.minGapMin ?? 0),
    staff: Math.max(1, activity?.staffCount ?? 1),
    maxParticipants: activity?.maxParticipants ?? null,
  };
}
// Janela que a reserva de fato bloqueia na agenda dos recursos (execução +
// preparo + desmontagem). É isso que precisa estar livre, não só o horário que
// aparece pro usuário.
function blockedWindow(startStr, endStr, activity) {
  const t = activityTimes(activity);
  return { start: addMinutes(startStr, -t.setup), end: addMinutes(endStr, t.teardown) };
}
