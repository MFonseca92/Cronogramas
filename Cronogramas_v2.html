      targetLevel: act.minLevel || 3, status: "pendente",
      requestedBy: actorName, createdAt: new Date().toISOString(),
      notes: `Pedido de dentro do planejamento de ${estudo.name}.`,
      targetBookingId: reservaSel?.id || null,
    };
    const ok = await onCreateTrainingRequest(req);
    return { ok: ok !== false, problemas: ok === false ? ["a gravação não foi concluída"] : [] };
  };

  const pedirHoraExtra = async (pessoa, b) => {
    if (!onCreateOvertimeRequest) return { ok: false, problemas: ["hora extra não disponível para o seu usuário"] };
    const ok = await onCreateOvertimeRequest({
      collaboratorId: pessoa.id, date: b.date, start: b.start, end: b.end,
      motivo: `${data.activities.find((a) => a.id === b.activityId)?.name || "atividade"} de ${estudo.name}`,
      bookingDraft: null,
    });
    return { ok: ok !== false, problemas: ok === false ? ["a gravação não foi concluída"] : [] };
  };

  /* "Preencher o que falta": roda o motor de sugestão em cada reserva
   * incompleta da visita e escala quem estiver livre. Não puxa nem pede
   * ninguém — tirar gente de outro estudo é decisão de quem planeja, e um
   * botão que faz isso sozinho seria uma armadilha. */
  const preencherOQueFalta = async () => {
    const incompletas = daVisita.filter((b) => {
      const act = data.activities.find((a) => a.id === b.activityId);
      return (b.collaboratorIds || []).length < Math.max(1, act?.staffCount ?? 1);
    });
    if (!incompletas.length) { dizer("Nada faltando nesta visita."); return; }
    let atual = bookings;
    let escaladas = 0;
    const semGente = [];
    for (const b of incompletas) {
      const act = data.activities.find((a) => a.id === b.activityId);
      const precisa = Math.max(1, act?.staffCount ?? 1);
      const opcoes = encaixeOpcoes({ activity: act, date: b.date, start: b.start, data,
        bookings: atual, studies, participants: b.participantCount || 0, excludeId: b.id });
      const livres = opcoes.pessoas.filter((p) => p.situacao === "livre" && !(b.collaboratorIds || []).includes(p.item.id));
      const entram = livres.slice(0, precisa - (b.collaboratorIds || []).length).map((p) => p.item.id);
      if (!entram.length) { semGente.push(act?.name || "atividade"); continue; }
      const nova = { ...b, collaboratorIds: [...(b.collaboratorIds || []), ...entram] };
      atual = atual.map((x) => (x.id === b.id ? { ...nova, status: bookingStatusFor(nova, act) } : x));
      escaladas += entram.length;
    }
    if (!escaladas) {
      dizer(`Ninguém livre para ${semGente.join(", ")}. Na coluna da direita dá pra ver quem é cedível e de quem é preciso pedir.`, true);
      return;
    }
    const ok = await onUpdateBookingsAtomic(atual);
    if (ok === false) return;
    dizer(`${escaladas} pessoa(s) escalada(s).${semGente.length ? ` Ainda sem ninguém livre para ${semGente.join(", ")} — veja quem dá pra puxar ou pedir.` : ""}`,
      semGente.length > 0);
  };

  /* Pedidos que interessam a este estudo: os que vêm buscar gente daqui e os
   * que este estudo enviou. Uma caixa de entrada geral misturaria estudos que
   * não têm nada a ver um com o outro. */
  const pedidosDoEstudo = useMemo(() => (staffRequests || []).filter((r) =>
    r.studyId === selId || (r.origemStudyIds || []).includes(selId)), [staffRequests, selId]);

  /* Grava pela MESMA função que a tela de acompanhamento usa. Montar as listas
   * aqui de novo foi o que produziu a tela branca: a gravação espera as listas
   * inteiras, e receber um estudo solto corrompe o estado do app. */
  const salvarEstudo = async (novo, tps) => {
    const { nextStudies, nextTimepoints } = studySavePayload({ study: novo, tpRows: tps, studies, timepoints, bookings });
    const ok = await onSaveStudyWithTimepoints(nextStudies, nextTimepoints);
    if (ok === false) return;
    setEditando(null);
    setSelId(novo.id);
  };

  /* ---------- sem estudo escolhido: a lista ---------- */
  if (!estudo && !editando) {
    return (
      <div className="space-y-4">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <Section icon={Layers} title="Estudos"
            subtitle="Cadastrar, planejar e acompanhar — tudo do estudo no mesmo lugar." />
          {canGerenciar && <Btn icon={Plus} onClick={() => setEditando({})}>Novo estudo</Btn>}
        </div>
        {/* Pedido esperando resposta aparece antes da lista: é o único item
            desta tela em que outra pessoa está parada esperando você. */}
        <PedidosDeEquipe staffRequests={staffRequests} data={data} studies={studies} bookings={bookings}
          actorName={actorName} podeResponder={canGerenciar}
          onDecidir={onDecidirPedidoEquipe} onCancelar={onCancelarPedidoEquipe} />
        {!studies.length && (
          <div style={{ background: T.surface, border: `1px dashed ${T.line}` }} className="rounded-xl p-6 text-center">
            <div className="text-sm font-medium mb-1">Nenhum estudo cadastrado ainda.</div>
            <div className="text-xs mb-3" style={{ color: T.inkMuted }}>
              Comece cadastrando o protocolo: D0, visitas por deslocamento, grupos de participantes e técnico.
            </div>
            {canGerenciar && <Btn icon={Plus} onClick={() => setEditando({})}>Cadastrar o primeiro estudo</Btn>}
          </div>
        )}
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
          {studies.map((s) => {
            const tps = timepoints.filter((tp) => tp.studyId === s.id);
            const agendadas = tps.filter((tp) => bookings.some((b) => b.timepointId === tp.id)).length;
            const meta = STUDY_STATUS_META[studyStatusAuto(s, timepoints, bookings)] || {};
            const base = studyBaseline(s, timepoints, bookings);
            return (
              <button key={s.id} onClick={() => { setSelId(s.id); setAba("planejar"); setVisitaSel(null); }}
                style={{ background: T.surface, border: `1px solid ${T.line}` }}
                className="rounded-xl p-3 text-left hover:shadow-sm transition-shadow">
                <div className="flex items-start justify-between gap-2">
                  <div className="text-sm font-semibold truncate" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{s.name}</div>
                  <Chip tone={meta.tone || "neutral"}>{meta.label || "—"}</Chip>
                </div>
                <div className="text-[11px] mt-1" style={{ color: T.inkMuted }}>
                  {data.sponsors.find((sp) => sp.id === s.sponsorId)?.name || "sem patrocinador"}
                </div>
                <div className="text-[11px] mt-1.5" style={{ color: agendadas < tps.length ? T.warn : T.accentDark }}>
                  {tps.length ? `${agendadas} de ${tps.length} visitas agendadas` : "protocolo sem visitas"}
                  {studyParticipantsTotal(s) ? ` · ${studyParticipantsTotal(s)} participantes` : ""}
                </div>
                <div className="text-[10px] mt-0.5" style={{ color: T.inkMuted }}>
                  D0 {base.real ? "" : "previsto "}em {weekdayLabel(base.date)}
                </div>
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  /* ---------- cadastro / edição ---------- */
  if (editando) {
    return (
      <div className="space-y-3">
        <Section icon={Layers} title={editando.id ? "Editar estudo" : "Novo estudo"}
          subtitle="Protocolo, período combinado, grupos de participantes e técnico responsável." />
        <StudyForm data={data} studies={studies} editing={editando} bookings={bookings}
          existingTimepoints={editando.id ? timepoints.filter((tp) => tp.studyId === editando.id) : []}
          onSubmit={salvarEstudo} onCancel={() => setEditando(null)} />
      </div>
    );
  }

  /* ---------- estudo escolhido ---------- */
  const custo = bookingsCost(reservasDoEstudo, data);
  const pendencias = reservasDoEstudo.filter((b) => b.status === "pendente_equipe").length;
  const semAgenda = doEstudo.filter((tp) => !bookings.some((b) => b.timepointId === tp.id)).length;
  /* Situação, D0 e técnico vêm da agenda, não do cadastro — o cabeçalho mostra
   * o que o sistema deduziu, e é a mesma dedução que as regras usam. */
  const situacao = studyStatusAuto(estudo, timepoints, bookings);
  const metaStatus = STUDY_STATUS_META[situacao] || {};
  const d0 = studyBaseline(estudo, timepoints, bookings);
  const tecnicos = studyTechnicians(estudo, bookings, data.activities);

  return (
    <div className="space-y-3">
      {/* ---- cabeçalho do estudo ---- */}
      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div className="min-w-0">
            <button onClick={() => { setSelId(null); setVisitaSel(null); }}
              className="text-[11px] mb-1 flex items-center gap-1" style={{ color: T.inkMuted }}>
              <ChevronLeft size={12} /> todos os estudos
            </button>
            <div className="text-xl font-bold leading-tight flex items-center gap-2 flex-wrap"
              style={{ fontFamily: "'Space Grotesk', sans-serif", letterSpacing: "-0.01em" }}>
              {estudo.name}
              <Chip tone={metaStatus.tone || "neutral"}>{metaStatus.label || situacao}</Chip>
            </div>
            <div className="text-xs mt-0.5" style={{ color: T.inkMuted }}>
              {data.sponsors.find((sp) => sp.id === estudo.sponsorId)?.name || "sem patrocinador"}
            </div>
          </div>
          {canGerenciar && <Btn variant="ghost" icon={Pencil} onClick={() => setEditando(estudo)}>Editar informações</Btn>}
        </div>

        <div className="flex gap-6 flex-wrap mt-3">
          {[
            [d0.real ? "D0 (marcado)" : "D0 (previsto)", weekdayLabel(d0.date)],
            ["Período combinado", estudo.startMin ? `${weekdayLabel(estudo.startMin)} a ${estudo.endDate ? weekdayLabel(estudo.endDate) : "—"}` : "—"],
            ["Grupos", studyGroups(estudo).length
              ? `${studyGroups(estudo).map((g) => `${g.name} (${g.size})`).join(" · ")} — ${studyParticipantsTotal(estudo)} no total`
              : (estudo.participantsPlanned ? `${estudo.participantsPlanned} participantes` : "sem grupos")],
            ["Técnico das mestres", tecnicos.length
              ? tecnicos.map((t) => `${data.collaborators.find((c) => c.id === t.collaboratorId)?.name || "?"} (${t.activity.name})`).join(" · ")
              : "definido pela primeira visita que for marcada"],
            ["Protocolo", `${doEstudo.length - semAgenda} de ${doEstudo.length} visitas agendadas`],
          ].map(([rot, val]) => (
            <div key={rot}>
              <div className="text-[10px] uppercase tracking-wide" style={{ color: T.inkMuted }}>{rot}</div>
              <div className="text-xs font-semibold">{val}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ---- abas ---- */}
      <div className="flex gap-1.5">
        <Btn small variant={aba === "planejar" ? "primary" : "ghost"} icon={Wand2} onClick={() => setAba("planejar")}>Planejar</Btn>
        <Btn small variant={aba === "acompanhar" ? "primary" : "ghost"} icon={ClipboardList} onClick={() => setAba("acompanhar")}>Acompanhar</Btn>
      </div>

      {aba === "acompanhar" ? (
        <StudiesView {...props} focoStudyId={estudo.id} />
      ) : (
        <div className="grid grid-cols-1 xl:grid-cols-[220px_1fr_300px] gap-3 items-start">
          {/* ---- visitas do protocolo ---- */}
          <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3">
            <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: T.accentDark }}>Visitas do protocolo</div>
            {!doEstudo.length && <div className="text-[11px]" style={{ color: T.inkMuted }}>
              Nenhuma visita no protocolo. Use "Editar informações" para montá-lo.
            </div>}
            {doEstudo.map((tp) => {
              const sit = visitaSituacao(tp, bookings, data);
              const cor = sit.cor === "ok" ? T.accent : sit.cor === "falta" ? T.warn : T.line;
              const escolhida = tpSel?.id === tp.id;
              return (
                <button key={tp.id} onClick={() => setVisitaSel(tp.id)}
                  className="w-full text-left rounded-lg px-2.5 py-2 mb-1 flex gap-2 items-start"
                  style={{ background: escolhida ? T.accentSoft : T.bg, border: `1px solid ${escolhida ? T.accent : "transparent"}` }}>
                  <span className="w-2 h-2 rounded-full mt-1.5 shrink-0" style={{ background: cor }} />
                  <span className="min-w-0">
                    <span className="block text-xs font-semibold truncate">{tp.label}</span>
                    <span className="block text-[10px]" style={{ color: T.inkMuted }}>
                      {tp.dateMin ? weekdayLabel(tp.dateMin) : "—"} · {sit.texto}
                    </span>
                  </span>
                </button>
              );
            })}
          </div>

          {/* ---- a montagem da visita ---- */}
          <div className="min-w-0">
            <MontagemDaVisita estudo={estudo} tp={tpSel} data={data} bookings={bookings} studies={studies}
              canPlanejar={canGerenciar} reservaSelId={reservaSel?.id || null}
              onSelecionarReserva={setReservaSelId} onCriarReserva={criarReserva}
              onExcluirReserva={excluirReserva} onSugerir={preencherOQueFalta} aviso={aviso} />
          </div>

          {/* ---- disponibilidade ---- */}
          <div className="space-y-3">
            <PainelDisponibilidade data={data} bookings={bookings} studies={studies}
              reserva={reservaSel} atividade={atividadeSel} participantes={participantesDaReserva}
              podeNegociar={canGerenciar} staffRequests={staffRequests}
              onPuxar={onPuxarColaborador} onPedir={onPedirColaborador}
              onEscolherSala={escolherSala} onEscolherEquipamento={escolherEquipamento}
              onEscolherMedico={escolherMedico}
              onPedirTreinamento={pedirTreinamento} onPedirHoraExtra={pedirHoraExtra} />
            <PedidosDeEquipe staffRequests={pedidosDoEstudo} data={data} studies={studies} bookings={bookings}
              actorName={actorName} podeResponder={canGerenciar}
              onDecidir={onDecidirPedidoEquipe} onCancelar={onCancelarPedidoEquipe} />
          </div>
        </div>
      )}

      {/* ---- rodapé ---- */}
      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3 flex items-center gap-7 flex-wrap">
        {[
          canVerCustos ? [`R$ ${Math.round(custo).toLocaleString("pt-BR")}`, "custo do estudo", T.ink] : null,
          [String(reservasDoEstudo.length), "reservas", T.ink],
          [String(pendencias), "sem equipe completa", pendencias ? T.warn : T.ink],
          [String(semAgenda), "visitas sem agendamento", semAgenda ? T.warn : T.ink],
        ].filter(Boolean).map(([v, r, cor]) => (
          <div key={r}>
            <div className="text-lg font-bold" style={{ color: cor, fontFamily: "'Space Grotesk', sans-serif" }}>{v}</div>
            <div className="text-[10px] uppercase tracking-wide" style={{ color: T.inkMuted }}>{r}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Histórico — visor somente leitura do auditLog                          */
/* ---------------------------------------------------------------------- */
const ENTITY_LABELS = {
  locations: "Locais", equipment: "Equipamentos", activities: "Atividades", doctors: "Médicos",
  collaborators: "Colaboradores", niches: "Nichos", sponsors: "Patrocinadores", supplies: "Suprimentos",
  bookings: "Reservas", trainingRequests: "Treinamentos", studies: "Estudos", timepoints: "Timepoints",
  deadlineRequests: "Prazos", cancellations: "Cancelamentos", roleCapabilities: "Permissões", stockEntries: "Entradas de estoque",
  overtimeRequests: "Horas extras", users: "Usuários", staffRequests: "Pedidos de equipe",
};
const ACTION_TONE = { criado: "accent", atualizado: "gold", excluído: "danger", reagendado: "gold" };
const CANCEL_OUTCOME_TONE = { reaproveitado: "accent", com_margem: "neutral", em_risco: "gold", perda: "danger" };
function HistoryView({ auditLog, cancellations, bookings, canVerCustos }) {
  const [entityFilter, setEntityFilter] = useState("");
  const entitiesPresent = Array.from(new Set(auditLog.map((e) => e.entity)));
  const filtered = entityFilter ? auditLog.filter((e) => e.entity === entityFilter) : auditLog;

  const cancelHistory = useMemo(() => {
    return (cancellations || []).map((c) => ({ ...c, outcome: cancellationOutcome(c, bookings) }))
      .sort((a, b) => b.cancelledAt.localeCompare(a.cancelledAt));
  }, [cancellations, bookings]);

  return (
    <div className="space-y-5">
      <Section icon={History} title="Histórico" subtitle="Quem alterou o quê e quando — criações, edições e exclusões em qualquer cadastro ou reserva." />

      {cancelHistory.length > 0 && (
        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
          <div className="px-4 pt-3 pb-2">
            <div style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold">Cancelamentos e reagendamentos</div>
            <div className="text-[11px] mt-0.5" style={{ color: T.inkMuted }}>Toda reserva excluída ou reagendada em Estudos/Cronograma fica registrada aqui, com o desfecho: reaproveitado, cancelado com margem, em risco ou perda do custo do recurso parado.</div>
          </div>
          {cancelHistory.map((c) => (
            <div key={c.id} className="px-4 py-2.5 flex items-center gap-3 flex-wrap" style={{ borderTop: `1px solid ${T.line}` }}>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkMuted }} className="text-[11px] whitespace-nowrap">
                {new Date(c.cancelledAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}
              </div>
              <Chip tone={ACTION_TONE[c.kind] || "neutral"}>{c.kind}</Chip>
              <Chip tone={CANCEL_OUTCOME_TONE[c.outcome.status] || "neutral"}>{c.outcome.label}</Chip>
              <span className="text-xs flex-1 min-w-[140px] truncate" title={`${c.studyName} · ${c.activityName} · ${c.locationName}`}>{c.studyName} · {c.locationName}</span>
              <span className="text-xs whitespace-nowrap" style={{ color: T.inkMuted }}>era {weekdayLabel(c.date)} {c.start}–{c.end}</span>
              {canVerCustos && c.cost > 0 && <span className="text-xs whitespace-nowrap" style={{ color: T.inkMuted, minWidth: 72, textAlign: "right" }}>{fmtBRL(c.cost)}</span>}
              <span className="text-xs whitespace-nowrap" style={{ color: T.inkMuted }}>por {c.cancelledBy}</span>
            </div>
          ))}
        </div>
      )}

      <div className="flex items-center gap-2 flex-wrap">
        <span className="text-xs font-medium" style={{ color: T.inkMuted }}>Filtrar por:</span>
        <button onClick={() => setEntityFilter("")} className="text-xs font-medium px-3 py-1.5 rounded-lg"
          style={{ background: !entityFilter ? T.accent : T.surface, color: !entityFilter ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>Tudo</button>
        {entitiesPresent.map((ent) => (
          <button key={ent} onClick={() => setEntityFilter(ent)} className="text-xs font-medium px-3 py-1.5 rounded-lg"
            style={{ background: entityFilter === ent ? T.accent : T.surface, color: entityFilter === ent ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>
            {ENTITY_LABELS[ent] || ent}
          </button>
        ))}
      </div>

      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
        {filtered.length === 0 && <div className="px-4 py-4 text-xs" style={{ color: T.inkMuted }}>Nenhum registro ainda.</div>}
        {filtered.map((entry) => (
          <div key={entry.id} className="px-4 py-2.5 flex items-center gap-3 flex-wrap" style={{ borderBottom: `1px solid ${T.line}` }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkMuted }} className="text-[11px] whitespace-nowrap">
              {new Date(entry.ts).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}
            </div>
            <Chip tone={ACTION_TONE[entry.action] || "neutral"}>{entry.action}</Chip>
            <span className="text-xs font-medium">{ENTITY_LABELS[entry.entity] || entry.entity}</span>
            <span className="text-xs" style={{ color: T.inkMuted }}>por {entry.actor}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Meu dia — agenda pessoal de quem está logado como médico/colaborador     */
/* (o login já resolve isso, ver App.enterAsUser), só as reservas de hoje   */
/* que envolvem essa pessoa especificamente.                                */
/* ---------------------------------------------------------------------- */
function MeuDiaView({ data, bookings, myPersonRole, myPersonId, onStartActivity, onFinishActivity }) {
  const me = myPersonId ? (myPersonRole === "doctor" ? data.doctors : data.collaborators).find((p) => p.id === myPersonId) : null;
  const today = todayStr();
  const [weekOffset, setWeekOffset] = useState(0); // 0 = semana atual
  const [view, setView] = useState("dia"); // "dia" | "semana"

  const mine = useMemo(() => bookings.filter((b) => (myPersonRole === "doctor" ? b.doctorId === myPersonId : (b.collaboratorIds || []).includes(myPersonId))), [bookings, myPersonRole, myPersonId]);
  // Semana começa na segunda: getDay() dá 0 pro domingo, então domingo volta 6 dias.
  const weekStart = useMemo(() => {
    const d = new Date(today + "T00:00:00");
    const dow = d.getDay();
    return addDays(today, (dow === 0 ? -6 : 1 - dow) + weekOffset * 7);
  }, [today, weekOffset]);
  const weekDays = useMemo(() => Array.from({ length: 7 }).map((_, i) => addDays(weekStart, i)), [weekStart]);
  const byDay = useMemo(() => {
    const map = {};
    weekDays.forEach((d) => { map[d] = mine.filter((b) => b.date === d).sort((a, b) => a.start.localeCompare(b.start)); });
    return map;
  }, [mine, weekDays]);
  const todays = (byDay[today] || (weekOffset === 0 ? [] : null)) || mine.filter((b) => b.date === today).sort((a, b) => a.start.localeCompare(b.start));

  const Card = ({ b, compact }) => {
    const loc = data.locations.find((l) => l.id === b.locationId);
    const sponsor = data.sponsors.find((s) => s.id === b.sponsorId);
    const activity = data.activities.find((a) => a.id === b.activityId);
    // Treinamento aparece aqui (a pessoa precisa saber que tem aula), mas quem
    // conclui é a equipe de treinamento — "Finalizar" aqui não habilitaria
    // ninguém, só gravaria um horário.
    const ehTreino = isTrainingBooking(b);
    const canAct = !ehTreino && b.date === today && !b.actualEnd;
    return (
      <div style={{ background: T.surface, border: `1px solid ${ehTreino ? T.gold : T.line}` }} className={`rounded-xl ${compact ? "p-2" : "p-3.5"} space-y-1`}>
        <div className="flex items-center gap-2 flex-wrap">
          <div style={{ fontFamily: "'JetBrains Mono', monospace", color: T.accentDark }} className={`${compact ? "text-[11px]" : "text-sm"} font-semibold whitespace-nowrap`}>{b.start}–{b.end}</div>
          <div className={`${compact ? "text-[11px]" : "text-sm"} font-medium truncate min-w-0`}>{b.studyName}</div>
          {ehTreino && <Chip tone="gold">treinamento</Chip>}
          {!ehTreino && (b.actualEnd ? <Chip tone="accent">concluída</Chip> : b.actualStart ? <Chip tone="gold">em andamento</Chip> : null)}
        </div>
        <div className="text-[11px] truncate flex items-center gap-1 flex-wrap" style={{ color: T.inkMuted }}>
          {loc && <MapPin size={10} />}{loc?.name}
          {activity && <span>· {activity.name}</span>}
          {!compact && sponsor && <span>· {sponsor.name}</span>}
          {b.participantCount ? <span>· {b.participantCount} participante(s)</span> : null}
        </div>
        {canAct && !compact && (
          <div className="flex gap-1.5 pt-1">
            {!b.actualStart
              ? <Btn small variant="subtle" icon={Timer} onClick={() => onStartActivity(b)}>Iniciar</Btn>
              : <Btn small icon={Check} onClick={() => onFinishActivity(b)}>Finalizar</Btn>}
          </div>
        )}
        {ehTreino && !compact && (
          <div className="text-[10px] pt-0.5" style={{ color: T.gold }}>
            <GraduationCap size={10} className="inline -mt-0.5 mr-1" />
            Você está em treinamento nesse horário. Quem registra a conclusão é a equipe de treinamento.
          </div>
        )}
      </div>
    );
  };

  return (
    <div className="space-y-5">
      <Section icon={CalendarCheck} title="Meu dia" subtitle={me ? "Sua agenda — e o que você precisa confirmar" : "Essa tela é só pra médico(a)/colaborador(a)"}
        right={me ? (
          <div className="flex items-center gap-1.5">
            {["dia", "semana"].map((v) => (
              <button key={v} onClick={() => setView(v)} className="text-xs font-medium px-3 py-1.5 rounded-lg capitalize"
                style={{ background: view === v ? T.accent : T.surface, color: view === v ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>{v}</button>
            ))}
          </div>
        ) : null} />

      {!me && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 flex items-center gap-2 text-xs">
          <Lock size={14} /> Seu usuário não está vinculado a um médico ou colaborador — essa tela não se aplica.
        </div>
      )}

      {me && view === "dia" && (
        <React.Fragment>
          <div className="text-xs" style={{ color: T.inkMuted }}>Hoje é {weekdayLabel(today)}</div>
          {todays.length === 0 && (
            <div style={{ background: T.bg, border: `1px dashed ${T.line}`, color: T.inkMuted }} className="rounded-xl p-6 text-center text-sm">Nenhum compromisso hoje.</div>
          )}
          <div className="space-y-2">{todays.map((b) => <Card key={b.id} b={b} />)}</div>
        </React.Fragment>
      )}

      {me && view === "semana" && (
        <React.Fragment>
          <div className="flex items-center gap-1">
            <Btn small variant="ghost" icon={ChevronLeft} onClick={() => setWeekOffset((w) => w - 1)} />
            <div className="text-xs font-medium px-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
              {weekdayLabel(weekDays[0])} a {weekdayLabel(weekDays[6])}
            </div>
            <Btn small variant="ghost" icon={ChevronRight} onClick={() => setWeekOffset((w) => w + 1)} />
            {weekOffset !== 0 && <Btn small variant="ghost" onClick={() => setWeekOffset(0)}>Esta semana</Btn>}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-7 gap-2">
            {weekDays.map((d) => {
              const items = byDay[d] || [];
              const isToday = d === today;
              return (
                <div key={d} style={{ background: isToday ? T.accentSoft : T.bg, border: `1px solid ${isToday ? T.accent : T.line}` }} className="rounded-lg p-2 min-h-[110px]">
                  <div className="text-[11px] font-medium mb-1.5 flex items-center justify-between">
                    <span style={{ color: isToday ? T.accentDark : T.ink }}>{weekdayLabel(d)}</span>
                    {items.length > 0 && <Chip tone="accent">{items.length}</Chip>}
                  </div>
                  {items.length === 0 && <div className="text-[10px]" style={{ color: T.inkMuted }}>—</div>}
                  <div className="space-y-1.5">{items.map((b) => <Card key={b.id} b={b} compact />)}</div>
                </div>
              );
            })}
          </div>
          <div className="text-[11px]" style={{ color: T.inkMuted }}>Pra iniciar ou finalizar uma atividade, use a visão "dia" — só dá pra confirmar o que é de hoje.</div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Treinamentos — solicitações abertas pela reserva, confirmadas por quem   */
/* tem a capacidade `treinamento_confirmar` (nível Treinador, por padrão)   */
/* ---------------------------------------------------------------------- */
// Componente de topo pelo mesmo motivo do PlanItemRow/PlanCard: declarado dentro
// do TrainingBoard, virava um tipo novo a cada render e remontava tudo — o que
// aqui é pior, porque essa linha tem SearchPick, data e horário. O poll de 5s
// fechava o dropdown e derrubava o foco sozinho no meio do preenchimento.
function TrainingRequestRow({ req, editable, data, bookings, draft, onSetDraft, onConfirm, onDecline, onRetry, onConclude, onUnschedule, podeAntecipar }) {
  const activity = data.activities.find((a) => a.id === req.activityId);
  const collaborator = data.collaborators.find((c) => c.id === req.collaboratorId);
  const lateRisk = draft.scheduledDate && draft.scheduledDate > req.deadlineDate;
  const candidates = data.collaborators.filter((c) => c.active);
  const meta = TRAINING_STATUS_META[req.status] || { label: req.status, tone: "neutral" };
  // A aula é uma reserva de verdade, então a prévia usa o MESMO validateBooking
  // que vai rodar ao agendar: assim sala, instrutor e equipamento ocupados
  // aparecem aqui, e não só o conflito de quem está sendo treinado.
  const escolhido = draft.collaboratorId || req.collaboratorId;
  const previa = (escolhido && draft.scheduledDate)
    ? trainingBookingFrom({
        ...req, collaboratorId: escolhido, scheduledDate: draft.scheduledDate,
        scheduledStart: draft.scheduledStart || "09:00",
        durationMin: draft.durationMin || TRAINING_DEFAULT_MIN,
        locationId: draft.locationId || null, trainerId: draft.trainerId || null,
        equipmentId: draft.equipmentId || null, accessoryIds: draft.accessoryIds || [],
      }, activity)
    : null;
  const problemas = previa
    ? validateBooking(previa, data, [...(bookings || []).filter((b) => b.id !== previa.id), previa], previa.id).errors
    : [];
  const acessoriosDoAparelho = draft.equipmentId ? equipAccessoryOptions(draft.equipmentId, data.equipment) : [];
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3.5 space-y-2">
      <div className="flex items-center justify-between flex-wrap gap-1.5">
        <div className="text-sm font-medium">{activity?.name || req.activityName}</div>
        <Chip tone={meta.tone}>{meta.label}</Chip>
      </div>
      <div className="text-[11px]" style={{ color: T.inkMuted }}>{req.studyName} · nível exigido <Stars level={req.requiredLevel} /></div>
      {req.collaboratorName && <div className="text-xs flex items-center gap-1.5" style={{ color: T.ink }}><Users size={12} /> Indicado(a): <strong>{req.collaboratorName}</strong></div>}
      <div className="text-xs flex items-center gap-1.5" style={{ color: T.warn }}>
        <CalendarClock size={12} /> Precisa estar pronto até <strong>{weekdayLabel(req.deadlineDate)}</strong> (início do estudo)
      </div>

      {req.status === "pendente" && editable && (
        <div className="space-y-2 pt-1" style={{ borderTop: `1px dashed ${T.line}` }}>
          <div className="text-[11px] font-medium" style={{ color: T.inkMuted }}>Colaborador indicado por quem fez a reserva
            <div className="mt-1"><SearchPick options={candidates} value={draft.collaboratorId || req.collaboratorId} onChange={(v) => onSetDraft(req.id, { collaboratorId: v })} placeholder="Escolher colaborador..." /></div>
            <div className="text-[10px] mt-0.5" style={{ color: T.inkMuted }}>Pode trocar aqui se precisar, mas normalmente já vem preenchido.</div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <label className="text-[11px] font-medium" style={{ color: T.inkMuted }}>Data do treinamento
              <input type="date" value={draft.scheduledDate || ""} onChange={(e) => onSetDraft(req.id, { scheduledDate: e.target.value })}
                className="mt-1 w-full text-xs px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-[11px] font-medium" style={{ color: T.inkMuted }}>Horário
              <input type="time" value={draft.scheduledStart || "09:00"} onChange={(e) => onSetDraft(req.id, { scheduledStart: e.target.value })}
                className="mt-1 w-full text-xs px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-[11px] font-medium" style={{ color: T.inkMuted }}>Duração (min)
              <input type="number" min={15} step={15} value={draft.durationMin || TRAINING_DEFAULT_MIN} onChange={(e) => onSetDraft(req.id, { durationMin: Number(e.target.value) || TRAINING_DEFAULT_MIN })}
                className="mt-1 w-full text-xs px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <div className="text-[11px] font-medium" style={{ color: T.inkMuted }}>Sala <span style={{ fontWeight: 400 }}>(opcional)</span>
              <div className="mt-1"><SearchPick options={data.locations.filter((l) => l.active !== false)} value={draft.locationId || null} onChange={(v) => onSetDraft(req.id, { locationId: v })} placeholder="Sem sala definida..." /></div>
            </div>
          </div>
          {/* Instrutor e equipamento também ficam ocupados durante a aula — se
              o treinamento usa um Corneometer real, ninguém pode agendar esse
              mesmo aparelho num estudo no mesmo horário. Ambos opcionais. */}
          <div className="grid grid-cols-2 gap-2">
            <div className="text-[11px] font-medium" style={{ color: T.inkMuted }}>Instrutor(a) <span style={{ fontWeight: 400 }}>(opcional)</span>
              <div className="mt-1"><SearchPick
                options={data.collaborators.filter((c) => c.active !== false && c.id !== escolhido)}
                value={draft.trainerId || null} onChange={(v) => onSetDraft(req.id, { trainerId: v })} placeholder="Quem vai ensinar..." /></div>
            </div>
            <div className="text-[11px] font-medium" style={{ color: T.inkMuted }}>Equipamento <span style={{ fontWeight: 400 }}>(opcional)</span>
              <div className="mt-1"><SearchPick
                options={data.equipment.filter((e) => !e.isAccessory && e.active !== false)}
                value={draft.equipmentId || null} onChange={(v) => onSetDraft(req.id, { equipmentId: v, accessoryIds: [] })} placeholder="Aparelho usado na aula..." /></div>
              {acessoriosDoAparelho.length > 0 && (
                <div className="mt-1 flex flex-wrap gap-1">
                  {acessoriosDoAparelho.map((acc) => {
                    const on = (draft.accessoryIds || []).includes(acc.id);
                    return (
                      <button key={acc.id} onClick={() => onSetDraft(req.id, { accessoryIds: on ? draft.accessoryIds.filter((x) => x !== acc.id) : [...(draft.accessoryIds || []), acc.id] })}
                        className="text-[10px] px-2 py-0.5 rounded-full"
                        style={{ background: on ? T.accent : T.subtle, color: on ? "#fff" : T.inkMuted }}>{acc.name}</button>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
          <div className="text-[10px]" style={{ color: T.inkMuted }}>
            <Info size={10} className="inline -mt-0.5 mr-1" />
            Ao agendar, esse horário fica <strong>bloqueado</strong> na agenda de quem vai ser treinado. O nível só sobe quando o treinamento for concluído.
          </div>
          {lateRisk && (
            <div style={{ background: T.dangerSoft, color: T.danger }} className="rounded-md p-2 text-[11px] flex items-center gap-1.5"><AlertTriangle size={12} /> Essa data é depois do prazo do estudo — o colaborador não vai estar pronto a tempo.</div>
          )}
          {problemas.length > 0 && (
            <div style={{ background: T.dangerSoft, color: T.danger }} className="rounded-md p-2 text-[11px] space-y-0.5">
              <div><AlertTriangle size={12} className="inline -mt-0.5 mr-1" />Não dá pra agendar assim:</div>
              {problemas.slice(0, 4).map((p, i) => <div key={i}>• {p}</div>)}
            </div>
          )}
          <div className="flex gap-2">
            <Btn small icon={CalendarCheck} disabled={!draft.scheduledDate || problemas.length > 0} onClick={() => onConfirm(req)}>Agendar treinamento</Btn>
            <Btn small variant="danger" icon={ThumbsDown} onClick={() => onDecline(req)}>Recusar</Btn>
          </div>
        </div>
      )}

      {req.status === "agendado" && (
        <div className="space-y-1.5 pt-1" style={{ borderTop: `1px dashed ${T.line}` }}>
          <div className="text-xs flex items-center gap-1.5 flex-wrap" style={{ color: req.scheduledDate > req.deadlineDate ? T.danger : T.accentDark }}>
            <GraduationCap size={13} /> {collaborator?.name} · {weekdayLabel(req.scheduledDate)} {req.scheduledStart}–{addMinutes(req.scheduledStart || "09:00", req.durationMin || TRAINING_DEFAULT_MIN)}
            {req.locationId && <span style={{ color: T.inkMuted }}>· {data.locations.find((l) => l.id === req.locationId)?.name}</span>}
            {req.trainerId && <span style={{ color: T.inkMuted }}>· instrutor(a) {data.collaborators.find((c) => c.id === req.trainerId)?.name}</span>}
            {req.equipmentId && <span style={{ color: T.inkMuted }}>· {data.equipment.find((e) => e.id === req.equipmentId)?.name}</span>}
            {req.scheduledDate > req.deadlineDate && <Chip tone="danger">após o prazo</Chip>}
          </div>
          <div className="text-[10px]" style={{ color: T.inkMuted }}>
            Horário bloqueado na agenda de {collaborator?.name || "quem vai ser treinado"}. O nível em <strong>{activity?.name}</strong> sobe pra <Stars level={req.requiredLevel} /> quando você marcar como concluído.
          </div>
          {editable && (() => {
            // Concluir é o comando que aumenta a qualificação — não pode ser
            // dado antes do treinamento acontecer, senão alguém libera a pessoa
            // pra reservas de hoje por uma aula marcada pra semana que vem.
            const fim = addMinutes(req.scheduledStart || "09:00", req.durationMin || TRAINING_DEFAULT_MIN);
            const jaAconteceu = req.scheduledDate < todayStr()
              || (req.scheduledDate === todayStr() && toMin(fim) <= toMin(nowHHMM()));
            return (
              <div className="space-y-1.5 pt-0.5">
                <div className="flex gap-2">
                  <Btn small icon={Check} disabled={!jaAconteceu} onClick={() => onConclude(req)}>Marcar como concluído</Btn>
                  <Btn small variant="ghost" icon={X} onClick={() => onUnschedule(req)}>Desmarcar</Btn>
                </div>
                {!jaAconteceu && (
                  <div className="text-[10px]" style={{ color: T.inkMuted }}>
                    Só dá pra concluir depois de {weekdayLabel(req.scheduledDate)} às {fim}.
                    {podeAntecipar && " Se o treinamento aconteceu antes, use a conclusão antecipada abaixo."}
                  </div>
                )}
                {/* Exceção explícita, com justificativa registrada — é o gestor
                    assumindo a responsabilidade, não um clique acidental. */}
                {!jaAconteceu && podeAntecipar && (
                  <div className="flex gap-1.5 items-center">
                    <input value={draft.justificativa || ""} onChange={(e) => onSetDraft(req.id, { justificativa: e.target.value })}
                      placeholder="Justificar conclusão antecipada..."
                      className="flex-1 text-[11px] px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                    <Btn small variant="ghost" icon={Unlock} disabled={!(draft.justificativa || "").trim()}
                      onClick={() => onConclude(req, draft.justificativa.trim())}>Concluir mesmo assim</Btn>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}

      {req.status === "concluido" && (
        <div className="text-xs flex items-center gap-1.5 flex-wrap" style={{ color: T.accentDark }}>
          <GraduationCap size={13} /> {collaborator?.name} treinado(a) em {weekdayLabel(req.scheduledDate)} — nível <Stars level={req.requiredLevel} /> aplicado.
        </div>
      )}

      {req.status === "recusado" && (
        <div className="space-y-1.5 pt-1" style={{ borderTop: `1px dashed ${T.line}` }}>
          <div className="text-[11px]" style={{ color: T.danger }}><ThumbsDown size={11} className="inline -mt-0.5 mr-1" />Recusado pela equipe de treinamento — escolha outra pessoa pra tentar de novo, ou reavalie a data do timepoint em "Planejar estudo".</div>
          <div className="w-48"><SearchPick options={candidates} value={draft.collaboratorId || null} onChange={(v) => onSetDraft(req.id, { collaboratorId: v })} placeholder="Tentar com outro colaborador..." /></div>
          <Btn small icon={RefreshCw} disabled={!draft.collaboratorId} onClick={() => onRetry(req, draft.collaboratorId)}>Reenviar solicitação</Btn>
        </div>
      )}
    </div>
  );
}
function TrainingBoard({ data, trainingRequests, bookings, onUpdateRequests, actorName, canTreinamento, podeAntecipar, onScheduleTraining, onConcludeTraining, onUnscheduleTraining }) {
  const [drafts, setDrafts] = useState({}); // id -> { collaboratorId, scheduledDate, scheduledStart, durationMin, locationId }

  const setDraft = (id, patch) => setDrafts((d) => ({ ...d, [id]: { ...d[id], ...patch } }));

  const pending = trainingRequests.filter((r) => r.status === "pendente").sort((a, b) => a.deadlineDate.localeCompare(b.deadlineDate));
  // "confirmado" é o estado antigo, de quando agendar já subia o nível — some
  // com a migração da carga, mas segue reconhecido aqui pra base não sumir da
  // tela se alguém abrir com dado velho em cache.
  const scheduled = trainingRequests.filter((r) => r.status === "agendado" || r.status === "confirmado")
    .sort((a, b) => (a.scheduledDate || "").localeCompare(b.scheduledDate || ""));
  const done = trainingRequests.filter((r) => r.status === "concluido").sort((a, b) => (b.scheduledDate || "").localeCompare(a.scheduledDate || ""));
  const declined = trainingRequests.filter((r) => r.status === "recusado");

  // Agendar NÃO habilita ninguém: só marca a data e bloqueia o horário. Quem
  // sobe o nível é a conclusão (onConcludeTraining).
  const confirmRequest = async (req) => {
    const draft = drafts[req.id] || {};
    const collaboratorId = draft.collaboratorId || req.collaboratorId;
    if (!collaboratorId || !draft.scheduledDate) return;
    await onScheduleTraining(req, {
      collaboratorId, scheduledDate: draft.scheduledDate,
      scheduledStart: draft.scheduledStart || "09:00",
      durationMin: draft.durationMin || TRAINING_DEFAULT_MIN,
      locationId: draft.locationId || null,
      trainerId: draft.trainerId || null,
      equipmentId: draft.equipmentId || null,
      accessoryIds: draft.accessoryIds || [],
    });
  };
  const declineRequest = (req) => onUpdateRequests(trainingRequests.map((r) => r.id === req.id ? { ...r, status: "recusado" } : r));
  const retryRequest = (req, newCollaboratorId) => {
    const collab = data.collaborators.find((c) => c.id === newCollaboratorId);
    onUpdateRequests(trainingRequests.map((r) => r.id === req.id
      ? { ...r, status: "pendente", collaboratorId: newCollaboratorId, collaboratorName: collab?.name || r.collaboratorName, scheduledDate: null, scheduledStart: null, confirmedBy: null }
      : r));
    setDraft(req.id, { collaboratorId: null });
  };

  return (
    <div className="space-y-5">
      <Section icon={GraduationCap} title="Treinamentos" subtitle="Solicitações abertas quando uma reserva não encontra colaborador qualificado." />

      {!canTreinamento && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 flex items-center gap-2 text-xs">
          <Lock size={14} /> Modo somente leitura — seu usuário não tem permissão pra confirmar treinamentos.
        </div>
      )}

      {(() => {
        const linha = (r, editable) => (
          <TrainingRequestRow key={r.id} req={r} editable={editable} data={data} bookings={bookings} draft={drafts[r.id] || {}}
            onSetDraft={setDraft} onConfirm={confirmRequest} onDecline={declineRequest} onRetry={retryRequest}
            onConclude={onConcludeTraining} onUnschedule={onUnscheduleTraining} podeAntecipar={podeAntecipar} />
        );
        return (
          <React.Fragment>
            <div>
              <div className="text-xs font-semibold mb-2 flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Aguardando agendamento <Chip tone="gold">{pending.length}</Chip></div>
              {pending.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhuma solicitação pendente.</div>}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{pending.map((r) => linha(r, canTreinamento))}</div>
            </div>

            <div>
              <div className="text-xs font-semibold mb-2 flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
                Agendados <Chip tone="accent">{scheduled.length}</Chip>
                <span className="font-normal" style={{ color: T.inkMuted }}>— horário bloqueado na agenda; o nível sobe ao concluir</span>
              </div>
              {scheduled.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhum treinamento agendado.</div>}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{scheduled.map((r) => linha(r, canTreinamento))}</div>
            </div>

            {done.length > 0 && (
              <div>
                <div className="text-xs font-semibold mb-2 flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Concluídos <Chip tone="accent">{done.length}</Chip></div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{done.map((r) => linha(r, false))}</div>
              </div>
            )}

            {declined.length > 0 && (
              <div>
                <div className="text-xs font-semibold mb-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Recusados</div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{declined.map((r) => linha(r, false))}</div>
              </div>
            )}
          </React.Fragment>
        );
      })()}
    </div>
  );
}

          Pedido vindo do assistente vira reserva junto com o plano, lá. */}
      {req.status === "confirmado" && req.origin === "encaixe" && (isAdmin || isGestor) && (
        req.bookingId

              <Btn small icon={CalendarClock} onClick={() => onCreateBooking(req)}>Criar reserva</Btn>
            </div>
      )}
    </div>
  );
}
