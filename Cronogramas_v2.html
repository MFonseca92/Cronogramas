                      className="text-xs px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
                    <Btn small icon={Check} onClick={() => confirmRenewal(item)}>Confirmar</Btn>
                    <Btn small variant="ghost" onClick={() => setRenewing(null)}>Cancelar</Btn>
                  </div>
                ) : (
                  <Btn small variant="subtle" icon={RefreshCw} onClick={() => { setRenewing(item.id); setRenewDate(todayStr()); }}>Confirmar renovação</Btn>
                )
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Estoque — reposição de suprimentos com histórico: até aqui a quantidade  */
/* só descia por consumo (applySupplyUsage), sem jeito de registrar entrada */
/* de produto novo além de editar o número direto no formulário.           */
/* ---------------------------------------------------------------------- */
function StockPanel({ data, onUpdateCat, canEstoque, stockEntries, onRecordStockEntry, actorName, bookings, estimates }) {
  const [qtyDrafts, setQtyDrafts] = useState({});
  const [noteDrafts, setNoteDrafts] = useState({});

  const addStock = (supply) => {
    const qty = Number(qtyDrafts[supply.id]);
    if (!qty || qty <= 0) return;
    onUpdateCat("supplies", data.supplies.map((s) => (s.id === supply.id ? { ...s, quantity: (s.quantity ?? 0) + qty } : s)));
    onRecordStockEntry({
      id: genId("stk"), supplyId: supply.id, supplyName: supply.name, qty, note: (noteDrafts[supply.id] || "").trim(),
      enteredBy: actorName || "usuário sem identificação", enteredAt: new Date().toISOString(),
    });
    setQtyDrafts((d) => ({ ...d, [supply.id]: "" }));
    setNoteDrafts((d) => ({ ...d, [supply.id]: "" }));
  };

  // Três camadas por item, e o alerta de déficit se todas as estimativas
  // em aberto forem aprovadas.
  const outlooks = data.supplies.map((s) => ({ s, o: supplyOutlook(s, data.activities, bookings, estimates) }));
  const deficits = outlooks.filter(({ o }) => o.seTudoAprovado < 0);

  return (
    <div className="space-y-4">
      {!canEstoque && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 text-xs flex items-center gap-2">
          <Lock size={13} /> Modo somente leitura — peça a um gestor ou administrador pra repor estoque.
        </div>
      )}

      {/* A pergunta que a estimativa permite responder: e se tudo entrar? */}
      {deficits.length > 0 && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-xl p-3 space-y-1">
          <div className="text-xs font-medium flex items-center gap-1.5" style={{ color: T.warn }}>
            <AlertTriangle size={13} /> Se todas as estimativas em aberto forem aprovadas, vai faltar material
          </div>
          {deficits.map(({ s, o }) => (
            <div key={s.id} className="text-[11px]" style={{ color: T.inkMuted }}>
              <strong>{s.name}</strong>: déficit de {Math.abs(o.seTudoAprovado)} {s.unit || "un"} —
              {" "}{o.fisico} em estoque, {o.comprometido} já comprometido, {o.previsto} previsto em estimativa.
            </div>
          ))}
          <div className="text-[10px]" style={{ color: T.inkMuted }}>
            Isso é um cenário, não uma falta de agora: estimativa só consome de verdade quando é convertida.
          </div>
        </div>
      )}

      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
        {data.supplies.length === 0 && <div className="px-4 py-3 text-xs" style={{ color: T.inkMuted }}>Nenhum suprimento cadastrado ainda.</div>}
        {outlooks.map(({ s, o }) => (
          <div key={s.id} className="px-4 py-3 flex items-center justify-between gap-3 flex-wrap" style={{ borderBottom: `1px solid ${T.line}` }}>
            <div className="min-w-0">
              <div className="text-sm font-medium truncate">{s.name}</div>
              {/* Físico sozinho engana: parte já está prometida. */}
              <div className="text-[11px] mt-0.5 flex items-center gap-2 flex-wrap" style={{ color: T.inkMuted }}>
                <span><strong style={{ color: T.ink }}>{o.fisico}</strong> {s.unit || "un"} na prateleira</span>
                {o.comprometido > 0 && <span>· −{o.comprometido} comprometido em reservas</span>}
                <span>· <strong style={{ color: o.disponivel <= o.minimo ? T.danger : T.accentDark }}>{o.disponivel} disponível</strong></span>
                {o.previsto > 0 && <span style={{ color: T.gold }}>· {o.previsto} previsto em estimativas</span>}
                {o.disponivel <= o.minimo && <Chip tone="danger">estoque baixo</Chip>}
                {o.seTudoAprovado < 0 && <Chip tone="warn">faltaria {Math.abs(o.seTudoAprovado)} se tudo entrar</Chip>}
              </div>
            </div>
            {canEstoque && (
              <div className="flex items-center gap-1.5">
                <input type="number" min={1} placeholder="qtd" value={qtyDrafts[s.id] || ""} onChange={(e) => setQtyDrafts((d) => ({ ...d, [s.id]: e.target.value }))}
                  className="text-xs px-2 py-1.5 rounded-lg outline-none w-16" style={{ border: `1px solid ${T.line}` }} />
                <input placeholder="nota (opcional)" value={noteDrafts[s.id] || ""} onChange={(e) => setNoteDrafts((d) => ({ ...d, [s.id]: e.target.value }))}
                  className="text-xs px-2 py-1.5 rounded-lg outline-none w-32" style={{ border: `1px solid ${T.line}` }} />
                <Btn small icon={Plus} onClick={() => addStock(s)}>Entrada</Btn>
              </div>
            )}
          </div>
        ))}
      </div>

      {stockEntries.length > 0 && (
        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
          <div className="px-4 py-2.5 text-sm font-medium" style={{ borderBottom: `1px solid ${T.line}`, fontFamily: "'Space Grotesk', sans-serif" }}>Histórico de entradas</div>
          {stockEntries.slice(0, 20).map((e) => (
            <div key={e.id} className="px-4 py-2 flex items-center gap-3 flex-wrap text-xs" style={{ borderBottom: `1px solid ${T.line}` }}>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", color: T.inkMuted }} className="whitespace-nowrap">
                {new Date(e.enteredAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}
              </span>
              <Chip tone="accent">+{e.qty}</Chip>
              <span className="flex-1 truncate">{e.supplyName}{e.note && <span style={{ color: T.inkMuted }}> · {e.note}</span>}</span>
              <span style={{ color: T.inkMuted }}>por {e.enteredBy}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Usuários (contas) — quem faz login no sistema e com qual nível. Só quem  */
/* tem a capacidade `usuarios` (Admin) vê/edita essa tela.                 */
/* ---------------------------------------------------------------------- */
function UserForm({ data, editing, onSubmit, onCancel }) {
  const [item, setItem] = useState(editing);
  useEffect(() => { setItem(editing); }, [editing]);
  const needsResource = item.level === "colaborador" || item.level === "medico";
  const resourceOptions = item.level === "medico" ? data.doctors : data.collaborators;
  const submit = () => { if (!item.name.trim() || !item.pin.trim()) return; onSubmit(item); };

  return (
    <div style={{ background: T.surface, border: `1px dashed ${T.line}` }} className="rounded-xl p-3.5 space-y-3">
      <div className="flex flex-wrap gap-2 items-end">
        <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Nome</div>
          <input value={item.name} onChange={(e) => setItem({ ...item, name: e.target.value })}
            className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-48" style={{ border: `1px solid ${T.line}` }} />
        </label>
        <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>PIN</div>
          <input value={item.pin} maxLength={8} onChange={(e) => setItem({ ...item, pin: e.target.value.replace(/\s/g, "") })}
            className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}`, fontFamily: "'JetBrains Mono', monospace" }} />
        </label>
        <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Nível</div>
          <select value={item.level} onChange={(e) => setItem({ ...item, level: e.target.value, resourceId: null })}
            className="text-sm px-2.5 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }}>
            {USER_LEVELS.map((l) => <option key={l.id} value={l.id}>{l.label}</option>)}
          </select>
        </label>
        {needsResource && (
          <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>{item.level === "medico" ? "Médico(a) vinculado(a)" : "Colaborador(a) vinculado(a)"}</div>
            <div className="w-56"><SearchPick options={resourceOptions} value={item.resourceId} onChange={(v) => setItem({ ...item, resourceId: v })} placeholder="Escolher..." /></div>
          </label>
        )}
        <Btn small icon={Check} onClick={submit}>Salvar</Btn>
        <Btn small variant="ghost" icon={X} onClick={onCancel}>Cancelar</Btn>
      </div>
      {needsResource && !item.resourceId && (
        <div className="text-[10px]" style={{ color: T.warn }}>Sem vínculo, essa pessoa não aparece em "Meu dia" nem consegue responder Horas Extras.</div>
      )}
    </div>
  );
}
function UsersPanel({ users, onSave, data }) {
  const [editing, setEditing] = useState(null);
  const blank = () => ({ id: genId("user"), name: "", pin: "", level: "colaborador", resourceId: null });

  const upsert = (user) => {
    const exists = users.some((u) => u.id === user.id);
    onSave(exists ? users.map((u) => (u.id === user.id ? user : u)) : [...users, user]);
    setEditing(null);
  };
  const remove = (id) => onSave(users.filter((u) => u.id !== id));

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold">Usuários</div>
        <Btn small icon={Plus} onClick={() => setEditing(blank())}>Novo usuário</Btn>
      </div>

      {editing && <UserForm data={data} editing={editing} onSubmit={upsert} onCancel={() => setEditing(null)} />}

      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
        {users.length === 0 && <div className="px-4 py-3 text-xs" style={{ color: T.inkMuted }}>Nenhum usuário cadastrado ainda.</div>}
        {users.map((u) => {
          const resource = u.resourceId ? (u.level === "medico" ? data.doctors : data.collaborators).find((r) => r.id === u.resourceId) : null;
          return (
            <div key={u.id} className="px-4 py-2.5 flex items-center justify-between gap-3 flex-wrap" style={{ borderBottom: `1px solid ${T.line}` }}>
              <div className="min-w-0">
                <div className="text-xs font-medium truncate">{u.name}</div>
                <div className="text-[11px] flex items-center gap-1.5 flex-wrap" style={{ color: T.inkMuted }}>
                  <Chip tone="neutral">{LEVEL_LABELS[u.level]}</Chip>
                  {resource && <span>vinculado a {resource.name}</span>}
                  <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>PIN {u.pin}</span>
                </div>
              </div>
              <div className="flex gap-1 shrink-0">
                <button onClick={() => setEditing(u)} style={{ color: T.accentDark }}><Pencil size={14} /></button>
                <button onClick={() => remove(u.id)} style={{ color: T.danger }}><Trash2 size={14} /></button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Usuários — matriz de capacidades por nível, editável só pelo Admin.      */
/* Admin em si não aparece (é sempre "tudo", fixo, ver CAPABILITIES acima). */
/* ---------------------------------------------------------------------- */
/* ---------------------------------------------------------------------- */
/* Permissões — o que cada nível VÊ e o que cada nível FAZ.                 */
/*                                                                          */
/* Um nível por vez, não uma tabela de 5 colunas por 26 linhas: a pergunta  */
/* que se faz aqui é "o que o Gestor pode?", e não "quem pode aprovar       */
/* prazo?". Trocar de nível é um clique; comparar dois lado a lado é raro.  */
/*                                                                          */
/* As ações vêm agrupadas por assunto, porque quase toda mudança mexe num   */
/* bloco inteiro ("esse nível cuida de estimativa") e não numa linha solta. */
/* ---------------------------------------------------------------------- */
const CAP_GROUPS = [
  { label: "Cadastro e configuração", caps: ["cadastro", "custos", "calibracao", "estoque", "calendario"] },
  { label: "Planejamento e prazos", caps: ["planejar_estudo", "aprovar_prazo"] },
  { label: "Treinamento", caps: ["treinamento_confirmar"] },
  { label: "Hora extra", caps: ["hora_extra_solicitar", "hora_extra_responder"] },
  { label: "Estimativas", caps: ["estimativa_ver", "estimativa_editar", "estimativa_segurar", "estimativa_converter"] },
  { label: "Números do setor", caps: ["indicadores"] },
  { label: "Pessoal", caps: ["meu_dia"] },
];
function PermissionsPanel({ roleCapabilities, onSave }) {
  // Sem sync automático a partir de `roleCapabilities`: o App repõe esse objeto a
  // cada poll de 5s (nova referência mesmo sem mudança de conteúdo) — um useEffect
  // preso a ele apagaria edições ainda não salvas no meio de uma sessão de edição.
  // `draft` só volta a acompanhar o prop quando o usuário salva ou descarta.
  const [draft, setDraft] = useState(roleCapabilities);
  const [role, setRole] = useState(EDITABLE_ROLES[0].id);
  const dirty = JSON.stringify(draft) !== JSON.stringify(roleCapabilities);
  const tem = (capId) => (draft[role] || []).includes(capId);

  const toggle = (capId) => setDraft((d) => {
    const atual = d[role] || [];
    return { ...d, [role]: atual.includes(capId) ? atual.filter((c) => c !== capId) : [...atual, capId] };
  });
  // Marcar/desmarcar um bloco inteiro de uma vez — é assim que a mudança
  // costuma vir ("esse nível passa a cuidar de estimativa").
  const setMany = (caps, ligar) => setDraft((d) => {
    const atual = new Set(d[role] || []);
    caps.forEach((c) => (ligar ? atual.add(c) : atual.delete(c)));
    return { ...d, [role]: [...atual] };
  });
  const copiarDe = (origem) => setDraft((d) => ({ ...d, [role]: [...(d[origem] || [])] }));
  const restaurarPadrao = () => setDraft((d) => ({
    ...d, [role]: [...(DEFAULT_ROLE_CAPABILITIES[role] || []), ...(DEFAULT_ROLE_SCREENS[role] || [])],
  }));

  const capById = Object.fromEntries(CAPABILITIES.map((c) => [c.id, c]));
  const telasMarcadas = SCREENS.filter((s) => tem(screenCap(s.id))).length;
  const acoesMarcadas = CAPABILITIES.filter((c) => tem(c.id)).length;

  const Linha = ({ id, label, desc, fixo }) => (
    <label className="flex items-start gap-2 py-1.5 cursor-pointer" style={{ cursor: fixo ? "default" : "pointer" }}>
      <input type="checkbox" className="mt-0.5" checked={fixo || tem(id)} disabled={fixo} onChange={() => toggle(id)} />
      <span className="min-w-0">
        <span className="text-xs block">{label}{fixo && <span className="ml-1" style={{ color: T.inkMuted }}>(sempre visível)</span>}</span>
        {desc && <span className="text-[10px] block" style={{ color: T.inkMuted }}>{desc}</span>}
      </span>
    </label>
  );

  return (
    <div className="space-y-3">
      <div style={{ background: T.accentSoft, border: `1px solid ${T.accent}`, color: T.accentDark }} className="rounded-xl p-3 text-xs flex items-start gap-2">
        <UserCog size={14} className="mt-0.5 shrink-0" />
        <span>
          Só o Admin vê e edita essa tela. O Admin sempre tem tudo e não aparece aqui — assim ninguém se autobloqueia.
          À esquerda, <strong>o que aparece no menu</strong> daquele nível; à direita, <strong>o que ele pode fazer</strong> dentro das telas.
        </span>
      </div>

      {/* Escolher o nível é o primeiro passo — o resto da tela é sobre ele. */}
      <div className="flex items-center gap-1.5 flex-wrap">
        {EDITABLE_ROLES.map((r) => (
          <button key={r.id} onClick={() => setRole(r.id)}
            className="text-xs px-3 py-1.5 rounded-lg"
            style={role === r.id
              ? { background: T.accent, color: "#fff" }
              : { background: T.surface, color: T.ink, border: `1px solid ${T.line}` }}>
            {r.label}
          </button>
        ))}
      </div>

      <div className="flex items-center justify-between gap-2 flex-wrap text-[11px]" style={{ color: T.inkMuted }}>
        <span>{LEVEL_LABELS[role] || role}: <strong>{telasMarcadas + 1}</strong> tela(s) no menu · <strong>{acoesMarcadas}</strong> ação(ões) permitida(s)</span>
        <div className="flex items-center gap-1.5">
          <Btn small variant="ghost" onClick={restaurarPadrao}>Restaurar padrão</Btn>
          <select value="" onChange={(e) => { if (e.target.value) copiarDe(e.target.value); }}
            className="text-xs px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}`, background: T.surface, color: T.ink }}>
            <option value="">Copiar de outro nível…</option>
            {EDITABLE_ROLES.filter((r) => r.id !== role).map((r) => <option key={r.id} value={r.id}>{r.label}</option>)}
          </select>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        {/* ---- O que vê ---------------------------------------------- */}
        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3">
          <div className="flex items-center justify-between mb-1">
            <div className="text-xs font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>O que aparece no menu</div>
            <div className="flex gap-1">
              <button className="text-[10px] underline" style={{ color: T.inkMuted }} onClick={() => setMany(SCREEN_CAPS, true)}>tudo</button>
              <button className="text-[10px] underline" style={{ color: T.inkMuted }} onClick={() => setMany(SCREEN_CAPS, false)}>nada</button>
            </div>
          </div>
          {SCREENS.map((s) => (
            <Linha key={s.id} id={screenCap(s.id)} fixo={s.id === "dashboard"}
              label={s.label + (s.requerPessoa ? " — só pra quem tem agenda própria" : "")} desc={s.desc} />
          ))}
        </div>

        {/* ---- O que faz ---------------------------------------------- */}
        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3 space-y-2">
          <div className="text-xs font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>O que pode fazer</div>
          {/* Capacidade nova que ninguém agrupou ainda cai em "Outras" em vez
              de sumir da tela — senão ela ficaria impossível de configurar. */}
          {[...CAP_GROUPS, { label: "Outras", caps: CAPABILITIES.map((c) => c.id).filter((id) => !CAP_GROUPS.some((g) => g.caps.includes(id))) }]
            .filter((g) => g.caps.length > 0).map((g) => {
            const caps = g.caps.filter((c) => capById[c]);
            const todos = caps.every((c) => tem(c));
            return (
              <div key={g.label}>
                <div className="flex items-center justify-between">
                  <div className="text-[10px] uppercase tracking-wide" style={{ color: T.inkMuted }}>{g.label}</div>
                  <button className="text-[10px] underline" style={{ color: T.inkMuted }} onClick={() => setMany(caps, !todos)}>
                    {todos ? "desmarcar" : "marcar"} tudo
                  </button>
                </div>
                <div style={{ borderLeft: `2px solid ${T.line}` }} className="pl-2">
                  {caps.map((c) => <Linha key={c} id={c} label={capById[c].label} desc={capById[c].desc} />)}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {dirty && (
        <div className="flex gap-2 items-center">
          <Btn small icon={Check} onClick={() => onSave(draft)}>Salvar permissões</Btn>
          <Btn small variant="ghost" onClick={() => setDraft(roleCapabilities)}>Descartar</Btn>
          <span className="text-[10px]" style={{ color: T.warn }}>Há alterações não salvas.</span>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Tempos e intervalos — tabela pra cadastrar de uma vez, pra todas as      */
/* atividades: duração, preparo antes, desmontagem depois, folga mínima até */
/* a próxima, quantas pessoas e limite de participantes. É esse cadastro    */
/* que o motor usa pra montar o cronograma sem encavalar nada.              */
/* ---------------------------------------------------------------------- */
function ActivityTimesPanel({ data, onUpdateCat, canCadastro }) {
  const [drafts, setDrafts] = useState({});
  const [search, setSearch] = useState("");
  const key = (id, f) => `${id}:${f}`;
  const valueOf = (a, f, fallback) => {
    const k = key(a.id, f);
    return drafts[k] !== undefined ? drafts[k] : (a[f] ?? fallback);
  };
  const setDraft = (id, f, v) => setDrafts((d) => ({ ...d, [key(id, f)]: v }));
  const commit = (a, f, fallback) => {
    const raw = drafts[key(a.id, f)];
    if (raw === undefined) return;
    const num = raw === "" ? fallback : Number(raw);
    const val = Number.isFinite(num) ? num : fallback;
    setDrafts((d) => { const n = { ...d }; delete n[key(a.id, f)]; return n; });
    if ((a[f] ?? fallback) === val) return;
    onUpdateCat("activities", data.activities.map((x) => (x.id === a.id ? { ...x, [f]: val } : x)));
  };

  const list = data.activities
    .filter((a) => a.name.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => a.name.localeCompare(b.name));

  const COLS = [
    { f: "durationMin", label: "Duração", fallback: 60, min: 15, step: 15 },
    { f: "setupMin", label: "Preparo", fallback: 0, min: 0, step: 5 },
    { f: "teardownMin", label: "Desmontagem", fallback: 0, min: 0, step: 5 },
    { f: "minGapMin", label: "Intervalo", fallback: 0, min: 0, step: 5 },
    { f: "staffCount", label: "Pessoas", fallback: 1, min: 1, step: 1 },
    { f: "maxParticipants", label: "Máx. part.", fallback: null, min: 0, step: 1 },
  ];

  return (
    <div className="space-y-3">
      {!canCadastro && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 text-xs flex items-center gap-2">
          <Lock size={13} /> Modo somente leitura — seu usuário não tem permissão pra alterar os tempos.
        </div>
      )}
      <div style={{ background: T.accentSoft, border: `1px solid ${T.accent}`, color: T.accentDark }} className="rounded-xl p-3 text-[11px]">
        <Info size={12} className="inline -mt-0.5 mr-1" />
        <strong>Preparo</strong> e <strong>desmontagem</strong> bloqueiam a sala e a equipe além do horário da atividade.
        O <strong>intervalo</strong> é a folga exigida antes da próxima atividade começar. <strong>Pessoas</strong> é quantos colaboradores precisam estar juntos.
      </div>

      <div className="flex items-center gap-2">
        <Search size={14} style={{ color: T.inkMuted }} />
        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar atividade..."
          className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
      </div>

      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs" style={{ minWidth: 720 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${T.line}` }}>
                <th className="text-left px-4 py-2 font-medium" style={{ color: T.inkMuted }}>Atividade / método</th>
                {COLS.map((c) => <th key={c.f} className="px-2 py-2 font-medium text-center" style={{ color: T.inkMuted, width: 92 }}>{c.label}<div className="text-[9px] font-normal">{c.f === "staffCount" || c.f === "maxParticipants" ? "" : "min"}</div></th>)}
              </tr>
            </thead>
            <tbody>
              {list.length === 0 && <tr><td colSpan={COLS.length + 1} className="px-4 py-4" style={{ color: T.inkMuted }}>Nenhuma atividade encontrada.</td></tr>}
              {list.map((a) => (
                <tr key={a.id} style={{ borderBottom: `1px solid ${T.line}` }}>
                  <td className="px-4 py-1.5 truncate max-w-[240px]" title={a.name}>{a.name}</td>
                  {COLS.map((c) => (
                    <td key={c.f} className="px-2 py-1.5 text-center">
                      <input type="number" min={c.min} step={c.step} disabled={!canCadastro}
                        placeholder={c.fallback === null ? "—" : String(c.fallback)}
                        value={valueOf(a, c.f, c.fallback === null ? "" : c.fallback)}
                        onChange={(e) => setDraft(a.id, c.f, e.target.value)}
                        onBlur={() => commit(a, c.f, c.fallback)}
                        className="text-xs px-2 py-1 rounded-md outline-none w-20 text-center"
                        style={{ border: `1px solid ${T.line}`, opacity: canCadastro ? 1 : 0.6 }} />
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <div className="text-[11px]" style={{ color: T.inkMuted }}>As alterações salvam ao sair do campo. "Máx. part." em branco = sem limite.</div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Horários — janela de funcionamento por dia da semana, pra local, equipe  */
/* e médico. O horário geral vale pra todo dia marcado; o horário por dia   */
/* sobrepõe (ex.: sábado só de manhã). O motor respeita os dois.            */
/* ---------------------------------------------------------------------- */
function ScheduleHoursPanel({ data, onUpdateCat, canCadastro }) {
  const [cat, setCat] = useState("locations");
  const [search, setSearch] = useState("");
  const CATS = [
    { id: "locations", label: "Locais", icon: Building2 },
    { id: "collaborators", label: "Colaboradores", icon: Users },
    { id: "doctors", label: "Médicos", icon: Stethoscope },
  ];
  const items = (data[cat] || []).filter((i) => i.name.toLowerCase().includes(search.toLowerCase()));

  const patch = (item, availPatch) => {
    if (!canCadastro) return;
    onUpdateCat(cat, data[cat].map((x) => (x.id === item.id ? { ...x, availability: { ...(x.availability || DEFAULT_AVAIL), ...availPatch } } : x)));
  };
  const setPerDay = (item, dayKey, field, value) => {
    const avail = item.availability || DEFAULT_AVAIL;
    const perDay = { ...(avail.perDay || {}) };
    const cur = perDay[dayKey] || { start: avail.start, end: avail.end };
    perDay[dayKey] = { ...cur, [field]: value };
    patch(item, { perDay });
  };
  const clearPerDay = (item, dayKey) => {
    const avail = item.availability || DEFAULT_AVAIL;
    const perDay = { ...(avail.perDay || {}) };
    delete perDay[dayKey];
    patch(item, { perDay });
  };

  return (
    <div className="space-y-3">
      {!canCadastro && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 text-xs flex items-center gap-2">
          <Lock size={13} /> Modo somente leitura — seu usuário não tem permissão pra alterar horários.
        </div>
      )}
      <div className="flex gap-1.5 flex-wrap">
        {CATS.map((c) => (
          <button key={c.id} onClick={() => setCat(c.id)} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg"
            style={{ background: cat === c.id ? T.accent : T.surface, color: cat === c.id ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>
            <c.icon size={13} /> {c.label}
          </button>
        ))}
      </div>
      <div className="flex items-center gap-2">
        <Search size={14} style={{ color: T.inkMuted }} />
        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar..."
          className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
      </div>

      <div className="space-y-2">
        {items.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nada encontrado.</div>}
        {items.map((item) => {
          const avail = item.availability || DEFAULT_AVAIL;
          return (
            <div key={item.id} style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3 space-y-2">
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <div className="text-xs font-medium">{item.name}</div>
                <div className="flex items-center gap-1.5 text-[11px]" style={{ color: T.inkMuted }}>
                  Horário geral
                  <input type="time" disabled={!canCadastro} value={avail.start} onChange={(e) => patch(item, { start: e.target.value })}
                    className="text-xs px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                  <span>até</span>
                  <input type="time" disabled={!canCadastro} value={avail.end} onChange={(e) => patch(item, { end: e.target.value })}
                    className="text-xs px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                </div>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-1.5">
                {WEEKDAYS.map((d) => {
                  const on = !!avail[d.key];
                  const per = avail.perDay?.[d.key];
                  return (
                    <div key={d.key} style={{ background: on ? T.bg : T.subtle, border: `1px solid ${on ? T.line : "transparent"}`, opacity: on ? 1 : 0.6 }} className="rounded-lg p-1.5">
                      <button disabled={!canCadastro} onClick={() => patch(item, { [d.key]: !on })}
                        className="w-full text-[11px] font-medium mb-1 rounded-md py-0.5"
                        style={{ background: on ? T.accent : "transparent", color: on ? "#fff" : T.inkMuted }}>{d.label}</button>
                      {on && (
                        <div className="space-y-1">
                          <input type="time" disabled={!canCadastro} value={per?.start || avail.start}
                            onChange={(e) => setPerDay(item, d.key, "start", e.target.value)}
                            className="w-full text-[10px] px-1 py-0.5 rounded outline-none text-center" style={{ border: `1px solid ${T.line}` }} />
                          <input type="time" disabled={!canCadastro} value={per?.end || avail.end}
                            onChange={(e) => setPerDay(item, d.key, "end", e.target.value)}
                            className="w-full text-[10px] px-1 py-0.5 rounded outline-none text-center" style={{ border: `1px solid ${T.line}` }} />
                          {per && canCadastro && (
                            <button onClick={() => clearPerDay(item, d.key)} className="w-full text-[9px] underline" style={{ color: T.inkMuted }}>usar geral</button>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Recurso segurado por uma estimativa — o que fazer.                       */
/*                                                                          */
/* "Ocupado" é uma parede: não tem o que discutir. "Segurado pela           */
/* estimativa X até 20/08" é uma DECISÃO que alguém tomou e que alguém pode */
/* rever. O sistema não decide sozinho — mostra de quem é, até quando, e    */
/* oferece as saídas pra quem tem alçada.                                   */
/* ---------------------------------------------------------------------- */
function EstimateBlockerNotice({ blockers, estimates, data, canSegurar, onLiberar }) {
  if (!blockers?.length) return null;
  // Um bloqueio por estimativa: várias linhas do mesmo pedido não viram
  // várias caixas iguais.
  const porEstimativa = new Map();
  blockers.forEach((bl) => {
    const est = estimates.find((e) => e.id === bl.booking.estimateId);
    if (!est) return;
    if (!porEstimativa.has(est.id)) porEstimativa.set(est.id, { est, recursos: [] });
    porEstimativa.get(est.id).recursos.push(`${bl.resource} "${bl.resourceName}"`);
  });
  if (!porEstimativa.size) return null;

  return (
    <div className="space-y-2">
      {[...porEstimativa.values()].map(({ est, recursos }) => (
        <div key={est.id} style={{ background: T.goldSoft, border: `1px solid ${T.gold}` }} className="rounded-lg p-2.5 space-y-1.5">
          <div className="text-[11px] font-medium flex items-center gap-1.5" style={{ color: T.gold }}>
            <Lock size={12} /> Esse recurso está temporariamente bloqueado por uma estimativa
          </div>
          <div className="text-[11px] space-y-0.5" style={{ color: T.inkMuted }}>
            <div><strong style={{ color: T.ink }}>Oportunidade:</strong> {est.name}</div>
            {est.client && <div><strong style={{ color: T.ink }}>Cliente:</strong> {est.client}</div>}
            <div><strong style={{ color: T.ink }}>Responsável:</strong> {data.collaborators.find((c) => c.id === est.responsibleId)?.name || est.createdBy || "—"}</div>
            <div><strong style={{ color: T.ink }}>Bloqueio válido até:</strong> {est.holdUntil ? weekdayLabel(est.holdUntil) : "—"}</div>
            <div><strong style={{ color: T.ink }}>Segurando:</strong> {[...new Set(recursos)].join(", ")}</div>
          </div>
          {canSegurar ? (
            <div className="space-y-1">
              <div className="flex items-center gap-1.5 flex-wrap">
                <Btn small variant="ghost" icon={Unlock} onClick={() => onLiberar(est)}>Liberar essa estimativa</Btn>
                <span className="text-[10px]" style={{ color: T.inkMuted }}>ou remaneje esta reserva pra outro horário/sala acima</span>
              </div>
              <div className="text-[10px]" style={{ color: T.inkMuted }}>
                Liberar solta os recursos na hora e a estimativa continua existindo, sem bloqueio. Fica registrado quem liberou.
              </div>
            </div>
          ) : (
            <div className="text-[10px]" style={{ color: T.inkMuted }}>
              Você não tem permissão pra liberar uma pré-reserva. Fale com o gestor, ou remaneje esta reserva pra outro horário.
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Estimativas — as oportunidades que ainda não viraram estudo.             */
/*                                                                          */
/* Três coisas separadas na tela porque são separadas na realidade:         */
/*   previsão      "se isso for aprovado, vamos precisar disso"             */
/*   pré-reserva   "ainda não aprovaram, mas decidimos segurar"             */
/*   convertida    virou estudo oficial                                     */
/* ---------------------------------------------------------------------- */
function EstimatesView({ data, estimates, bookings, studies, canEditar, canSegurar, canConverter, canVerCustos,
  onSetHold, onCancel, onReopen, onConvert, onNova }) {
  const [filtro, setFiltro] = useState("abertas");
  const [aberta, setAberta] = useState({});
  const [draftPrazo, setDraftPrazo] = useState({});
  const [draftCancel, setDraftCancel] = useState({});
  const [resultado, setResultado] = useState(null); // conflitos da conversão
  // Trava o botão enquanto a conversão está em voo. A garantia de verdade é a
  // pré-condição no servidor (ver `convertEstimateAtomic`), mas deixar o botão
  // clicável convida ao clique duplo, que é o caminho mais fácil pro problema.
  const [convertendo, setConvertendo] = useState(null);

  const ocupacoesDe = (est) => bookings.filter((b) => b.estimateId === est.id);
  const custoDe = (est) => bookingsCost(ocupacoesDe(est), data);
  const horasDe = (est) => ocupacoesDe(est).reduce((s, b) => s + (toMin(b.end) - toMin(b.start)) / 60, 0);
  const nomePessoa = (id) => data.collaborators.find((c) => c.id === id)?.name || "—";

  const FILTROS = [
    { id: "abertas", label: "Em aberto", teste: (e) => ESTIMATE_OPEN.includes(estimateEffectiveStatus(e)) },
    { id: "segurando", label: "Segurando recursos", teste: (e) => estimateHoldsNow(e) },
    { id: "convertidas", label: "Convertidas", teste: (e) => e.status === "convertida" },
    { id: "encerradas", label: "Canceladas e expiradas", teste: (e) => ["cancelada", "expirada"].includes(estimateEffectiveStatus(e)) },
    { id: "todas", label: "Todas", teste: () => true },
  ];
  const lista = estimates.filter(FILTROS.find((f) => f.id === filtro).teste)
    .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));

  const converter = async (est) => {
    if (convertendo) return;
    setResultado(null);
    setConvertendo(est.id);
    try {
      const r = await onConvert(est);
      setResultado({ id: est.id, ...r });
    } finally { setConvertendo(null); }
  };

  return (
    <div className="space-y-4">
      <Section icon={Wallet} title="Estimativas"
        subtitle="Oportunidades ainda não confirmadas: servem pra orçar, prever capacidade e — quando alguém decide — segurar recursos por um prazo."
        right={canEditar ? <Btn small icon={Plus} onClick={onNova}>Nova estimativa</Btn> : null} />

      <div className="flex items-center gap-1.5 flex-wrap">
        {FILTROS.map((f) => {
          const n = estimates.filter(f.teste).length;
          return (
            <button key={f.id} onClick={() => setFiltro(f.id)} className="text-xs px-3 py-1.5 rounded-lg"
              style={filtro === f.id ? { background: T.accent, color: "#fff" } : { background: T.surface, color: T.ink, border: `1px solid ${T.line}` }}>
              {f.label} ({n})
            </button>
          );
        })}
      </div>

      {lista.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhuma estimativa nesse filtro.</div>}

      <div className="space-y-3">
        {lista.map((est) => {
          const st = estimateEffectiveStatus(est);
          const meta = ESTIMATE_STATUS_META[st];
          const ocup = ocupacoesDe(est);
          const segurando = estimateHoldsNow(est);
          const estudo = est.convertedStudyId ? studies.find((s) => s.id === est.convertedStudyId) : null;
          const res = resultado?.id === est.id ? resultado : null;
          const podeConverter = canConverter && estimateConversionBlockers(est).length === 0;
          return (
            <div key={est.id} style={{ background: T.surface, border: `1px solid ${segurando ? T.gold : T.line}` }} className="rounded-xl p-4 space-y-2">
              <div className="flex items-start justify-between gap-2 flex-wrap">
                <div className="min-w-0 cursor-pointer" onClick={() => setAberta((a) => ({ ...a, [est.id]: !a[est.id] }))}>
                  <div className="text-sm font-semibold flex items-center gap-1.5 flex-wrap" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
                    {est.name}
                    <Chip tone={meta?.tone}>{meta?.label}</Chip>
                    {segurando && <Chip tone="gold"><Lock size={10} className="inline -mt-0.5 mr-0.5" />segurando até {weekdayLabel(est.holdUntil)}</Chip>}
                  </div>
                  <div className="text-[11px]" style={{ color: T.inkMuted }}>
                    {est.client ? `${est.client} · ` : ""}
                    {data.sponsors.find((s) => s.id === est.sponsorId)?.name || "sem patrocinador"}
                    {est.responsibleId ? ` · responsável: ${nomePessoa(est.responsibleId)}` : ""}
                    {" · "}{(est.protocol || []).length} visita(s) · {ocup.length} ocupação(ões) prevista(s)
                    {est.estimatedValue != null ? ` · valor ${fmtBRL(est.estimatedValue)}` : ""}
                  </div>
                  <div className="text-[11px]" style={{ color: T.inkMuted }}>
                    Criada em {weekdayLabel((est.createdAt || "").slice(0, 10))} por {est.createdBy}
                    {canVerCustos && ocup.length > 0 && ` · custo operacional previsto ${fmtBRL(custoDe(est))}`}
                    {ocup.length > 0 && ` · ${horasDe(est).toFixed(1)}h de recurso`}
                  </div>
                </div>
                <div className="flex items-center gap-1.5 flex-wrap shrink-0">
                  {estudo && <Chip tone="accent">virou {estudo.name}</Chip>}
                  <Btn small variant="ghost" onClick={() => setAberta((a) => ({ ...a, [est.id]: !a[est.id] }))}>{aberta[est.id] ? "Recolher" : "Detalhes"}</Btn>
                </div>
              </div>

              {/* Ações — cada uma só aparece pra quem pode e faz sentido no
                  estado atual. Botão que existe mas não funciona confunde
                  mais do que botão ausente. */}
              <div className="flex items-center gap-1.5 flex-wrap">
                {canSegurar && ESTIMATE_OPEN.includes(st) && !segurando && (
                  <Btn small variant="subtle" icon={Lock} onClick={() => setDraftPrazo((d) => ({ ...d, [est.id]: addDays(todayStr(), 7) }))}>Segurar recursos</Btn>
                )}
                {canSegurar && segurando && (
                  <>
                    <Btn small variant="ghost" icon={CalendarRange} onClick={() => setDraftPrazo((d) => ({ ...d, [est.id]: est.holdUntil }))}>Prorrogar</Btn>
                    <Btn small variant="ghost" icon={Unlock} onClick={() => onSetHold(est, { segurar: false })}>Liberar recursos</Btn>
                  </>
                )}
                {canConverter && ESTIMATE_OPEN.includes(st) && (
                  <Btn small icon={Check} disabled={!podeConverter || !!convertendo} onClick={() => converter(est)}>
                    {convertendo === est.id ? "Convertendo…" : "Transformar em reserva"}
                  </Btn>
                )}
                {canEditar && ESTIMATE_OPEN.includes(st) && (
                  <Btn small variant="danger" icon={X} onClick={() => setDraftCancel((d) => ({ ...d, [est.id]: { motivo: ESTIMATE_CANCEL_REASONS[0] } }))}>Cancelar</Btn>
                )}
                {canEditar && ["cancelada", "expirada"].includes(st) && (
                  <Btn small variant="ghost" icon={RefreshCw} onClick={() => onReopen(est)}>Reabrir</Btn>
                )}
              </div>

              {draftPrazo[est.id] !== undefined && (
                <div className="flex items-end gap-2 flex-wrap rounded-lg p-2" style={{ background: T.goldSoft }}>
                  <label className="text-[10px]" style={{ color: T.gold }}>Segurar recursos até
                    <input type="date" min={todayStr()} value={draftPrazo[est.id] || ""} onChange={(e) => setDraftPrazo((d) => ({ ...d, [est.id]: e.target.value }))}
                      className="mt-0.5 block text-xs px-2 py-1.5 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                  </label>
                  <Btn small icon={Check} disabled={!draftPrazo[est.id]} onClick={async () => {
                    const ok = await onSetHold(est, { segurar: true, ate: draftPrazo[est.id] });
                    if (ok !== false) setDraftPrazo((d) => { const n = { ...d }; delete n[est.id]; return n; });
                  }}>Confirmar</Btn>
                  <Btn small variant="ghost" onClick={() => setDraftPrazo((d) => { const n = { ...d }; delete n[est.id]; return n; })}>Cancelar</Btn>
                  <div className="text-[10px] w-full" style={{ color: T.inkMuted }}>
                    A partir de agora essas {ocup.length} ocupação(ões) tiram o horário de quem tentar reservar em cima. Depois da data, o bloqueio cai sozinho.
                  </div>
                </div>
              )}

              {draftCancel[est.id] && (
                <div className="space-y-1.5 rounded-lg p-2" style={{ background: T.dangerSoft }}>
                  <div className="text-[11px]" style={{ color: T.danger }}>Por que essa oportunidade foi cancelada?</div>
                  <select value={draftCancel[est.id].motivo} onChange={(e) => setDraftCancel((d) => ({ ...d, [est.id]: { motivo: e.target.value } }))}
                    className="text-xs px-2 py-1.5 rounded-md outline-none" style={{ border: `1px solid ${T.line}`, background: T.surface, color: T.ink }}>
                    {ESTIMATE_CANCEL_REASONS.map((m) => <option key={m} value={m}>{m}</option>)}
                  </select>
                  <div className="flex gap-1.5">
                    <Btn small variant="danger" icon={Check} onClick={async () => {
                      const ok = await onCancel(est, draftCancel[est.id].motivo);
                      if (ok !== false) setDraftCancel((d) => { const n = { ...d }; delete n[est.id]; return n; });
                    }}>Cancelar estimativa</Btn>
                    <Btn small variant="ghost" onClick={() => setDraftCancel((d) => { const n = { ...d }; delete n[est.id]; return n; })}>Voltar</Btn>
                  </div>
                  <div className="text-[10px]" style={{ color: T.inkMuted }}>Os recursos segurados são liberados na hora. A estimativa fica no histórico.</div>
                </div>
              )}

              {/* Resultado da conversão: ou converteu, ou lista o que impediu.
                  Nunca converte pela metade. */}
              {res && !res.ok && (
                <div style={{ background: T.dangerSoft, border: `1px solid ${T.danger}` }} className="rounded-lg p-2.5 space-y-1">
                  <div className="text-[11px] font-medium" style={{ color: T.danger }}>
                    <AlertTriangle size={12} className="inline -mt-0.5 mr-1" />
                    Não foi possível transformar em reserva — {res.problemas.length} problema(s). Nada foi alterado.
                  </div>
                  {res.problemas.map((p, i) => <div key={i} className="text-[11px]" style={{ color: T.inkMuted }}>• {p}</div>)}
                  <div className="text-[10px]" style={{ color: T.inkMuted }}>
                    A estimativa foi montada antes; alguma coisa mudou desde então. Replaneje no assistente ou libere o recurso que está no caminho.
                  </div>
                </div>
              )}
              {res && res.ok && (
                <div className="text-[11px] rounded-lg p-2" style={{ background: T.accentSoft, color: T.accentDark }}>
                  <Check size={12} className="inline -mt-0.5 mr-1" />Convertida: o estudo e as reservas oficiais foram criados, e o estoque foi baixado.
                </div>
              )}

              {aberta[est.id] && (
                <div className="space-y-1.5 pt-2" style={{ borderTop: `1px dashed ${T.line}` }}>
                  {est.notes && <div className="text-[11px]" style={{ color: T.inkMuted }}>Observações: {est.notes}</div>}
                  {est.cancellationReason && <div className="text-[11px]" style={{ color: T.danger }}>Cancelada por: {est.cancellationReason} ({est.cancelledBy})</div>}
                  {(est.protocol || []).map((v) => {
                    const doVisita = ocup.filter((b) => b.estimateVisitId === v.tpId);
                    const w = timepointWindow(v, est.baselineDate, est);
                    return (
                      <div key={v.tpId} className="text-[11px]" style={{ color: T.inkMuted }}>
                        <strong style={{ color: T.ink }}>{v.label}</strong> · D{v.offsetDays}{v.toleranceDays ? `±${v.toleranceDays}` : ""} ·
                        {" "}{w.dateMin === w.dateMax ? weekdayLabel(w.dateMin) : `${weekdayLabel(w.dateMin)} a ${weekdayLabel(w.dateMax)}`} ·
                        {" "}{doVisita.length} atividade(s)
                        {doVisita.map((b) => (
                          <div key={b.id} className="pl-3">
                            {data.activities.find((a) => a.id === b.activityId)?.name || "—"} · {weekdayLabel(b.date)} {b.start}–{b.end} ·
                            {" "}{data.locations.find((l) => l.id === b.locationId)?.name || "sem sala"}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Calendário do ano — férias, folgas, feriados, eventos e manutenção.      */
/*                                                                          */
/* O ano inteiro de uma vez de propósito: planejamento de estudo trabalha   */
/* meses à frente, e a pergunta que se faz aqui é "quem some em setembro?", */
/* não "o que tem hoje". Ver é de todo mundo (a pessoa precisa enxergar as  */
/* próprias férias); lançar exige a capacidade `calendario`.                */
/* ---------------------------------------------------------------------- */
const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
  "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
const KIND_ICON = { ferias: Umbrella, folga: Umbrella, feriado: PartyPopper, evento: PartyPopper, manutencao: Wrench };
// Rótulo em cima do campo, no mesmo estilo do resto do arquivo.
function Field({ label, children }) {
  return (
    <div>
      <div className="text-[10px] uppercase tracking-wide mb-1" style={{ color: T.inkMuted }}>{label}</div>
      {children}
    </div>
  );
}

// Todo mundo que uma ausência pode atingir, num pote só — o formulário não
// precisa saber se é gente, sala ou aparelho, só o id.
function absenceTargets(data) {
  return [
    ...data.collaborators.map((c) => ({ id: c.id, name: c.name, grupo: "Colaboradores" })),
    ...data.doctors.map((d) => ({ id: d.id, name: d.name, grupo: "Médicos" })),
    ...data.locations.map((l) => ({ id: l.id, name: l.name, grupo: "Locais" })),
    ...data.equipment.map((e) => ({ id: e.id, name: e.name, grupo: "Equipamentos" })),
  ];
}

function CalendarView({ data, bookings, canLancar, actorName, onSave }) {
  const hoje = todayStr();
  const [ano, setAno] = useState(Number(hoje.slice(0, 4)));
  const [editando, setEditando] = useState(null); // entrada em edição/criação
  const [diaAberto, setDiaAberto] = useState(null);
  const calendar = data.calendar || [];
  const alvos = absenceTargets(data);
  const nomeDe = (id) => alvos.find((a) => a.id === id)?.name || id;

  // Só o que toca o ano escolhido (uma ausência pode atravessar o réveillon).
  const doAno = calendar.filter((c) => (c.dateStart || "") <= `${ano}-12-31` && (c.dateEnd || c.dateStart || "") >= `${ano}-01-01`)
    .sort((a, b) => (a.dateStart || "").localeCompare(b.dateStart || ""));

  const noDia = (d) => doAno.filter((c) => d >= c.dateStart && d <= (c.dateEnd || c.dateStart));
  // Reserva marcada num dia de ausência: é o conflito que já existia na base
  // antes de alguém lançar as férias. Precisa aparecer, não ser escondido.
  const reservasNoDia = (d) => bookings.filter((b) => b.date === d);

  const salvar = async (entrada) => {
    const limpa = {
      ...entrada,
      targetIds: entrada.scope === "todos" ? [] : (entrada.targetIds || []),
      dateEnd: entrada.dateEnd || entrada.dateStart,
      start: entrada.allDay ? null : (entrada.start || "08:00"),
      end: entrada.allDay ? null : (entrada.end || "18:00"),
    };
    if (!limpa.dateStart) return;
    if (limpa.scope !== "todos" && !limpa.targetIds.length) return;
    const existe = calendar.some((c) => c.id === limpa.id);
    const ok = await onSave(existe ? calendar.map((c) => (c.id === limpa.id ? limpa : c)) : [...calendar, limpa]);
    if (ok !== false) setEditando(null);
  };
  const excluir = async (c) => {
    if (!window.confirm(`Tirar "${c.title || ABSENCE_KIND_META[c.kind]?.label}" do calendário?`)) return;
    await onSave(calendar.filter((x) => x.id !== c.id));
  };
  /* Feriados nacionais do ano, lançados a pedido. O botão some quando o ano
   * já tem feriado — evita gravar tudo duas vezes, que é o erro fácil aqui. */
  const jaTemFeriados = doAno.filter((c) => c.kind === "feriado").length;
  const lancarFeriados = async () => {
    const novos = nationalHolidays(ano).map((h) => ({
      id: genId("cal"), kind: "feriado", title: h.title, scope: "todos", targetIds: [],
      dateStart: h.date, dateEnd: h.date, allDay: true, start: null, end: null,
      notes: "Feriado nacional", createdBy: actorName || "usuário sem identificação",
      createdAt: new Date().toISOString(),
    }));
    await onSave([...calendar, ...novos]);
  };

  const novo = (dateStart) => setEditando({
    id: genId("cal"), kind: "ferias", title: "", scope: "recurso", targetIds: [],
    dateStart: dateStart || hoje, dateEnd: dateStart || hoje, allDay: true, start: null, end: null,
    notes: "", createdBy: actorName || "usuário sem identificação", createdAt: new Date().toISOString(),
  });

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <Section icon={CalendarDays} title="Calendário do ano"
          subtitle="Férias, folgas, feriados, eventos e manutenção — o motor não escala ninguém nesses dias." />
        <div className="flex items-center gap-2">
          <div className="flex items-center gap-1">
            <Btn small variant="ghost" icon={ChevronLeft} onClick={() => setAno(ano - 1)} />
            <div style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold w-12 text-center">{ano}</div>
            <Btn small variant="ghost" icon={ChevronRight} onClick={() => setAno(ano + 1)} />
          </div>
          {canLancar && jaTemFeriados === 0 && (
            <Btn small variant="subtle" icon={PartyPopper} onClick={lancarFeriados}
              title={`Grava os feriados nacionais de ${ano} no calendário`}>
              Lançar feriados de {ano}
            </Btn>
          )}
          {canLancar && <Btn small icon={Plus} onClick={() => novo()}>Lançar ausência</Btn>}
        </div>
      </div>

      {/* Legenda: cor sozinha não basta, cada tipo carrega seu ícone. */}
      <div className="flex items-center gap-3 flex-wrap text-[10px]" style={{ color: T.inkMuted }}>
        {ABSENCE_KINDS.map((k) => {
          const Ic = KIND_ICON[k.id];
          return <span key={k.id} className="flex items-center gap-1"><Ic size={11} /> {k.label}</span>;
        })}
      </div>

      {editando && (
        <AbsenceForm entrada={editando} alvos={alvos} onChange={setEditando}
          onCancel={() => setEditando(null)} onSave={() => salvar(editando)} />
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
        {MESES.map((mes, mi) => {
          const primeiro = new Date(ano, mi, 1);
          const dias = new Date(ano, mi + 1, 0).getDate();
          const vazios = primeiro.getDay(); // domingo = 0, igual à grade abaixo
          return (
            <div key={mes} style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-2.5">
              <div className="text-xs font-medium mb-1.5">{mes}</div>
              <div className="grid grid-cols-7 gap-0.5 text-[9px] text-center" style={{ color: T.inkMuted }}>
                {["D", "S", "T", "Q", "Q", "S", "S"].map((d, i) => <div key={i}>{d}</div>)}
              </div>
              <div className="grid grid-cols-7 gap-0.5">
                {Array.from({ length: vazios }).map((_, i) => <div key={`v${i}`} />)}
                {Array.from({ length: dias }).map((_, i) => {
                  const d = `${ano}-${String(mi + 1).padStart(2, "0")}-${String(i + 1).padStart(2, "0")}`;
                  const itens = noDia(d);
                  const geral = itens.find((c) => c.scope === "todos");
                  const fds = [0, 6].includes(new Date(d + "T00:00:00").getDay());
                  const bg = geral ? T.goldSoft : itens.length ? T.accentSoft : fds ? T.subtle : "transparent";
                  const fg = geral ? T.gold : itens.length ? T.accentDark : T.ink;
                  return (
                    <button key={d} onClick={() => setDiaAberto(diaAberto === d ? null : d)}
                      title={itens.length ? itens.map((c) => `${c.scope === "todos" ? "" : nomeDe(c.targetIds?.[0]) + ": "}${absenceLabel(c)}`).join("\n") : d}
                      className="text-[10px] rounded aspect-square flex items-center justify-center relative"
                      style={{ background: bg, color: fg, outline: d === hoje ? `1.5px solid ${T.accent}` : "none" }}>
                      {i + 1}
                      {itens.length > 1 && <span className="absolute bottom-0 right-0.5 text-[7px]">•</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {diaAberto && (
        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3 space-y-2">
          <div className="flex items-center justify-between">
            <div className="text-sm font-medium">{weekdayLabel(diaAberto)}</div>
            <div className="flex items-center gap-1.5">
              {canLancar && <Btn small variant="subtle" icon={Plus} onClick={() => novo(diaAberto)}>Lançar nesse dia</Btn>}
              <Btn small variant="ghost" icon={X} onClick={() => setDiaAberto(null)} />
            </div>
          </div>
          {noDia(diaAberto).length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhuma ausência lançada nesse dia.</div>}
          {noDia(diaAberto).map((c) => <AbsenceRow key={c.id} c={c} nomeDe={nomeDe} canLancar={canLancar}
            onEdit={() => setEditando({ ...c })} onDelete={() => excluir(c)} />)}
          {reservasNoDia(diaAberto).length > 0 && (
            <div className="text-[10px] pt-1" style={{ color: T.inkMuted }}>
              {reservasNoDia(diaAberto).length} reserva(s) marcada(s) nesse dia — se você lançar uma ausência aqui, elas não somem sozinhas: reagende em Cronograma.
            </div>
          )}
        </div>
      )}

      <div className="space-y-1.5">
        <div className="text-xs font-medium">Lançamentos de {ano} ({doAno.length})</div>
        {doAno.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nada lançado nesse ano.</div>}
        {doAno.map((c) => <AbsenceRow key={c.id} c={c} nomeDe={nomeDe} canLancar={canLancar}
          onEdit={() => setEditando({ ...c })} onDelete={() => excluir(c)} />)}
      </div>
    </div>
  );
}

function AbsenceRow({ c, nomeDe, canLancar, onEdit, onDelete }) {
  const meta = ABSENCE_KIND_META[c.kind] || {};
  const Ic = KIND_ICON[c.kind] || CalendarDays;
  const quem = c.scope === "todos" ? "Todo o setor" : (c.targetIds || []).map(nomeDe).join(", ");
  return (
    <div style={{ background: T.bg, border: `1px solid ${T.line}` }} className="rounded-lg px-2.5 py-2 flex items-center justify-between gap-2">
      <div className="flex items-center gap-2 min-w-0">
        <Ic size={13} style={{ color: T[meta.tone] || T.inkMuted }} className="shrink-0" />
        <div className="min-w-0">
          <div className="text-xs truncate">{c.title || meta.label} <Chip tone={meta.tone}>{meta.label}</Chip></div>
          <div className="text-[10px] truncate" style={{ color: T.inkMuted }}>
            {quem} · {c.dateStart.split("-").reverse().join("/")}
            {c.dateEnd && c.dateEnd !== c.dateStart ? ` a ${c.dateEnd.split("-").reverse().join("/")}` : ""}
            {c.allDay === false ? ` · ${c.start}–${c.end}` : " · dia inteiro"}
          </div>
        </div>
      </div>
      {canLancar && (
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={onEdit} title="Editar" className="p-1 rounded" style={{ color: T.inkMuted }}><Pencil size={12} /></button>
          <button onClick={onDelete} title="Excluir" className="p-1 rounded" style={{ color: T.danger }}><Trash2 size={12} /></button>
        </div>
      )}
    </div>
  );
}

function AbsenceForm({ entrada, alvos, onChange, onCancel, onSave }) {
  const meta = ABSENCE_KIND_META[entrada.kind] || {};
  // Feriado e evento da empresa são sempre do setor inteiro — trocar o tipo
  // acerta o alcance sozinho, pra ninguém lançar "feriado da Ana".
  const trocaTipo = (kind) => {
    const k = ABSENCE_KIND_META[kind];
    onChange({ ...entrada, kind, scope: k?.scope || "recurso", targetIds: k?.scope === "todos" ? [] : entrada.targetIds });
  };
  const invalido = !entrada.dateStart
    || (entrada.dateEnd && entrada.dateEnd < entrada.dateStart)
    || (entrada.scope !== "todos" && !(entrada.targetIds || []).length);
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.accent}` }} className="rounded-xl p-3 space-y-2.5">
      <div className="text-sm font-medium">Lançar no calendário</div>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
        <Field label="Tipo">
          <select value={entrada.kind} onChange={(e) => trocaTipo(e.target.value)}
            className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}`, background: T.surface, color: T.ink }}>
            {ABSENCE_KINDS.map((k) => <option key={k.id} value={k.id}>{k.label}</option>)}
          </select>
        </Field>
        <Field label="Descrição">
          <input value={entrada.title} onChange={(e) => onChange({ ...entrada, title: e.target.value })}
            placeholder={meta.label} className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
        </Field>
        <Field label="De">
          <input type="date" value={entrada.dateStart} onChange={(e) => onChange({ ...entrada, dateStart: e.target.value, dateEnd: entrada.dateEnd && entrada.dateEnd >= e.target.value ? entrada.dateEnd : e.target.value })}
            className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
        </Field>
        <Field label="Até">
          <input type="date" min={entrada.dateStart} value={entrada.dateEnd || entrada.dateStart} onChange={(e) => onChange({ ...entrada, dateEnd: e.target.value })}
            className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
        </Field>
      </div>
      {meta.scope !== "todos" && (
        <Field label="Quem fica indisponível">
          <MultiSearchPick options={alvos} values={entrada.targetIds || []}
            onChange={(v) => onChange({ ...entrada, targetIds: v })}
            placeholder="Colaborador, médico, sala ou equipamento..."
            badge={(o) => <span className="text-[9px]" style={{ color: T.inkMuted }}>{o.grupo}</span>} />
        </Field>
      )}
      {meta.scope === "todos" && (
        <div className="text-[11px] rounded-md px-2 py-1.5" style={{ background: T.goldSoft, color: T.gold }}>
          {meta.label} vale pro setor inteiro — pessoas, salas e equipamentos.
        </div>
      )}
      <div className="flex items-center gap-3 flex-wrap">
        <label className="flex items-center gap-1.5 text-xs cursor-pointer">
          <input type="checkbox" checked={entrada.allDay !== false} onChange={(e) => onChange({ ...entrada, allDay: e.target.checked })} />
          Dia inteiro
        </label>
        {entrada.allDay === false && (
          <>
            <input type="time" value={entrada.start || "08:00"} onChange={(e) => onChange({ ...entrada, start: e.target.value })}
              className="text-sm px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
            <span className="text-xs" style={{ color: T.inkMuted }}>até</span>
            <input type="time" value={entrada.end || "18:00"} onChange={(e) => onChange({ ...entrada, end: e.target.value })}
              className="text-sm px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
          </>
        )}
      </div>
      <div className="flex gap-2">
        <Btn small icon={Check} disabled={invalido} onClick={onSave}>Salvar</Btn>
        <Btn small variant="ghost" onClick={onCancel}>Cancelar</Btn>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Configurações — painel geral que reúne Cadastro, Calibração, Estoque,   */
/* Custos e (só Admin) Usuários num único lugar organizado, em vez de       */
/* espalhado — Cadastro continua focado só nos cadastros em si.            */
/* ---------------------------------------------------------------------- */
function ConfigArea({ data, bookings, estimates, canCadastro, canCustos, canCalibracao, canEstoque, canUsuarios, onUpdateCat, roleCapabilities, onSaveRoleCapabilities, users, onSaveUsers, stockEntries, onRecordStockEntry, actorName }) {
  const [section, setSection] = useState("cadastro");
  const SECTIONS = [
    { id: "cadastro", label: "Cadastro", icon: Building2 },
    { id: "tempos", label: "Tempos e intervalos", icon: Timer },
    { id: "horarios", label: "Horários", icon: CalendarClock },
    { id: "calibracao", label: "Calibração", icon: Gauge },
    { id: "estoque", label: "Estoque", icon: Boxes },
    { id: "custos", label: "Custos", icon: Wallet },
    ...(canUsuarios ? [{ id: "usuarios", label: "Usuários", icon: UserCog }] : []),
  ];
  // Se o login mudar (ex.: troca de gestor pra admin sem sair da aba) e a sub-aba
  // selecionada não existir mais pra esse nível (hoje só "usuarios" é condicional),
  // volta pra Cadastro em vez de ficar numa tela em branco sem explicação.
  useEffect(() => { if (section === "usuarios" && !canUsuarios) setSection("cadastro"); }, [canUsuarios, section]);

  return (
    <div className="space-y-5">
      <Section icon={Settings} title="Configurações" subtitle="Cadastro de recursos, calibração, estoque, custos e permissões de acesso" />

      <div className="flex gap-1.5 flex-wrap">
        {SECTIONS.map((s) => (
          <button key={s.id} onClick={() => setSection(s.id)} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg"
            style={{ background: section === s.id ? T.accent : T.surface, color: section === s.id ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>
            <s.icon size={13} /> {s.label}
          </button>
        ))}
      </div>

      {section === "cadastro" && <Registry data={data} bookings={bookings} canCadastro={canCadastro} onUpdateCat={onUpdateCat} />}
      {section === "tempos" && <ActivityTimesPanel data={data} onUpdateCat={onUpdateCat} canCadastro={canCadastro} />}
      {section === "horarios" && <ScheduleHoursPanel data={data} onUpdateCat={onUpdateCat} canCadastro={canCadastro} />}
      {section === "calibracao" && <CalibrationPanel data={data} onUpdateCat={onUpdateCat} canCalibracao={canCalibracao} />}
      {section === "estoque" && <StockPanel data={data} onUpdateCat={onUpdateCat} canEstoque={canEstoque} stockEntries={stockEntries} onRecordStockEntry={onRecordStockEntry} actorName={actorName} bookings={bookings} estimates={estimates} />}
      {section === "custos" && <CostsEditor data={data} onUpdateCat={onUpdateCat} canCustos={canCustos} />}
      {section === "usuarios" && canUsuarios && (
        <div className="space-y-5">
          <UsersPanel users={users} onSave={onSaveUsers} data={data} />
          <PermissionsPanel roleCapabilities={roleCapabilities} onSave={onSaveRoleCapabilities} />
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Cadastro do estudo — o protocolo em si: dados básicos + a lista de       */
/* visitas por DESLOCAMENTO a partir do baseline (D0, D7±2, D28±3), não por */
/* datas soltas. Assim, mexer no baseline reposiciona todas as visitas de   */
/* uma vez, e dá pra saber se uma reserva saiu da janela do protocolo.      */
/* ---------------------------------------------------------------------- */
const PROTOCOL_TEMPLATES = [
  { id: "vazio", label: "Começar do zero", rows: [] },
  { id: "d0d7d28", label: "D0 · D7±2 · D28±3", rows: [["Baseline (D0)", 0, 0], ["D7", 7, 2], ["D28", 28, 3]] },
  { id: "d0d14d28d56", label: "D0 · D14±2 · D28±3 · D56±3", rows: [["Baseline (D0)", 0, 0], ["D14", 14, 2], ["D28", 28, 3], ["D56", 56, 3]] },
  { id: "d0d28", label: "D0 · D28±3", rows: [["Baseline (D0)", 0, 0], ["D28", 28, 3]] },
];
function StudyForm({ data, studies, editing, existingTimepoints, bookings, onSubmit, onCancel }) {
  const isNew = !editing.id;
  /* O cadastro guarda só o que ninguém consegue deduzir: como o protocolo é e
   * o que foi combinado com o cliente. Situação, D0 e técnico saíram daqui —
   * os três já estão escritos na agenda, e perguntá-los de novo era pedir que
   * alguém repetisse o que o sistema sabe, com a chance de as duas respostas
   * divergirem. Os campos continuam no objeto porque base antiga os tem;
   * simplesmente não são mais perguntados. */
  const [form, setForm] = useState(() => ({
    id: editing.id || genId("study"),
    name: editing.name || "",
    sponsorId: editing.sponsorId || data.sponsors[0]?.id || null,
    status: editing.status || "planejamento",
    // Janela contratada: de quando até quando o estudo pode COMEÇAR, e a data
    // em que ele tem que estar terminado.
    startMin: editing.startMin || editing.baselineDate || todayStr(),
    startMax: editing.startMax || editing.baselineDate || todayStr(),
    endDate: editing.endDate || "",
    participantsPlanned: editing.participantsPlanned ?? "",
    technicianId: editing.technicianId ?? null,
    createdAt: editing.createdAt || new Date().toISOString(),
  }));
  /* Grupos do estudo. Estudo antigo não tem nenhum, e isso é um estado
   * legítimo: quem não divide em grupos continua usando "participantes
   * previstos" como sempre. */
  const [grupos, setGrupos] = useState(() => studyGroups(editing).map((g) => ({ ...g })));
  const problemasGrupos = studyGroupProblems(grupos);
  const totalGrupos = grupos.reduce((soma, g) => soma + (Number(g.size) || 0), 0);
  const [tps, setTps] = useState(() => (existingTimepoints || []).map((tp) => ({
    id: tp.id, label: tp.label, offsetDays: tp.offsetDays ?? 0, toleranceDays: tp.toleranceDays ?? 0, existing: true,
  })));
  const set = (patch) => setForm((f) => ({ ...f, ...patch }));

  const applyTemplate = (tplId) => {
    const tpl = PROTOCOL_TEMPLATES.find((t) => t.id === tplId);
    if (!tpl || !tpl.rows.length) return;
    setTps(tpl.rows.map(([label, offsetDays, toleranceDays]) => ({ id: genId("tp"), label, offsetDays, toleranceDays, existing: false })));
  };
  const addTp = () => setTps((l) => [...l, { id: genId("tp"), label: `Visita ${l.length + 1}`, offsetDays: l.length === 0 ? 0 : 7, toleranceDays: l.length === 0 ? 0 : 2, existing: false }]);
  const setTp = (id, patch) => setTps((l) => l.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  const removeTp = (id) => setTps((l) => l.filter((t) => t.id !== id));

  const nameTaken = studies.some((s) => s.id !== form.id && s.name.trim().toLowerCase() === form.name.trim().toLowerCase());
  const sorted = [...tps].sort((a, b) => (a.offsetDays ?? 0) - (b.offsetDays ?? 0));
  // Diagnóstico da janela, recalculado a cada tecla: é o que diz se o
  // protocolo ainda cabe no prazo combinado com o cliente.
  /* O D0 não é digitado: enquanto a primeira visita não estiver marcada, ele é
   * o começo do período combinado; depois, é a data que ela realmente tem. */
  const d0 = studyBaseline({ ...form, baselineDate: editing.baselineDate },
    sorted.map((t) => ({ ...t, studyId: form.id })), bookings);
  const fit = studyFit({ ...form, baselineDate: d0.date }, sorted);
  /* Estourar o prazo NÃO impede salvar. O estudo existe no mundo real mesmo
   * quando o cronograma não fecha — é justamente aí que alguém precisa ver o
   * problema e ir renegociar. O que trava é dado incoerente (prazo antes do
   * início), que não descreve nenhuma realidade possível. */
  const janelaIncoerente = fit.problems.some((p) => /está antes/.test(p));
  const canSave = form.name.trim() && form.sponsorId && !nameTaken && !janelaIncoerente;

  return (
    <div style={{ background: T.surface, border: `1px solid ${T.accent}` }} className="rounded-xl p-4 space-y-3">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
          <Layers size={15} style={{ color: T.accentDark }} />
          <span className="text-sm font-semibold">{isNew ? "Novo estudo" : `Editar ${editing.name}`}</span>
        </div>
        <Btn small variant="ghost" icon={X} onClick={onCancel}>Fechar</Btn>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <label className="text-xs font-medium" style={{ color: T.inkMuted }}>Nome do estudo / protocolo
          <input value={form.name} onChange={(e) => set({ name: e.target.value })} placeholder="ex.: Protocolo XPTO-102"
            className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${nameTaken ? T.danger : T.line}` }} />
          {nameTaken && <div className="text-[10px] mt-0.5" style={{ color: T.danger }}>Já existe um estudo com esse nome.</div>}
        </label>
        <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Patrocinador
          <div className="mt-1"><SearchPick options={data.sponsors} value={form.sponsorId} onChange={(v) => set({ sponsorId: v })} placeholder="Buscar patrocinador..." /></div>
        </div>
        {/* Aplicar modelo REESCREVE a lista de visitas, então só aparece
            enquanto não há nada pra perder. Num estudo já montado, o caminho é
            editar visita por visita, logo abaixo. */}
        {sorted.length === 0 && (
          <label className="text-xs font-medium" style={{ color: T.inkMuted }}>Modelo de protocolo
            <select onChange={(e) => applyTemplate(e.target.value)} defaultValue="vazio"
              className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }}>
              {PROTOCOL_TEMPLATES.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
            <div className="text-[10px] mt-0.5">Preenche as visitas no formato mais usado. Dá pra ajustar tudo depois.</div>
          </label>
        )}
      </div>

      {/* O que o sistema resolve sozinho — dito aqui pra ninguém ficar
          procurando o campo que sumiu. */}
      <div className="text-[11px] flex flex-wrap gap-x-4 gap-y-1 rounded-lg px-3 py-2"
        style={{ background: T.subtle, color: T.inkMuted }}>
        <span><strong>Situação</strong>, <strong>D0</strong> e <strong>técnico</strong> quem controla é o sistema: saem do que for agendado.</span>
        <span>
          D0 {d0.real ? "de verdade" : "previsto"}: <strong style={{ color: T.accentDark }}>{weekdayLabel(d0.date)}</strong>
          {d0.real ? "" : " — a primeira visita que você marcar fixa ele"}
        </span>
      </div>

      {/* ---- Janela contratada ------------------------------------------ */}
      <div style={{ background: T.bg, border: `1px solid ${fit.ok ? T.line : T.warn}` }} className="rounded-lg p-3 space-y-2">
        <div className="text-xs font-semibold flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
          <CalendarRange size={13} style={{ color: T.accentDark }} /> Período combinado com o cliente
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <label className="text-[11px]" style={{ color: T.inkMuted }}>Pode começar a partir de
            <input type="date" value={form.startMin}
              onChange={(e) => set({ startMin: e.target.value, startMax: form.startMax && form.startMax >= e.target.value ? form.startMax : e.target.value })}
              className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
          </label>
          <label className="text-[11px]" style={{ color: T.inkMuted }}>Precisa começar até
            <input type="date" min={form.startMin || undefined} value={form.startMax} onChange={(e) => set({ startMax: e.target.value })}
              className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
          </label>
          <label className="text-[11px]" style={{ color: T.inkMuted }}>Precisa terminar até
            <input type="date" min={form.startMin || undefined} value={form.endDate} onChange={(e) => set({ endDate: e.target.value })}
              className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${fit.overflowDays > 0 || fit.impossivel ? T.warn : T.line}` }} />
          </label>
        </div>

        {/* Traduz o protocolo pra número de dias e diz se cabe — é a conta que
            a pessoa faria na mão pra saber se dá pra prometer esse prazo. */}
        {sorted.length > 0 && (
          <div className="text-[11px] flex flex-wrap items-center gap-x-3 gap-y-1" style={{ color: T.inkMuted }}>
            <span>O protocolo leva <strong>{fit.span} dia(s)</strong> do D0 até o fim da última visita.</span>
            {fit.protocolEnd && <span>Com D0 em {weekdayLabel(fit.baseline)}, termina em <strong>{weekdayLabel(fit.protocolEnd)}</strong>.</span>}
            {fit.latestFeasibleBaseline && !fit.impossivel && (
              <span>Último D0 que ainda cabe no prazo: <strong>{weekdayLabel(fit.latestFeasibleBaseline)}</strong>.</span>
            )}
          </div>
        )}
        {fit.problems.length > 0 && (
          <div className="text-[11px] rounded-md px-2 py-1.5 space-y-0.5" style={{ background: T.warnSoft, color: T.warn }}>
            {fit.problems.map((p, i) => <div key={i}><AlertTriangle size={11} className="inline -mt-0.5 mr-1" />{p}</div>)}
            {fit.impossivel
              ? <div className="pt-0.5">Nesse caso não adianta mexer na data: ou o cliente estende o prazo, ou o protocolo precisa encurtar.</div>
              : <div className="pt-0.5">Dá pra salvar assim mesmo — o estudo vai aparecer com aviso de prazo em Estudos, onde é possível pedir um prazo novo ao gestor.</div>}
          </div>
        )}
      </div>

      <div className="space-y-2">
