    trainingRequests.filter((r) => r.status === "recusado").forEach((r) => {
      out.push({ tone: "danger", kind: "treinamento recusado", text: `${r.activityName} (${r.studyName}): equipe de treinamento recusou — indique outro colaborador ou reavalie a data` });
    });
    // Treinamento que já aconteceu e ninguém marcou como concluído: a pessoa
    // segue sem o nível e as próximas sugestões continuam sem ela.
    trainingRequests.filter((r) => r.status === "agendado" && r.scheduledDate && r.scheduledDate < todayStr()).forEach((r) => {
      out.push({ tone: "warn", kind: "treinamento a concluir", text: `${r.collaboratorName} — ${r.activityName}: treinamento era ${weekdayLabel(r.scheduledDate)} e ainda não foi marcado como concluído (o nível não subiu)` });
    });
    // O alerta mais importante pro cronograma e que faltava: visita com a janela
    // do protocolo fechando (ou já fechada) sem nenhuma reserva. É exatamente
    // isso que faz estudo atrasar sem ninguém perceber a tempo.
    (timepoints || []).forEach((tp) => {
      const study = (studies || []).find((s) => s.id === tp.studyId);
      if (!study || !isStudyOpen(study)) return;
      if ((bookings || []).some((b) => b.timepointId === tp.id)) return;
      const daysLeft = Math.round((new Date(tp.dateMax + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000);
      const label = `${tp.label} (${study.name})`;
      if (daysLeft < 0) out.push({ tone: "danger", kind: "visita atrasada", text: `${label}: a janela fechou em ${weekdayLabel(tp.dateMax)} e nada foi agendado` });
      else if (daysLeft <= 7) out.push({ tone: "warn", kind: "visita sem agenda", text: `${label}: janela fecha em ${daysLeft} dia(s) e ainda não tem reserva` });
    });
    return out.sort((a, b) => (a.tone === "danger" ? 0 : 1) - (b.tone === "danger" ? 0 : 1));
  }, [data, trainingRequests, timepoints, studies, bookings]);

  // Tema é preferência pessoal de exibição, não dado de agenda — guardado à parte
  // (privado, não "shared") e fora do polling de 5s do loadAll.
  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get(KEYS.theme, false); if (r?.value) setTheme(JSON.parse(r.value)); } catch {}
    })();
  }, []);
  const toggleTheme = async () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    try { await window.storage.set(KEYS.theme, JSON.stringify(next), false); } catch {}
  };
  // O <body> fica fora da árvore do React (é definido no HTML estático), então o
  // fundo dele é sincronizado à parte — senão sobra uma faixa clara ao redor do
  // card no tema escuro.
  useEffect(() => { document.body.style.background = theme === "dark" ? "#0B1416" : "#F4F7F7"; }, [theme]);

  // Só guarda QUEM foi o último a entrar (privado, por navegador) — pra pré-selecionar
  // no login da próxima vez. Não loga sozinho: o PIN sempre é pedido de novo (mesma
  // ideia do nome pré-preenchido de antes, só que agora ligado a um usuário real).
  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get(KEYS.lastUserId, false); if (r?.value) setLastUserId(JSON.parse(r.value)); } catch {}
    })();
  }, []);
  // Login único: o nível do usuário escolhido no EntryGate já liga de uma vez todos
  // os booleanos de acesso — substitui os 4 logins separados que existiam antes.
  const enterAsUser = (user) => {
    setCurrentUserId(user.id);
    setIsAdmin(user.level === "admin");
    setIsGestor(user.level === "gestor");
    setIsTrainer(user.level === "treinador");
    setIsScheduler(user.level === "agendador");
    setMyPersonRole(user.level === "colaborador" ? "collaborator" : user.level === "medico" ? "doctor" : null);
    setMyPersonId(user.resourceId || null);
    setActorName(user.name);
    setEntered(true);
    setTab("dashboard");
    setLastUserId(user.id);
    window.storage.set(KEYS.lastUserId, JSON.stringify(user.id), false).catch(() => {});
  };
  const logout = () => {
    setCurrentUserId(null); setIsAdmin(false); setIsGestor(false); setIsTrainer(false); setIsScheduler(false);
    setMyPersonRole(null); setMyPersonId(null); setActorName(""); setEntered(false); setTab("dashboard");
  };

  // Log de auditoria: um helper único chamado por todas as funções persistXxx abaixo,
  // pra não duplicar a lógica de "descobrir o que mudou" em cada uma. A comparação é
  // por tamanho de lista (criado/excluído/atualizado) — não é um diff campo a campo,
  // mas já basta pra responder "quem mexeu em quê e quando".
  // Monta a entrada de auditoria sem gravar. Quem grava é a própria operação,
  // junto com o dado — ver auditChange/persistList.
  const makeAuditEntry = (entity, prevList, nextList) => ({
    id: genId("log"), ts: new Date().toISOString(), actor: actorName || "anônimo",
    action: nextList.length > (prevList?.length || 0) ? "criado" : nextList.length < (prevList?.length || 0) ? "excluído" : "atualizado",
    entity,
  });
  // A auditoria vai na MESMA transação da alteração: se o dado entrou, o
  // registro de quem mudou entrou junto. Antes ela era gravada à parte com
  // `.catch(() => {})`, e como o adaptador devolve `null` (não exceção) quando o
  // servidor está fora, a falha não disparava o catch — a alteração ficava
  // salva e o histórico não, sem ninguém perceber. Num sistema clínico isso é
  // pior que perder a alteração.
  const auditChange = (entity, prevList, nextList) => {
    const entry = makeAuditEntry(entity, prevList, nextList);
    const next = [entry, ...(auditLog || [])].slice(0, 500); // limite simples pra não crescer sem fim
    return { entry, next, change: { key: KEYS.auditLog, replaceWith: next } };
  };

  // Uma pessoa pode estar logada em mais de um nível ao mesmo tempo (ex.: Admin e
  // Treinador juntos, num computador compartilhado da equipe) — por isso `canI`
  // checa todos os logins ativos, não só um. Admin sempre tem tudo (superusuário
  // fixo, não editável na tela de Usuários, pra ninguém se autobloquear).
  const canI = (cap) => {
    if (isAdmin) return true;
    if (isGestor && roleCapabilities?.gestor?.includes(cap)) return true;
    if (isTrainer && roleCapabilities?.treinador?.includes(cap)) return true;
    if (isScheduler && roleCapabilities?.agendador?.includes(cap)) return true;
    if (myPersonRole === "collaborator" && roleCapabilities?.colaborador?.includes(cap)) return true;
    if (myPersonRole === "doctor" && roleCapabilities?.medico?.includes(cap)) return true;
    return false;
  };

  /* AVISOS. Roda de carona no mesmo estado que a consulta de 5 segundos já
   * atualiza — não há polling novo nem chamada nova ao servidor. A regra de
   * quem recebe o quê está em `pendingActionsFor`, fora do React e coberta
   * por teste; aqui só se junta o que ela precisa saber.
   *
   * Fica ANTES do retorno da tela de carregamento de propósito: hook não
   * pode ficar depois de um `return` condicional. */
  const avisos = useMemo(() => (loading || !currentUserId ? [] : pendingActionsFor({
    hoje: todayStr(), actorName, myPersonId, myPersonRole, isAdmin, isGestor, can: canI,
    overtimeRequests: overtimeRequests || [], trainingRequests: trainingRequests || [],
    deadlineRequests: deadlineRequests || [], bookings: bookings || [],
    studies: studies || [], timepoints: timepoints || [], estimates: estimates || [],
    staffRequests: staffRequests || [], collaborators: data?.collaborators || [],
  })), [loading, currentUserId, actorName, myPersonId, myPersonRole, isAdmin, isGestor,
    isTrainer, isScheduler, roleCapabilities, overtimeRequests, trainingRequests,
    deadlineRequests, bookings, studies, timepoints, estimates, staffRequests, data]);

  /* O número no menu e no título conta só o que EXIGE AÇÃO — ver `acao` em
   * pendingActionsFor. Recado ("marcaram uma reserva pra você") merece o
   * balão na hora, mas não vira número: não some quando a pessoa lê, e um
   * contador que nunca zera deixa de ser lido em uma semana. */
  const avisosDeAcao = useMemo(() => avisos.filter((a) => a.acao), [avisos]);
  const avisosPorTab = useMemo(() => {
    const porTela = {};
    avisosDeAcao.forEach((a) => { porTela[a.tab] = (porTela[a.tab] || 0) + 1; });
    return porTela;
  }, [avisosDeAcao]);

  const irParaAviso = useCallback((destino) => { if (destino) setTab(destino); }, []);
  const notificacoes = useAvisos(avisos, currentUserId, irParaAviso);

  /* Título da aba. É o aviso que funciona em qualquer situação: sem HTTPS,
   * sem permissão, com a janela minimizada — a pessoa vê "(3)" na barra de
   * tarefas do mesmo jeito. */
  useEffect(() => {
    document.title = avisosDeAcao.length
      ? `(${avisosDeAcao.length}) Central de Recursos`
      : "Central de Recursos";
  }, [avisosDeAcao.length]);

  // Trava contra duas cargas ao mesmo tempo. Com localStorage a leitura resolvia
  // na hora e isso nunca aparecia; contra um servidor, cada `get` é uma ida à
  // rede e a carga inteira demora — o poll de 5s entrava no meio da primeira
  // carga, via as coleções ainda vazias e SEMEAVA TUDO DE NOVO. O resultado era
  // uma base com salas de uma geração e atividades de outra: os `locationIds`
  // das atividades apontavam pra salas que não existiam, e nenhum agendamento
  // fechava ("nenhum recurso cadastrado atende nesse dia").
  const loadingRef = React.useRef(false);
  // Última mensagem de falha de gravação — ver `persistTx`.
  const ultimoErroRef = React.useRef("");
  const loadAll = useCallback(async () => {
    if (loadingRef.current) return;
    loadingRef.current = true;
    try {
      /* Leitura de coleção com conferência de FORMA, não só de sintaxe.
       *
       * JSON válido não quer dizer dado utilizável: um defeito de gravação
       * chegou a salvar um estudo solto onde devia estar a lista de estudos.
       * O arquivo abria, o JSON abria, e a leitura morria linhas adiante num
       * `.filter is not a function` — dentro do try do `loadAll`, que engolia
       * o erro e deixava a tela de carregamento girando para sempre, sem uma
       * palavra sobre o motivo.
       *
       * Coleção com forma errada é tratada como ausente e reescrita vazia: o
       * conteúdo já estava perdido de qualquer jeito, e o que se ganha é o
       * programa abrindo — com o cadastro intacto e um aviso dizendo o que
       * foi descartado. */
      const COLECOES_OBJETO = new Set([KEYS.roleCapabilities]);
      const corrompidas = [];
      const get = async (k) => {
        try {
          const r = await window.storage.get(k, true);
          if (!r) return null;
          const v = JSON.parse(r.value);
          if (v === null || v === undefined) return null;
          const formaOk = COLECOES_OBJETO.has(k)
            ? (typeof v === "object" && !Array.isArray(v))
            : Array.isArray(v);
          if (!formaOk) {
            if (!corrompidas.includes(k)) corrompidas.push(k);
            return null;
          }
          return v;
        } catch { return null; }
      };
      // Semeia uma coleção UMA vez só, mesmo com dois clientes abrindo o
      // sistema pela primeira vez ao mesmo tempo: quem chega depois adota o
      // que o primeiro gravou em vez de criar uma segunda geração de IDs.
      // Devolve sempre o conteúdo que ficou valendo, que é o que as seeds
      // seguintes usam pra referenciar (ex.: atividade aponta pra sala).
      // Falha de semeadura NÃO pode passar em silêncio: foi assim que a coleção
      // de reservas ficou vazia sem ninguém perceber, e a tela só mostrava
      // "nada agendado" sem dizer o motivo.
      const seedProblems = [];
      /* ---- SEMEADURA: TUDO OU NADA, UMA VEZ SÓ ------------------------
       *
       * O cadastro inteiro é uma teia de referências: atividade aponta pra
       * sala, colaborador aponta pra atividade, usuário aponta pra
       * colaborador, reserva aponta pra todos eles. Semear coleção por
       * coleção — mesmo com `seedOnce` adotando o vencedor de cada uma —
       * deixava dois clientes numa base vazia ficarem com PEDAÇOS de
       * gerações diferentes: quem perdeu a corrida de "locations" já tinha
       * montado as atividades com os ids que ele mesmo gerou.
       *
       * Foi assim que apareceram 9 reservas apontando pra salas que não
       * existem, com os dois conjuntos gravados com segundos de diferença.
       *
       * Agora existe UMA sentinela pra base inteira. Ou o primeiro cliente
       * grava tudo junto — cadastro e pacote de exemplo, numa transação —,
       * ou ele descobre que alguém chegou antes e lê a base DELE inteira.
       * Não há estado intermediário possível. */
      const seedLock = (await get(KEYS.seedLock)) || [];
      const temSentinela = seedLock.some((x) => x.id === "__base");
      /* A sentinela sozinha não basta para decidir.
       *
       * Uma versão anterior gravava a sentinela junto com quase nada — só a
       * conta de Administrador. Quem passou por ela ficou com uma base
       * marcada como "já inicializada" e com o cadastro vazio, e nenhuma
       * versão seguinte semeava, porque a marca estava lá. Listas vazias para
       * sempre, sem nada na tela explicando o motivo.
       *
       * Então a condição olha também o ESTADO: base sem nenhum local e sem
       * nenhuma atividade não tem cadastro, tendo marca ou não. É idempotente
       * — assim que o cadastro existe, isto nunca mais roda. */
      const jaTemCadastro = ((await get(KEYS.locations)) || []).length > 0
        || ((await get(KEYS.activities)) || []).length > 0;
      if (!temSentinela || !jaTemCadastro) {
        /* PRIMEIRO ACESSO — o CADASTRO nasce pronto, o MOVIMENTO nasce vazio.
         *
         * A distinção é essa, e ela é a resposta certa para duas queixas
         * opostas que apareceram na prática:
         *
         *   · semear TUDO (como era antes) enche o sistema de estudos e
         *     reservas fictícias que quem vai usar de verdade tem que apagar
         *     um a um — e que reaparecem em cada computador novo, parecendo
         *     que a limpeza não funcionou;
         *   · semear NADA deixa a pessoa diante de uma tela em que não dá
         *     para testar coisa alguma: sem sala e sem método, o assistente
         *     não fecha um horário sequer, e cadastrar 15 salas à mão antes
         *     de ver a primeira tela funcionar não é começo de nada.
         *
         * Então: locais, equipamentos, atividades, insumos, patrocinadores,
         * equipe e contas de login vêm prontos — é infraestrutura, muda pouco
         * e dá para editar tudo no Cadastro. Estudo, visita, reserva,
         * estimativa, treinamento, hora extra e histórico começam VAZIOS,
         * porque isso é o trabalho, e o trabalho é de quem usa.
         *
         * Feriados também não entram sozinhos: há um botão no Calendário. */
        const n = seedNiches();
        const loc = seedLocations();
        const sup = seedSupplies();
        const act = seedActivities(loc, sup);
        const doc = seedDoctors();
        const eqp = seedEquipment();
        const col = seedCollaborators(act);

        /* A equipe nasce habilitada em TODOS os métodos.
         *
         * O cadastro de exemplo dá 2 ou 3 métodos por pessoa, e o efeito numa
         * base sem estudo nenhum é que a primeira coisa que a pessoa encontra
         * ao testar é "ninguém treinado para esta atividade" — antes de
         * conseguir marcar qualquer coisa. Habilitar todo mundo tira essa
         * parede do caminho; para exercitar a tela de Treinamentos, basta
         * baixar o nível de alguém no Cadastro. */
        col.forEach((c) => { act.forEach((a) => { c.levels[a.id] = Math.max(c.levels[a.id] || 0, a.minLevel || 3); }); });

        // Um PIN só em todas as contas: quem testa troca de usuário o tempo
        // todo e não pode travar lembrando qual é de quem.
        const usuarios = seedUsers(col, doc).map((u) => ({ ...u, pin: "1234" }));

        const partes = [
          /* A sentinela só é gravada quando ainda não existe — com a
           * pré-condição "não pode existir", que é o que impede dois clientes
           * de semearem bases diferentes ao mesmo tempo. Recuperando uma base
           * que ficou sem cadastro, a marca já está lá e a pré-condição
           * recusaria a transação inteira. */
          ...(temSentinela ? [] : [{
            key: KEYS.seedLock, replaceWith: [{ id: "__base", at: new Date().toISOString() }],
            expects: [{ id: "__base", absent: true, message: "outro cliente já semeou a base" }],
          }]),
          // Cadastro — pronto para usar
          { key: KEYS.niches, replaceWith: n },
          { key: KEYS.sponsors, replaceWith: seedSponsors(n) },
          { key: KEYS.locations, replaceWith: loc },
          { key: KEYS.supplies, replaceWith: sup },
          { key: KEYS.activities, replaceWith: act },
          { key: KEYS.equipment, replaceWith: eqp },
          { key: KEYS.doctors, replaceWith: doc },
          { key: KEYS.collaborators, replaceWith: col },
          /* Contas: só na primeira vez. Numa recuperação, o Admin pode já ter
           * cadastrado gente de verdade, e sobrescrever tiraria todo mundo do
           * sistema — inclusive quem está logado naquele momento. */
          ...(temSentinela ? [] : [{ key: KEYS.users, replaceWith: usuarios }]),
          { key: KEYS.trainingTypes, replaceWith: seedTrainingTypes(act, loc, eqp) },
          /* Movimento vazio SÓ na primeira vez. Recuperando o cadastro de uma
           * base que já está em uso, zerar estudo e reserva apagaria o
           * trabalho de quem usa — o oposto de consertar. */
          ...(temSentinela ? [] : [
            { key: KEYS.studies, replaceWith: [] },
            { key: KEYS.timepoints, replaceWith: [] },
            { key: KEYS.bookings, replaceWith: [] },
            { key: KEYS.trainingRequests, replaceWith: [] },
            { key: KEYS.overtimeRequests, replaceWith: [] },
            { key: KEYS.staffRequests, replaceWith: [] },
          ]),
        ];
        /* Falha de semeadura NÃO pode passar em silêncio: foi assim que a
         * coleção de reservas ficou vazia sem ninguém perceber, e a tela só
         * dizia "nada agendado". Perder a corrida pra outro cliente não é
         * falha — é o caso normal, e a leitura abaixo resolve. */
        const r = await window.storage.transaction(partes);
        const perdeuACorrida = (r?.conflicts || []).some((c) => /já semeou a base/.test(c));
        if (r && !r.ok && !perdeuACorrida) {
          seedProblems.push((r.conflicts || ["o servidor não aceitou a gravação"]).slice(0, 3).join("; "));
        } else if (!r) {
          seedProblems.push("não foi possível gravar os dados de exemplo");
        }
      }
      // Daqui pra frente vale o que ESTÁ gravado — da nossa semeadura ou da
      // de quem chegou primeiro. Nunca uma mistura das duas.
      const niches = (await get(KEYS.niches)) || [];
      const sponsors = (await get(KEYS.sponsors)) || [];
      const locations = (await get(KEYS.locations)) || [];
      const supplies = (await get(KEYS.supplies)) || [];
      let activities = (await get(KEYS.activities)) || [];
      const equipment = (await get(KEYS.equipment)) || [];
      const doctors = (await get(KEYS.doctors)) || [];
      let collaborators = (await get(KEYS.collaborators)) || [];
      let users = (await get(KEYS.users)) || [];
      if (users && !users.some((u) => u.level === "agendador")) {
        // Migração: "Agendador" é um nível novo — quem já tinha usuários salvos antes
        // dele existir ganha uma conta de exemplo pronta, mesma ideia do Admin/Gestor
        // que já vêm prontos desde a Etapa D.
        users = [...users, { id: genId("user"), name: "Agendador", pin: "7890", level: "agendador", resourceId: null }];
        await window.storage.set(KEYS.users, JSON.stringify(users), true);
      }
      let roleCapabilities = await get(KEYS.roleCapabilities);
      let rcMudou = false;
      if (!roleCapabilities) { roleCapabilities = DEFAULT_ROLE_CAPABILITIES; rcMudou = true; }
      else {
        // Migração: um nível novo (ex.: "agendador", adicionado depois que alguém já
        // salvou essa matriz) entra com o default — sem sobrescrever capacidades que o
        // Admin já customizou nos níveis que já existiam.
        const withDefaults = { ...roleCapabilities };
        EDITABLE_ROLES.forEach((r) => { if (!withDefaults[r.id]) { withDefaults[r.id] = DEFAULT_ROLE_CAPABILITIES[r.id] || []; rcMudou = true; } });
        roleCapabilities = withDefaults;
      }
      // Visibilidade das telas virou capacidade (`ver_<tela>`); matriz salva
      // antes disso não tem nenhuma, e sem esse passo todo mundo ficaria sem
      // menu. Idempotente: roda uma vez e depois não mexe mais.
      {
        const norm = normalizeRoleCapabilities(roleCapabilities);
        if (norm.changed) { roleCapabilities = norm.roleCapabilities; rcMudou = true; }
      }
      if (rcMudou) await window.storage.set(KEYS.roleCapabilities, JSON.stringify(roleCapabilities), true);
      // trainingRequests/overtimeRequests ficam sem valor padrão aqui de propósito:
      // são semeados junto com estudos/reservas mais abaixo, porque precisam dos
      // IDs de estudo, atividade e colaborador pra fazer sentido.
      let trainingRequests = await get(KEYS.trainingRequests);
      let auditLog = await get(KEYS.auditLog);
      if (!auditLog) { auditLog = []; await window.storage.set(KEYS.auditLog, JSON.stringify(auditLog), true); }
      let deadlineRequests = await get(KEYS.deadlineRequests);
      if (!deadlineRequests) { deadlineRequests = []; await window.storage.set(KEYS.deadlineRequests, JSON.stringify(deadlineRequests), true); }
      let cancellations = await get(KEYS.cancellations);
      if (!cancellations) { cancellations = []; await window.storage.set(KEYS.cancellations, JSON.stringify(cancellations), true); }
      let stockEntries = await get(KEYS.stockEntries);
      if (!stockEntries) { stockEntries = []; await window.storage.set(KEYS.stockEntries, JSON.stringify(stockEntries), true); }
      let overtimeRequests = await get(KEYS.overtimeRequests);
      let estimates = await get(KEYS.estimates);
      if (!estimates) { estimates = []; await window.storage.set(KEYS.estimates, JSON.stringify(estimates), true); }
      let staffRequests = await get(KEYS.staffRequests);
      if (!staffRequests) { staffRequests = []; await window.storage.set(KEYS.staffRequests, JSON.stringify(staffRequests), true); }

      // Rede de segurança: atividade apontando pra sala que não existe mais
      // (sala excluída, ou base semeada duas vezes antes da trava acima) deixa
      // o método sem NENHUMA sala válida e nada fecha, com uma mensagem que não
      // explica o motivo. Referência morta é descartada; método que fica sem
      // nenhuma sala volta a valer "qualquer sala", que é o padrão do campo.
      const locIds = new Set(locations.map((l) => l.id));
      let prunedRefs = 0;
      activities = activities.map((a) => {
        if (!a.locationIds?.length) return a;
        const kept = a.locationIds.filter((id) => locIds.has(id));
        if (kept.length === a.locationIds.length) return a;
        prunedRefs += a.locationIds.length - kept.length;
        return { ...a, locationIds: kept };
      });
      if (prunedRefs) await window.storage.set(KEYS.activities, JSON.stringify(activities), true);

      /* O calendário também NÃO se preenche sozinho.
       *
       * Feriado nacional é dado verdadeiro, não inventado — mas continua sendo
       * o sistema decidindo gravar coisa que ninguém pediu, e numa base que
       * alguém acabou de limpar isso reaparece como "não limpou". Virou botão
       * na tela de Calendário: "Lançar feriados nacionais de <ano>". Um clique,
       * e quem clicou sabe o que gravou. */
      let calendar = await get(KEYS.calendar);
      if (!calendar) { calendar = []; await window.storage.set(KEYS.calendar, JSON.stringify(calendar), true); }

      /* Tipos de treinamento. Base semeada antes disso existir simplesmente
       * não tem a coleção — e uma lista vazia é um estado legítimo aqui (dá
       * pra solicitar treinamento sem tipo, como sempre foi), então NÃO se
       * semeia por cima: só se garante que a coleção exista. */
      let trainingTypes = await get(KEYS.trainingTypes);
      if (!trainingTypes) { trainingTypes = []; await window.storage.set(KEYS.trainingTypes, JSON.stringify(trainingTypes), true); }

      const fullData = { niches, sponsors, activities, locations, equipment, doctors, collaborators, supplies, calendar, trainingTypes };

      // Estudos, visitas e reservas já vieram na mesma transação da semeadura
      // (lá em cima) ou já estavam gravados — aqui só se lê o que vale.
      let studies = (await get(KEYS.studies)) || [];
      let timepoints = (await get(KEYS.timepoints)) || [];
      let bks = (await get(KEYS.bookings)) || [];
      trainingRequests = (await get(KEYS.trainingRequests)) || [];
      overtimeRequests = (await get(KEYS.overtimeRequests)) || [];

      // Migração de status: reserva antiga nasceu "confirmado" mesmo sem equipe
      // completa. Rebaixa pra "pendente_equipe" quem não tem quem execute, pra
      // a tela parar de afirmar que está pronta. Reserva já concluída fica como
      // está — o que aconteceu, aconteceu.
      if (bks) {
        let mudou = false;
        const ajustadas = bks.map((b) => {
          // Aula de treinamento tem status próprio e não segue essa regra.
          if (b.completedAt || isTrainingBooking(b)) return b;
          const certo = bookingStatusFor(b, activities.find((a) => a.id === b.activityId));
          if (b.status === certo) return b;
          mudou = true;
          return { ...b, status: certo };
        });
        if (mudou) { bks = ajustadas; await window.storage.set(KEYS.bookings, JSON.stringify(bks), true); }
      }

      // Migração do treinamento: "confirmado" fazia duas coisas ao mesmo tempo
      // (marcar data E subir o nível). Vira "agendado", e a aula ganha a reserva
      // que bloqueia a agenda da pessoa — que antes não existia. O nível de quem
      // já foi habilitado fica como está: já subiu, e desfazer seria pior.
      if (trainingRequests?.length && bks) {
        const antigos = trainingRequests.filter((r) => r.status === "confirmado" && r.scheduledDate);
        if (antigos.length) {
          const novasAulas = [];
          const migrados = trainingRequests.map((r) => {
            if (r.status !== "confirmado" || !r.scheduledDate) return r;
            const atualizado = { ...r, status: "agendado", durationMin: r.durationMin || TRAINING_DEFAULT_MIN };
            const aula = trainingBookingFrom(atualizado, activities.find((a) => a.id === r.activityId));
            atualizado.bookingId = aula.id;
            if (!bks.some((b) => b.trainingRequestId === r.id)) novasAulas.push(aula);
            return atualizado;
          });
          trainingRequests = migrados;
          await window.storage.set(KEYS.trainingRequests, JSON.stringify(trainingRequests), true);
          if (novasAulas.length) {
            bks = [...bks, ...novasAulas];
            await window.storage.set(KEYS.bookings, JSON.stringify(bks), true);
          }
        }
      }

      /* Expiração da pré-reserva. O bloqueio em si já morre sozinho — quem
       * decide se uma ocupação vale é `bookingOccupies`, que compara o
       * `holdUntil` com hoje. Aqui só se acerta o RÓTULO da estimativa, pra
       * a tela não ficar dizendo "pré-reserva" de um prazo que venceu ontem.
       *
       * As reservas previstas continuam gravadas, com `holdsResources` e
       * `holdUntil` intactos: são elas que registram quais horários chegaram
       * a ficar segurados, que é o dado da análise de reaproveitamento. */
      if (estimates.length) {
        const vencidas = estimates.filter((e) => e.status === "pre_reserva" && holdExpired(e.holdUntil));
        if (vencidas.length) {
          estimates = estimates.map((e) => (vencidas.includes(e)
            ? { ...e, status: "expirada", expiredAt: new Date().toISOString() } : e));
          await window.storage.set(KEYS.estimates, JSON.stringify(estimates), true);
        }
      }

      // Converte de uma vez estudo sem baseline e visita sem deslocamento pro
      // formato de protocolo, e grava — assim não sobra dado nos dois formatos.
      const norm = normalizeProtocol(studies, timepoints);
      if (norm.changed) {
        studies = norm.studies; timepoints = norm.timepoints;
        await window.storage.set(KEYS.studies, JSON.stringify(studies), true);
        await window.storage.set(KEYS.timepoints, JSON.stringify(timepoints), true);
      }

      setData(fullData); setBookings(bks); setUsers(users); setTrainingRequests(trainingRequests);
      setStudies(studies); setTimepoints(timepoints); setAuditLog(auditLog); setDeadlineRequests(deadlineRequests); setCancellations(cancellations);
      setRoleCapabilities(roleCapabilities); setStockEntries(stockEntries); setOvertimeRequests(overtimeRequests);
      /* Conserta no armazenamento o que veio torto, senão o aviso voltaria a
       * cada leitura e o problema seguiria esperando a próxima vez. */
      if (corrompidas.length) {
        for (const k of corrompidas) {
          const vazio = COLECOES_OBJETO.has(k) ? {} : [];
          await window.storage.set(k, JSON.stringify(vazio), true);
        }
      }

      setEstimates(estimates); setStaffRequests(staffRequests);
      if (corrompidas.length) {
        const nomeDaColecao = (k) => Object.keys(KEYS).find((n) => KEYS[n] === k) || k;
        const nomes = corrompidas.map(nomeDaColecao);
        setReparos((antes) => [...new Set([...antes, ...nomes])]);
      }
      setErr(seedProblems.length ? `Dados de exemplo não puderam ser criados — ${seedProblems.join(" | ")}` : "");
    } catch (e) { setErr("Não foi possível carregar os dados agora. Tentando novamente..."); }
    finally { setLoading(false); loadingRef.current = false; }
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);
  useEffect(() => { const iv = setInterval(loadAll, 5000); return () => clearInterval(iv); }, [loadAll]);

  /* Toda gravação passa por aqui. Devolve true SÓ quando o dado entrou de fato.
   *
   * São três formas de falhar, e as três precisam voltar false:
   *  - exceção (rede caiu no meio);
   *  - `null` do adaptador (servidor fora do ar, resposta não-ok) — esta era a
   *    perigosa: o código antigo só olhava `r.rejected`, então `null` passava
   *    como sucesso e a tela dizia "salvo" com o servidor sem ter recebido nada;
   *  - `rejected` (o servidor recusou por regra, ex.: conflito de agenda).
   *
   * Em qualquer um dos casos o estado local volta ao que era, pra tela nunca
   * mostrar algo que o banco não tem.
   */
  const SETTERS = {
    bookings: setBookings, studies: setStudies, timepoints: setTimepoints,
    trainingRequests: setTrainingRequests, deadlineRequests: setDeadlineRequests,
    cancellations: setCancellations, users: setUsers, stockEntries: setStockEntries,
    overtimeRequests: setOvertimeRequests, auditLog: setAuditLog,
    estimates: setEstimates, staffRequests: setStaffRequests,
  };
  const setColecao = (key, valor) => {
    if (SETTERS[key]) return SETTERS[key](valor);
    setData((d) => ({ ...d, [key]: valor })); // categorias do cadastro
  };
  const valorAtual = (key) => ({
    bookings, studies, timepoints, trainingRequests, deadlineRequests,
    cancellations, users, stockEntries, overtimeRequests, auditLog, estimates,
    staffRequests,
  }[key] ?? data[key]);

  /* Gravação transacional genérica: várias coleções, tudo ou nada, com a
   * auditoria dentro da mesma transação.
   *
   * `partes` é uma lista de `{ key, next }` (lista nova) e/ou
   * `{ key, deltas }` (operação incremental, ex.: consumo de estoque), com
   * `expects` opcional — a pré-condição checada DENTRO da transação, que é o
   * que impede a mesma operação de acontecer duas vezes.
   * `auditar` diz qual coleção nomeia a entrada do histórico.
   *
   * Aplica otimista na tela e desfaz TUDO se qualquer coisa falhar — as três
   * formas: exceção, `null` (servidor sem responder) e `rejected` (recusa por
   * regra). É esta função que fecha o "falso sucesso" em todos os caminhos.
   */
  const persistTx = async ({ partes, auditar, rotulo }) => {
    const anteriores = partes.map((p) => ({ key: p.key, valor: valorAtual(p.key) }));
    const audit = auditar ? auditChange(auditar.entity, auditar.prev, auditar.next) : null;
    partes.forEach((p) => { if (p.next) setColecao(p.key, p.next); });
    if (audit) setAuditLog(audit.next);

    const desfazer = (msg) => {
      anteriores.forEach((a) => setColecao(a.key, a.valor));
      if (audit) setAuditLog(auditLog);
      setErr(msg);
      // Guarda a última mensagem num ref: quem precisa MOSTRAR o motivo dentro
      // da própria tela (a conversão de estimativa) não consegue ler `err`
      // logo depois de `setErr` — o estado só chega no render seguinte.
      ultimoErroRef.current = msg;
      return false;
    };
    const changes = [
      ...partes.map((p) => ({
        key: KEYS[p.key],
        ...(p.next ? { replaceWith: p.next } : { deltas: p.deltas }),
        // A pré-condição viaja com a coleção resolvida: o servidor não conhece
        // os nomes curtos que o App usa.
        ...(p.expects ? { expects: p.expects.map((e) => ({ ...e, collection: KEYS[e.key] || e.collection })) } : {}),
      })),
      ...(audit ? [audit.change] : []),
    ];
    let r;
    try { r = await window.storage.transaction(changes); }
    catch { return desfazer(`Falha ao salvar ${rotulo}. Verifique a conexão — nada foi gravado.`); }
    if (!r || !r.ok) return desfazer(`Não deu pra salvar ${rotulo}: ${(r?.conflicts || ["o servidor não respondeu"]).join("; ")}. Nada foi gravado.`);
    // Deltas são calculados pelo servidor; recarrega pra trazer o valor real.
    if (partes.some((p) => p.deltas)) loadAll();
    return true;
  };

  const persistList = async (key, prev, next, _setState, rotulo) =>
    persistTx({ partes: [{ key, next }], auditar: { entity: key, prev, next }, rotulo });

  const persistCat = async (cat, next) => persistList(cat, data[cat], next, null, `o cadastro de ${cat}`);
  const persistBookings = async (next) => persistList("bookings", bookings, next, null, "a reserva");
  const persistTrainingRequests = async (next) => persistList("trainingRequests", trainingRequests, next, null, "a solicitação de treinamento");
  const persistStudies = async (next) => persistList("studies", studies, next, null, "o estudo");
  const persistTimepoints = async (next) => persistList("timepoints", timepoints, next, null, "a visita");
  const persistDeadlineRequests = async (next) => persistList("deadlineRequests", deadlineRequests, next, null, "a solicitação de prazo");
  // Aprovar prolonga o prazo (dateMax) do timepoint de verdade e marca "postergado" —
  // é isso que faz o estudo mostrar o aviso. Recusar só fecha a solicitação.
  // As duas gravações vão juntas: aprovar e não conseguir mover o prazo deixaria
  // a solicitação fechada sem o efeito dela.
  const decideDeadlineRequest = async (req, approve) => {
    const nextReqs = deadlineRequests.map((r) => r.id === req.id
      ? { ...r, status: approve ? "aprovado" : "recusado", decidedBy: actorName || "admin", decidedAt: new Date().toISOString() }
      : r);
    const partes = [{ key: "deadlineRequests", next: nextReqs }];
    if (approve && req.scope === "study") {
      /* Prazo do estudo inteiro: move o `endDate` combinado com o cliente.
       * Isso reabre a janela de TODAS as visitas de uma vez — é justamente o
       * efeito de renegociar o contrato, não de adiar uma visita só. */
      partes.push({ key: "studies", next: studies.map((s) => s.id === req.studyId
        ? { ...s, endDate: req.requestedDateMax, deadlineExtended: true, deadlineExtendedFrom: s.deadlineExtendedFrom || s.endDate }
        : s) });
    } else if (approve) {
      partes.push({ key: "timepoints", next: timepoints.map((tp) => tp.id === req.timepointId
        ? { ...tp, dateMax: req.requestedDateMax, postponed: true, postponedFrom: tp.postponedFrom || tp.dateMax }
        : tp) });
    }
    return persistTx({ partes, auditar: { entity: "deadlineRequests", prev: deadlineRequests, next: nextReqs }, rotulo: "a decisão de prazo" });
  };
  /* Prazo do estudo negociado por quem TEM a alçada (gestor/admin): grava o
   * registro já aprovado e move o `endDate` na mesma transação.
   *
   * Sem isso o gestor teria que abrir um pedido pra si mesmo e aprová-lo em
   * seguida — cerimônia vazia, e duas gravações onde a segunda pode falhar.
   * Quem NÃO tem alçada continua no fluxo de pedido → aprovação (ver
   * `submitStudyDeadlineRequest` em StudiesView): o registro é o mesmo, muda
   * só quem fecha. Em ambos os casos fica no histórico quem negociou o quê. */
  const negotiateStudyDeadline = async (study, novoPrazo, motivo) => {
    const reg = {
      id: genId("dlr"), scope: "study", studyId: study.id, timepointId: null, timepointLabel: null,
      studyName: study.name, requestedBy: actorName || "usuário sem identificação",
      currentDateMax: study.endDate || null, requestedDateMax: novoPrazo, reason: motivo || "",
      status: "aprovado", requestedAt: new Date().toISOString(),
      decidedBy: actorName || "usuário sem identificação", decidedAt: new Date().toISOString(),
    };
    const nextReqs = [...deadlineRequests, reg];
    return persistTx({
      partes: [
        { key: "deadlineRequests", next: nextReqs },
        { key: "studies", next: studies.map((s) => s.id === study.id
          ? { ...s, endDate: novoPrazo, deadlineExtended: true, deadlineExtendedFrom: s.deadlineExtendedFrom || s.endDate }
          : s) },
      ],
      auditar: { entity: "studies", prev: studies, next: studies },
      rotulo: "o novo prazo do estudo",
    });
  };
  const persistCancellations = async (next) => persistList("cancellations", cancellations, next, setCancellations, "o cancelamento");
  // Registra o "buraco" deixado por uma reserva excluída ou reagendada pra outra
  // data/sala — se ninguém mais ocupar aquele mesmo horário/sala depois, isso é uma
  // perda de verdade (o custo da sala parada). kind só diferencia o motivo na tela.
  // Monta a entrada sem gravar — quem grava é a operação que causou o
  // cancelamento, na mesma transação (ver deleteBookingsAtomic/saveEdit).
  const cancellationEntry = (booking, kind) => ({
    id: genId("cxl"), bookingId: booking.id, studyId: booking.studyId, studyName: booking.studyName,
    timepointId: booking.timepointId, activityId: booking.activityId,
    activityName: data.activities.find((a) => a.id === booking.activityId)?.name || "—",
    locationId: booking.locationId, locationName: data.locations.find((l) => l.id === booking.locationId)?.name || "—",
    sponsorId: booking.sponsorId, date: booking.date, start: booking.start, end: booking.end,
    cost: bookingCost(booking, data), cancelledAt: new Date().toISOString(), cancelledBy: actorName || "usuário sem identificação", kind,
  });
  // Reagendamento não passa pelo delete: a reserva continua existindo, só mudou
  // de horário. Aqui a gravação é separada mesmo, mas o dado principal (a
  // reserva) já foi salvo — perder o registro de perda não corrompe nada.
  const recordCancellation = (booking, kind) => persistCancellations([cancellationEntry(booking, kind), ...cancellations].slice(0, 500));
  const persistUsers = async (next) => persistList("users", users, next, setUsers, "o usuário");
  // A matriz de permissões é um objeto, não uma lista — o adaptador embrulha
  // como registro único, então segue pelo mesmo caminho transacional.
  const persistRoleCapabilities = async (next) => {
    const prev = roleCapabilities;
    setRoleCapabilities(next);
    const audit = auditChange("roleCapabilities", prev ? [prev] : [], [next]);
    setAuditLog(audit.next);
    let r;
    const desfazer = (msg) => { setRoleCapabilities(prev); setAuditLog(auditLog); setErr(msg); return false; };
    try { r = await window.storage.transaction([{ key: KEYS.roleCapabilities, replaceWith: next }, audit.change]); }
    catch { return desfazer("Falha ao salvar as permissões. Verifique a conexão — nada foi gravado."); }
    if (!r || !r.ok) return desfazer(`Não deu pra salvar as permissões: ${(r?.conflicts || ["o servidor não respondeu"]).join("; ")}`);
    return true;
  };
  const persistStockEntries = async (next) => persistList("stockEntries", stockEntries, next, setStockEntries, "a entrada de estoque");
  const recordStockEntry = (entry) => persistStockEntries([entry, ...stockEntries].slice(0, 500));
  const persistEstimates = async (next) => persistList("estimates", estimates, next, setEstimates, "a estimativa");

  /* ---- Estimativa: criar e converter ---------------------------------- */

  /* Criar: a estimativa e as ocupações previstas entram juntas. Metade
   * gravada seria o pior estado possível — ocupação de estimativa sem dono
   * é bloqueio órfão, e estimativa sem ocupação é orçamento sem conteúdo.
   *
   * NÃO mexe em estoque: estimativa é previsão. O consumo físico só
   * acontece na conversão (ver `convertEstimateAtomic`). */
  const createEstimateAtomic = async (estimativa, novasOcupacoes) => persistTx({
    partes: [
      { key: "estimates", next: [estimativa, ...estimates] },
      { key: "bookings", next: [...bookings, ...novasOcupacoes] },
    ],
    auditar: { entity: "estimates", prev: estimates, next: [estimativa, ...estimates] },
    rotulo: "a estimativa",
  });

  /* Segurar / liberar / prorrogar. Os três mexem em DUAS coleções ao mesmo
   * tempo: a estimativa (que é a verdade) e as ocupações dela (que é o que o
   * motor lê). Fora de uma transação, dava pra ficar com a estimativa
   * dizendo "segurada" e as ocupações livres na agenda — ou o contrário. */
  const setEstimateHold = async (est, { segurar, ate, motivo }) => {
    const status = segurar ? "pre_reserva" : (est.status === "pre_reserva" ? "aberta" : est.status);
    const atualizada = {
      ...est, status, holdsResources: !!segurar, holdUntil: segurar ? ate : null,
      ...(segurar ? { heldAt: new Date().toISOString(), heldBy: actorName || "usuário sem identificação" }
                  : { releasedAt: new Date().toISOString(), releasedBy: actorName || "usuário sem identificação", releaseReason: motivo || null }),
    };
    const nextEstimates = estimates.map((e) => (e.id === est.id ? atualizada : e));
    /* Liberar NÃO apaga a ocupação: ela vira não-bloqueante e continua
     * gravada. É ela que registra qual horário chegou a ficar segurado — o
     * dado da análise de reaproveitamento de capacidade. */
    const nextBookings = bookings.map((b) => (b.estimateId === est.id
      ? { ...b, holdsResources: !!segurar, holdUntil: segurar ? ate : null } : b));
    return persistTx({
      partes: [{ key: "estimates", next: nextEstimates }, { key: "bookings", next: nextBookings }],
      auditar: { entity: "estimates", prev: estimates, next: nextEstimates },
      rotulo: segurar ? "a pré-reserva" : "a liberação dos recursos",
    });
  };
  // Cancelar: libera na hora o que estava segurado e guarda o motivo.
  const cancelEstimate = async (est, motivo) => {
    const atualizada = {
      ...est, status: "cancelada", holdsResources: false, holdUntil: null,
      cancelledAt: new Date().toISOString(), cancelledBy: actorName || "usuário sem identificação",
      cancellationReason: motivo || null,
    };
    const nextEstimates = estimates.map((e) => (e.id === est.id ? atualizada : e));
    const nextBookings = bookings.map((b) => (b.estimateId === est.id ? { ...b, holdsResources: false } : b));
    return persistTx({
      partes: [{ key: "estimates", next: nextEstimates }, { key: "bookings", next: nextBookings }],
      auditar: { entity: "estimates", prev: estimates, next: nextEstimates },
      rotulo: "o cancelamento da estimativa",
    });
  };
  // Reabrir: cancelada/expirada volta pra aberta (sem segurar nada de novo —
  // segurar é uma decisão separada, e o mundo mudou desde então).
  const reopenEstimate = async (est) => {
    const atualizada = { ...est, status: "aberta", reopenedAt: new Date().toISOString(), reopenedBy: actorName || "usuário sem identificação" };
    const nextEstimates = estimates.map((e) => (e.id === est.id ? atualizada : e));
    return persistTx({
      partes: [{ key: "estimates", next: nextEstimates }],
      auditar: { entity: "estimates", prev: estimates, next: nextEstimates },
      rotulo: "a reabertura da estimativa",
    });
  };

  /* Converter: a operação mais delicada do fluxo. A estimativa pode ter sido
   * montada semanas antes, então TUDO é revalidado antes de virar
   * compromisso oficial — e ou converte inteira, ou não converte nada.
   *
   * Devolve `{ ok, problemas }` em vez de só um booleano: a tela precisa
   * listar o que impediu ("Sala 03 ocupada em 05/09") pra a pessoa poder
   * replanejar, em vez de receber um "não deu". */
  const convertEstimateAtomic = async (est) => {
    const impedimentos = estimateConversionBlockers(est);
    if (impedimentos.length) return { ok: false, problemas: impedimentos };

    const previstas = bookings.filter((b) => b.estimateId === est.id);
    if (!previstas.length) return { ok: false, problemas: ["essa estimativa não tem nenhuma ocupação prevista"] };

    const studyId = genId("study");
    const study = estimateAsStudyShape(est, studyId);
    const novosTimepoints = timepointsFromEstimate(est, studyId);
    const convertidas = previstas.map((b) => bookingFromEstimateBooking(b, study));

    /* Revalidação com os dados de AGORA. O universo já tem as convertidas no
     * lugar das previstas (mesmos ids), então elas não conflitam consigo
     * mesmas — mas passam a valer como reserva oficial, o que é justamente o
     * que muda: uma previsão sem bloqueio não disputava nada, e a partir de
     * agora disputa. */
    const universo = bookings.map((b) => convertidas.find((c) => c.id === b.id) || b);
    const problemas = [];
    convertidas.forEach((c) => {
      const nome = data.activities.find((a) => a.id === c.activityId)?.name || "atividade";
      validateBooking(c, data, universo, c.id).errors.forEach((e) => problemas.push(`${nome} em ${weekdayLabel(c.date)}: ${e}`));
    });
    // Estoque entra AGORA — é aqui que o compromisso vira consumo real.
    const supplyDeltas = supplyDeltasFor(convertidas, -1);
    if (problemas.length) return { ok: false, problemas };

    const estimativaConvertida = {
      ...est, status: "convertida", convertedStudyId: studyId,
      convertedAt: new Date().toISOString(), convertedBy: actorName || "usuário sem identificação",
      // Libera o que ela segurava: o compromisso agora é da reserva oficial.
      holdsResources: false,
    };
    const nextEstimates = estimates.map((e) => (e.id === est.id ? estimativaConvertida : e));
    const nextBookings = universo;

    const partes = [
      { key: "studies", next: [...studies, study] },
      { key: "timepoints", next: [...timepoints, ...novosTimepoints] },
      { key: "bookings", next: nextBookings },
      {
        key: "estimates", next: nextEstimates,
        /* PRÉ-CONDIÇÃO: a estimativa só pode ser convertida se AINDA não
         * tiver sido. A checagem em `estimateConversionBlockers` acima roda
         * contra a cópia da tela, que pode ter segundos de atraso — duas
         * pessoas clicando ao mesmo tempo passavam as duas, e nasciam dois
         * estudos (um órfão) com o estoque descontado em dobro.
         *
         * Aqui a comparação acontece dentro do BEGIN IMMEDIATE: a segunda
         * transação lê o resultado da primeira e é recusada. */
        expects: [{
          key: "estimates", id: est.id, field: "convertedStudyId", equals: null,
          message: "essa estimativa já foi convertida por outra pessoa — recarregue a tela",
        }],
      },
    ];
    if (supplyDeltas.length) partes.push({ key: "supplies", deltas: supplyDeltas });

    const ok = await persistTx({
      partes,
      auditar: { entity: "estimates", prev: estimates, next: nextEstimates },
      rotulo: "a conversão da estimativa",
    });
    return ok
      ? { ok: true, studyId }
      : { ok: false, problemas: [ultimoErroRef.current || "a gravação não foi concluída — nada foi alterado"] };
  };
  const persistOvertimeRequests = async (next) => persistList("overtimeRequests", overtimeRequests, next, setOvertimeRequests, "a solicitação de hora extra");
  const createOvertimeRequest = (req) => persistOvertimeRequests([req, ...overtimeRequests]);
  // Dois passos, propositalmente separados: a pessoa (logada por PIN, não o
  // actorName genérico da sessão — senão o histórico mostraria o gestor que pediu
  // como se tivesse sido ele a responder por si mesmo) só diz que PODE ou não;
  // quem decide se vai USAR é sempre o gestor, no passo seguinte. Nenhuma reserva
  // depende só do aceite da pessoa — ver o bloqueio em TimepointPlanner/PlanCard.
  const respondOvertimeRequest = (req, available) => {
    const me = myPersonId ? (myPersonRole === "doctor" ? data.doctors : data.collaborators).find((p) => p.id === myPersonId) : null;
    return persistOvertimeRequests(overtimeRequests.map((r) => r.id === req.id
      ? { ...r, status: available ? "disponivel" : "recusado", decidedBy: me?.name || actorName || "usuário sem identificação", decidedAt: new Date().toISOString() }
      : r));
  };
  const approveOvertimeRequest = (req, approve) => {
    return persistOvertimeRequests(overtimeRequests.map((r) => r.id === req.id
      ? { ...r, status: approve ? "confirmado" : "dispensado", approvedBy: actorName || "usuário sem identificação", approvedAt: new Date().toISOString() }
      : r));
  };
  // Fecha o ciclo do encaixe (origin === "encaixe"): aprovada a hora extra, o pedido
  // ainda não é uma reserva — vira uma aqui, num passo explícito do gestor. Pedido
  // vindo do assistente (origin "plano") não passa por aqui: lá a reserva nasce do
  // "Confirmar este timepoint", junto com as outras do plano.
  const createBookingFromOvertime = async (req) => {
    if (req.bookingId) return;
    // A equipe é a que veio no pedido; se o pedido não trouxe lista (formato
    // antigo), cai na própria pessoa da hora extra.
    const team = (req.collaboratorIds && req.collaboratorIds.length)
      ? req.collaboratorIds
      : (req.role === "collaborator" ? [req.personId] : []);
    const booking = {
      id: genId("bk"), studyId: req.studyId || null, timepointId: null, studyName: req.studyName,
      sponsorId: req.sponsorId || null, date: req.date, start: req.start, end: req.end,
      blockStart: req.blockStart || req.start, blockEnd: req.blockEnd || req.end,
      locationId: req.locationId, equipmentId: req.equipmentId || null, accessoryIds: req.accessoryIds || [],
      activityId: req.activityId, minLevel: req.minLevel ?? 0,
      collaboratorIds: team, doctorId: req.doctorId || (req.role === "doctor" ? req.personId : null),
      needDoctor: !!req.needDoctor,
      participantCount: req.participantCount ?? null,
      createdBy: actorName || "usuário sem identificação",
      encaixe: true, encaixeReason: req.reason || "", overtimeRequestId: req.id,
    };
    booking.status = bookingStatusFor(booking, data.activities.find((a) => a.id === booking.activityId));
    // Reserva + baixa de estoque + vínculo com o pedido de hora extra numa
    // transação só. Eram três operações: a segunda ou a terceira falhando
    // deixava estoque descontado com o pedido ainda em aberto.
    return createBookingAtomic(booking, [
      { key: "overtimeRequests", next: overtimeRequests.map((r) => (r.id === req.id ? { ...r, bookingId: booking.id } : r)) },
    ]);
  };
  /* Confirmar uma visita é UMA operação: a visita, as reservas e a baixa de
   * estoque entram juntas ou não entra nada. Antes eram três gravações
   * independentes — a rede caindo no meio deixava reserva criada com estoque
   * não descontado, ou reserva apontando pra visita que não foi gravada.
   *
   * O estoque vai como DELTA ("consome 5"), não como quantidade nova. Dois
   * usuários confirmando ao mesmo tempo liam 100 e gravavam 95 os dois; com
   * delta o servidor lê o valor atual dentro da transação e chega em 90. */
  // `novoEstudo` entra na MESMA transação quando o estudo está sendo criado
  // agora. Antes ele era gravado antes, e sem checar o retorno: se falhasse, as
  // reservas iam pro banco apontando pra um estudo inexistente; se a transação
  // falhasse depois, sobrava estudo vazio. Estudo já existente não entra.
  const confirmTimepointAtomic = async ({ novoEstudo, timepoint, newBookings, supplyDeltas, vinculosTreinamento }) => {
    const partes = [
      { key: "bookings", next: [...bookings, ...newBookings] },
      { key: "timepoints", next: [...timepoints.filter((t) => t.id !== timepoint.id), timepoint] },
    ];
    if (novoEstudo) partes.unshift({ key: "studies", next: [...studies, novoEstudo] });
    if (supplyDeltas.length) partes.push({ key: "supplies", deltas: supplyDeltas });
    // O vínculo pedido-de-treinamento → reserva entra na mesma transação: se as
    // reservas não forem gravadas, o vínculo não pode existir.
    if (vinculosTreinamento?.length) {
      const porReq = new Map(vinculosTreinamento.map((v) => [v.reqId, v.bookingId]));
      partes.push({ key: "trainingRequests", next: trainingRequests.map((r) => (porReq.has(r.id) ? { ...r, targetBookingId: porReq.get(r.id) } : r)) });
    }
    return persistTx({
      partes,
      auditar: { entity: "bookings", prev: bookings, next: [...bookings, ...newBookings] },
      rotulo: "a visita",
    });
  };

  // Consumo de estoque de uma atividade, como DELTA. `sinal` -1 consome, +1
  // devolve (exclusão de reserva). É a forma única de mexer em estoque a partir
  // de reserva: o servidor lê o valor atual dentro da transação, então dois
  // usuários confirmando ao mesmo tempo não se sobrescrevem.
  const supplyDeltasFor = (bookingsList, sinal) => {
    const acc = new Map();
    bookingsList.forEach((b) => {
      const act = data.activities.find((a) => a.id === b.activityId);
      (act?.supplyUsage || []).forEach((u) => acc.set(u.supplyId, (acc.get(u.supplyId) || 0) + u.qty * sinal));
    });
    return [...acc.entries()].filter(([, q]) => q !== 0).map(([id, q]) => ({ id, field: "quantity", delta: q, min: 0 }));
  };

  /* Criar reserva (encaixe, hora extra) numa transação só: a reserva, a baixa
   * de estoque e o que mais vier junto (ex.: marcar o pedido de hora extra como
   * atendido). Antes eram operações separadas — a segunda podia falhar e
   * deixava reserva sem estoque descontado, ou estoque descontado com o pedido
   * de hora extra ainda em aberto. */
  const createBookingAtomic = async (booking, extras = []) =>
    persistTx({
      partes: [
        { key: "bookings", next: [...bookings, booking] },
        ...supplyDeltasFor([booking], -1).length ? [{ key: "supplies", deltas: supplyDeltasFor([booking], -1) }] : [],
        ...extras,
      ],
      auditar: { entity: "bookings", prev: bookings, next: [...bookings, booking] },
      rotulo: "a reserva",
    });

  // Excluir devolve o estoque na mesma transação, e registra o cancelamento
  // junto — o histórico de perda não pode ficar sem a exclusão que o gerou.
  // `motivo` ("excluído"/"reagendado") faz o registro de cancelamento entrar na
  // MESMA transação. Antes ele era gravado depois, por fora: falhando, a reserva
  // sumia mas o indicador de perda ficava sem a entrada que a explica.
  const deleteBookingsAtomic = async (removidas, extras = [], motivo) => {
    const ids = new Set(removidas.map((b) => b.id));
    const next = bookings.filter((b) => !ids.has(b.id));
    const devolve = supplyDeltasFor(removidas, +1);
    const partes = [
      { key: "bookings", next },
      ...devolve.length ? [{ key: "supplies", deltas: devolve }] : [],
      ...extras,
    ];
    if (motivo) {
      const novas = removidas.map((b) => cancellationEntry(b, motivo));
      partes.push({ key: "cancellations", next: [...novas, ...cancellations].slice(0, 500) });
    }
    return persistTx({
      partes,
      auditar: { entity: "bookings", prev: bookings, next },
      rotulo: "a exclusão da reserva",
    });
  };

  /* Treinamento: agendar, concluir e desmarcar.
   *
   * Agendar cria uma reserva de verdade (kind "treinamento") na agenda do
   * colaborador — é o que o deixa indisponível naquele horário em todas as
   * checagens, inclusive a do servidor. O nível NÃO sobe aqui.
   * Concluir é o único momento em que o nível sobe. */
  const scheduleTraining = async (req, { collaboratorId, scheduledDate, scheduledStart, durationMin, locationId, trainerId, equipmentId, accessoryIds }) => {
    const atualizado = {
      ...req, collaboratorId, scheduledDate, scheduledStart,
      durationMin: durationMin || TRAINING_DEFAULT_MIN, locationId: locationId || null,
      trainerId: trainerId || null, equipmentId: equipmentId || null, accessoryIds: accessoryIds || [],
      collaboratorName: data.collaborators.find((c) => c.id === collaboratorId)?.name || req.collaboratorName,
      status: "agendado", confirmedBy: actorName || "equipe de treinamento", confirmedAt: new Date().toISOString(),
    };
    const aula = trainingBookingFrom(atualizado, data.activities.find((a) => a.id === req.activityId));
    atualizado.bookingId = aula.id;
    // A aula passa pelo MESMO validateBooking das outras reservas antes de
    // entrar: sala, instrutor e equipamento ocupados barram aqui, no cliente,
    // funcionando igual com ou sem servidor.
    const v = validateBooking(aula, data, [...bookings.filter((b) => b.id !== aula.id), aula], aula.id);
    if (v.errors.length) {
      setErr(`Não dá pra agendar esse treinamento: ${v.errors.join("; ")}`);
      return false;
    }
    return persistTx({
      partes: [
        { key: "bookings", next: [...bookings.filter((b) => b.id !== aula.id), aula] },
        { key: "trainingRequests", next: trainingRequests.map((r) => (r.id === req.id ? atualizado : r)) },
      ],
      auditar: { entity: "trainingRequests", prev: trainingRequests, next: trainingRequests },
      rotulo: "o agendamento do treinamento",
    });
  };
  // Concluir: o nível sobe agora, junto com o registro da conclusão. A reserva
  // do treinamento fica na agenda como histórico do que aconteceu.
  const concludeTraining = async (req, justificativaAntecipada) => {
    const nextReqs = trainingRequests.map((r) => (r.id === req.id
      ? {
          ...r, status: "concluido", concludedAt: new Date().toISOString(),
          concludedBy: actorName || "equipe de treinamento",
          ...(justificativaAntecipada ? { concluidoAntecipadamente: true, justificativaAntecipada } : {}),
        }
      : r));
    const partes = [{ key: "trainingRequests", next: nextReqs }];
    const collab = data.collaborators.find((c) => c.id === req.collaboratorId);
    const habilitado = collab && (collab.levels?.[req.activityId] || 0) < req.requiredLevel;
    const nextCollaborators = habilitado
      ? data.collaborators.map((c) => (c.id === req.collaboratorId
          ? { ...c, levels: { ...c.levels, [req.activityId]: req.requiredLevel } } : c))
      : data.collaborators;
    if (habilitado) partes.push({ key: "collaborators", next: nextCollaborators });

    /* Fecha o ciclo: a reserva que ficou "pendente_equipe" esperando essa
     * pessoa ganha ela agora. Sem isso o treinamento terminava, o nível subia,
     * e a reserva de 25/08 continuava marcada como "falta equipe" pra sempre.
     * Só entra se ela estiver realmente livre naquele horário — quem fez o
     * treinamento pode ter sido escalado em outra coisa nesse meio-tempo.
     *
     * A validação usa o cadastro DEPOIS do treinamento (`dataDepois`): validar
     * contra o `data` atual reprovaria sempre, porque nele a pessoa ainda está
     * com o nível antigo — que é exatamente o que este treinamento resolve. */
    const dataDepois = { ...data, collaborators: nextCollaborators };
    const alvo = req.targetBookingId ? bookings.find((b) => b.id === req.targetBookingId) : null;
    let recado = null;
    if (alvo && !isTrainingBooking(alvo) && !(alvo.collaboratorIds || []).includes(req.collaboratorId)) {
      const comAPessoa = { ...alvo, collaboratorIds: [...(alvo.collaboratorIds || []), req.collaboratorId] };
      const universo = bookings.map((b) => (b.id === alvo.id ? comAPessoa : b));
      const v = validateBooking(comAPessoa, dataDepois, universo, alvo.id);
      if (!v.errors.length) {
        partes.push({ key: "bookings", next: bookings.map((b) => (b.id === alvo.id
          ? { ...comAPessoa, status: bookingStatusFor(comAPessoa, dataDepois.activities.find((a) => a.id === comAPessoa.activityId)) }
          : b)) });
      } else {
        recado = `Treinamento concluído, mas a reserva de ${weekdayLabel(alvo.date)} ainda precisa de equipe: ${v.errors[0]}`;
      }
    }

    const ok = await persistTx({ partes, auditar: { entity: "trainingRequests", prev: trainingRequests, next: nextReqs }, rotulo: "a conclusão do treinamento" });
    if (ok && recado) setErr(recado);
    return ok;
  };
  // Desmarcar devolve pra pendente e tira a aula da agenda — a pessoa volta a
  // ficar livre naquele horário.
  const unscheduleTraining = async (req) => {
    const nextReqs = trainingRequests.map((r) => (r.id === req.id
      ? { ...r, status: "pendente", scheduledDate: null, scheduledStart: null, bookingId: null, confirmedBy: null }
      : r));
    return persistTx({
      partes: [
        { key: "bookings", next: bookings.filter((b) => b.id !== req.bookingId) },
        { key: "trainingRequests", next: nextReqs },
      ],
      auditar: { entity: "trainingRequests", prev: trainingRequests, next: nextReqs },
      rotulo: "o cancelamento do agendamento",
    });
  };

  // Atualiza reservas e, quando houver, grava o registro de reagendamento na
  // MESMA transacao — o indicador de perda depende dessa entrada.
  const updateBookingsAtomic = async (next, cancelamentos = []) => persistTx({
    partes: [
      { key: "bookings", next },
      ...(cancelamentos.length ? [{ key: "cancellations", next: [...cancelamentos, ...cancellations].slice(0, 500) }] : []),
    ],
    auditar: { entity: "bookings", prev: bookings, next },
    rotulo: "a reserva",
  });

  /* ---- negociação de equipe entre agendadores ----
   *
   * Aplicar a troca é uma gravação só: a pessoa sai de uma reserva e entra na
   * outra no MESMO instante. Em duas gravações separadas, uma falha no meio
   * deixaria a pessoa em lugar nenhum (saiu e não entrou) ou nos dois ao mesmo
   * tempo — e nenhum dos dois estados descreve algo que aconteceu de verdade.
   *
   * O plano é sempre recalculado aqui, contra a lista de reservas atual, e não
   * o que a tela tinha quando o botão apareceu: entre ver e clicar, alguém
   * pode ter marcado a pessoa em outra coisa. */
  const aplicarPlanoDeEquipe = async (plano, rotulo) => {
    if (!plano || plano.modo === "impossivel" || !plano.entrada) return false;
    const porId = new Map([...plano.saidas, plano.entrada].map((b) => [b.id, b]));
    const next = bookings.map((b) => porId.get(b.id) || b);
    return persistTx({
      partes: [{ key: "bookings", next }],
      auditar: { entity: "bookings", prev: bookings, next },
      rotulo: rotulo || "a troca de equipe",
    });
  };

  const puxarColaborador = async ({ collaboratorId, destino }) => {
    const plano = pullPlan({ collaboratorId, destino, bookings, activities: data.activities, studies, calendar: data.calendar });
    if (plano.modo === "pedir") return { ok: false, plano, problemas: ["essa atividade não é cedível — use 'pedir'"] };
    if (plano.modo === "impossivel") return { ok: false, plano, problemas: plano.impedimentos };
    const ok = await aplicarPlanoDeEquipe(plano, "o remanejamento da equipe");
    return { ok, plano, problemas: ok ? [] : [ultimoErroRef.current || "a gravação não foi concluída"] };
  };

  const persistStaffRequests = async (next) => persistList("staffRequests", staffRequests, next, setStaffRequests, "o pedido de equipe");

  const pedirColaborador = async ({ collaboratorId, destino, motivo }) => {
    const plano = pullPlan({ collaboratorId, destino, bookings, activities: data.activities, studies, calendar: data.calendar });
    if (plano.modo === "impossivel") return { ok: false, plano, problemas: plano.impedimentos };
    const jaPedido = staffRequests.some((r) => r.status === "pendente" && r.bookingId === destino.id && r.collaboratorId === collaboratorId);
    if (jaPedido) return { ok: false, plano, problemas: ["já existe um pedido pendente para essa pessoa nessa reserva"] };
    const req = staffRequestBlank({ collaboratorId, destino, plano, actorName, motivo });
    const ok = await persistStaffRequests([req, ...staffRequests]);
    return { ok, plano, problemas: ok ? [] : [ultimoErroRef.current || "a gravação não foi concluída"] };
  };

  /* Aceitar grava a troca E a resposta na MESMA transação. Separadas, um
   * pedido podia ficar marcado como aceito sem a pessoa ter mudado de lugar —
   * o pior estado possível, porque os dois agendadores acreditam em coisas
   * diferentes e nenhum tem motivo pra conferir. */
  const decidirPedidoDeEquipe = async (req, { aceitar, resposta }) => {
    const marcado = {
      ...req, status: aceitar ? "aceito" : "recusado",
      decidedBy: actorName, decidedAt: new Date().toISOString(), resposta: resposta || "",
    };
    const nextReqs = staffRequests.map((r) => (r.id === req.id ? marcado : r));
    if (!aceitar) {
      const ok = await persistStaffRequests(nextReqs);
      return { ok, problemas: ok ? [] : [ultimoErroRef.current || "a gravação não foi concluída"] };
    }
    const destino = bookings.find((b) => b.id === req.bookingId);
    if (!destino) return { ok: false, problemas: ["a reserva de destino não existe mais — o pedido perdeu o sentido"] };
    const plano = pullPlan({ collaboratorId: req.collaboratorId, destino, bookings, activities: data.activities, studies, calendar: data.calendar });
    if (plano.modo === "impossivel") return { ok: false, problemas: plano.impedimentos };
    const porId = new Map([...plano.saidas, plano.entrada].map((b) => [b.id, b]));
    const nextBookings = bookings.map((b) => porId.get(b.id) || b);
    const ok = await persistTx({
      partes: [{ key: "bookings", next: nextBookings }, { key: "staffRequests", next: nextReqs }],
      auditar: { entity: "bookings", prev: bookings, next: nextBookings },
      rotulo: "a resposta ao pedido de equipe",
    });
    return { ok, problemas: ok ? [] : [ultimoErroRef.current || "a gravação não foi concluída"] };
  };

  const cancelarPedidoDeEquipe = async (req) => persistStaffRequests(
    staffRequests.map((r) => (r.id === req.id ? { ...r, status: "cancelado", decidedBy: actorName, decidedAt: new Date().toISOString() } : r)));

  // Estudo + visitas numa transacao so (ver submitStudy).
  const saveStudyWithTimepoints = async (nextStudies, nextTimepoints) => persistTx({
    partes: [{ key: "studies", next: nextStudies }, { key: "timepoints", next: nextTimepoints }],
    auditar: { entity: "studies", prev: studies, next: nextStudies },
    rotulo: "o protocolo do estudo",
  });

  const goPlanTimepoint = (studyId) => { setPresetStudyId(studyId); setTab("booking"); };

  /* A tela de carregamento precisa saber FALHAR.
   *
   * Enquanto ela só sabia girar, qualquer erro na leitura virava animação
   * eterna: o `catch` do `loadAll` desligava o `loading`, mas as coleções
   * continuavam nulas e a condição abaixo seguia verdadeira para sempre. Quem
   * abria o arquivo via uma bolinha andando e nenhuma explicação — e do outro
   * lado não havia como descobrir o motivo.
   *
   * Agora, passados alguns segundos, ela conta o que faltou carregar, mostra o
   * erro que o `loadAll` guardou e oferece as duas saídas possíveis. */
  const FALTANDO = [
    ["cadastro", data], ["reservas", bookings], ["contas", users],
    ["treinamentos", trainingRequests], ["estudos", studies], ["visitas", timepoints],
    ["histórico", auditLog], ["prazos", deadlineRequests], ["cancelamentos", cancellations],
    ["permissões", roleCapabilities], ["estoque", stockEntries], ["horas extras", overtimeRequests],
    ["estimativas", estimates], ["pedidos de equipe", staffRequests],
  ];
  const faltam = FALTANDO.filter(([, v]) => !v).map(([nome]) => nome);

  if (loading || !minSplashDone || faltam.length) {
    const travou = demorouDemais && !loading;
    return (
      <div className="loading-screen">
        <style>{FONTS}{SPLASH_CSS}</style>
        <div className="loader-card">
          <svg className="loader-pipeline" viewBox="0 0 380 70">
            <path id="loaderPath" d="M 15 35 C 55 8, 80 62, 135 35 S 195 8, 255 35 S 315 62, 365 35" fill="none" stroke="rgba(234,241,238,0.18)" strokeWidth="2" />
            <g>
              <circle cx="15" cy="35" r="6" className="lnode" style={{ animationDelay: "0s" }} />
              <circle cx="72" cy="42" r="6" className="lnode" style={{ animationDelay: ".2s" }} />
              <circle cx="129" cy="26" r="6" className="lnode" style={{ animationDelay: ".4s" }} />
              <circle cx="186" cy="42" r="6" className="lnode" style={{ animationDelay: ".6s" }} />
              <circle cx="243" cy="26" r="6" className="lnode" style={{ animationDelay: ".8s" }} />
              <circle cx="300" cy="42" r="6" className="lnode" style={{ animationDelay: "1.0s" }} />
              <circle cx="365" cy="35" r="6" className="lnode" style={{ animationDelay: "1.2s" }} />
            </g>
            <circle r="4.5" className="loader-dot" fill="#fff">
              <animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#loaderPath" /></animateMotion>
            </circle>
            <circle r="4.5" fill="#9FD8C8">
              <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.85s"><mpath href="#loaderPath" /></animateMotion>
            </circle>
            <circle r="4.5" fill="#E8C77A">
              <animateMotion dur="2.6s" repeatCount="indefinite" begin="1.7s"><mpath href="#loaderPath" /></animateMotion>
            </circle>
          </svg>
          <svg viewBox="0 0 60 60" width="52" height="52">
            <circle cx="30" cy="30" r="24" fill="none" stroke="#EAF1EE" strokeWidth="2.2" />
            <line className="clock-hand-hour" x1="30" y1="30" x2="30" y2="17" stroke="#EAF1EE" strokeWidth="2.4" strokeLinecap="round" />
            <line className="clock-hand-min" x1="30" y1="30" x2="41" y2="30" stroke="#9FD8C8" strokeWidth="2" strokeLinecap="round" />
            <circle cx="30" cy="30" r="2" fill="#EAF1EE" />
            <circle className="clock-tick" cx="30" cy="8" r="1.6" fill="#E8C77A" />
          </svg>
          <div className="loader-title">Central de Recursos</div>
          <div className="loader-sub">{travou ? "não consegui carregar os dados" : "carregando agenda de recursos…"}</div>
          <div className="loader-sub" style={{ opacity: 0.7 }}>v{APP_VERSION} · {APP_VERSION_DATE}</div>

          {travou && (
            <div style={{ marginTop: 16, textAlign: "left", maxWidth: 460 }}>
              <div style={{ fontSize: 12, color: "#F7E4DD", lineHeight: 1.5 }}>
                Faltou carregar: <strong>{faltam.join(", ")}</strong>.
              </div>
              {err && <div style={{ fontSize: 12, color: "#E8C77A", marginTop: 6, lineHeight: 1.5 }}>{err}</div>}
              <div style={{ fontSize: 11, color: "#9FB4B3", marginTop: 10, lineHeight: 1.5 }}>
                Quase sempre é a base guardada no navegador em um formato que este
                arquivo não entende mais. Limpar apaga só os dados deste computador —
                o cadastro é recriado ao recarregar.
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
                <button onClick={() => { loadingRef.current = false; setErr(""); loadAll(); }}
                  style={{ background: "#0E7C7B", color: "#fff", border: 0, borderRadius: 8, padding: "7px 13px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
                  Tentar de novo
                </button>
                <button onClick={() => {
                    try {
                      Object.keys(localStorage).filter((k) => k.startsWith("crb-local:")).forEach((k) => localStorage.removeItem(k));
                    } catch (e) { /* modo privado bloqueia: recarregar já é o que resta */ }
                    location.reload();
                  }}
                  style={{ background: "transparent", color: "#EAF1EE", border: "1px solid #2A4148", borderRadius: 8, padding: "7px 13px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
                  Limpar a base deste computador e recarregar
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  if (!entered) {
    return <EntryGate users={users} lastUserId={lastUserId} onEnter={enterAsUser} />;
  }

  const currentUser = users.find((u) => u.id === currentUserId) || null;
  /* O menu sai da matriz de permissões (capacidade `ver_<tela>`), não de
   * regras espalhadas aqui. Duas exceções deliberadas, que não são política
   * e sim coerência: "Meu dia" precisa de alguém com agenda própria pra
   * mostrar, e o Painel nunca some — é onde a pessoa aterrissa ao entrar. */
  const NAV_ICONS = {
    dashboard: LayoutDashboard, booking: Wand2, studies: Layers, schedule: CalendarClock,
    calendar: CalendarDays, training: GraduationCap, overtime: Timer, myday: CalendarCheck,
    kpis: TrendingUp, resources: Settings, history: History, estimates: Wallet,
  };
  const NAV = SCREENS
    .filter((s) => !s.ocultaNoMenu)
    .filter((s) => (s.id === "dashboard" || canI(screenCap(s.id))) && (!s.requerPessoa || myPersonId))
    .map((s) => ({ id: s.id, label: s.label, icon: NAV_ICONS[s.id] }));
  // Conta o que exige ação da equipe: agendar, ou concluir treinamento que já
  // passou da data.
  const pendingTrainingCount = trainingRequests.filter((r) => r.status === "pendente"
    || (r.status === "agendado" && r.scheduledDate && r.scheduledDate < todayStr())).length;
  const pendingOvertimeCount = (isAdmin || isGestor)
    ? overtimeRequests.filter((r) => r.status === "pendente").length
    : overtimeRequests.filter((r) => r.status === "pendente" && r.personId === myPersonId).length;

  return (
    <div data-theme={theme} style={{ background: T.bg, fontFamily: "'Inter', sans-serif", color: T.ink, height: "100vh" }} className="w-full flex items-stretch">
      <style>{FONTS}{THEME_CSS}</style>

      {/* Sidebar — navegação principal + controles utilitários, tudo fora do
          topo pra não poluir a área de conteúdo (era um cabeçalho com 11 itens). */}
      <aside style={{ background: T.chrome, width: 216 }} className="shrink-0 flex flex-col">
        <div className="px-3.5 py-4 flex items-center gap-2.5" style={{ borderBottom: `1px solid ${T.chromeLine}` }}>
          <div style={{ background: T.accent }} className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"><Gauge size={16} color="#fff" /></div>
          <div className="min-w-0">
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", letterSpacing: "-0.01em" }} className="text-white text-sm font-bold leading-tight truncate">Central de Recursos</div>
            <div className="text-[10px] truncate" style={{ color: "#9FB4B3" }}>locais · equip. · equipe · patroc.</div>
          </div>
        </div>

        <nav className="flex-1 overflow-y-auto py-2 px-2 space-y-0.5">
          {NAV.map((n) => (
            <button key={n.id} onClick={() => setTab(n.id)} className="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium transition-colors"
              style={{ background: tab === n.id ? T.accent : "transparent", color: tab === n.id ? "#fff" : "#B9CBCA" }}>
              <n.icon size={15} className="shrink-0" /><span className="flex-1 text-left truncate">{n.label}</span>
              {/* Um número por item, nunca dois. Quando existe algo esperando
                  ESTA pessoa, é esse o número que aparece (em verde) — ele é
                  mais específico que os contadores gerais, que mostram o
                  trabalho do setor inteiro. Sem aviso pessoal, valem os
                  contadores de sempre. */}
              {avisosPorTab[n.id] > 0 ? (
                <span title="esperando você" className="text-[10px] rounded-full px-1.5 leading-4 shrink-0 font-semibold" style={{ background: T.accent, color: "#fff" }}>{avisosPorTab[n.id]}</span>
              ) : (
                <>
                  {n.id === "training" && pendingTrainingCount > 0 && (
                    <span className="text-[10px] rounded-full px-1.5 leading-4 shrink-0" style={{ background: T.warn, color: "#fff" }}>{pendingTrainingCount}</span>
                  )}
                  {n.id === "overtime" && pendingOvertimeCount > 0 && (
                    <span className="text-[10px] rounded-full px-1.5 leading-4 shrink-0" style={{ background: T.warn, color: "#fff" }}>{pendingOvertimeCount}</span>
                  )}
                  {n.id === "dashboard" && alerts.length > 0 && (
                    <span className="text-[10px] rounded-full px-1.5 leading-4 shrink-0" style={{ background: T.danger, color: "#fff" }}>{alerts.length}</span>
                  )}
                </>
              )}
            </button>
          ))}
        </nav>

        <div className="p-2 space-y-1" style={{ borderTop: `1px solid ${T.chromeLine}` }}>
          <div className="flex items-center gap-1">
            <button onClick={toggleTheme} title={theme === "dark" ? "Mudar para tema claro" : "Mudar para tema escuro"}
              className="flex items-center justify-center w-7 h-7 rounded-lg shrink-0" style={{ background: "transparent", color: "#B9CBCA", border: `1px solid ${T.chromeLine}` }}>
              {theme === "dark" ? <Sun size={13} /> : <Moon size={13} />}
            </button>
            {/* Sino: liga a notificação do Windows. Aparece SEMPRE, inclusive
                quando não dá — porque "por que não recebo notificação?" é a
                pergunta que a pessoa faria de qualquer jeito, e é melhor a
                resposta estar aqui do que virar um chamado. */}
            <button
              onClick={notificacoes.permissao === "default" ? notificacoes.pedirPermissao : undefined}
              disabled={notificacoes.permissao !== "default"}
              title={
                !notificacoes.disponivel
                  ? "Notificação do Windows exige HTTPS — pela rede interna em http:// o navegador não permite. A contagem no menu e no título da aba continuam funcionando."
                  : notificacoes.permissao === "granted" ? "Notificações do Windows ativadas"
                  : notificacoes.permissao === "denied" ? "Notificações bloqueadas para este site — libere no cadeado da barra de endereço"
                  : "Ativar notificações do Windows"
              }
              className="flex items-center justify-center w-7 h-7 rounded-lg shrink-0"
              style={{
                background: "transparent",
                color: notificacoes.permissao === "granted" ? T.accent : "#B9CBCA",
                opacity: notificacoes.permissao === "default" ? 1 : 0.55,
                cursor: notificacoes.permissao === "default" ? "pointer" : "default",
                border: `1px solid ${T.chromeLine}`,
              }}>
