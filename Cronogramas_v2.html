              {notificacoes.permissao === "granted" ? <Bell size={13} /> : <BellOff size={13} />}
            </button>
            <div className="min-w-0 flex-1 px-2.5 py-1.5 rounded-lg" style={{ border: `1px solid ${T.chromeLine}` }}>
              <div className="text-xs font-medium truncate" style={{ color: "#fff" }}>{actorName}</div>
              <div className="text-[10px] truncate" style={{ color: "#9FB4B3" }}>{LEVEL_LABELS[currentUser?.level] || "—"}</div>
              {/* Versão do arquivo aberto. Passar o mouse mostra o que mudou. */}
              <div className="text-[9px] truncate" style={{ color: "#6E8785" }} title={`Versão ${APP_VERSION} de ${APP_VERSION_DATE} — ${APP_VERSION_NOTE}`}>
                v{APP_VERSION} · {APP_VERSION_DATE}
              </div>
            </div>
            <button onClick={logout} title="Sair" className="flex items-center justify-center w-7 h-7 rounded-lg shrink-0" style={{ color: "#B9CBCA", border: `1px solid ${T.chromeLine}` }}>
              <LogOut size={13} />
            </button>
          </div>
        </div>
      </aside>

      {/* Conteúdo */}
      <div className="flex-1 min-w-0 flex flex-col">
        {err && <div style={{ background: T.dangerSoft, color: T.danger }} className="text-xs px-5 py-2 flex items-center gap-2"><AlertTriangle size={13} /> {err}</div>}
        {reparos.length > 0 && (
          <div style={{ background: T.warnSoft, color: T.warn }} className="text-xs px-5 py-2 flex items-start gap-2">
            <AlertTriangle size={13} className="mt-0.5 shrink-0" />
            <div className="flex-1">
              <strong>Havia dado gravado em formato inválido e ele foi descartado:</strong> {reparos.join(", ")}.
              O cadastro (salas, métodos, equipamentos, equipe) não foi afetado — só o que estava ilegível.
            </div>
            <button onClick={() => setReparos([])} className="shrink-0 font-semibold underline">entendi</button>
          </div>
        )}

        <div className="p-5 flex-1 min-w-0 overflow-y-auto">
        {tab === "dashboard" && <Dashboard data={data} bookings={bookings} setTab={setTab} alerts={alerts} cancellations={cancellations} canPlanejar={canI("planejar_estudo")} canVerCustos={canI("indicadores")} />}
        {/* Duas portas pro mesmo assistente: criar estudo oficial
            (`planejar_estudo`) ou montar orçamento (`estimativa_editar`).
            Quem tem só uma delas entra direto no modo correspondente. */}
        {tab === "booking" && (canI("planejar_estudo") || canI("estimativa_editar")) && <BookingWizard data={data} bookings={bookings} onCreate={persistBookings} actorName={actorName}
          trainingRequests={trainingRequests} onCreateTrainingRequest={(reqs) => persistTrainingRequests([...trainingRequests, ...(Array.isArray(reqs) ? reqs : [reqs])])}
          studies={studies} onCreateStudy={(s) => persistStudies([...studies, s])}
          timepoints={timepoints} onCreateTimepoint={(tp) => persistTimepoints([...timepoints, tp])}
          onUpdateSupplies={(next) => persistCat("supplies", next)}
          onConfirmTimepoint={confirmTimepointAtomic}
          presetStudyId={presetStudyId} onConsumePreset={() => setPresetStudyId(null)}
          onIrParaEstudos={() => setTab("studies")}
          canSolicitarHoraExtra={canI("hora_extra_solicitar")} onCreateOvertimeRequest={createOvertimeRequest} overtimeRequests={overtimeRequests}
          estimates={estimates} onCreateEstimate={createEstimateAtomic}
          canEstimar={canI("estimativa_editar")} canSegurar={canI("estimativa_segurar")} canPlanejar={canI("planejar_estudo")} />}
        {tab === "studies" && <LimiteDeErro><EstudoView data={data} bookings={bookings} studies={studies} timepoints={timepoints}
          trainingRequests={trainingRequests} onNewTimepoint={goPlanTimepoint} canPlanejar={canI("planejar_estudo")} canVerCustos={canI("indicadores")}
          onUpdateBookings={persistBookings} onDeleteBookingsAtomic={deleteBookingsAtomic}
          canAprovarPrazo={canI("aprovar_prazo")} deadlineRequests={deadlineRequests} onCreateDeadlineRequest={(r) => persistDeadlineRequests([...deadlineRequests, r])}
          onDecideDeadlineRequest={decideDeadlineRequest} onNegotiateStudyDeadline={negotiateStudyDeadline}
          actorName={actorName} onRecordCancellation={recordCancellation}
          onSaveStudies={persistStudies} onSaveTimepoints={persistTimepoints} onSaveStudyWithTimepoints={saveStudyWithTimepoints}
          canGerenciar={canI("planejar_estudo") || isAdmin || isGestor}
          estimates={estimates} canSegurarEstimativa={canI("estimativa_segurar")}
          onLiberarEstimativa={(est) => setEstimateHold(est, { segurar: false, motivo: "liberada pra dar lugar a uma reserva oficial" })}
          onUpdateBookingsAtomic={updateBookingsAtomic} cancellationEntry={cancellationEntry}
          onCreate={persistBookings} onCreateTrainingRequest={(reqs) => persistTrainingRequests([...trainingRequests, ...(Array.isArray(reqs) ? reqs : [reqs])])}
          onCreateBookingAtomic={createBookingAtomic}
          onCreateStudy={(s) => persistStudies([...studies, s])} onCreateTimepoint={(tp) => persistTimepoints([...timepoints, tp])}
          onUpdateSupplies={(next) => persistCat("supplies", next)} onConfirmTimepoint={confirmTimepointAtomic}
          onConsumePreset={() => setPresetStudyId(null)}
          canSolicitarHoraExtra={canI("hora_extra_solicitar")} onCreateOvertimeRequest={createOvertimeRequest}
          onCreateEstimate={createEstimateAtomic} canEstimar={canI("estimativa_editar")} canSegurar={canI("estimativa_segurar")}
          overtimeRequests={overtimeRequests}
          staffRequests={staffRequests} onPuxarColaborador={puxarColaborador} onPedirColaborador={pedirColaborador}
          onDecidirPedidoEquipe={decidirPedidoDeEquipe} onCancelarPedidoEquipe={cancelarPedidoDeEquipe} /></LimiteDeErro>}
        {tab === "schedule" && <Schedule data={data} bookings={bookings} studies={studies} onUpdateBookings={persistBookings}
          onCreateBookingAtomic={createBookingAtomic} onDeleteBookingsAtomic={deleteBookingsAtomic}
          onRecordCancellation={recordCancellation} canPlanejar={canI("planejar_estudo")} canSolicitarHoraExtra={canI("hora_extra_solicitar")}
          canGerenciar={canI("planejar_estudo") || isAdmin || isGestor} myPersonId={myPersonId} podeSupervisionar={isAdmin || isGestor}
          estimates={estimates} canSegurarEstimativa={canI("estimativa_segurar")}
          onLiberarEstimativa={(est) => setEstimateHold(est, { segurar: false, motivo: "liberada pra dar lugar a uma reserva oficial" })}
          onCreateOvertimeRequest={createOvertimeRequest} actorName={actorName} />}
        {tab === "training" && <TrainingBoard data={data} trainingRequests={trainingRequests} bookings={bookings} onUpdateRequests={persistTrainingRequests} actorName={actorName}
          canTreinamento={canI("treinamento_confirmar")} podeAntecipar={isAdmin || isGestor}
          onScheduleTraining={scheduleTraining} onConcludeTraining={concludeTraining} onUnscheduleTraining={unscheduleTraining} />}
        {tab === "resources" && <ConfigArea data={data} bookings={bookings} estimates={estimates} onUpdateCat={persistCat}
          canCadastro={canI("cadastro")} canCustos={canI("custos")} canCalibracao={canI("calibracao")} canEstoque={canI("estoque")} canUsuarios={canI("usuarios")}
          roleCapabilities={roleCapabilities} onSaveRoleCapabilities={persistRoleCapabilities}
          users={users} onSaveUsers={persistUsers}
          stockEntries={stockEntries} onRecordStockEntry={recordStockEntry} actorName={actorName} />}
        {tab === "estimates" && <EstimatesView data={data} estimates={estimates} bookings={bookings} studies={studies}
          canEditar={canI("estimativa_editar")} canSegurar={canI("estimativa_segurar")} canConverter={canI("estimativa_converter")}
          canVerCustos={canI("indicadores")}
          onSetHold={setEstimateHold} onCancel={cancelEstimate} onReopen={reopenEstimate} onConvert={convertEstimateAtomic}
          onNova={() => setTab("booking")} />}
        {tab === "calendar" && <CalendarView data={data} bookings={bookings}
          canLancar={canI("calendario")} actorName={actorName}
          onSave={(next) => persistCat("calendar", next)} />}
        {tab === "history" && <HistoryView auditLog={auditLog} cancellations={cancellations} bookings={bookings} canVerCustos={canI("indicadores")} />}
        {tab === "myday" && <MeuDiaView data={data} bookings={bookings} myPersonRole={myPersonRole} myPersonId={myPersonId}
          onStartActivity={(b) => persistBookings(bookings.map((x) => (x.id === b.id ? { ...x, actualStart: nowHHMM(), startedAt: new Date().toISOString() } : x)))}
          onFinishActivity={(b) => persistBookings(bookings.map((x) => (x.id === b.id ? { ...x, actualStart: x.actualStart || x.start, actualEnd: nowHHMM(), completedAt: new Date().toISOString() } : x)))} />}
        {tab === "overtime" && <OvertimeBoard data={data} overtimeRequests={overtimeRequests} isAdmin={isAdmin} isGestor={isGestor}
          myPersonRole={myPersonRole} myPersonId={myPersonId}
          canResponder={canI("hora_extra_responder")} onRespond={respondOvertimeRequest} onApprove={approveOvertimeRequest}
          onCreateBooking={createBookingFromOvertime} />}
        {tab === "kpis" && <IndicatorsView data={data} bookings={bookings} cancellations={cancellations} overtimeRequests={overtimeRequests} estimates={estimates} />}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Dashboard / Visão Gestor                                                */
/* ---------------------------------------------------------------------- */
function Dashboard({ data, bookings, setTab, alerts, cancellations, canPlanejar, canVerCustos }) {
  const today = todayStr();
  const next7 = Array.from({ length: 7 }).map((_, i) => addDays(today, i));
  const todaysBookings = bookings.filter((b) => b.date === today).sort((a, b) => a.start.localeCompare(b.start));
  const [category, setCategory] = useState("location");

  const CATEGORY_OPTIONS = [
    { id: "location", label: "Locais", icon: Building2, items: data.locations },
    { id: "equipment", label: "Equipamentos", icon: Package, items: data.equipment },
    { id: "collaborator", label: "Colaboradores", icon: Users, items: data.collaborators },
    { id: "doctor", label: "Médicos", icon: Stethoscope, items: data.doctors },
  ];
  const activeCategory = CATEGORY_OPTIONS.find((c) => c.id === category);

  const utilData = useMemo(() => {
    return activeCategory.items
      .map((r) => ({ name: r.name.length > 20 ? r.name.slice(0, 19) + "…" : r.name, reservas: loadOf(r.id, category, bookings, today) }))
      .sort((a, b) => b.reservas - a.reservas).slice(0, 8);
  }, [data, bookings, category]);

  const sponsorData = useMemo(() => {
    const counts = {};
    bookings.forEach((b) => { counts[b.sponsorId] = (counts[b.sponsorId] || 0) + 1; });
    return Object.entries(counts).map(([id, count]) => ({ name: (data.sponsors.find((s) => s.id === id)?.name || "—").slice(0, 18), reservas: count }))
      .sort((a, b) => b.reservas - a.reservas).slice(0, 6);
  }, [data, bookings]);

  const costData = useMemo(() => {
    const totals = {};
    // Agrupa por patrocinador antes de somar pra que `bookingsCost` consiga
    // cobrar a sala de um grupo simultâneo uma vez só.
    const porPatrocinador = {};
    bookings.forEach((b) => { (porPatrocinador[b.sponsorId] = porPatrocinador[b.sponsorId] || []).push(b); });
    Object.entries(porPatrocinador).forEach(([id, list]) => { totals[id] = bookingsCost(list, data); });
    return Object.entries(totals).filter(([, cost]) => cost > 0)
      .map(([id, cost]) => ({ name: (data.sponsors.find((s) => s.id === id)?.name || "—").slice(0, 18), custo: Math.round(cost * 100) / 100 }))
      .sort((a, b) => b.custo - a.custo).slice(0, 6);
  }, [data, bookings]);

  const nicheStats = useMemo(() => {
    return data.niches.map((n) => {
      const sponsorIds = new Set(data.sponsors.filter((s) => s.nicheId === n.id).map((s) => s.id));
      return { name: n.name, count: bookings.filter((b) => sponsorIds.has(b.sponsorId)).length };
    });
  }, [data, bookings]);

  const heatmapItems = useMemo(() => {
    return activeCategory.items.map((r) => ({ ...r, total: loadOf(r.id, category, bookings, today) }))
      .sort((a, b) => b.total - a.total).slice(0, 8);
  }, [data, bookings, category]);

  const weekAgenda = useMemo(() => {
    return next7.map((d) => ({
      date: d,
      items: bookings.filter((b) => b.date === d).sort((a, b) => a.start.localeCompare(b.start)),
    }));
  }, [bookings]);

  const cancelStats = useMemo(() => {
    const list = (cancellations || []).map((c) => ({ ...c, outcome: cancellationOutcome(c, bookings) }));
    const perda = list.filter((c) => c.outcome.status === "perda");
    const emRisco = list.filter((c) => c.outcome.status === "em_risco");
    const totalPerda = perda.reduce((sum, c) => sum + (c.cost || 0), 0);
    const totalEmRisco = emRisco.reduce((sum, c) => sum + (c.cost || 0), 0);
    return { perda, emRisco, totalPerda, totalEmRisco, destaque: [...emRisco, ...perda].sort((a, b) => b.cancelledAt.localeCompare(a.cancelledAt)) };
  }, [cancellations, bookings]);

  const stat = (label, value, Icon) => (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 flex items-center gap-3">
      <div style={{ background: T.accentSoft, color: T.accentDark }} className="p-2.5 rounded-lg"><Icon size={18} /></div>
      <div><div style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-2xl font-bold">{value}</div>
        <div className="text-xs" style={{ color: T.inkMuted }}>{label}</div></div>
    </div>
  );

  return (
    <div className="space-y-5">
      <Section icon={LayoutDashboard} title="Visão geral" subtitle={`Hoje é ${weekdayLabel(today)}`}
        right={canPlanejar ? <Btn icon={Plus} onClick={() => setTab("booking")}>Nova reserva</Btn> : null} />

      {alerts.length > 0 && (
        <div style={{ background: T.dangerSoft, border: `1px solid ${T.danger}` }} className="rounded-xl p-4 space-y-1.5">
          <div className="flex items-center gap-2 text-sm font-medium" style={{ color: T.danger }}><AlertTriangle size={15} /> {alerts.length} alerta(s) pedindo atenção</div>
          {alerts.slice(0, 6).map((a, i) => (
            <div key={i} className="text-xs flex items-center gap-1.5" style={{ color: T.ink }}>
              <Chip tone={a.tone}>{a.kind}</Chip> {a.text}
            </div>
          ))}
          {alerts.length > 6 && <div className="text-[11px]" style={{ color: T.inkMuted }}>+ {alerts.length - 6} outro(s)</div>}
        </div>
      )}

      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        {stat("Locais", data.locations.length, Building2)}
        {stat("Equipamentos", data.equipment.length, Package)}
        {stat("Colaboradores", data.collaborators.length, Users)}
        {stat("Médicos", data.doctors.length, Stethoscope)}

                    </div>

/* Booking Wizard                                                          */
/* ---------------------------------------------------------------------- */
function suggestCombo({ date, start, end, locationId, equipmentId, accessoryIds, activityId, minLevel, needDoctor, participants }, data, bookings, excluded = { locations: [], collaborators: [], doctors: [] }, opts = {}) {
  const missing = [];
  const activity = activityId ? data.activities.find((a) => a.id === activityId) : null;
  const times = activityTimes(activity);
  // Toda checagem de conflito/horário usa a janela BLOQUEADA (preparo + execução +
  // desmontagem), não só a execução — é esse o tempo em que sala, equipamento e
  // equipe ficam de fato ocupados.
  const blk = blockedWindow(start, end, activity);
  const bs = blk.start, be = blk.end;
  // "Método": a atividade já define em quais salas ela pode rodar. Se não tiver salas
  // definidas, cai no comportamento antigo (qualquer sala cadastrada serve).
  const allowedRoomIds = activity?.locationIds?.length ? activity.locationIds : null;

  // Cada candidato rejeitado guarda o motivo — alimenta o painel "por que essa
  // sugestão?" no wizard, sem precisar rodar a busca de novo só pra explicar.
  const locRejected = [];
  const locCandidates = data.locations.filter((l) => {
    if (!l.active) { locRejected.push({ name: l.name, reason: "inativa" }); return false; }
    if (!withinAvailability(l, date, bs, be)) { locRejected.push({ name: l.name, reason: times.setup || times.teardown ? "fora do horário considerando preparo/desmontagem" : "fora do horário de disponibilidade" }); return false; }
    if (!fieldFree(l.id, "location", date, bs, be, bookings)) { locRejected.push({ name: l.name, reason: "já reservada nesse horário" }); return false; }
    if (excluded.locations.includes(l.id)) { locRejected.push({ name: l.name, reason: "já sugerida antes — buscando outra opção" }); return false; }
    // Feriado e festa da empresa também derrubam a sala: não adianta ela estar
    // teoricamente aberta num dia em que ninguém vem.
    const aul = absenceOn(data.calendar, l.id, date, bs, be);
    if (aul) { locRejected.push({ name: l.name, reason: absenceLabel(aul) }); return false; }
    if (locationId && l.id !== locationId) return false; // filtro explícito do usuário, não é uma "rejeição"
    if (allowedRoomIds && !allowedRoomIds.includes(l.id)) { locRejected.push({ name: l.name, reason: "não permitida para esse método" }); return false; }
    // Capacidade de participantes: sala pequena demais pro grupo previsto não serve.
    if (participants > 0) {
      const lim = participantLimit(l, activity);
      if (lim != null && participants > lim) { locRejected.push({ name: l.name, reason: `comporta ${lim} participante(s), precisa de ${participants}` }); return false; }
    }
    return true;
  }).sort((a, b) => {
    // Reuso de sala: se o plano já colocou uma atividade numa sala, tenta manter as
    // seguintes lá — menos troca de sala significa menos preparo e menos deslocamento.
    if (opts.preferLocationId) {
      const ap = a.id === opts.preferLocationId ? 0 : 1, bp = b.id === opts.preferLocationId ? 0 : 1;
      if (ap !== bp) return ap - bp;
    }
    return loadOf(a.id, "location", bookings, date) - loadOf(b.id, "location", bookings, date);
  });
  if (locCandidates.length === 0) missing.push(locationId ? "esse local está indisponível nesse horário" : allowedRoomIds ? "nenhuma das salas definidas para esse método está livre nesse horário" : "local cadastrado disponível");

  // Equipamento por TIPO, não por patrimônio: pedir "Corneometer" aceita qualquer
  // unidade equivalente (mesmo tipo, mesma condição de acessório). Tenta primeiro a
  // unidade pedida — se ela estiver ocupada, com calibração vencida ou fora do
  // horário, cai pra outra do mesmo tipo em vez de simplesmente falhar. Com
  // opts.lockEquipmentUnit ligado, respeita o patrimônio exato que foi escolhido.
  const eqRejected = [];
  let chosenEquipment = null;
  if (equipmentId) {
    const requested = data.equipment.find((e) => e.id === equipmentId);
    const units = opts.lockEquipmentUnit ? [requested].filter(Boolean) : typeCandidates(equipmentId, data.equipment);
    // A unidade pedida vem primeiro; entre as outras, a menos usada por perto.
    const ordered = [...units].sort((a, b) => {
      if (a.id === equipmentId) return -1;
      if (b.id === equipmentId) return 1;
      return loadOf(a.id, "equipment", bookings, date) - loadOf(b.id, "equipment", bookings, date);
    });
    // Uma unidade só serve se ela mesma estiver em ordem E se os acessórios
    // pedidos forem DELA. A sonda do MPA A não encaixa no MPA B: trocar o
    // patrimônio principal sem checar isso montaria um conjunto que não existe.
    const wanted = (accessoryIds || []).filter(Boolean);
    const unitOk = (eq) => {
      if (eq.active === false) { eqRejected.push({ name: eq.name, reason: "inativo" }); return false; }
      const cal = calibrationStatus(eq, date);
      if (cal?.status === "vencido") { eqRejected.push({ name: eq.name, reason: `calibração vencida desde ${weekdayLabel(cal.due)}` }); return false; }
      if (eq.availability && !withinAvailability(eq, date, bs, be)) { eqRejected.push({ name: eq.name, reason: "fora do horário de uso cadastrado" }); return false; }
      // Aparelho em manutenção sai da lista pelo mesmo caminho de férias e
      // feriado — é o calendário que diz até quando ele volta.
      const aue = absenceOn(data.calendar, eq.id, date, bs, be);
      if (aue) { eqRejected.push({ name: eq.name, reason: absenceLabel(aue) }); return false; }
      return true;
    };
    for (const eq of ordered) {
      if (!unitOk(eq)) continue;
      const incompat = wanted.filter((id) => !(eq.accessoryIds || []).includes(id));
      if (incompat.length) {
        const nomes = incompat.map((id) => data.equipment.find((x) => x.id === id)?.name || id).join(", ");
        eqRejected.push({ name: eq.name, reason: `não aceita o(s) acessório(s) ${nomes}` });
        continue;
      }
      // Os acessórios pedidos também são instrumentos: se um estiver inativo ou
      // com calibração vencida, o conjunto não pode ser usado.
      const accRuim = wanted.map((id) => data.equipment.find((x) => x.id === id)).filter(Boolean).find((acc) => !unitOk(acc));
      if (accRuim) continue;
      if (!equipCombinationFree(eq.id, wanted, date, bs, be, bookings)) { eqRejected.push({ name: eq.name, reason: "já reservado nesse horário" }); continue; }
      chosenEquipment = eq;
      break;
    }
    if (!chosenEquipment) {
      const typeName = requested ? baseTypeName(requested.name) : "equipamento";
      missing.push(ordered.length > 1
        ? `nenhuma unidade de "${typeName}" livre e compatível com os acessórios nesse horário (${ordered.length} cadastradas)`
        : `equipamento "${requested?.name || typeName}" indisponível nesse horário`);
    }
  }
  if (activity?.supplyUsage?.length) {
    activity.supplyUsage.forEach((u) => {
      const s = data.supplies?.find((x) => x.id === u.supplyId);
      if (s && (s.quantity ?? 0) < u.qty) missing.push(`suprimento "${s.name}" insuficiente em estoque (${s.quantity} ${s.unit} de ${u.qty} necessário)`);
    });
  }

  // Pools de hora extra: candidato que passa em tudo (ativo, nível, livre, não
  // repetido) e só falha no horário de disponibilidade cadastrado. Só é usado se
  // opts.allowStaffOvertime estiver ligado E o pool normal (dentro do horário)
  // estiver vazio — sala/equipamento/estoque continuam bloqueando normalmente,
  // sem exceção nenhuma; hora extra só cobre o horário do colaborador/médico.
  const colRejected = [];
  let colCandidates = [];
  let chosenCollaborators = [];
  let collaboratorMissing = false;
  let overtimeCollaborator = null;
  if (activityId) {
    const colOvertimePool = [];
    colCandidates = data.collaborators.filter((c) => {
      const level = c.levels?.[activityId] || 0;
      if (!c.active) { colRejected.push({ name: c.name, reason: "inativo" }); return false; }
      if (level < (minLevel || 0)) { colRejected.push({ name: c.name, reason: `nível insuficiente (${level} de ${minLevel} exigido)` }); return false; }
      if (!fieldFree(c.id, "collaborator", date, bs, be, bookings)) { colRejected.push({ name: c.name, reason: "já tem outra reserva nesse horário" }); return false; }
      if (excluded.collaborators.includes(c.id)) { colRejected.push({ name: c.name, reason: "já sugerido antes — buscando outra opção" }); return false; }
      // Férias/folga/feriado não são hora extra: não adianta pedir autorização
      // pra alguém que não vai estar. Por isso saem antes do pool de overtime.
      const auc = absenceOn(data.calendar, c.id, date, bs, be);
      if (auc) { colRejected.push({ name: c.name, reason: absenceLabel(auc) }); return false; }
      if (!withinAvailability(c, date, bs, be)) {
        colRejected.push({ name: c.name, reason: times.setup || times.teardown ? "fora do horário considerando preparo/desmontagem" : "fora do horário de disponibilidade" });
        colOvertimePool.push(c);
        return false;
      }
      return true;
    }).sort((a, b) => ((a.levels[activityId] - minLevel) - (b.levels[activityId] - minLevel)) || (loadOf(a.id, "collaborator", bookings, date) - loadOf(b.id, "collaborator", bookings, date)));
    // A atividade pode exigir mais de uma pessoa ao mesmo tempo (staffCount).
    chosenCollaborators = colCandidates.slice(0, times.staff);
    if (chosenCollaborators.length < times.staff && opts.allowStaffOvertime && colOvertimePool.length > 0) {
      // Completa o time com quem só falhou no horário — isso é o que dispara o
      // pedido de hora extra pra essa pessoa.
      const extras = colOvertimePool
        .sort((a, b) => loadOf(a.id, "collaborator", bookings, date) - loadOf(b.id, "collaborator", bookings, date))
        .slice(0, times.staff - chosenCollaborators.length);
      if (extras.length > 0) {
        overtimeCollaborator = extras[0];
        chosenCollaborators = [...chosenCollaborators, ...extras];
      }
    }
    if (chosenCollaborators.length < times.staff) {
      if (opts.allowMissingCollaborator) collaboratorMissing = true;
      else missing.push(times.staff > 1
        ? `${times.staff} colaboradores com nível suficiente (só ${chosenCollaborators.length} disponível(is))`
        : "colaborador com nível suficiente na atividade exigida");
    }
  }

  const docRejected = [];
  let docCandidates = [];
  let overtimeDoctor = null;
  if (needDoctor) {
    const docOvertimePool = [];
    docCandidates = data.doctors.filter((d) => {
      if (!d.active) { docRejected.push({ name: d.name, reason: "inativo" }); return false; }
      if (!fieldFree(d.id, "doctor", date, bs, be, bookings)) { docRejected.push({ name: d.name, reason: "já tem outra reserva nesse horário" }); return false; }
      if (excluded.doctors.includes(d.id)) { docRejected.push({ name: d.name, reason: "já sugerido antes — buscando outra opção" }); return false; }
      const aud = absenceOn(data.calendar, d.id, date, bs, be);
      if (aud) { docRejected.push({ name: d.name, reason: absenceLabel(aud) }); return false; }
      if (!withinAvailability(d, date, bs, be)) {
        docRejected.push({ name: d.name, reason: "fora do horário de disponibilidade" });
        docOvertimePool.push(d);
        return false;
      }
      return true;
    }).sort((a, b) => loadOf(a.id, "doctor", bookings, date) - loadOf(b.id, "doctor", bookings, date));
    if (docCandidates.length === 0 && opts.allowStaffOvertime && docOvertimePool.length > 0) {
      overtimeDoctor = docOvertimePool.sort((a, b) => loadOf(a.id, "doctor", bookings, date) - loadOf(b.id, "doctor", bookings, date))[0];
      docCandidates = [overtimeDoctor];
    }
    if (docCandidates.length === 0) missing.push("médico disponível");
  }

  // Mesmo falhando, devolve os candidatos rejeitados e o porquê — é o que
  // permite explicar "por que não fechou" em vez de só dizer que não fechou.
  if (missing.length > 0) return { success: false, missing, rejected: [...locRejected, ...eqRejected, ...colRejected, ...docRejected].slice(0, 6) };
  return {
    success: true, location: locCandidates[0],
    collaborator: chosenCollaborators[0] || null, // primeiro da equipe, pros lugares que só mostram um
    collaborators: chosenCollaborators,
    doctor: docCandidates[0] || null, collaboratorMissing,
    equipment: chosenEquipment,
    // Avisa a UI quando o motor trocou o patrimônio pedido por outra unidade do
    // mesmo tipo — a pessoa precisa saber que vai usar outro aparelho.
    equipmentSwapped: chosenEquipment && equipmentId && chosenEquipment.id !== equipmentId ? chosenEquipment : null,
    blockStart: bs, blockEnd: be, minGapMin: times.gap,
    staffNeeded: times.staff, staffFound: chosenCollaborators.length,
    overtimeNeeded: (overtimeCollaborator || overtimeDoctor) ? { collaboratorId: overtimeCollaborator?.id || null, doctorId: overtimeDoctor?.id || null } : null,
    rejected: [...locRejected, ...eqRejected, ...colRejected, ...docRejected].slice(0, 6),
  };
}
// Próxima data viável quando o horário pedido não fecha. Tenta primeiro o MESMO
// horário nos dias seguintes (é o que a pessoa pediu); se não achar, aceita
// outro horário no mesmo dia, varrendo a agenda de 15 em 15 minutos.
function findAlternativeDate(criteria, data, bookings, maxDays = 21) {
  const durationMin = toMin(criteria.end) - toMin(criteria.start);
  for (let i = 1; i <= maxDays; i++) {
    const d2 = addDays(criteria.date, i);
    const attempt = suggestCombo({ ...criteria, date: d2 }, data, bookings);
    if (attempt.success) return { date: d2, ...attempt };
  }
  for (let i = 0; i <= maxDays; i++) {
    const d2 = addDays(criteria.date, i);
    const slot = findSlotOnDay({ ...criteria, durationMin }, d2, data, bookings, undefined, {});
    if (slot) return { date: d2, start: slot.start, end: slot.end, timeShifted: true, ...slot.result };
  }
  return null;
}

/* Planejamento de estudo — janela de datas (mínima/máxima) + várias        */
/* atividades/métodos, tentando encaixar tudo no mesmo dia OU distribuído   */
/* ao longo da janela.                                                     */
/* ---------------------------------------------------------------------- */
// Pontuação de um plano candidato — quanto MENOR, melhor. Não é só "menos dias":
// o plano bom é o que respeita o protocolo, não força hora extra, não fica
// trocando a equipe de sala, custa menos e não empilha tudo em cima de quem já
// está sobrecarregado. Os pesos estão todos aqui em cima, num lugar só, pra dar
// pra ajustar a política de agendamento sem caçar número espalhado no código.
const PLAN_WEIGHTS = {
  perDay: 10,        // cada dia a mais de campanha
  overtime: 40,      // hora extra é caro e depende de aprovação — evita ao máximo
  staffMissing: 25,  // linha que ficou sem colaborador treinado
  roomSwitch: 6,     // trocar de sala entre atividades (mais preparo, mais deslocamento)
  lateInWindow: 3,   // cada dia gasto da tolerância do protocolo (deixa margem pra imprevisto)
  costPerReal: 0.02, // custo operacional estimado do plano
  loadAvg: 1,        // carga média dos recursos escolhidos
  loadSpread: 2,     // desequilíbrio entre quem está muito e pouco carregado
};
function scorePlan(items, bookings, data, ctx = {}) {
  if (!items.length) return Infinity;
  const days = new Set(items.map((it) => it.date)).size;
  let score = days * PLAN_WEIGHTS.perDay;

  // Hora extra e equipe incompleta: penalidades diretas por linha.
  items.forEach((it) => {
    if (it.overtimeNeeded) score += PLAN_WEIGHTS.overtime;
    if (it.collaboratorMissing) score += PLAN_WEIGHTS.staffMissing;
  });

  // Deslocamento: quantas vezes a sala muda de uma atividade pra outra na sequência.
  let switches = 0;
  for (let i = 1; i < items.length; i++) {
    if (items[i].location?.id && items[i - 1].location?.id && items[i].location.id !== items[i - 1].location.id) switches++;
  }
  score += switches * PLAN_WEIGHTS.roomSwitch;

  // Prazo do protocolo: agendar no começo da janela deixa margem pra remarcar se
  // o voluntário faltar. Conta os dias já gastos da tolerância.
  if (ctx.dateMin) {
    const last = items.reduce((acc, it) => (it.date > acc ? it.date : acc), items[0].date);
    const used = Math.round((new Date(last + "T00:00:00") - new Date(ctx.dateMin + "T00:00:00")) / 86400000);
    score += Math.max(0, used) * PLAN_WEIGHTS.lateInWindow;
  }

  // Custo operacional estimado do plano inteiro. Usa bookingsCost (e não a soma
  // de bookingCost) pra sala de grupo simultâneo não ser cobrada duas vezes —
  // senão a pontuação penalizava justamente o plano que aproveita melhor a sala.
  if (data) {
    const cost = bookingsCost(items.map((it) => ({
      date: it.date, start: it.start, end: it.end, blockStart: it.blockStart, blockEnd: it.blockEnd,
      locationId: it.location?.id, equipmentId: it.equipment?.id || it.row?.equipmentId,
      collaboratorIds: (it.collaborators || []).map((c) => c.id), doctorId: it.doctor?.id || null,
      groupId: it.groupId,
    })), data);
    score += cost * PLAN_WEIGHTS.costPerReal;
  }

  // Equilíbrio da equipe: além da carga média, penaliza a diferença entre o
  // recurso mais e o menos carregado do plano — distribuir é melhor que
  // sobrecarregar uma pessoa só porque ela é a primeira da lista.
  const loads = [];
  items.forEach((it) => {
    if (it.location) loads.push(loadOf(it.location.id, "location", bookings, it.date));
    (it.collaborators || (it.collaborator ? [it.collaborator] : [])).forEach((c) => loads.push(loadOf(c.id, "collaborator", bookings, it.date)));
  });
  if (loads.length) {
    const avg = loads.reduce((a, b) => a + b, 0) / loads.length;
    score += avg * PLAN_WEIGHTS.loadAvg + (Math.max(...loads) - Math.min(...loads)) * PLAN_WEIGHTS.loadSpread;
  }
  return score;
}
// Constrói o objeto de item do plano a partir do resultado do motor — os três
// planejadores montavam isso na mão, cada um com uma variação sutil.
function planItemFrom(row, date, slot, group) {
  const r = slot.result;
  return {
    rowId: row.rowId, row, date, start: slot.start, end: slot.end,
    // Quando a atividade faz parte de um grupo simultâneo, o item carrega o
    // grupo pra UI poder mostrar as duas juntas em vez de como etapas soltas.
    groupId: group?.id || null, groupSize: group?.size || 1, groupIndex: group?.index ?? 0,
    blockStart: r.blockStart, blockEnd: r.blockEnd,
    location: r.location, collaborator: r.collaborator, collaborators: r.collaborators,
    doctor: r.doctor, equipment: r.equipment, equipmentSwapped: r.equipmentSwapped,
    collaboratorMissing: r.collaboratorMissing, staffNeeded: r.staffNeeded, staffFound: r.staffFound,
    overtimeNeeded: r.overtimeNeeded, rejected: r.rejected,
  };
}
function tentativeBooking(row, item) {
  return {
    id: `tmp_${row.rowId}`, date: item.date, start: item.start, end: item.end,
    blockStart: item.blockStart, blockEnd: item.blockEnd,
    locationId: item.location.id, equipmentId: item.equipment?.id || row.equipmentId || null,
    accessoryIds: row.accessoryIds || [], activityId: row.activityId,
    collaboratorIds: (item.collaborators || []).map((c) => c.id), doctorId: item.doctor?.id || null,
  };
}
/* ---------------------------------------------------------------------- */
/* Grupo de atividades simultâneas                                         */
/*                                                                         */
/* Caso real: a visita precisa de "Apoio" E "Lavagem de cabelo" na MESMA    */
/* sala, ao MESMO tempo, com duas pessoas diferentes. Isso não é uma        */
/* atividade encadeada depois da outra (o motor já fazia isso) nem uma      */
/* atividade de 2 pessoas (`staffCount` já fazia isso) — são duas           */
/* atividades distintas, cada uma com o seu método, equipamento e equipe,   */
/* ocupando a mesma sala ao mesmo tempo.                                    */
/*                                                                         */
/* Cada atividade do plano tem um `groupKey`: vazio = roda sozinha, mesmo   */
/* valor = roda junto. Não precisa ser em linhas vizinhas nem parar em      */
/* duas — dá pra montar "A, A, B" ou juntar três de uma vez.                */
/*                                                                         */
/* Todas as atividades do grupo começam no mesmo horário; cada uma mantém   */
/* a própria duração, então a sala fica bloqueada pela união das janelas.   */
/* As pessoas saem distintas de graça: cada atividade é resolvida contra as */
/* reservas provisórias das anteriores do grupo, então quem já foi          */
/* escolhido aparece como ocupado pra próxima.                              */
/* ---------------------------------------------------------------------- */
const GROUP_KEYS = ["A", "B", "C", "D"];
function groupRows(rows) {
  const groups = [];
  const byKey = new Map();
  (rows || []).forEach((row) => {
    if (!row.groupKey) { groups.push([row]); return; }
    const existing = byKey.get(row.groupKey);
    if (existing) { existing.push(row); return; }
    const fresh = [row];
    byKey.set(row.groupKey, fresh);
    groups.push(fresh); // mantém a ordem em que o grupo apareceu
  });
  return groups;
}
// Janela de cada linha do grupo a partir de um início comum, mais a união do
// que o grupo inteiro bloqueia na sala.
function groupWindow(group, startStr, data) {
  const rows = group.map((row) => {
    const activity = data.activities.find((a) => a.id === row.activityId);
    const times = activityTimes(activity);
    const end = addMinutes(startStr, row.durationMin || 60);
    const blk = blockedWindow(startStr, end, activity);
    return { row, activity, times, start: startStr, end, blockStart: blk.start, blockEnd: blk.end };
  });
  const blockStartMin = Math.min(...rows.map((r) => toMin(r.blockStart)));
  const blockEndMin = Math.max(...rows.map((r) => toMin(r.blockEnd)));
  return {
    rows,
    blockStart: minToHHMM(blockStartMin), blockEnd: minToHHMM(blockEndMin),
    endMin: Math.max(...rows.map((r) => toMin(r.end))),
    maxSetup: Math.max(...rows.map((r) => r.times.setup)),
    maxTeardown: Math.max(...rows.map((r) => r.times.teardown)),
    maxGap: Math.max(...rows.map((r) => r.times.gap)),
    participants: rows.reduce((sum, r) => sum + (r.row.participants || 0), 0),
  };
}
// Resolve um grupo inteiro num horário. Grupo de uma linha só delega pro
// suggestCombo de sempre — o comportamento antigo fica idêntico.
function suggestGroup(group, date, startStr, data, bookings, excluded, opts = {}) {
  const win = groupWindow(group, startStr, data);
  if (group.length === 1) {
    const r0 = win.rows[0];
    const r = suggestCombo({ ...rowCriteria(r0.row), date, start: r0.start, end: r0.end }, data, bookings, excluded, opts);
    return r.success
      ? { success: true, location: r.location, blockStart: r.blockStart, blockEnd: r.blockEnd, maxGap: win.maxGap, maxTeardown: win.maxTeardown, endMin: win.endMin, items: [{ row: r0.row, start: r0.start, end: r0.end, result: r }] }
      : { success: false, missing: r.missing };
  }

  // A sala é escolhida uma vez pro grupo todo: precisa estar livre pela união
  // das janelas e comportar a soma dos participantes das atividades juntas.
  const roomFilter = group.map((r) => r.roomId).find(Boolean) || opts.forceLocationId || null;
  const rooms = data.locations
    .filter((l) => l.active !== false)
    .filter((l) => !roomFilter || l.id === roomFilter)
    .filter((l) => !excluded?.locations?.includes(l.id))
    .sort((a, b) => {
      if (opts.preferLocationId) {
        const ap = a.id === opts.preferLocationId ? 0 : 1, bp = b.id === opts.preferLocationId ? 0 : 1;
        if (ap !== bp) return ap - bp;
      }
      return loadOf(a.id, "location", bookings, date) - loadOf(b.id, "location", bookings, date);
    });

  const roomRejected = [];
  for (const room of rooms) {
    if (!withinAvailability(room, date, win.blockStart, win.blockEnd)) { roomRejected.push({ name: room.name, reason: "fora do horário para a janela do grupo" }); continue; }
    if (!fieldFree(room.id, "location", date, win.blockStart, win.blockEnd, bookings)) { roomRejected.push({ name: room.name, reason: "já reservada nessa janela" }); continue; }
    if (typeof room.capacity === "number" && room.capacity > 0 && win.participants > room.capacity) {
      roomRejected.push({ name: room.name, reason: `comporta ${room.capacity}, o grupo junto tem ${win.participants} participante(s)` });
      continue;
    }
    // Resolve linha a linha com a sala já fixada. As provisórias do próprio
    // grupo entram SEM sala (o conflito de sala já foi resolvido acima); o que
    // elas carregam é pessoa, médico e equipamento, que é justamente o que
    // precisa sair diferente entre as atividades simultâneas.
    let inner = bookings;
    const items = [];
    let failed = null;
    for (const r of win.rows) {
      const res = suggestCombo(
        { ...rowCriteria(r.row), locationId: room.id, date, start: r.start, end: r.end },
        data, inner, excluded, { ...opts, preferLocationId: room.id }
      );
      if (!res.success) { failed = { room, missing: res.missing, activity: r.activity }; break; }
      items.push({ row: r.row, start: r.start, end: r.end, result: res });
      // `date` é obrigatório aqui: fieldFree descarta reserva de outro dia, e
      // sem ele a provisória seria ignorada — a segunda atividade não enxergaria
      // a pessoa/equipamento que a primeira acabou de pegar.
      inner = [...inner, { ...tentativeBooking(r.row, { ...r, date, location: res.location, equipment: res.equipment, collaborators: res.collaborators, doctor: res.doctor }), locationId: null }];
    }
    if (!failed) {
      return {
        success: true, location: room, blockStart: win.blockStart, blockEnd: win.blockEnd,
        maxGap: win.maxGap, maxTeardown: win.maxTeardown, endMin: win.endMin, items,
        groupRoomRejected: roomRejected.slice(0, 4),
      };
    }
    roomRejected.push({ name: room.name, reason: `${failed.activity?.name || "uma atividade"}: ${(failed.missing || []).join("; ")}` });
  }
  return {
    success: false,
    missing: [rooms.length
      ? `nenhuma sala atende as ${group.length} atividades juntas nesse horário`
      : "nenhuma sala cadastrada disponível"],
    groupRoomRejected: roomRejected.slice(0, 4),
  };
}
// Janela útil do dia pro grupo: interseção do que cada linha exige.
function dayBoundsForGroup(group, data, dateStr) {
  const parts = group.map((row) => dayBoundsForRow(rowCriteria(row), data, dateStr));
  if (parts.some((p) => !p)) return null;
  const startMin = Math.max(...parts.map((p) => p.startMin));
  const endMin = Math.min(...parts.map((p) => p.endMin));
  return endMin > startMin ? { startMin, endMin } : null;
}
// Mesma busca de 15 em 15 minutos do findSlotOnDay, só que resolvendo o grupo
// inteiro em cada horário candidato.
function findGroupSlotOnDay(group, dateStr, data, bookings, excluded, opts = {}) {
  const bounds = dayBoundsForGroup(group, data, dateStr);
  if (!bounds) return null;
  const probe = groupWindow(group, minToHHMM(bounds.startMin), data);
  const longest = Math.max(...group.map((r) => r.durationMin || 60));
  const firstStart = Math.max(bounds.startMin + probe.maxSetup, opts.notBeforeMin ?? 0);
  const lastStart = bounds.endMin - probe.maxTeardown - longest;
  const step = opts.stepMin || SLOT_STEP_MIN;
  for (let m = Math.ceil(firstStart / step) * step; m <= lastStart; m += step) {
    const r = suggestGroup(group, dateStr, minToHHMM(m), data, bookings, excluded, opts);
    if (r.success) return r;
  }
  return null;
}
function rowCriteria(row) {
  return {
    durationMin: row.durationMin || 60, locationId: row.roomId || null,
    equipmentId: row.equipmentId, accessoryIds: row.accessoryIds, activityId: row.activityId,
    minLevel: row.minLevel, needDoctor: row.needDoctor, participants: row.participants,
  };
}
function planSameDay({ dateMin, dateMax, rows }, data, bookings, excluded = { locations: [], collaborators: [], doctors: [] }) {
  // Em vez de parar no primeiro dia que fecha, junta até 5 candidatos na janela
  // e fica com o de melhor pontuação — comparação real, não first-fit puro.
  // As linhas viram GRUPOS: linha marcada como simultânea entra no grupo da
  // anterior e é agendada junto, na mesma sala e no mesmo horário.
  const groups = groupRows(rows);
  const candidates = [];
  for (let d = dateMin; d <= dateMax && candidates.length < 5; d = addDays(d, 1)) {
    let cursorMin = 0; // início do dia; a janela real vem dos horários cadastrados
    let tempBookings = bookings;
    const items = [];
    let ok = true;
    let lastLocationId = null;
    for (const group of groups) {
      // O próximo grupo não pode começar antes do fim da desmontagem do
      // anterior mais a folga mínima que ele exige (cursorMin). Dentro disso, a
      // busca acha o primeiro horário viável de 15 em 15 minutos.
      const slot = findGroupSlotOnDay(group, d, data, tempBookings, excluded,
        { allowMissingCollaborator: true, allowStaffOvertime: true, preferLocationId: lastLocationId, notBeforeMin: cursorMin });
      if (!slot) { ok = false; break; }
      const gid = group[0].rowId;
      slot.items.forEach((sub, i) => {
        const item = planItemFrom(sub.row, d, sub, { id: gid, size: group.length, index: i });
        // Dentro do grupo a sala é a mesma, então a provisória de cada linha
        // guarda a sala só uma vez — senão a segunda atividade veria a primeira
        // ocupando a sala que ela mesma vai dividir.
        tempBookings = [...tempBookings, i === 0 ? tentativeBooking(sub.row, item) : { ...tentativeBooking(sub.row, item), locationId: null }];
        items.push(item);
      });
      cursorMin = slot.endMin + slot.maxTeardown + slot.maxGap;
      lastLocationId = slot.location.id;
    }
    if (ok) candidates.push(items);
  }
  if (!candidates.length) return null;
  candidates.sort((a, b) => scorePlan(a, bookings, data, { dateMin }) - scorePlan(b, bookings, data, { dateMin }));
  return { mode: "same-day", items: candidates[0], alternativesConsidered: candidates.length };
}
function planSpread({ dateMin, dateMax, rows }, data, bookings, excluded = { locations: [], collaborators: [], doctors: [] }) {
  let tempBookings = bookings;
  const items = [];
  // Grupo simultâneo nunca é separado: mesmo distribuindo na janela, as
  // atividades do grupo caem no mesmo dia, no mesmo horário e na mesma sala.
  for (const group of groupRows(rows)) {
    // Junta até 3 datas viáveis pro grupo (em vez de ficar só com a primeira)
    // e escolhe a melhor pela mesma pontuação usada no plano do mesmo dia.
    const found = [];
    for (let d = dateMin; d <= dateMax && found.length < 3; d = addDays(d, 1)) {
      const slot = findGroupSlotOnDay(group, d, data, tempBookings, excluded,
        { allowMissingCollaborator: true, allowStaffOvertime: true });
      if (slot) {
        const gid = group[0].rowId;
        found.push({ date: d, items: slot.items.map((sub, i) => planItemFrom(sub.row, d, sub, { id: gid, size: group.length, index: i })) });
      }
    }
    if (!found.length) return null;
    found.sort((a, b) => scorePlan(a.items, tempBookings, data, { dateMin }) - scorePlan(b.items, tempBookings, data, { dateMin }));
    found[0].items.forEach((item, i) => {
      tempBookings = [...tempBookings, i === 0 ? tentativeBooking(item.row, item) : { ...tentativeBooking(item.row, item), locationId: null }];
      items.push(item);
    });
  }
  return { mode: "spread", items };
}
function excludedFromPlan(plan) {
  const locations = [], collaborators = [], doctors = [];
  (plan?.items || []).forEach((it) => {
    if (it.location) locations.push(it.location.id);
    (it.collaborators || (it.collaborator ? [it.collaborator] : [])).forEach((c) => collaborators.push(c.id));
    if (it.doctor) doctors.push(it.doctor.id);
  });
  return { locations, collaborators, doctors };
}

function mergeExcluded(a, b) {
  return {
    locations: Array.from(new Set([...(a?.locations || []), ...(b?.locations || [])])),
    collaborators: Array.from(new Set([...(a?.collaborators || []), ...(b?.collaborators || [])])),
    doctors: Array.from(new Set([...(a?.doctors || []), ...(b?.doctors || [])])),
  };
}
// Diagnóstico quando nenhum plano fecha: varre a janela toda pra cada GRUPO
// isoladamente e diz se o problema é falta de colaborador treinado ou outra
// coisa. Grupo simultâneo é diagnosticado junto de propósito — separar as
// atividades diria "cada uma cabe sozinha" quando o problema é justamente elas
// precisarem da mesma sala ao mesmo tempo.
function diagnoseRows(rows, dateMin, dateMax, data, bookings) {
  const noExclusion = { locations: [], collaborators: [], doctors: [] };
  const out = [];
  groupRows(rows).forEach((group) => {
    let bestMissing = null, collaboratorMissing = false, anySuccess = false;
    for (let d = dateMin; d <= dateMax; d = addDays(d, 1)) {
      // Varre o dia inteiro (não só um horário fixo) antes de dizer que não
      // fecha — senão o diagnóstico acusa falta de recurso que na verdade só
      // estava ocupado naquele horário específico.
      const slot = findGroupSlotOnDay(group, d, data, bookings, noExclusion,
        { allowMissingCollaborator: true, allowStaffOvertime: true });
      if (slot) {
        anySuccess = true;
        if (slot.items.some((s) => s.result.collaboratorMissing)) collaboratorMissing = true;
        else { bestMissing = null; break; }
      } else if (!bestMissing) {
        // Sem horário no dia: pega o motivo do primeiro horário da janela.
        const bounds = dayBoundsForGroup(group, data, d);
        if (!bounds) bestMissing = ["nenhum recurso cadastrado atende nesse dia da semana"];
        else {
          const probe = groupWindow(group, minToHHMM(bounds.startMin), data);
          const r = suggestGroup(group, d, minToHHMM(bounds.startMin + probe.maxSetup), data, bookings, noExclusion,
            { allowMissingCollaborator: true, allowStaffOvertime: true });
          bestMissing = r.missing || ["nenhum horário livre nesse dia"];
        }
      }
    }
    // Um resultado por linha, todas do grupo compartilhando o mesmo veredito —
    // é o que a UI espera (ela procura o diagnóstico pelo rowId).
    group.forEach((row) => out.push({
      rowId: row.rowId, ok: anySuccess && !collaboratorMissing,
      collaboratorMissing: anySuccess && collaboratorMissing, missing: bestMissing,
      groupSize: group.length,
    }));
  });
  return out;
}

function makeRow(data) {
  const act = data.activities[0];
  // groupKey: atividades com a mesma letra rodam JUNTAS, na mesma sala e no
  // mesmo horário (ver groupRows). Vazio = roda sozinha, em sequência.
  // roomId continua no modelo (o encaixe manual usa), mas o assistente não
  // pergunta mais — a sala sai do que está cadastrado no método.
  return { rowId: genId("row"), activityId: act?.id || null, durationMin: act?.durationMin ?? 60, roomId: null, equipmentId: null, accessoryIds: [], needDoctor: false, participants: null, groupKey: null };
}
// Toda visita é descrita em termos de PROTOCOLO — deslocamento em dias a partir
// do baseline (D0) mais a tolerância —, nunca por datas soltas. É o mesmo
// formato que o cadastro de estudo usa, então não existem mais dois tipos de
// timepoint no sistema: mudar o baseline recalcula a janela de todas as visitas.
// A primeira visita nasce como D0 (o próprio baseline); as seguintes, D+7±2.
function makeTimepointDraft(data, n) {
  return {
    tpId: genId("tpdraft"), label: n === 1 ? "D0 — Baseline" : `D${(n - 1) * 7} — Visita ${n}`,
    offsetDays: (n - 1) * 7, toleranceDays: n === 1 ? 0 : 2,
    rows: [makeRow(data)], plans: null, diagnostics: null,
    excludedByMode: { sameDay: { locations: [], collaborators: [], doctors: [] }, spread: { locations: [], collaborators: [], doctors: [] } },
    confirmed: null, trainingPicks: {}, requestedTraining: {}, requestedOvertime: {},
  };
}
/* Janela concreta de um rascunho de visita: sai do baseline + offset, e é
 * aparada pelo prazo do estudo quando ele existe — o assistente não deve
 * sugerir um dia que já está fora do que foi combinado com o cliente. */
function draftWindow(draft, baselineDate, study) {
  return timepointWindow({ offsetDays: draft.offsetDays, toleranceDays: draft.toleranceDays }, baselineDate, study);
}
// Estados de uma solicitação de hora extra: pendente (aguardando a pessoa
// responder) -> disponivel (topou, aguardando aprovação do gestor) | recusado
// (não pode); disponivel -> confirmado (gestor aprovou de vez — só aqui a
// reserva pode ser criada) | dispensado (gestor não vai precisar apesar do
// aceite). Dois passos de propósito: a pessoa só diz que PODE, quem decide se
// VAI USAR é sempre o gestor.
const OVERTIME_STATUS_META = {
  pendente: { label: "Aguardando resposta", tone: "gold" },
  disponivel: { label: "Aguardando sua aprovação", tone: "gold" },
  confirmado: { label: "Aprovada", tone: "accent" },
  recusado: { label: "Recusada", tone: "danger" },
  dispensado: { label: "Dispensada", tone: "neutral" },
};

/* ---------------------------------------------------------------------- */
/* PlanItemRow / PlanCard — uma linha do plano sugerido e o card que junta  */
/* todas. IMPORTANTE: os dois são componentes de topo de propósito. Quando  */
/* estavam declarados dentro do TimepointPlanner, cada render do pai criava */
/* uma função nova, e o React trata função nova como TIPO novo de           */
/* componente — ou seja, desmontava e remontava tudo em vez de só           */
/* re-renderizar. Como o App relê os dados a cada 5s, o SearchPick de       */
/* "quem deve ser treinado?" era destruído sozinho no meio da digitação     */
/* (perdia foco e o que já tinha sido digitado), sem ninguém encostar nele. */
/* Tudo que antes vinha por closure agora entra como prop explícita.        */
/* ---------------------------------------------------------------------- */

/* Escolhas e pedidos de treinamento de uma linha são LISTAS: uma atividade
 * de 3 pessoas com 1 qualificada precisa de 2 treinamentos. Rascunho antigo
 * (e o salvo no meio de uma sessão) guardava um id solto — `pickList`
 * normaliza os dois formatos pra ninguém ter que migrar nada. */
const pickList = (v) => (Array.isArray(v) ? v : v ? [v] : []);
/* Quantas pessoas faltam de fato na linha. `staffFound` pode vir undefined em
 * plano antigo; nesse caso "falta equipe" significa pelo menos uma. */
function trainingsNeededFor(it) {
  if (!it?.collaboratorMissing) return 0;
  const precisa = Math.max(1, it.staffNeeded || 1);
  const tem = Math.max(0, it.staffFound ?? (it.collaborators || []).length);
  return Math.max(1, precisa - tem);
}

function PlanItemRow({ it, draft, data, overtimeRequests, canSolicitarHoraExtra, onSetTrainingPick, onRequestTraining, onRequestOvertime }) {
  const activity = data.activities.find((a) => a.id === it.row.activityId);
  const times = activityTimes(activity);
  const team = it.collaborators || (it.collaborator ? [it.collaborator] : []);
  const key = `${it.rowId}-${it.date}`;
  // Quantas pessoas ainda faltam nessa linha. Uma atividade de 3 pessoas com 1
  // qualificada precisa de DOIS treinamentos, não de um — pedir só um deixaria
  // a reserva em "pendente_equipe" mesmo depois da aula acontecer.
  const faltam = trainingsNeededFor(it);
  const escolhidos = pickList(draft.trainingPicks[key]);
  const pedidos = pickList(draft.requestedTraining[key]);
  // Quem já está escalado nessa linha não precisa de treinamento pra ela.
  // (Os já escolhidos, o MultiSearchPick tira sozinho.)
  const jaEscalado = new Set((it.collaborators || []).map((c) => c.id));
  const candidates = data.collaborators.filter((c) => c.active && !jaEscalado.has(c.id));
  const otReqId = draft.requestedOvertime[key];
  const otReq = otReqId ? overtimeRequests.find((r) => r.id === otReqId) : null;

  return (
    <div style={{ background: T.bg, border: `1px solid ${it.groupSize > 1 ? T.accent : T.line}` }} className="rounded-lg p-2.5 space-y-1.5">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <div className="text-xs font-medium flex items-center gap-1.5">
          {activity?.name || "Atividade"}
          {/* Atividades simultâneas dividem sala e horário: sem essa marca, o
              plano pareceria ter duas etapas com o mesmo horário por engano. */}
          {it.groupSize > 1 && <Chip tone="accent">{it.groupIndex === 0 ? `mesma sala, ao mesmo tempo (${it.groupSize} atividades)` : "em paralelo"}</Chip>}
        </div>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", color: T.accentDark }} className="text-xs">{weekdayLabel(it.date)} · {it.start}–{it.end}</div>
      </div>
      {/* Preparo/desmontagem/folga ficam explícitos: o horário que aparece é o da
          execução, mas o recurso fica preso por mais tempo que isso. */}
      {(times.setup > 0 || times.teardown > 0 || times.gap > 0 || (it.row.participants > 0)) && (
        <div className="text-[10px] flex items-center gap-2 flex-wrap" style={{ color: T.inkMuted }}>
          {(times.setup > 0 || times.teardown > 0) && (
            <span><Timer size={10} className="inline -mt-0.5 mr-0.5" />ocupa {it.blockStart}–{it.blockEnd}
              {times.setup > 0 && ` (${times.setup}min de preparo`}{times.setup > 0 && times.teardown > 0 && " + "}
              {times.teardown > 0 && `${times.setup > 0 ? "" : "("}${times.teardown}min de desmontagem`}
              {(times.setup > 0 || times.teardown > 0) && ")"}
            </span>
          )}
          {times.gap > 0 && <span>· folga de {times.gap}min até a próxima</span>}
          {it.row.participants > 0 && <span>· {it.row.participants} participante(s)</span>}
        </div>
      )}
      {/* Troca de patrimônio precisa ficar explícita: quem pediu um aparelho
          específico tem que saber que vai usar outro. */}
      {it.equipmentSwapped && (
        <div className="text-[10px] rounded-md px-2 py-1" style={{ background: T.goldSoft, color: T.gold }}>
          <Package size={10} className="inline -mt-0.5 mr-1" />
          Substituído automaticamente: vai usar <strong>{it.equipmentSwapped.name}</strong> —
          o pedido original ({data.equipment.find((e) => e.id === it.row.equipmentId)?.name}) não estava livre.
        </div>
      )}
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
        <ResourceCard icon={Building2} label="Local" name={it.location?.name || "—"} tag={it.location?.capacity ? `cap. ${it.location.capacity}` : ""} />
        <ResourceCard icon={Users} label={team.length > 1 ? `Equipe (${team.length})` : "Colaborador"}
          name={team.length ? team.map((c) => c.name).join(", ") : (it.collaboratorMissing ? "Falta equipe" : "—")}
          tag={team.length === 1 ? `nível ${team[0].levels?.[it.row.activityId] ?? "?"}` : (it.staffNeeded > 1 ? `precisa de ${it.staffNeeded}` : "")} />
        {it.row.needDoctor && <ResourceCard icon={Stethoscope} label="Médico" name={it.doctor?.name || "—"} tag="" />}
        {/* Mostra a unidade que o motor REALMENTE escolheu, não a que foi
            pedida — a busca é por tipo e pode trocar de patrimônio. Antes a
            tela dizia "MPA A-EM-169" e a reserva gravava "A-EM-177". */}
        {it.row.equipmentId && <ResourceCard icon={Package} label="Equipamento"
          name={(it.equipment || data.equipment.find((e) => e.id === it.row.equipmentId))?.name}
          tag={(it.row.accessoryIds || []).length ? `+ ${it.row.accessoryIds.length} acessório(s)` : ""} />}
      </div>
      {activity?.supplyUsage?.length > 0 && (
        <div className="text-[10px] flex items-center gap-1" style={{ color: T.inkMuted }}>
          <Boxes size={11} />Consome do estoque ao confirmar: {activity.supplyUsage.map((u) => {
            const s = data.supplies?.find((x) => x.id === u.supplyId);
            return s ? `${u.qty} ${s.unit} de ${s.name}` : null;
          }).filter(Boolean).join(", ")}
        </div>
      )}
      {it.rejected?.length > 0 && (
        <div className="text-[10px] flex items-start gap-1" style={{ color: T.inkMuted }}>
          <Info size={11} className="mt-0.5 shrink-0" />
          <span>Também considerado: {it.rejected.map((r) => `${r.name} (${r.reason})`).join("; ")}</span>
        </div>
      )}
      {it.collaboratorMissing && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-md p-2 space-y-1.5">
          <div className="text-[11px]" style={{ color: T.warn }}><AlertTriangle size={11} className="inline -mt-0.5 mr-1" />
            {it.staffNeeded > 1
              ? <>Essa atividade precisa de <strong>{it.staffNeeded} pessoas</strong> com nível mínimo <Stars level={it.row.minLevel} /> e {it.staffFound || 0} está disponível — local e horário reservados, mas <strong>faltam {faltam}</strong>.</>
              : <>Nenhum colaborador treinado nessa atividade (nível mínimo <Stars level={it.row.minLevel} />) — local e horário reservados, mas falta gente qualificada.</>}
          </div>
          {/* Um pedido por pessoa que falta. Enquanto não fecha a conta, o
              seletor continua na tela mostrando quantos ainda faltam. */}
          {pedidos.length > 0 && (
            <div className="flex items-center gap-1 flex-wrap">
              <Chip tone="accent">{pedidos.length === 1 ? "1 treinamento solicitado" : `${pedidos.length} treinamentos solicitados`}</Chip>
              {pedidos.length < faltam && <span className="text-[10px]" style={{ color: T.warn }}>ainda faltam {faltam - pedidos.length}</span>}
            </div>
          )}
          {pedidos.length < faltam && (
            <div className="flex items-start gap-1.5 flex-wrap">
              <div className="w-56">
                <MultiSearchPick options={candidates} values={escolhidos} onChange={(v) => onSetTrainingPick(key, v)}
                  placeholder={faltam - pedidos.length > 1 ? `Quem treinar? (faltam ${faltam - pedidos.length})` : "Quem deve ser treinado?"} />
              </div>
              <Btn small variant="subtle" icon={GraduationCap} disabled={escolhidos.length === 0} onClick={() => onRequestTraining(it)}>
                {escolhidos.length > 1 ? `Solicitar ${escolhidos.length} treinamentos` : "Solicitar treinamento"}
              </Btn>
            </div>
          )}
        </div>
      )}
      {it.overtimeNeeded && (() => {
        const isDoctor = !!it.overtimeNeeded.doctorId;
        const person = isDoctor ? data.doctors.find((d) => d.id === it.overtimeNeeded.doctorId) : data.collaborators.find((c) => c.id === it.overtimeNeeded.collaboratorId);
        return (
          <div style={{ background: T.dangerSoft, border: `1px solid ${T.danger}` }} className="rounded-md p-2 space-y-1.5">
            <div className="text-[11px]" style={{ color: T.danger }}>
              <Timer size={11} className="inline -mt-0.5 mr-1" />
              Só fecha fora do horário normal de <strong>{person?.name || "—"}</strong> ({isDoctor ? "médico" : "colaborador"}) — sugestão de emergência, precisa de hora extra.
            </div>
            {otReq ? (
              <div className="flex items-center gap-1.5">
                <Chip tone={OVERTIME_STATUS_META[otReq.status]?.tone || "neutral"}>{OVERTIME_STATUS_META[otReq.status]?.label || otReq.status}</Chip>
                {otReq.status !== "confirmado" && <span className="text-[10px]" style={{ color: T.inkMuted }}>acompanhe em Horas Extras</span>}
              </div>
            ) : (
              canSolicitarHoraExtra ? (
                <Btn small variant="subtle" icon={Timer} onClick={() => onRequestOvertime(it)}>Solicitar hora extra</Btn>
              ) : (
                <div className="text-[10px]" style={{ color: T.inkMuted }}>Só gestor pode solicitar hora extra.</div>
              )
            )}
          </div>
        );
      })()}
    </div>
  );
}
function PlanCard({ mode, label, plan, draft, data, overtimeRequests, canSolicitarHoraExtra, onSetTrainingPick, onRequestTraining, onRequestOvertime, onRegenerate, onConfirm, ehEstimativa }) {
  if (!plan) return null;
  // A reserva só pode ser criada quando toda linha com overtimeNeeded já tem um
  // pedido de hora extra "confirmado" (os 2 passos completos: pessoa aceitou +
  // gestor aprovou) — sem isso, "Confirmar este timepoint" ficaria assumindo uma
  // pessoa que nunca disse sim.
  const blockingItems = plan.items.filter((it) => {
    if (!it.overtimeNeeded) return false;
    const reqId = draft.requestedOvertime[`${it.rowId}-${it.date}`];
    const req = reqId ? overtimeRequests.find((r) => r.id === reqId) : null;
    return !req || req.status !== "confirmado";
  });
  // Plano pode ficar sem equipe (serve pra enxergar o que falta); RESERVA
  // confirmada, não. Se não há ninguém qualificado, é preciso pelo menos ter
  // pedido o treinamento — assim fica registrado como aquilo vai ser resolvido
  // até a data, em vez de virar uma reserva "confirmada" sem quem execute.
  // A conta é por PESSOA que falta: uma atividade de 3 com 1 qualificada não
  // fica resolvida com um pedido só.
  const semEquipe = plan.items.filter((it) => pickList(draft.requestedTraining[`${it.rowId}-${it.date}`]).length < trainingsNeededFor(it));
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-3">
      <div className="flex items-center justify-between">
        <div style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold flex items-center gap-1.5">
          {mode === "sameDay" ? <CalendarClock size={14} /> : <CalendarRange size={14} />} {label}
        </div>
        <div className="flex items-center gap-1.5">
          {plan.alternativesConsidered > 1 && <Chip tone="gold">melhor de {plan.alternativesConsidered} opções comparadas</Chip>}
          <Chip tone="accent">{new Set(plan.items.map((it) => it.date)).size} dia(s)</Chip>
        </div>
      </div>
      {/* O que falta, em uma linha, antes dos detalhes. Ler três cards
          inteiros pra descobrir por que o botão está travado era o pior
          momento dessa tela. */}
      <div className="text-[11px] flex items-center gap-1.5" style={{ color: (blockingItems.length || (!ehEstimativa && semEquipe.length)) ? T.warn : T.accentDark }}>
        {(blockingItems.length || (!ehEstimativa && semEquipe.length))
          ? <><AlertTriangle size={12} />Falta resolver: {[
              !ehEstimativa && semEquipe.length ? `equipe em ${semEquipe.length} atividade(s)` : null,
              blockingItems.length ? `hora extra em ${blockingItems.length}` : null,
            ].filter(Boolean).join(" e ")} — os avisos estão nos cards abaixo.</>
          : ehEstimativa && semEquipe.length
            ? <><Info size={12} />{semEquipe.length} atividade(s) sem gente qualificada hoje — pra orçar tudo bem, mas será cobrado na conversão.</>
            : <><Check size={12} />Tudo resolvido: dá pra confirmar.</>}
      </div>

      <div className="space-y-2">
        {plan.items.map((it) => (
          <PlanItemRow key={it.rowId} it={it} draft={draft} data={data} overtimeRequests={overtimeRequests}
            canSolicitarHoraExtra={canSolicitarHoraExtra} onSetTrainingPick={onSetTrainingPick}
            onRequestTraining={onRequestTraining} onRequestOvertime={onRequestOvertime} />
        ))}
      </div>
      {blockingItems.length > 0 && (
        <div className="text-[11px] flex items-center gap-1.5" style={{ color: T.danger }}>
          <Lock size={11} /> Falta aprovar {blockingItems.length} hora(s) extra(s) desse plano antes de confirmar.
        </div>
      )}
      {semEquipe.length > 0 && !ehEstimativa && (
        <div className="text-[11px] flex items-start gap-1.5" style={{ color: T.danger }}>
          <Lock size={11} className="mt-0.5 shrink-0" />
          <span>
            {semEquipe.length} atividade(s) sem colaborador qualificado. Peça o treinamento acima
            (o pedido já basta pra confirmar) ou tire a atividade do plano — reserva confirmada não pode ficar sem quem execute.
          </span>
        </div>
      )}
      <div className="flex gap-2 pt-1">
        {/* Estimativa não exige equipe completa: ela é previsão, e a conversão
            revalida tudo de novo. Exigir treinamento pedido pra montar um
            orçamento travaria justamente o caso que a estimativa existe pra
            responder — "se este estudo entrar, o que vamos precisar?". */}
        <Btn icon={Check} disabled={blockingItems.length > 0 || (!ehEstimativa && semEquipe.length > 0)} onClick={() => onConfirm(mode)}>
          {ehEstimativa ? "Incluir na estimativa" : "Confirmar esta visita"}
        </Btn>
        <Btn icon={RefreshCw} variant="ghost" onClick={() => onRegenerate(mode)}>Sugerir outra alternativa</Btn>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Um timepoint = uma "visita"/coleta do estudo: janela de datas própria,   */
/* atividades próprias, cronograma gerado e confirmado de forma isolada.   */
/* ---------------------------------------------------------------------- */
function TimepointPlanner({ draft, data, bookings, onChange, onRemove, canRemove, onConfirm, onCreateTrainingRequest, studyNameHint, canSolicitarHoraExtra, onCreateOvertimeRequest, overtimeRequests, actorName, baselineDate, study, ehEstimativa }) {
  const mainEquipment = data.equipment.filter((e) => !e.isAccessory);
  // A janela em datas nunca é digitada: sempre sai do baseline do estudo mais o
  // deslocamento e a tolerância desta visita — aparada pelo prazo combinado.
  const win = draftWindow(draft, baselineDate, study);
  const janelaPura = draftWindow(draft, baselineDate);
  const dateMin = win.dateMin, dateMax = win.dateMax;

  const criteriaRows = useMemo(() => draft.rows.map((r) => ({
    ...r, minLevel: data.activities.find((a) => a.id === r.activityId)?.minLevel ?? 0,
  })), [draft.rows, data.activities]);

  const addRow = () => onChange({ rows: [...draft.rows, makeRow(data)] });
  const removeRow = (rowId) => onChange({ rows: draft.rows.length > 1 ? draft.rows.filter((r) => r.rowId !== rowId) : draft.rows });
  const updateRow = (rowId, patch) => onChange({ rows: draft.rows.map((r) => (r.rowId === rowId ? { ...r, ...patch } : r)) });
  const setRowActivity = (rowId, activityId) => {
    const act = data.activities.find((a) => a.id === activityId);
    updateRow(rowId, { activityId, durationMin: act?.durationMin ?? 60, roomId: null });
  };
  const setRowEquipment = (rowId, equipmentId) => updateRow(rowId, { equipmentId, accessoryIds: [] });
  const toggleRowAccessory = (rowId, accId) => onChange({
    rows: draft.rows.map((r) => {
      if (r.rowId !== rowId) return r;
      const on = (r.accessoryIds || []).includes(accId);
      return { ...r, accessoryIds: on ? r.accessoryIds.filter((x) => x !== accId) : [...(r.accessoryIds || []), accId] };
    }),
  });

  const generatePlans = () => {
    const freshExcl = { locations: [], collaborators: [], doctors: [] };
    const sameDay = planSameDay({ dateMin: dateMin, dateMax: dateMax, rows: criteriaRows }, data, bookings, freshExcl);
    const spread = planSpread({ dateMin: dateMin, dateMax: dateMax, rows: criteriaRows }, data, bookings, freshExcl);
    onChange({
      plans: { sameDay, spread },
      excludedByMode: { sameDay: freshExcl, spread: freshExcl },
      diagnostics: (!sameDay && !spread) ? diagnoseRows(criteriaRows, dateMin, dateMax, data, bookings) : null,
    });
  };

  const regenerate = (mode) => {
    if (!draft.plans?.[mode]) return;
    const newExcl = mergeExcluded(draft.excludedByMode[mode], excludedFromPlan(draft.plans[mode]));
    const fn = mode === "sameDay" ? planSameDay : planSpread;
    const next = fn({ dateMin: dateMin, dateMax: dateMax, rows: criteriaRows }, data, bookings, newExcl);
    onChange({ plans: { ...draft.plans, [mode]: next }, excludedByMode: { ...draft.excludedByMode, [mode]: newExcl } });
  };

  const setTrainingPick = (key, ids) => onChange({ trainingPicks: { ...draft.trainingPicks, [key]: pickList(ids) } });
  /* Uma solicitação POR PESSOA que falta. Uma atividade de 3 pessoas com 1
   * qualificada precisa de 2 treinamentos: pedindo só um, a aula acontece, o
   * nível sobe, e a reserva continua em "pendente_equipe" porque ainda falta
   * a segunda. Os pedidos vão numa gravação só — meio pedido gravado seria
   * pior que nenhum. */
  const requestTraining = async (item) => {
    const key = `${item.rowId}-${item.date}`;
    const escolhidos = pickList(draft.trainingPicks[key]);
    if (!escolhidos.length) return;
    const activity = data.activities.find((a) => a.id === item.row.activityId);
    const agora = new Date().toISOString();
    /* Se existe um TIPO cadastrado pra essa atividade, o pedido já nasce com
     * sala, aparelho, duração e instrutor dele — é pra isso que o tipo existe.
     * Sem tipo, o pedido sai como sempre saiu. A equipe de treinamento pode
     * mudar tudo depois: o tipo é ponto de partida, não amarra. */
    const tipo = (data.trainingTypes || []).find((t) => t.active !== false && t.activityId === item.row.activityId) || null;
    const doTipo = tipo ? trainingRequestFromType(tipo, { requiredLevel: item.row.minLevel }) : {};
    const novos = escolhidos.map((collaboratorId) => ({
      id: genId("train"), studyName: studyNameHint || "Estudo sem nome", activityId: item.row.activityId,
      activityName: activity?.name || "—", collaboratorId,
      collaboratorName: data.collaborators.find((c) => c.id === collaboratorId)?.name || "—",
      requiredLevel: item.row.minLevel, deadlineDate: dateMin, status: "pendente",
      scheduledDate: null, scheduledStart: null, requestedAt: agora, confirmedBy: null,
      ...doTipo,
    }));
    // Só marca como pedido depois de gravar — senão a linha some do plano e a
    // solicitação nunca existiu.
    const ok = await onCreateTrainingRequest(novos);
    if (ok === false) return;
    // Guarda os IDs (não só "true"): são eles que ligam os pedidos à reserva
    // criada na confirmação, pra que concluir cada treinamento vá preenchendo
    // a equipe que estava faltando.
    onChange({
      trainingPicks: { ...draft.trainingPicks, [key]: [] },
      requestedTraining: {
        ...draft.requestedTraining,
        [key]: [...pickList(draft.requestedTraining[key]), ...novos.map((r) => r.id)],
      },
    });
  };

  // Hora extra detectada pelo motor: só aparece quando o único motivo do horário não
  // fechar dentro da disponibilidade normal é o colaborador/médico (suggestCombo já
  // garantiu isso via opts.allowStaffOvertime) — sala/equipamento/estoque continuam
  // valendo normalmente. O pedido só vira reserva depois dos 2 passos: a pessoa
  // aceita (respondOvertimeRequest, em App) e DEPOIS o gestor aprova
  // (approveOvertimeRequest) — ver o bloqueio do "Confirmar este timepoint" abaixo.
  // O pedido avulso, fora de um plano, é o "encaixe" do Cronograma (ver EncaixeForm).
  const requestOvertime = async (item) => {
    const key = `${item.rowId}-${item.date}`;
    const activity = data.activities.find((a) => a.id === item.row.activityId);
    const isDoctor = !!item.overtimeNeeded?.doctorId;
    const personId = isDoctor ? item.overtimeNeeded.doctorId : item.overtimeNeeded?.collaboratorId;
    const person = isDoctor ? data.doctors.find((d) => d.id === personId) : data.collaborators.find((c) => c.id === personId);
    const req = {
      id: genId("ovt"), origin: "plano", studyId: null, studyName: studyNameHint || "Estudo sem nome",
      activityId: item.row.activityId, activityName: activity?.name || "—",
      date: item.date, start: item.start, end: item.end, locationId: item.location?.id || null, locationName: item.location?.name || "—",
      role: isDoctor ? "doctor" : "collaborator", personId, personName: person?.name || "—",
      requestedBy: actorName || "usuário sem identificação", requestedAt: new Date().toISOString(),
      status: "pendente", decidedAt: null, decidedBy: null, approvedAt: null, approvedBy: null, bookingId: null,
    };
    const ok = await onCreateOvertimeRequest(req);
    if (ok === false) return;
    onChange({ requestedOvertime: { ...draft.requestedOvertime, [key]: req.id } });
  };

  if (draft.confirmed) {
    const ehEstimativa = draft.confirmed.estimativa;
    return (
      <div style={{ background: ehEstimativa ? T.goldSoft : T.accentSoft, border: `1px solid ${ehEstimativa ? T.gold : T.accent}` }} className="rounded-xl p-4">
        <div className="flex items-center gap-2 text-sm font-medium" style={{ color: ehEstimativa ? T.gold : T.accentDark }}>
          <Check size={16} />
          {ehEstimativa
            ? <>{draft.label} incluída na estimativa — {draft.confirmed.items.length} ocupação(ões) prevista(s)</>
            : <>{draft.label} agendado — {draft.confirmed.items.length} reserva(s) criada(s)</>}
        </div>
        <div className="text-xs mt-1" style={{ color: T.inkMuted }}>
          {ehEstimativa
            ? "Acompanhe em \"Estimativas\", onde dá pra segurar recursos, prorrogar, cancelar ou converter em estudo oficial."
            : "Use \"Estudos\" ou \"Cronograma\" pra acompanhar. Volte aqui pra adicionar outra visita quando quiser."}
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-3">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <input value={draft.label} onChange={(e) => onChange({ label: e.target.value })}
          className="text-sm font-semibold px-2 py-1 rounded-lg outline-none" style={{ border: `1px solid ${T.line}`, fontFamily: "'Space Grotesk', sans-serif" }} />
        {canRemove && <button onClick={onRemove} style={{ color: T.danger }}><Trash2 size={14} /></button>}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 space-y-3">
          <div className="text-xs font-semibold flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
            <span style={{ background: T.accent, color: "#fff" }} className="w-4 h-4 rounded-full text-[10px] flex items-center justify-center">2</span>
            O que precisa acontecer nessa visita
          </div>
          <div className="grid grid-cols-2 gap-2">
            <label className="block text-xs font-medium" style={{ color: T.inkMuted }}>Quantos dias depois do D0
              <input type="number" min="0" value={draft.offsetDays} onChange={(e) => onChange({ offsetDays: Math.max(0, Number(e.target.value) || 0) })}
                className="mt-1 w-full text-sm px-2 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
              <span className="block text-[10px] font-normal mt-0.5">0 = é o próprio D0</span>
            </label>
            <label className="block text-xs font-medium" style={{ color: T.inkMuted }}>Pode variar (± dias)
              <input type="number" min="0" value={draft.toleranceDays} onChange={(e) => onChange({ toleranceDays: Math.max(0, Number(e.target.value) || 0) })}
                className="mt-1 w-full text-sm px-2 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
              <span className="block text-[10px] font-normal mt-0.5">folga que o protocolo aceita</span>
            </label>
          </div>
          {/* A janela em DATAS é o que a pessoa precisa ler; "D7±2" é o jargão
              do protocolo e fica como legenda, não como informação principal. */}
          <div className="rounded-lg px-2.5 py-2" style={{ background: T.accentSoft }}>
            <div className="text-[10px] uppercase tracking-wide" style={{ color: T.accentDark }}>Esta visita acontece entre</div>
            <div className="text-sm font-semibold" style={{ fontFamily: "'JetBrains Mono', monospace", color: T.accentDark }}>
              {!win.fits
                ? "não cabe no prazo do estudo"
                : dateMin === dateMax ? weekdayLabel(dateMin) : `${weekdayLabel(dateMin)} a ${weekdayLabel(dateMax)}`}
            </div>
            <div className="text-[10px] mt-0.5" style={{ color: T.inkMuted }}>
              D{draft.offsetDays}{draft.toleranceDays ? `±${draft.toleranceDays}` : ""} contando do D0 em {weekdayLabel(baselineDate)}.
              Mudar o D0 no protocolo reposiciona todas as visitas de uma vez.
            </div>
