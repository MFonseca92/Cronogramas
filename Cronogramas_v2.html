/* NÍVEL DE COMPROMISSO DE UMA RESERVA                                      */
/*                                                                          */
/* O sistema tem três coisas diferentes ocupando a mesma agenda, e a         */
/* diferença entre elas é o quanto o compromisso vale:                       */
/*                                                                          */
/*   reservation  estudo confirmado. Sempre bloqueia. É o mais forte.        */
/*   training     aula agendada. Sempre bloqueia — a pessoa está lá.         */
/*   estimate     oportunidade ainda não aprovada. Só bloqueia se alguém     */
/*                decidiu segurar o recurso E o prazo ainda está de pé.      */
/*                                                                          */
/* PREVISÃO ≠ PRÉ-RESERVA ≠ RESERVA CONFIRMADA. A previsão entra em custo,   */
/* capacidade e estoque previsto, mas não tira o horário de ninguém.         */
/*                                                                          */
/* Compatibilidade: reserva gravada antes disso não tem `bookingType`. Sem o */
/* campo ela é RESERVA, e a aula continua sendo reconhecida pelo `kind` que  */
/* já existia — nenhuma migração de dados é necessária.                      */
/* ---------------------------------------------------------------------- */
const BOOKING_TYPE_META = {
  reservation: { label: "Reserva", short: "Reserva confirmada", icon: "✓" },
  estimate: { label: "Estimativa", short: "Estimativa", icon: "◇" },
  training: { label: "Treinamento", short: "Treinamento", icon: "🎓" },
};
function bookingTypeOf(b) {
  if (b?.bookingType) return b.bookingType;
  return b?.kind === "treinamento" ? "training" : "reservation";
}
const isEstimateBooking = (b) => bookingTypeOf(b) === "estimate";

/* Instante de referência das checagens de prazo, no calendário local. Usa o
 * mesmo formato das datas gravadas (YYYY-MM-DD / YYYY-MM-DDTHH:MM) pra que a
 * comparação seja de string, sem `Date` no meio — foi assim que o bug de
 * fuso do `toISOString` apareceu antes. */
const nowStamp = () => `${todayStr()}T${nowHHMM()}`;
/* Um prazo pode vir só com a data ("segurar até 18/08" vale o dia 18 inteiro)
 * ou com hora ("até 18/08 14:00"). Sem prazo, a pré-reserva não vale — é a
 * regra de integridade: pré-reserva ativa exige `holdUntil`. */
function holdExpired(holdUntil, agora) {
  if (!holdUntil) return true;
  const lim = String(holdUntil);
  const ref = agora || nowStamp();
  return lim.length <= 10 ? lim < ref.slice(0, 10) : lim < ref;
}
/* A pergunta que o motor faz: essa reserva tira o horário de alguém? */
function bookingOccupies(b, agora) {
  if (!isEstimateBooking(b)) return true;
  if (!b.holdsResources) return false;
  return !holdExpired(b.holdUntil, agora);
}

function bookingMatchesResource(b, field, id) {
  if (field === "location") return b.locationId === id;
  if (field === "collaborator") return (b.collaboratorIds || []).includes(id);
  if (field === "doctor") return b.doctorId === id;
  if (field === "equipment") return b.equipmentId === id || (b.accessoryIds || []).includes(id);
  return false;
}
// A reserva já guarda blockStart/blockEnd (execução + preparo + desmontagem) —
// é contra ESSA janela que o conflito é medido. Reserva antiga, criada antes dos
// tempos de preparo existirem, não tem os campos e cai no start/end de sempre.
const bookingBlock = (b) => ({ s: toMin(b.blockStart || b.start), e: toMin(b.blockEnd || b.end) });
function fieldFree(id, field, dateStr, start, end, bookings, excludeId) {
  const s = toMin(start), e = toMin(end);
  return !bookings.some((b) => {
    if (excludeId && b.id === excludeId) return false;
    if (b.date !== dateStr) return false;
    // Estimativa que não segura recurso (ou cujo prazo venceu) aparece na
    // agenda como previsão, mas não impede ninguém de marcar em cima.
    if (!bookingOccupies(b)) return false;
    if (!bookingMatchesResource(b, field, id)) return false;
    const blk = bookingBlock(b);
    return overlaps(s, e, blk.s, blk.e);
  });
}
// Quantos dos próximos `days` dias (a partir de `fromDate`) esse local não tem
// nenhuma reserva — usado como "vagas disponíveis" na semana/mês no Cadastro.
function freeDaysCount(locationId, bookings, fromDate, days) {
  let free = 0;
  for (let i = 0; i < days; i++) {
    const d = addDays(fromDate, i);
    if (!bookings.some((b) => b.locationId === locationId && b.date === d)) free++;
  }
  return free;
}
function loadOf(id, field, bookings, aroundDate) {
  return bookings.filter((b) => {
    // Previsão não conta como carga de trabalho: ninguém está ocupado por um
    // estudo que talvez nem aconteça.
    if (!bookingOccupies(b)) return false;
    if (!bookingMatchesResource(b, field, id)) return false;
    if (!aroundDate) return true;
    return Math.abs((new Date(b.date) - new Date(aroundDate)) / 86400000) <= 10;
  }).length;
}
function equipAccessoryOptions(equipmentId, equipmentList) {
  const eq = equipmentList.find((e) => e.id === equipmentId);
  if (!eq || !eq.accessoryIds) return [];
  return eq.accessoryIds.map((id) => equipmentList.find((e) => e.id === id)).filter(Boolean);
}
function equipCombinationFree(equipmentId, accessoryIds, dateStr, start, end, bookings, excludeId) {
  const mySet = [equipmentId, ...(accessoryIds || [])].filter(Boolean);
  const s = toMin(start), e = toMin(end);
  return !bookings.some((b) => {
    if (excludeId && b.id === excludeId) return false;
    if (b.date !== dateStr) return false;
    if (!bookingOccupies(b)) return false;
    const otherSet = [b.equipmentId, ...(b.accessoryIds || [])].filter(Boolean);
    if (!mySet.some((id) => otherSet.includes(id))) return false;
    const blk = bookingBlock(b);
    return overlaps(s, e, blk.s, blk.e);
  });
}
// Capacidade de participantes: a sala tem um limite e a atividade pode ter outro
// (ex.: método que só dá pra fazer em 4 pessoas por vez). Vale o menor dos dois.
function participantLimit(location, activity) {
  const lims = [location?.capacity, activity?.maxParticipants].filter((n) => typeof n === "number" && n > 0);
  return lims.length ? Math.min(...lims) : null;
}

/* ---------------------------------------------------------------------- */
/* Janela do dia e busca de horário                                        */
/*                                                                         */
/* O sistema não tem mais nenhum horário fixo escrito no código (o antigo   */
/* "começa 08:00, no máximo até 20:00"). O dia útil de cada agendamento sai */
/* dos horários REALMENTE cadastrados nos recursos que aquela atividade     */
/* pode usar: sala, equipamento, colaborador e médico. Se a sala abre 07:00 */
/* e o colaborador vai até 22:00, a busca varre 07:00–22:00 e deixa o       */
/* suggestCombo reprovar o que não couber em cada recurso individualmente.  */
/* ---------------------------------------------------------------------- */
const SLOT_STEP_MIN = 15; // granularidade da busca automática de horário
const minToHHMM = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

// União das janelas de funcionamento de uma lista de recursos num dia. Recurso
// que não abre nesse dia simplesmente não entra. Devolve null se nenhum abre.
function unionDayWindow(resources, dateStr) {
  let startMin = null, endMin = null;
  (resources || []).forEach((r) => {
    if (!r || r.active === false) return;
    const w = dayWindow(r, dateStr);
    if (!w) return;
    startMin = startMin == null ? w.startMin : Math.min(startMin, w.startMin);
    endMin = endMin == null ? w.endMin : Math.max(endMin, w.endMin);
  });
  return startMin == null ? null : { startMin, endMin };
}

// Quais recursos podem atender essa linha do plano — é a partir DELES que sai a
// janela do dia. Filtra pelo que a linha já fixou (sala escolhida, equipamento
// escolhido) e pelas salas permitidas no método.
function rowResourcePool(criteria, data) {
  const activity = criteria.activityId ? data.activities.find((a) => a.id === criteria.activityId) : null;
  const allowedRoomIds = activity?.locationIds?.length ? activity.locationIds : null;
  const locations = data.locations.filter((l) => l.active !== false
    && (!criteria.locationId || l.id === criteria.locationId)
    && (!allowedRoomIds || allowedRoomIds.includes(l.id)));
  const equipment = criteria.equipmentId ? typeCandidates(criteria.equipmentId, data.equipment) : [];
  const collaborators = criteria.activityId
    ? data.collaborators.filter((c) => c.active !== false && (c.levels?.[criteria.activityId] || 0) >= (criteria.minLevel || 0))
    : [];
  const doctors = criteria.needDoctor ? data.doctors.filter((d) => d.active !== false) : [];
  return { activity, locations, equipment, collaborators, doctors };
}

// Janela útil do dia pra essa linha: precisa de pelo menos uma sala aberta E
// (se exigir) um colaborador/médico/equipamento disponível. A interseção seria
// restritiva demais (bastaria uma pessoa de horário curto pra estreitar tudo),
// então usa-se a união por categoria e a interseção ENTRE categorias.
function dayBoundsForRow(criteria, data, dateStr) {
  const pool = rowResourcePool(criteria, data);
  const parts = [unionDayWindow(pool.locations, dateStr)];
  if (pool.equipment.length) parts.push(unionDayWindow(pool.equipment, dateStr));
  if (pool.collaborators.length) parts.push(unionDayWindow(pool.collaborators, dateStr));
  if (pool.doctors.length) parts.push(unionDayWindow(pool.doctors, dateStr));
  if (parts.some((p) => !p)) return null; // alguma categoria obrigatória não abre hoje
  const startMin = Math.max(...parts.map((p) => p.startMin));
  const endMin = Math.min(...parts.map((p) => p.endMin));
  return endMin > startMin ? { startMin, endMin } : null;
}

// Procura o primeiro horário viável no dia, de SLOT_STEP_MIN em SLOT_STEP_MIN,
// em vez de tentar um único horário fixo. `notBeforeMin` permite encadear
// atividades no mesmo dia (a próxima não pode começar antes do fim da anterior).
function findSlotOnDay(criteria, dateStr, data, bookings, excluded, opts = {}) {
  const durationMin = criteria.durationMin || 60;
  const activity = criteria.activityId ? data.activities.find((a) => a.id === criteria.activityId) : null;
  const times = activityTimes(activity);
  const bounds = dayBoundsForRow(criteria, data, dateStr);
  if (!bounds) return null;
  // O preparo acontece ANTES do início e a desmontagem DEPOIS do fim — os dois
  // precisam caber dentro da janela, então a execução em si é espremida.
  const firstStart = Math.max(bounds.startMin + times.setup, opts.notBeforeMin ?? 0);
  const lastStart = bounds.endMin - times.teardown - durationMin;
  const step = opts.stepMin || SLOT_STEP_MIN;
  const from = Math.ceil(firstStart / step) * step;
  for (let m = from; m <= lastStart; m += step) {
    const start = minToHHMM(m), end = minToHHMM(m + durationMin);
    const r = suggestCombo({ ...criteria, date: dateStr, start, end }, data, bookings, excluded, opts);
    if (r.success) return { start, end, result: r };
  }
  return null;
}

/* ---------------------------------------------------------------------- */
/* Validação de reserva                                                    */
/*                                                                         */
/* Toda reserva editada à mão volta a passar por aqui antes de ser salva —  */
/* senão dá pra criar conflito de sala, equipamento, colaborador ou médico  */
/* simplesmente digitando outro horário. `excludeId` tira a própria reserva */
/* da checagem (senão ela conflitaria consigo mesma).                       */
/* ---------------------------------------------------------------------- */
function validateBooking(b, data, bookings, excludeId) {
  const errors = [], warnings = [], blockers = [];
  const activity = data.activities.find((a) => a.id === b.activityId);
  const blk = blockedWindow(b.start, b.end, activity);
  const times = activityTimes(activity);

  if (!b.date) errors.push("informe a data");
  if (!b.start || !b.end) errors.push("informe início e fim");
  if (b.start && b.end && toMin(b.end) <= toMin(b.start)) errors.push("o fim precisa ser depois do início");
  // Integridade do vínculo com a estimativa. Uma ocupação de estimativa sem
  // dono não teria como ser liberada nem expirada — viraria um bloqueio órfão
  // que ninguém consegue tirar da agenda.
  if (isEstimateBooking(b)) {
    if (!b.estimateId) errors.push("esta ocupação é de estimativa mas não aponta pra nenhuma estimativa");
    if (b.holdsResources && !b.holdUntil) errors.push("pré-reserva precisa de uma data limite (segurar até)");
  } else if (b.estimateId) {
    errors.push("só ocupação de estimativa pode apontar pra uma estimativa");
  }
  if (errors.length) return { errors, warnings, blockers, blockStart: blk.start, blockEnd: blk.end };

  // Reservas do MESMO grupo simultâneo dividem a sala de propósito (ex.: Apoio
  // + Lavagem de cabelo juntas). Elas saem da checagem de conflito DE SALA —
  // mas continuam valendo pra pessoa, médico e equipamento, que não podem
  // estar em duas atividades ao mesmo tempo nem que seja na mesma sala.
  const groupMates = b.groupId ? bookings.filter((x) => x.groupId === b.groupId && x.id !== b.id).map((x) => x.id) : [];
  const roomBookings = groupMates.length ? bookings.filter((x) => !groupMates.includes(x.id)) : bookings;

  // Referência quebrada é ERRO. Antes `check` só voltava quando não achava o
  // recurso, então uma reserva apontando pra equipamento ou médico que não
  // existe mais passava batido — e o Cadastro permitia excluir de verdade.
  const exigeExistir = (id, achado, label) => {
    if (id && !achado) errors.push(`${label} desta reserva não existe mais no cadastro (id ${id}) — reative ou troque o recurso`);
  };

  // Primeira reserva que ocupa esse recurso na janela — só pra explicar o erro.
  const culpado = (id, field, lista) => lista.find((x) => x.id !== b.id && x.id !== excludeId
    && x.date === b.date && bookingOccupies(x) && bookingMatchesResource(x, field, id)
    && overlaps(toMin(blk.start), toMin(blk.end), bookingBlock(x).s, bookingBlock(x).e));

  const check = (res, label, field) => {
    if (!res) return;
    if (res.active === false) errors.push(`${label} "${res.name}" está inativo`);
    /* Férias, folga, feriado e manutenção são ERRO, não aviso — diferente do
     * "fora do horário", que vira pedido de hora extra. Não existe hora extra
     * pra quem está de férias: a pessoa não está. O encaixe pode furar
     * horário; não pode furar ausência. */
    const au = absenceOn(data.calendar, res.id, b.date, blk.start, blk.end);
    if (au) errors.push(`${label} "${res.name}": ${absenceLabel(au)}`);
    if (!withinAvailability(res, b.date, blk.start, blk.end)) {
      const w = dayWindow(res, b.date);
      warnings.push(w
        ? `${label} "${res.name}" atende das ${w.start} às ${w.end} — a reserva ocupa ${blk.start}–${blk.end}${times.setup || times.teardown ? " (com preparo/desmontagem)" : ""}, precisa de hora extra`
        : `${label} "${res.name}" não atende em ${weekdayLabel(b.date)} — precisa de hora extra`);
    }
    const against = field === "location" ? roomBookings : bookings;
    if (field && !fieldFree(res.id, field, b.date, blk.start, blk.end, against, excludeId)) {
      // Quem bloqueia importa: "ocupado" é uma parede, "segurado pela
      // estimativa X até 20/08" é uma decisão que alguém pode rever. A tela
      // usa `blockers` pra oferecer manter/liberar/remanejar.
      const quem = culpado(res.id, field, against);
      if (quem && isEstimateBooking(quem)) {
        blockers.push({ resource: label, resourceName: res.name, booking: quem });
        errors.push(`${label} "${res.name}" está com pré-reserva da estimativa "${quem.studyName || "sem nome"}" até ${quem.holdUntil || "—"}`);
      } else {
        errors.push(`${label} "${res.name}" já tem outra reserva nesse horário`);
      }
    }
  };

  // Uma aula de treinamento é uma reserva só pra ocupar a agenda da pessoa:
  // não exige sala e, obviamente, não exige que ela já tenha o nível — é
  // justamente o que ela vai aprender. O que vale é o conflito de horário.
  const ehTreinamento = isTrainingBooking(b);

  const loc = data.locations.find((l) => l.id === b.locationId);
  if (!loc) {
    if (b.locationId) errors.push(`a sala desta reserva não existe mais no cadastro (id ${b.locationId}) — reative ou troque a sala`);
    else if (!ehTreinamento) errors.push("escolha uma sala");
  } else {
    check(loc, "a sala", "location");
    const lim = participantLimit(loc, activity);
    if (lim != null && (b.participants || 0) > lim) errors.push(`a sala comporta ${lim} participante(s), a reserva tem ${b.participants}`);
  }
  /* Atividade MESTRE: quem já faz essa atividade no estudo continua fazendo.
   * É bloqueio e não aviso — trocar quem mede no meio do protocolo introduz
   * variação entre medidas que deveriam ser comparáveis, e isso não se
   * conserta depois.
   *
   * Como o técnico agora é DEDUZIDO das reservas do estudo, a regra precisa da
   * lista de reservas — vale aqui a mesma ressalva do bloco do equipamento
   * logo abaixo: quem passar só as reservas de um dia não enxerga a amarra. */
  if (isMasterActivity(activity)) {
    const estudoDaReserva = (data.studies || []).find((st) => st.id === b.studyId) || null;
    technicianProblems(b, estudoDaReserva, activity, undefined, bookings).forEach((m) => errors.push(m));
  }
  /* Continuidade do operador do equipamento. Independe da atividade estar
   * marcada como mestre — ver o bloco `equipmentOperatorFor`.
   *
   * ATENÇÃO ao chamar: esta regra olha o HISTÓRICO do estudo, que atravessa
   * datas. Quem passar aqui só as reservas de um dia (o gerador faz isso, por
   * velocidade) não vai ver a amarra — não é falso negativo silencioso por
   * descuido, é limite conhecido de quem chama. A tela de planejamento passa
   * a lista inteira. */
  if (b.studyId && b.equipmentId) {
    const estudoOp = (data.studies || []).find((st) => st.id === b.studyId) || null;
    equipmentOperatorProblems(b, estudoOp, bookings, data).forEach((m) => errors.push(m));
  }
  {
    // Sala não permitida pro método é ERRO, não aviso: é regra do método, não
    // uma questão de agenda. O que a via manual pode furar (com aviso e pedido
    // de hora extra) é HORÁRIO — é pra isso que o encaixe existe. Método,
    // qualificação, calibração e capacidade valem igual nos dois caminhos.
    //
    // Treinamento é exceção deliberada: EXECUTAR Corneometria pode exigir a
    // sala do equipamento, mas ENSINAR Corneometria pode acontecer numa sala
    // de treinamento qualquer.
    const allowed = (!ehTreinamento && activity?.locationIds?.length) ? activity.locationIds : null;
    if (allowed && !allowed.includes(loc.id)) errors.push(`"${loc.name}" não está entre as salas definidas para ${activity.name}`);
  }

  // Equipamento E acessórios passam pelas MESMAS checagens. Acessório também é
  // instrumento rastreado (tem calibração e horário próprios no cadastro) —
  // validar só o aparelho principal deixava passar sonda inativa ou vencida.
  [b.equipmentId, ...(b.accessoryIds || [])].filter(Boolean).forEach((id) => {
    exigeExistir(id, data.equipment.find((e) => e.id === id), id === b.equipmentId ? "o equipamento" : "um acessório");
  });
  const equipUnits = [b.equipmentId, ...(b.accessoryIds || [])].filter(Boolean)
    .map((id) => data.equipment.find((e) => e.id === id)).filter(Boolean);
  equipUnits.forEach((eq) => {
    const rotulo = eq.isAccessory ? "o acessório" : "o equipamento";
    if (eq.active === false) errors.push(`${rotulo} "${eq.name}" está inativo`);
    const cal = calibrationStatus(eq, b.date);
    if (cal?.status === "vencido") errors.push(`${rotulo} "${eq.name}" está com calibração vencida nessa data`);
    else if (cal?.status === "vencendo") warnings.push(`${rotulo} "${eq.name}" vence a calibração em ${cal.daysLeft} dia(s)`);
    if (eq.availability && !withinAvailability(eq, b.date, blk.start, blk.end)) {
      warnings.push(`${rotulo} "${eq.name}" está fora do horário de uso cadastrado`);
    }
    const auEq = absenceOn(data.calendar, eq.id, b.date, blk.start, blk.end);
    if (auEq) errors.push(`${rotulo} "${eq.name}": ${absenceLabel(auEq)}`);
  });
  // Acessório precisa pertencer ao aparelho escolhido. Importa quando o motor
  // troca a unidade automaticamente: a sonda do MPA A não serve no MPA B.
  if (b.equipmentId) {
    const principal = data.equipment.find((e) => e.id === b.equipmentId);
    (b.accessoryIds || []).forEach((accId) => {
      if (principal && !(principal.accessoryIds || []).includes(accId)) {
        const acc = data.equipment.find((e) => e.id === accId);
        errors.push(`o acessório "${acc?.name || accId}" não é compatível com "${principal.name}"`);
      }
    });
    if (!equipCombinationFree(b.equipmentId, b.accessoryIds, b.date, blk.start, blk.end, bookings, excludeId)) {
      const quem = culpado(b.equipmentId, "equipment", bookings);
      if (quem && isEstimateBooking(quem)) {
        blockers.push({ resource: "o equipamento", resourceName: principal?.name || b.equipmentId, booking: quem });
        errors.push(`o equipamento está com pré-reserva da estimativa "${quem.studyName || "sem nome"}" até ${quem.holdUntil || "—"}`);
      } else {
        errors.push("o equipamento (ou um acessório dele) já está reservado nesse horário");
      }
    }
  }

  (b.collaboratorIds || []).forEach((id) => exigeExistir(id, data.collaborators.find((c) => c.id === id), "um colaborador"));
  if (b.doctorId) exigeExistir(b.doctorId, data.doctors.find((d) => d.id === b.doctorId), "o médico");
  const cols = (b.collaboratorIds || []).map((id) => data.collaborators.find((c) => c.id === id)).filter(Boolean);
  if (!ehTreinamento && cols.length < times.staff) {
    // Reserva CONFIRMADA não pode ficar sem quem execute — isso é erro. Reserva
    // em "pendente_equipe" pode: é justamente o estado de quem já garantiu sala
    // e equipamento e ainda está resolvendo a equipe (ver BOOKING_STATUS).
    const texto = times.staff > 1
      ? `${activity?.name || "a atividade"} pede ${times.staff} pessoa(s), a reserva tem ${cols.length}`
      : "a reserva está sem colaborador";
    if (b.status === "confirmado") errors.push(texto + " — uma reserva confirmada precisa da equipe completa");
    else warnings.push(texto);
  }
  // "Precisa de médico" fica gravado na reserva. Sem isso a informação se
  // perdia depois do planejamento e dava pra tirar o médico na edição sem o
  // sistema saber que ele era obrigatório.
  if (b.needDoctor && !b.doctorId) errors.push(`${activity?.name || "essa atividade"} exige médico investigador`);
  cols.forEach((c) => {
    check(c, "o colaborador", "collaborator");
    // Nível ABAIXO do exigido é erro, igual ao planejamento automático. Antes só
    // reclamava de nível 0, então dava pra colocar alguém de nível 1 numa
    // atividade que exige 3 editando a reserva à mão.
    const lvl = c.levels?.[b.activityId] || 0;
    const exigido = ehTreinamento ? 0 : (activity?.minLevel || 0);
    if (b.activityId && exigido > 0 && lvl < exigido) {
      errors.push(lvl <= 0
        ? `"${c.name}" não tem treinamento em ${activity?.name || "essa atividade"} (exige nível ${exigido})`
        : `"${c.name}" tem nível ${lvl} em ${activity?.name || "essa atividade"}, que exige ${exigido}`);
    } else if (!ehTreinamento && b.activityId && exigido === 0 && lvl <= 0) {
      // Método sem nível mínimo definido: não dá pra reprovar, mas ninguém
      // deveria executar sem nenhum treinamento registrado.
      warnings.push(`"${c.name}" não tem treinamento registrado em ${activity?.name || "essa atividade"}`);
    }
  });

  if (b.doctorId) check(data.doctors.find((d) => d.id === b.doctorId), "o médico", "doctor");

  return { errors, warnings, blockers, blockStart: blk.start, blockEnd: blk.end };
}

/* ---------------------------------------------------------------------- */
/* Protocolo do estudo: o cronograma real não é um monte de datas soltas —  */
/* é o baseline (D0) mais visitas em deslocamentos definidos, cada uma com  */
/* sua tolerância (D7±2). Guardando offset+tolerância em vez de datas fixas,*/
/* mexer no baseline recalcula a janela de todas as visitas seguintes de    */
/* uma vez, e dá pra dizer se uma reserva está dentro ou fora do protocolo. */
/* ---------------------------------------------------------------------- */
/* Estado de uma RESERVA.
 *  confirmado      — sala, equipamento e equipe completos: pode executar.
 *  pendente_equipe — sala/equipamento garantidos, mas ainda falta gente
 *                    qualificada (treinamento pedido, por exemplo). Serve pra
 *                    segurar o recurso sem dizer que está operacionalmente
 *                    pronto — antes essas reservas nasciam "confirmado" com a
 *                    equipe vazia, o que era mentira. */
const BOOKING_STATUS_META = {
  confirmado: { label: "Confirmada", tone: "accent" },
  pendente_equipe: { label: "Falta equipe", tone: "gold" },
};
/* ---------------------------------------------------------------------- */
/* ESTIMATIVA                                                               */
/*                                                                          */
/* Uma oportunidade que ainda não virou estudo. Serve pra orçar, prever      */
/* capacidade e estoque, e — quando alguém decide — segurar recursos por um  */
/* prazo. Os dados comerciais (cliente, responsável, valor, motivo do        */
/* cancelamento) moram AQUI, não repetidos em cada reserva; a reserva só     */
/* guarda `estimateId` mais os dois campos que o motor precisa ler sem       */
/* consultar outra coleção (ver a nota em `bookingOccupies`).                */
/* ---------------------------------------------------------------------- */
const ESTIMATE_STATUS_META = {
  rascunho: { label: "Rascunho", tone: "neutral", desc: "ainda sendo preparada" },
  aberta: { label: "Aberta", tone: "accent", desc: "orçamento ativo, sem recursos segurados" },
  pre_reserva: { label: "Pré-reserva", tone: "gold", desc: "recursos segurados temporariamente" },
  convertida: { label: "Convertida", tone: "accent", desc: "virou estudo oficial" },
  cancelada: { label: "Cancelada", tone: "danger", desc: "oportunidade cancelada" },
  expirada: { label: "Expirada", tone: "danger", desc: "o prazo da pré-reserva venceu" },
};
// Estados em que a oportunidade ainda está viva (dá pra editar e converter).
const ESTIMATE_OPEN = ["rascunho", "aberta", "pre_reserva"];
// Encerradas — é o denominador da taxa de conversão. Estimativa ainda aberta
// não conta como fracasso: ela simplesmente não foi decidida ainda.
const ESTIMATE_CLOSED = ["convertida", "cancelada", "expirada"];
const isEstimateOpen = (e) => ESTIMATE_OPEN.includes(e?.status);
const ESTIMATE_CANCEL_REASONS = [
  "Cliente não aprovou o orçamento", "Estudo suspenso", "Mudança de escopo",
  "Oportunidade perdida", "Duplicidade", "Outro",
];
/* Status derivado do prazo: uma pré-reserva com `holdUntil` vencido está
 * expirada mesmo que ninguém tenha rodado nada. A rotina de expiração
 * (ver `expireEstimates`) só grava o que esta função já sabe — assim a tela
 * nunca mostra "pré-reserva" pra um prazo que passou ontem. */
function estimateEffectiveStatus(est, agora) {
  if (est?.status === "pre_reserva" && holdExpired(est.holdUntil, agora)) return "expirada";
  return est?.status || "rascunho";
}
const estimateHoldsNow = (est, agora) => estimateEffectiveStatus(est, agora) === "pre_reserva" && !!est.holdsResources;

/* A estimativa guarda o PROTOCOLO (as visitas por deslocamento) igual a um
 * estudo, porque é isso que a conversão vai virar. As ocupações previstas
 * apontam pra visita por `estimateVisitId` — é esse par que permite
 * reconstruir estudo + visitas sem o usuário remontar nada. */
function estimateAsStudyShape(est, studyId) {
  return {
    id: studyId, name: est.name, sponsorId: est.sponsorId, status: "ativo",
    createdAt: new Date().toISOString(), fromEstimateId: est.id,
    baselineDate: est.baselineDate, startMin: est.startMin, startMax: est.startMax, endDate: est.endDate || null,
    participantsPlanned: est.participantsPlanned ?? null,
  };
}
/* Por que a conversão pode ser recusada. Sai daqui e não da tela pra poder
 * ser testado — e pra a mesma regra valer se um dia isso virar uma chamada
 * de API. */
function estimateConversionBlockers(est) {
  const out = [];
  if (!est) return ["a estimativa não existe"];
  if (est.convertedStudyId) out.push("essa estimativa já foi convertida");
  if (est.status === "cancelada") out.push("estimativa cancelada — reabra antes de converter");
  if (est.status === "expirada") out.push("a pré-reserva expirou — reabra a estimativa antes de converter");
  if (!est.name?.trim()) out.push("a estimativa precisa de um nome");
  if (!(est.protocol || []).length) out.push("a estimativa não tem nenhuma visita");
  return out;
}
/* Transforma uma ocupação prevista na reserva oficial equivalente. Preserva
 * TUDO que o motor já tinha decidido — data, horário, sala, equipe, médico,
 * equipamento, acessórios, grupo simultâneo, preparo/desmontagem — porque a
 * conversão não deve obrigar ninguém a remontar o cronograma. */
function bookingFromEstimateBooking(b, study) {
  const { estimateId, estimateVisitId, holdsResources, holdUntil, ...resto } = b;
  return {
    ...resto,
    bookingType: "reservation",
    estimateId: null, holdsResources: false, holdUntil: null,
    studyId: study.id, timepointId: estimateVisitId || null,
    studyName: study.name, sponsorId: study.sponsorId,
    // De onde veio: é o que liga a reserva oficial de volta à oportunidade,
    // e o que permite medir taxa de conversão sem cruzar coleção nenhuma.
    fromEstimateId: b.estimateId || null,
  };
}
/* ---------------------------------------------------------------------- */
/* ESTOQUE EM TRÊS CAMADAS                                                  */
/*                                                                          */
/* O número no cadastro é o que está na prateleira HOJE — e por si só ele   */
/* engana, porque parte já está prometida.                                  */
/*                                                                          */
/*   físico       o que existe agora (já descontado o que foi consumido)    */
/*   comprometido reservas confirmadas futuras vão consumir isso            */
/*   previsto     estimativas em aberto consumiriam isso SE forem aprovadas */
/*                                                                          */
/*   disponível = físico − comprometido                                     */
/*                                                                          */
/* A previsão fica FORA do disponível de propósito: ela é cenário, não      */
/* compromisso. Entra na pergunta separada "e se todas forem aprovadas?".   */
/* ---------------------------------------------------------------------- */
function supplyOutlook(supply, activities, bookings, estimates, hoje) {
  const ref = hoje || todayStr();
  const porAtividade = (activityId) => {
    const act = (activities || []).find((a) => a.id === activityId);
    return (act?.supplyUsage || []).filter((u) => u.supplyId === supply.id).reduce((s, u) => s + u.qty, 0);
  };
  let comprometido = 0, previsto = 0;
  const estAbertas = new Set((estimates || []).filter((e) => ESTIMATE_OPEN.includes(estimateEffectiveStatus(e))).map((e) => e.id));
  (bookings || []).forEach((b) => {
    // Reserva que já aconteceu (ou já foi concluída) não compromete nada: o
    // consumo dela já saiu do físico quando foi criada.
    if (b.date < ref || b.completedAt) return;
    const qtd = porAtividade(b.activityId);
    if (!qtd) return;
    if (isEstimateBooking(b)) {
      // Só estimativa VIVA conta como previsão. Cancelada, expirada ou já
      // convertida não vai consumir nada (a convertida já virou reserva).
      if (estAbertas.has(b.estimateId)) previsto += qtd;
    } else {
      comprometido += qtd;
    }
  });
  const fisico = supply.quantity ?? 0;
  return {
    fisico, comprometido, previsto,
    disponivel: fisico - comprometido,
    // Se TODAS as estimativas em aberto forem aprovadas, sobra ou falta?
    seTudoAprovado: fisico - comprometido - previsto,
    minimo: supply.minThreshold ?? 0,
  };
}

/* ---------------------------------------------------------------------- */
/* REAPROVEITAMENTO DE CAPACIDADE                                           */
/*                                                                          */
/* Quando uma estimativa solta um horário (cancelada, expirada ou liberada  */
/* à mão), a pergunta certa NÃO é "quanto perdemos" — é "alguém usou aquele */
/* espaço depois?". Cancelar uma oportunidade e encaixar outro estudo no    */
/* mesmo horário não é perda nenhuma.                                       */
/*                                                                          */
/*   reaproveitada       outra reserva ocupou a mesma sala no mesmo horário */
/*   não reaproveitada   o dia chegou e ficou vazio                         */
/*   ainda em aberto     a data ainda não chegou: cedo pra julgar           */
/* ---------------------------------------------------------------------- */
function capacityReuse(estimates, bookings, hoje) {
  const ref = hoje || todayStr();
  const soltas = new Set((estimates || [])
    .filter((e) => ["cancelada", "expirada"].includes(estimateEffectiveStatus(e)))
    .map((e) => e.id));
  const out = { liberadas: 0, reaproveitadas: 0, naoReaproveitadas: 0, emAberto: 0, itens: [] };
  (bookings || []).forEach((b) => {
    // Só conta o que CHEGOU a segurar recurso: previsão pura nunca tirou o
    // horário de ninguém, então não havia o que reaproveitar.
    if (!isEstimateBooking(b) || !b.holdsResources || !soltas.has(b.estimateId)) return;
    const horas = (toMin(b.end) - toMin(b.start)) / 60;
    out.liberadas += horas;
    const ocupado = (bookings || []).some((x) => x.id !== b.id && x.date === b.date
      && x.locationId === b.locationId && bookingOccupies(x)
      && overlaps(toMin(b.start), toMin(b.end), toMin(x.start), toMin(x.end)));
    const estado = ocupado ? "reaproveitada" : (b.date >= ref ? "emAberto" : "naoReaproveitada");
    if (estado === "reaproveitada") out.reaproveitadas += horas;
    else if (estado === "naoReaproveitada") out.naoReaproveitadas += horas;
    else out.emAberto += horas;
    out.itens.push({ bookingId: b.id, estimateId: b.estimateId, date: b.date, horas, estado });
  });
  return out;
}

/* Taxa de conversão: convertidas ÷ ENCERRADAS. Estimativa ainda aberta não
 * entra no denominador — ela simplesmente não foi decidida, e contá-la como
 * fracasso faria a taxa despencar toda vez que alguém orçasse algo novo. */
function conversionStats(estimates, filtro) {
  const lista = (estimates || []).filter((e) => (filtro ? filtro(e) : true));
  const encerradas = lista.filter((e) => ESTIMATE_CLOSED.includes(estimateEffectiveStatus(e)));
  const convertidas = encerradas.filter((e) => e.status === "convertida");
  return {
    total: lista.length,
    abertas: lista.filter((e) => ESTIMATE_OPEN.includes(estimateEffectiveStatus(e))).length,
    encerradas: encerradas.length,
    convertidas: convertidas.length,
    canceladas: encerradas.filter((e) => estimateEffectiveStatus(e) === "cancelada").length,
    expiradas: encerradas.filter((e) => estimateEffectiveStatus(e) === "expirada").length,
    taxa: encerradas.length ? Math.round((convertidas.length / encerradas.length) * 100) : null,
    valorAberto: lista.filter((e) => ESTIMATE_OPEN.includes(estimateEffectiveStatus(e)))
      .reduce((s, e) => s + (e.estimatedValue || 0), 0),
    valorConvertido: convertidas.reduce((s, e) => s + (e.estimatedValue || 0), 0),
  };
}

// As visitas do protocolo da estimativa viram timepoints de verdade.
function timepointsFromEstimate(est, studyId) {
  return (est.protocol || []).map((v) => {
    const w = timepointWindow(v, est.baselineDate, est);
    return {
      id: v.tpId, studyId, label: v.label,
      offsetDays: v.offsetDays, toleranceDays: v.toleranceDays,
      dateMin: w.dateMin, dateMax: w.dateMax,
      createdAt: new Date().toISOString(), fromEstimateId: est.id,
    };
  });
}

// Reserva completa = tem todo mundo que a atividade exige (e o médico, se for o caso).
function bookingStatusFor(b, activity) {
  const precisa = Math.max(1, activity?.staffCount ?? 1);
  const temEquipe = (b.collaboratorIds || []).length >= precisa;
  const temMedico = !b.needDoctor || !!b.doctorId;
  return temEquipe && temMedico ? "confirmado" : "pendente_equipe";
}

/* Ciclo de vida de uma solicitação de treinamento.
 *
 *   pendente  — pedida pelo planejamento, esperando a equipe de treinamento.
 *   agendado  — equipe marcou data e hora. A PARTIR DAQUI o colaborador fica
 *               ocupado nesse horário (o treinamento vira uma reserva de
 *               verdade na agenda dele), mas o nível AINDA NÃO sobe.
 *   concluido — o treinamento aconteceu. Só aqui o nível sobe.
 *   recusado  — equipe não vai treinar essa pessoa.
 *
 * Antes existia só "confirmado", que fazia as duas coisas ao mesmo tempo:
 * marcava a data e já habilitava a pessoa, assumindo que o treinamento ia
 * acontecer. Na prática isso deixava alguém entrando em reserva por uma
 * qualificação que ela ainda não tinha, e ainda por cima livre pra ser
 * escalada no mesmo horário do próprio treinamento.
 */
const TRAINING_STATUS_META = {
  pendente: { label: "Aguardando a equipe", tone: "gold" },
  agendado: { label: "Agendado", tone: "accent" },
  concluido: { label: "Concluído", tone: "accent" },
  recusado: { label: "Recusado", tone: "danger" },
};
const TRAINING_DEFAULT_MIN = 60;
// O treinamento agendado é gravado como uma reserva de verdade (kind
// "treinamento"): assim ele ocupa a agenda do colaborador em TODO lugar que já
// checa conflito — motor de sugestão, edição manual e a validação do servidor —
// sem precisar de uma segunda regra paralela. E aparece no Cronograma e no
// "Meu dia" da pessoa, que é onde ela precisa ver.
function trainingBookingFrom(req, activity) {
  const start = req.scheduledStart || "09:00";
  const end = addMinutes(start, req.durationMin || TRAINING_DEFAULT_MIN);
  // Instrutor entra em collaboratorIds junto com quem está sendo treinado: os
  // DOIS estão ocupados nesse horário, e assim a regra de conflito que já
  // existe cuida dos dois sem nenhum código novo. Equipamento e acessórios
  // idem — se a aula usa um Corneometer real, o agendador não pode colocar
  // esse mesmo aparelho num estudo ao mesmo tempo. Todos opcionais.
  const pessoas = [req.collaboratorId, req.trainerId].filter(Boolean);
  return {
    id: req.bookingId || genId("bk"), kind: "treinamento", trainingRequestId: req.id,
    studyId: null, timepointId: null, sponsorId: null,
    studyName: `Treinamento — ${activity?.name || req.activityName || "atividade"}`,
    date: req.scheduledDate, start, end, blockStart: start, blockEnd: end,
    locationId: req.locationId || null,
    equipmentId: req.equipmentId || null, accessoryIds: req.accessoryIds || [],
    activityId: req.activityId, collaboratorIds: [...new Set(pessoas)],
    traineeId: req.collaboratorId, trainerId: req.trainerId || null,
    doctorId: null, needDoctor: false, participantCount: null,
    createdBy: req.confirmedBy || "equipe de treinamento", status: "treinamento",
  };
}
const isTrainingBooking = (b) => b?.kind === "treinamento";

const STUDY_STATUS = [
  { id: "planejamento", label: "Em planejamento", tone: "neutral" },
  { id: "ativo", label: "Ativo", tone: "accent" },
  { id: "concluido", label: "Concluído", tone: "gold" },
  { id: "cancelado", label: "Cancelado", tone: "danger" },
];
const STUDY_STATUS_META = Object.fromEntries(STUDY_STATUS.map((s) => [s.id, s]));
const isStudyOpen = (study) => !study?.status || study.status === "ativo" || study.status === "planejamento";

// Migração: dado antigo tem estudo sem baseline e visita descrita só por
// dateMin/dateMax ("timepoint solto"). Conviver com os dois formatos ao mesmo
// tempo é o que confunde — então tudo é normalizado pro formato de protocolo
// logo na carga: o estudo ganha um baseline (a visita mais cedo, que na prática
// é o D0) e cada visita ganha deslocamento + tolerância equivalentes à janela
// que ela já tinha. Nenhuma janela muda de tamanho ou posição nessa conversão.
function normalizeProtocol(studies, timepoints) {
  const nextStudies = (studies || []).map((s) => {
    if (s.baselineDate) return s;
    const mine = (timepoints || []).filter((tp) => tp.studyId === s.id);
    const earliest = mine.reduce((acc, tp) => (!acc || tp.dateMin < acc ? tp.dateMin : acc), null);
    return { ...s, baselineDate: earliest || s.createdAt?.slice(0, 10) || todayStr() };
  });
  const nextTimepoints = (timepoints || []).map((tp) => {
    if (tp.offsetDays != null) return tp;
    const study = nextStudies.find((s) => s.id === tp.studyId);
    if (!study?.baselineDate || !tp.dateMin || !tp.dateMax) return tp;
    const days = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
    // O alvo é o centro da janela antiga; a tolerância, a metade da largura.
    // Janela de largura ímpar arredonda pra baixo no alvo, então guardamos as
    // duas metades e ficamos com a maior — a janela nunca encolhe.
    const span = days(tp.dateMin, tp.dateMax);
    const target = addDays(tp.dateMin, Math.floor(span / 2));
    return {
      ...tp,
      offsetDays: days(study.baselineDate, target),
      toleranceDays: Math.max(days(tp.dateMin, target), days(target, tp.dateMax)),
    };
  });
  /* Janela contratada dos estudos antigos. Eles tinham um D0 fixo e nenhum
   * prazo — o equivalente honesto é "só pode começar nesse dia" e "o prazo é
   * o fim do próprio protocolo". Assim a tela nova já mostra algo verdadeiro
   * no primeiro uso, em vez de campo vazio, e nada passa a estourar prazo por
   * causa da migração. */
  const comJanela = nextStudies.map((s) => {
    if (s.startMin && s.endDate) return s;
    const minhas = nextTimepoints.filter((tp) => tp.studyId === s.id);
    return {
      ...s,
      startMin: s.startMin || s.baselineDate,
      startMax: s.startMax || s.baselineDate,
      endDate: s.endDate || protocolEnd(minhas, s.baselineDate) || s.baselineDate,
    };
  });
  const changed = comJanela.some((s, i) => s !== studies[i]) || nextTimepoints.some((tp, i) => tp !== timepoints[i]);
  return { studies: comJanela, timepoints: nextTimepoints, changed };
}

/* ---------------------------------------------------------------------- */
/* JANELA CONTRATADA DO ESTUDO                                              */
/*                                                                          */
/* O protocolo diz a FORMA do cronograma (D0, D7±2, D28±3). A janela diz    */
/* ONDE ela cabe no calendário: a partir de quando o estudo pode começar,    */
/* até quando pode começar, e a data em que ele tem que estar terminado.     */
/*                                                                          */
/* São perguntas diferentes. "D28±3" continua valendo mesmo se o cliente     */
/* mudar o prazo; o que muda é se aquele D28 ainda cabe. Estourar o prazo    */
/* não é erro do sistema — é assunto comercial, e por isso vira solicitação  */
/* de prazo pro gestor, não um bloqueio silencioso.                          */
/* ---------------------------------------------------------------------- */
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
function studyWindow(study) {
  // Estudo antigo só tem `baselineDate`: a janela de início vira aquele único
  // dia, e sem prazo final nada é cobrado. Nenhuma migração de dados.
  const startMin = study?.startMin || study?.baselineDate || null;
  const startMax = study?.startMax || study?.baselineDate || startMin;
  return { startMin, startMax, endDate: study?.endDate || null };
}

function timepointWindow(tp, baselineDate, study) {
  // Sem baseline ou sem offset, cai no que já estava gravado (dado antigo, ou
  // timepoint criado manualmente sem protocolo).
  if (!baselineDate || tp?.offsetDays == null) return { dateMin: tp?.dateMin, dateMax: tp?.dateMax, derived: false, fits: true };
  const target = addDays(baselineDate, tp.offsetDays);
  const tol = Math.max(0, tp.toleranceDays ?? 0);
  let dateMin = addDays(target, -tol), dateMax = addDays(target, tol);
  /* O prazo do estudo APARA a janela: o motor não deve oferecer um dia que já
   * está fora do que foi combinado com o cliente. A tolerância do protocolo
   * continua a mesma — o que encolhe é onde ela pode ser usada.
   *
   * `study` é opcional de propósito: todo o código que já chamava com dois
   * argumentos continua vendo a janela pura do protocolo. */
  let clipped = false;
  const w = study ? studyWindow(study) : null;
  if (w?.endDate && dateMax > w.endDate) { dateMax = w.endDate; clipped = true; }
  if (w?.startMin && dateMin < w.startMin) { dateMin = w.startMin; clipped = true; }
  // Aparou até não sobrar nada: essa visita não cabe no prazo combinado.
  return { dateMin, dateMax, target, derived: true, clipped, fits: dateMin <= dateMax };
}

/* Último dia que o protocolo alcança, dado um D0 — o fim da tolerância da
 * visita mais distante. É esse número que se compara com o prazo. */
function protocolEnd(timepoints, baselineDate) {
  let fim = null;
  (timepoints || []).forEach((tp) => {
    const w = timepointWindow(tp, baselineDate);
    if (w.dateMax && (!fim || w.dateMax > fim)) fim = w.dateMax;
  });
  return fim;
}
// Quantos dias o protocolo ocupa, do D0 até o fim da última tolerância.
function protocolSpan(timepoints) {
  const fim = protocolEnd(timepoints, "2000-01-01");
  return fim ? daysBetween("2000-01-01", fim) : 0;
}

/* O diagnóstico da janela: cabe? o D0 escolhido está dentro do combinado?
 * qual é o D0 mais tarde que ainda termina no prazo? */
function studyFit(study, timepoints) {
  const w = studyWindow(study);
  const baseline = study?.baselineDate || w.startMin;
  const span = protocolSpan(timepoints);
  const fim = baseline ? protocolEnd(timepoints, baseline) : null;
  const problems = [];

  if (w.startMin && w.startMax && w.startMax < w.startMin) problems.push("o início máximo está antes do início mínimo");
  if (w.endDate && w.startMin && w.endDate < w.startMin) problems.push("o prazo final está antes do início do estudo");
  if (baseline && w.startMin && baseline < w.startMin) problems.push(`o D0 escolhido (${baseline}) é antes do início combinado (${w.startMin})`);
  if (baseline && w.startMax && baseline > w.startMax) problems.push(`o D0 escolhido (${baseline}) é depois do início máximo combinado (${w.startMax})`);

  // O D0 mais tarde que ainda faz o protocolo inteiro terminar no prazo.
  const latestFeasibleBaseline = w.endDate ? addDays(w.endDate, -span) : null;
  const overflowDays = (w.endDate && fim && fim > w.endDate) ? daysBetween(w.endDate, fim) : 0;
  if (overflowDays > 0) problems.push(`o protocolo termina ${overflowDays} dia(s) depois do prazo`);
  /* Nem começando no primeiro dia possível cabe. Aí o problema não é a data
   * escolhida — é o protocolo ser mais longo que o prazo, e nenhum
   * replanejamento resolve: ou o cliente estende, ou o protocolo encurta. */
  const impossivel = !!(w.endDate && w.startMin && latestFeasibleBaseline && latestFeasibleBaseline < w.startMin);
  if (impossivel) problems.push(`o protocolo leva ${span} dia(s) e não cabe na janela nem começando no primeiro dia`);

  return { ...w, baseline, span, protocolEnd: fim, latestFeasibleBaseline, overflowDays, impossivel, problems, ok: problems.length === 0 };
}
// Data alvo x data realmente agendada: é isso que diz "essa visita saiu do
// protocolo" — o desvio em dias e se estourou a tolerância.
function protocolDeviation(tp, baselineDate, bookedDate) {
  const w = timepointWindow(tp, baselineDate);
  if (!w.derived || !bookedDate) return null;
  const diff = Math.round((new Date(bookedDate + "T00:00:00") - new Date(w.target + "T00:00:00")) / 86400000);
  const tol = Math.max(0, tp.toleranceDays ?? 0);
  return { diff, target: w.target, outOfWindow: Math.abs(diff) > tol };
}
const addMinutes = (t, mins) => {
  const total = toMin(t) + mins;
  const h = Math.floor(total / 60) % 24, m = total % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
};
// Strips the asset tag/code and any trailing "(...)" note so we can group physical
// units that are really "the same kind of thing" — e.g. "Corneometer A-EM-175 (Fixo 452...)" -> "Corneometer"
function baseTypeName(name) {
  const stripped = name.replace(/\s*-?\s*A-E[MG]-\d+.*$/i, "").replace(/\s*\(.*?\)\s*$/, "").trim();
  return stripped || name;
}
function typeCandidates(equipmentId, equipmentList) {
  const eq = equipmentList.find((e) => e.id === equipmentId);
  if (!eq) return [];
  const base = baseTypeName(eq.name);
  return equipmentList.filter((e) => !!e.isAccessory === !!eq.isAccessory && baseTypeName(e.name) === base);

  const fromCollaborators = collaborators.map((c) => ({ id: genId("user"), name: c.name, pin: c.pin || "1234", level: "colaborador", resourceId: c.id }));
  const fromDoctors = doctors.map((d) => ({ id: genId("user"), name: d.name, pin: d.pin || "1234", level: "medico", resourceId: d.id }));
  return [...examples, ...fromCollaborators, ...fromDoctors];
}

/* Feriados nacionais do ano corrente e do seguinte, já lançados no calendário.
 * O planejamento de estudo trabalha meses à frente — abrir o sistema com o
 * calendário vazio faria o motor marcar visita em 25 de dezembro no primeiro
 * uso. Feriado municipal/estadual e recesso da empresa entram à mão.
 *
 * Páscoa pelo algoritmo de Meeus/Butcher: Carnaval, Sexta-feira Santa e
 * Corpus Christi saem dela. */
function easterSunday(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31);
  const dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, mes - 1, dia);
}
function nationalHolidays(year) {
  const pascoa = easterSunday(year);
  const rel = (n) => { const d = new Date(pascoa); d.setDate(d.getDate() + n); return fmtDate(d); };
  return [
    { date: `${year}-01-01`, title: "Confraternização Universal" },
    { date: rel(-48), title: "Carnaval" },
    { date: rel(-47), title: "Carnaval" },
    { date: rel(-2), title: "Sexta-feira Santa" },
    { date: `${year}-04-21`, title: "Tiradentes" },
    { date: `${year}-05-01`, title: "Dia do Trabalho" },
    { date: rel(60), title: "Corpus Christi" },
    { date: `${year}-09-07`, title: "Independência" },
    { date: `${year}-10-12`, title: "Nossa Senhora Aparecida" },
    { date: `${year}-11-02`, title: "Finados" },
    { date: `${year}-11-15`, title: "Proclamação da República" },
    { date: `${year}-11-20`, title: "Consciência Negra" },
    { date: `${year}-12-25`, title: "Natal" },
  ];
}
function seedCalendar() {
  const ano = new Date().getFullYear();
  return [ano, ano + 1].flatMap((y) => nationalHolidays(y)).map((h) => ({
    id: genId("cal"), kind: "feriado", title: h.title, scope: "todos", targetIds: [],
    dateStart: h.date, dateEnd: h.date, allDay: true, start: null, end: null,
    notes: "Feriado nacional", createdBy: "sistema", createdAt: new Date().toISOString(),
  }));
}

// Estudo → Timepoints → Reservas de exemplo, três estudos com formas diferentes
// de propósito (orçamento folgado / sem orçamento / orçamento estourado) pra dar
// pra ver a tela de Estudos com conteúdo de verdade, não vazia, no primeiro uso.
function seedStudiesBundle(data) {
  const t = todayStr();
  const sponsorBy = (frag) => data.sponsors.find((s) => s.name.includes(frag)) || data.sponsors[0];
  const actBy = (name) => data.activities.find((a) => a.name === name)?.id || null;
  const eqBy = (prefix) => data.equipment.find((e) => e.name.startsWith(prefix));
  const colBy = (name) => data.collaborators.find((c) => c.name === name);
  const daysAgoIso = (n) => new Date(Date.now() - n * 86400000).toISOString();

  /* O exemplo tem que OBEDECER as próprias regras. Antes ele fixava sala e
   * pessoas na mão, enquanto as salas permitidas de cada método e os níveis
   * de cada colaborador nascem sorteados — então quase toda reserva de
   * exemplo aparecia com "sala não permitida" ou "sem treinamento". Alerta
   * que aparece sempre vira ruído, e ninguém mais confia nele.
   *
   * Agora sala e equipe são DERIVADAS do método. */
  /* Salas já entregues, por dia, com a janela BLOQUEADA que cada uma ocupa
   * (execução + preparo + desmontagem). Comparar só start/end deixava duas
   * reservas encavalarem o preparo de uma no fim da outra. */
  const salasOcupadas = []; // { locationId, date, s, e }
  const salaPara = (activityId, preferida, date, start, end) => {
    const act = data.activities.find((a) => a.id === activityId);
    const permitidas = act?.locationIds?.length
      ? data.locations.filter((l) => act.locationIds.includes(l.id))
      : data.locations;
    const blk = blockedWindow(start, end, act);
    const s = toMin(blk.start), e = toMin(blk.end);
    const livre = (l) => !salasOcupadas.some((o) => o.locationId === l.id && o.date === date && overlaps(s, e, o.s, o.e));
    const ordem = [...permitidas].sort((a, b) => (a.id === preferida?.id ? -1 : b.id === preferida?.id ? 1 : 0));
    const escolhida = ordem.find(livre) || ordem[0] || data.locations[0];
    salasOcupadas.push({ locationId: escolhida.id, date, s, e });
    return escolhida.id;
  };
  /* Equipamento só entra se estiver calibrado NAQUELA data. O exemplo não
   * pode nascer com o aparelho vencido — é justamente um dos alertas que o
   * sistema existe pra dar, e vindo de fábrica ele vira ruído. Devolve null
   * quando não há unidade válida: reserva sem equipamento é honesta. */
  const equipamentoValido = (eq, date) => {
    if (!eq) return null;
    return calibrationStatus(eq, date)?.status === "vencido" ? null : eq;
  };
  /* Acessório do aparelho que esteja calibrado NAQUELA data.
   *
   * O cadastro de exemplo tem um Corneometer vencido DE PROPÓSITO — é o que
   * dá conteúdo à tela de Calibração. O erro nunca foi ele existir; era
   * agendá-lo. Aqui se escolhe outro acessório do mesmo aparelho, e o
   * vencido continua no cadastro, aparecendo onde deve. */
  const acessorioValido = (equipamento, date) => {
    if (!equipamento?.accessoryIds?.length) return null;
    const ok = equipamento.accessoryIds
      .map((id) => data.equipment.find((e) => e.id === id))
      .filter(Boolean)
      .find((acc) => calibrationStatus(acc, date)?.status !== "vencido");
    return ok || null;
  };
  /* Escolhe gente qualificada; se não houver o bastante no sorteio, SOBE o
   * nível de quem foi escolhido — os colaboradores também são dado de
   * exemplo, então o pacote inteiro sai coerente por construção. */
  /* Os níveis que o pacote precisou garantir. NÃO altera os objetos no lugar:
   * o adaptador de servidor calcula o que enviar comparando com o snapshot
   * que ele leu, e mutação in-place deixa "antes" e "depois" idênticos — o
   * ajuste nunca chegaria ao banco, e o exemplo continuaria acusando "sem
   * treinamento" em quase toda reserva. */
  const niveisGarantidos = new Map(); // colaboradorId -> { activityId: nivel }
  const nivelDe = (c, activityId) => niveisGarantidos.get(c.id)?.[activityId] ?? (c.levels?.[activityId] || 0);
  const equipePara = (activityId, quantos, excluirIds = []) => {
    const act = data.activities.find((a) => a.id === activityId);
    const min = act?.minLevel || 0;
    const livres = data.collaborators.filter((c) => c.active !== false && !excluirIds.includes(c.id));
    const jaQualificados = livres.filter((c) => nivelDe(c, activityId) >= min);
    const escolhidos = [...jaQualificados, ...livres.filter((c) => !jaQualificados.includes(c))].slice(0, quantos);
    escolhidos.forEach((c) => {
      if (nivelDe(c, activityId) < min) {
        niveisGarantidos.set(c.id, { ...(niveisGarantidos.get(c.id) || {}), [activityId]: min });
      }
    });
    return escolhidos.map((c) => c.id);
  };

  const xpto = { id: genId("study"), name: "Protocolo XPTO-102", sponsorId: sponsorBy("NATURA").id, createdAt: daysAgoIso(20), status: "ativo", baselineDate: t, participantsPlanned: 24 };

  const mkTp = (study, label, offsetDays, toleranceDays) => {

  const timepoints = [

    mkTp(cardio, "Baseline (D0)", 0, 0),

    mkTp(derm, "T1 (D7±2)", 7, 2),
    mkTp(derm, "T2 (D14±3)", 14, 3),
  ];
  const [tpXptoBaseline, tpXptoT1, tpCardioBaseline, tpDermBaseline, tpDermT1, tpDermT2] = timepoints;

  /* Sala e equipe vêm de `salaPara`/`equipePara`, não escritas à mão: assim
   * o exemplo respeita as salas permitidas do método e o nível mínimo, que
   * são sorteados. `emAndamento` guarda quem já está ocupado hoje pra a

  const actEritema = actBy("Avaliação De Eritema");

  const actApoio = actBy("Apoio");
  // Quem está na atividade "em andamento" de hoje (08:00–09:30), mais abaixo.
  const staffDe = (id) => Math.max(1, data.activities.find((a) => a.id === id)?.staffCount ?? 1);
  const ocupadosHoje = equipePara(actApoio, Math.max(2, staffDe(actApoio)));

  const bookings = [
    {

      accessoryIds: [acessorioValido(mpa169, t)?.id].filter(Boolean), activityId: actEritema, minLevel: 3,

      collaboratorIds: equipePara(actEritema, Math.max(2, staffDe(actEritema)), ocupadosHoje),

    },
    {
      id: genId("bk"), studyId: xpto.id, timepointId: tpXptoT1.id, studyName: xpto.name, sponsorId: xpto.sponsorId,
      date: addDays(t, 14), start: "09:30", end: "11:00", locationId: salaPara(actEritema, data.locations[0], addDays(t, 14), "09:30", "11:00"), equipmentId: equipamentoValido(mpa169, addDays(t, 14))?.id || null,
      accessoryIds: [acessorioValido(mpa169, addDays(t, 14))?.id].filter(Boolean), activityId: actEritema, minLevel: 3,
      collaboratorIds: equipePara(actEritema, staffDe(actEritema)),

    {

  /* --- Cenários extras, pra nenhuma tela nascer vazia ou com um estado só ---

  const alpha = { id: genId("study"), name: "Protocolo ALPHA-11", sponsorId: sponsorBy("BEIERSDORF").id, createdAt: daysAgoIso(3), status: "planejamento", baselineDate: addDays(t, 21), participantsPlanned: 18 };
  const omega = { id: genId("study"), name: "Protocolo OMEGA-3", sponsorId: sponsorBy("UNILEVER").id, createdAt: daysAgoIso(120), status: "concluido", baselineDate: addDays(t, -90), participantsPlanned: 15 };
  const solar = { id: genId("study"), name: "Protocolo SOLAR-88", sponsorId: sponsorBy("GALDERMA").id, createdAt: daysAgoIso(40), status: "ativo", baselineDate: addDays(t, -28), participantsPlanned: 40 };

  timepoints.push(...tpAlpha, ...tpOmega, tpSolarD0, tpSolarD14, tpSolarD28, tpSolarD60);

  // (actTecnica/actApoio já foram resolvidos junto com as outras atividades
  // do pacote, lá em cima.)
  const withBlock = (b) => {
    // Todo cenário novo já nasce com a janela bloqueada calculada, igual às

    // SOLAR D0 — concluída de verdade, com duração real acima do planejado

    withBlock({

      accessoryIds: [], activityId: actTecnica, minLevel: 3, participantCount: 10,
      collaboratorIds: equipePara(actTecnica, staffDe(actTecnica)),
      doctorId: data.doctors[2]?.id || null, createdBy: "demo", status: "confirmado",
      actualStart: "14:05", actualEnd: "15:40", completedAt: daysAgoIso(10),

  const trainingRequests = [

    },
