/* Planta baixa — layout abstrato (não em escala), só agrupa as salas       */
/* visualmente com cor por ocupação do dia. Sem coordenadas reais ainda.   */
/* ---------------------------------------------------------------------- */
function FloorPlanView({ locations, bookings, dateStr }) {
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4">
      <div className="text-[11px] mb-3 flex items-center gap-1.5" style={{ color: T.inkMuted }}>
        <Info size={11} /> Layout abstrato — agrupa as salas visualmente pra dar uma leitura rápida da ocupação, não representa a planta física real (nem está em escala). A capacidade % considera a janela de disponibilidade cadastrada de cada sala.
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        {locations.map((l) => {
          const dayBookings = bookings.filter((b) => b.date === dateStr && b.locationId === l.id).sort((a, b) => a.start.localeCompare(b.start));
          const count = dayBookings.length;
          const bg = count === 0 ? T.subtle : count === 1 ? T.accentSoft : T.accent;
          const fg = count >= 2 ? "#fff" : T.ink;
          const fgMuted = count >= 2 ? "rgba(255,255,255,0.8)" : T.inkMuted;
          const dailyPct = dailyCapacityPct(l, bookings, dateStr);
          const monthlyPct = monthlyCapacityPct(l, bookings, dateStr);
          return (
            <div key={l.id} style={{ background: bg, color: fg, minHeight: 112 }} className="rounded-xl p-3 flex flex-col justify-between">
              <div>
                <div className="text-xs font-medium leading-tight">{l.name}</div>
                {l.active === false && <div className="text-[10px] mt-0.5" style={{ color: fgMuted }}>inativa</div>}
              </div>
              <div>
                <div className="text-[11px] flex items-center gap-1" style={{ color: fgMuted }}><MapPin size={11} />{count} reserva{count === 1 ? "" : "s"} hoje</div>
                {dayBookings[0] && <div className="text-[10px] mt-0.5 truncate" style={{ color: fgMuted }}>{dayBookings[0].start} {dayBookings[0].studyName}</div>}
                <div className="text-[10px] mt-1 flex items-center gap-1" style={{ color: fgMuted }}>
                  <Gauge size={10} /> Hoje: {dailyPct === null ? "fechado" : `${dailyPct}%`} · Mês: {monthlyPct === null ? "—" : `${monthlyPct}%`}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Encaixe — reserva avulsa criada direto no Cronograma, sem passar pelo    */
/* assistente. Existe pra um caso concreto: o dia está cheio, mas fora do   */
/* horário normal ainda cabe alguma coisa (a Agenda mostra essa faixa       */
/* sombreada). Se o horário escolhido cai DENTRO da disponibilidade de      */
/* todo mundo envolvido, vira reserva na hora; se cai fora, vira uma        */
/* solicitação de hora extra e só vira reserva depois que a pessoa aceita   */
/* e o gestor aprova (mesmos 2 passos do resto do fluxo de hora extra).     */
/* Componente de topo de propósito: tem SearchPick dentro, e se fosse       */
/* declarado dentro do Schedule seria recriado a cada poll de 5s, perdendo  */
/* o foco de quem está digitando.                                           */
/* ---------------------------------------------------------------------- */
// Mesmo motivo do PlanItemRow/TrainingRequestRow: componente de topo pra não ser
// recriado (e remontado) a cada render do Schedule. Aqui o sintoma era o campo de
// horário do "Marcar concluída" perder o foco a cada poll de 5s.
/* Autorização POR AÇÃO, não por tela.
 *
 *   gerenciar (criar/editar/reagendar/remover) → Agendador, Gestor, Admin
 *   executar (iniciar/finalizar)               → quem está escalado na
 *                                                atividade; Gestor/Admin também,
 *                                                pra corrigir quem esqueceu de
 *                                                clicar
 *   o resto                                    → só leitura
 *
 * Antes o Cronograma mostrava "Remover" pra qualquer um que abrisse a tela —
 * um colaborador podia apagar a reserva de outra pessoa. Isso é autorização
 * funcional e não depende de a autenticação definitiva existir.
 */
function BookingRow({ b, data, bookings, completingId, actualEndInput,
  onSetActualEnd, onStartCompleting, onMarkCompleted, onCancelCompleting, onRemove, onApplyImprovement,
  onStartActivity, onUndoStart, canGerenciar, myPersonId, podeSupervisionar }) {
  // Treinamento não usa os botões de reserva: concluir é o que sobe o nível da
  // pessoa, e "Finalizar" aqui só gravaria actualEnd sem habilitar ninguém.
  // Remover deixaria a solicitação como "agendado" apontando pra reserva que
  // não existe mais. Os dois caminhos precisam ser o fluxo de Treinamentos.
  const ehTreino = isTrainingBooking(b);
  const souParticipante = !!myPersonId && ((b.collaboratorIds || []).includes(myPersonId) || b.doctorId === myPersonId);
  const podeExecutar = !ehTreino && (souParticipante || podeSupervisionar);
  const podeRemover = !ehTreino && canGerenciar;
  const loc = data.locations.find((l) => l.id === b.locationId);
  const cols = (b.collaboratorIds || []).map((id) => data.collaborators.find((c) => c.id === id)).filter(Boolean);
  const doc = data.doctors.find((d) => d.id === b.doctorId);
  const eq = data.equipment.find((e) => e.id === b.equipmentId);
  const sponsor = data.sponsors.find((s) => s.id === b.sponsorId);
  return (
    <div className="px-4 py-2.5" style={{ borderBottom: `1px solid ${T.line}` }}>
      <div className="flex items-center justify-between gap-3">
        <div className="flex items-center gap-3 min-w-0">
          <div style={{ fontFamily: "'JetBrains Mono', monospace", color: T.accentDark }} className="text-xs font-medium whitespace-nowrap">{weekdayLabel(b.date)} · {b.start}–{b.end}</div>
          <div className="min-w-0">
            <div className="text-xs font-medium truncate flex items-center gap-1.5">
              {isTrainingBooking(b) && <GraduationCap size={12} style={{ color: T.gold }} />}
              {b.studyName}
              {isTrainingBooking(b)
                ? <Chip tone="gold">treinamento</Chip>
                : <span style={{ color: T.inkMuted, fontWeight: 400 }}>· {sponsor?.name}</span>}
            </div>
            <div className="text-[11px] truncate" style={{ color: T.inkMuted }}>
              {loc && <MapPin size={10} className="inline -mt-0.5 mr-0.5" />}{loc?.name}
              {cols.length > 0 && <> · {cols.map((c) => c.name).join(", ")}</>}{doc && <> · {doc.name}</>}
              {eq && <> · {eq.name}{(b.accessoryIds || []).length > 0 && <> (+ {b.accessoryIds.map((id) => data.equipment.find((e) => e.id === id)?.name).filter(Boolean).join(", ")})</>}</>}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-1.5 shrink-0">
          {ehTreino && (
            <span className="text-[11px]" style={{ color: T.gold }}>
              <GraduationCap size={11} className="inline -mt-0.5 mr-1" />Gerenciar em <strong>Treinamentos</strong>
            </span>
          )}
          {podeExecutar && b.date <= todayStr() && !b.actualEnd && (
            completingId === b.id ? (
              <React.Fragment>
                <input type="time" value={actualEndInput} onChange={(e) => onSetActualEnd(e.target.value)}
                  className="text-xs px-2 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
                <Btn small icon={Check} onClick={() => onMarkCompleted(b)}>Salvar fim</Btn>
                <Btn small variant="ghost" onClick={onCancelCompleting}>Cancelar</Btn>
              </React.Fragment>
            ) : b.actualStart ? (
              <React.Fragment>
                <Chip tone="gold">em andamento · começou {b.actualStart}</Chip>
                <Btn small variant="subtle" icon={Check} onClick={() => onStartCompleting(b)}>Finalizar</Btn>
                <Btn small variant="ghost" onClick={() => onUndoStart(b)} title="Desfazer o início">Desfazer</Btn>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <Btn small variant="subtle" icon={Timer} onClick={() => onStartActivity(b)} title="Marca o início real da atividade">Iniciar</Btn>
                <Btn small variant="ghost" icon={Check} onClick={() => onStartCompleting(b)} title="Se esqueceu de iniciar, registre só o fim">Só finalizar</Btn>
              </React.Fragment>
            )
          )}
          {/* Quem não está escalado vê o estado, mas não age. */}
          {!ehTreino && !podeExecutar && b.actualStart && !b.actualEnd && <Chip tone="gold">em andamento · começou {b.actualStart}</Chip>}
          {b.actualEnd && <Chip tone="accent">concluída · {toMin(b.actualEnd) - toMin(b.actualStart || b.start)} min</Chip>}
          {podeRemover && <Btn small variant="danger" icon={Trash2} onClick={() => onRemove(b.id)}>Remover</Btn>}
        </div>
      </div>
    </div>
  );
}
function EncaixeForm({ data, bookings, studies, initial, onSubmit, onCancel, estimates, canSegurarEstimativa, onLiberarEstimativa }) {
  const [form, setForm] = useState(() => ({
    studyId: studies[0]?.id || null, activityId: data.activities[0]?.id || null,
    locationId: initial.locationId || null, date: initial.date,
    start: initial.start || "18:00", end: initial.end || "19:00",
    collaboratorIds: initial.collaboratorId ? [initial.collaboratorId] : [],
    doctorId: initial.doctorId || null,
    equipmentId: null, accessoryIds: [], participants: "",
    reason: "",
  }));
  const set = (patch) => setForm((f) => ({ ...f, ...patch }));

  const activity = data.activities.find((a) => a.id === form.activityId);
  const study = studies.find((s) => s.id === form.studyId);
  const location = data.locations.find((l) => l.id === form.locationId);
  const collaborator = data.collaborators.find((c) => c.id === form.collaboratorId);
  const doctor = data.doctors.find((d) => d.id === form.doctorId);

  // Ao trocar a atividade, ajusta o fim pra duração padrão dela — evita o usuário
  // ter que recalcular na mão o horário toda vez.
  const setActivity = (activityId) => {
    const act = data.activities.find((a) => a.id === activityId);
    const dur = act?.durationMin ?? 60;
    set({ activityId, end: addMinutes(form.start, dur) });
  };
  const setStart = (start) => {
    const dur = activity?.durationMin ?? 60;
    set({ start, end: addMinutes(start, dur) });
  };

  const times = activityTimes(activity);
  const team = (form.collaboratorIds || []).map((id) => data.collaborators.find((c) => c.id === id)).filter(Boolean);
  const validTime = form.start && form.end && toMin(form.end) > toMin(form.start);
  // O encaixe respeita os mesmos tempos do resto: o que é checado é a janela
  // bloqueada (preparo + execução + desmontagem), não só o horário digitado.
  const blk = validTime ? blockedWindow(form.start, form.end, activity) : { start: form.start, end: form.end };
  const equipment = data.equipment.find((e) => e.id === form.equipmentId);
  const accessoryOptions = form.equipmentId ? equipAccessoryOptions(form.equipmentId, data.equipment) : [];

  // Três checagens independentes: conflito de agenda (sala/pessoa/equipamento já
  // ocupados — isso BLOQUEIA, encaixe não pode dar choque), e disponibilidade
  // cadastrada (fora dela não bloqueia, só transforma em pedido de hora extra).
  const conflicts = useMemo(() => {
    if (!validTime) return [];
    const out = [];
    if (form.locationId && !fieldFree(form.locationId, "location", form.date, blk.start, blk.end, bookings)) out.push(`${location?.name} já tem reserva nesse horário`);
    team.forEach((c) => { if (!fieldFree(c.id, "collaborator", form.date, blk.start, blk.end, bookings)) out.push(`${c.name} já está em outra reserva`); });
    if (form.doctorId && !fieldFree(form.doctorId, "doctor", form.date, blk.start, blk.end, bookings)) out.push(`${doctor?.name} já está em outra reserva`);
    if (form.equipmentId && !equipCombinationFree(form.equipmentId, form.accessoryIds, form.date, blk.start, blk.end, bookings)) out.push(`${equipment?.name} já está reservado nesse horário`);
    // Capacidade da sala/atividade vs participantes previstos.
    if (form.participants > 0) {
      const lim = participantLimit(location, activity);
      if (lim != null && form.participants > lim) out.push(`${location?.name || "a sala"} comporta ${lim} participante(s), mas foram informados ${form.participants}`);
    }
    return out;
  }, [form, bookings, validTime, location, doctor, equipment, activity, blk.start, blk.end]);

  const outsideWho = useMemo(() => {
    if (!validTime) return [];
    const out = [];
    if (location && !withinAvailability(location, form.date, blk.start, blk.end)) out.push({ kind: "local", name: location.name });
    team.forEach((c) => { if (!withinAvailability(c, form.date, blk.start, blk.end)) out.push({ kind: "collaborator", name: c.name, id: c.id }); });
    if (doctor && !withinAvailability(doctor, form.date, blk.start, blk.end)) out.push({ kind: "doctor", name: doctor.name, id: doctor.id });
    return out;
  }, [form, validTime, location, doctor, blk.start, blk.end]);

  // Hora extra é sobre PESSOA — sala fora do horário é aviso, não gera pedido a
  // ninguém (não tem quem "aceitar" por uma sala).
  const staffOutside = outsideWho.filter((o) => o.kind !== "local");
  const locationOutside = outsideWho.some((o) => o.kind === "local");
  const needsOvertime = staffOutside.length > 0;
  const staffShort = team.length < times.staff;
  // "Manual" não significa "sem regras": o encaixe passa pelo MESMO
  // validateBooking da edição de reserva, então nível mínimo, sala permitida
  // pro método, calibração, compatibilidade de acessório e capacidade valem
  // aqui também. Antes o encaixe só olhava conflito de agenda, e por isso era o
  // caminho mais fácil pra furar as outras regras.
  const check = useMemo(() => {
    if (!validTime || !form.activityId) return null;
    return validateBooking({
      id: initial?.id || "novo", date: form.date, start: form.start, end: form.end,
      locationId: form.locationId, activityId: form.activityId,
      equipmentId: form.equipmentId, accessoryIds: form.accessoryIds || [],
      collaboratorIds: form.collaboratorIds || [], doctorId: form.doctorId,
      participants: form.participants ?? null,
    }, data, bookings, initial?.id);
  }, [form, validTime, data, bookings, initial]);
  // Fora do horário vira pedido de hora extra (fluxo próprio), então não trava.
  const blockingErrors = (check?.errors || []).filter((e) => !/hora extra/.test(e));
  const canSubmit = validTime && form.studyId && form.activityId && form.locationId
    && team.length > 0 && conflicts.length === 0 && !staffShort && blockingErrors.length === 0;

  return (
    <div style={{ background: T.surface, border: `1px solid ${T.accent}` }} className="rounded-xl p-4 space-y-3">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
          <Zap size={15} style={{ color: T.accentDark }} /><span className="text-sm font-semibold">Encaixe manual</span>
        </div>
        <Btn small variant="ghost" icon={X} onClick={onCancel}>Fechar</Btn>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Estudo
          <div className="mt-1"><SearchPick options={studies.map((s) => ({ id: s.id, name: s.name }))} value={form.studyId} onChange={(v) => set({ studyId: v })} placeholder="Buscar estudo..." /></div>
        </div>
        <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Atividade / método
          <div className="mt-1"><SearchPick options={data.activities} value={form.activityId} onChange={setActivity} placeholder="Buscar atividade..." /></div>
        </div>
        <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Local
          <div className="mt-1"><SearchPick options={data.locations.filter((l) => l.active)} value={form.locationId} onChange={(v) => set({ locationId: v })} placeholder="Buscar local..." /></div>
        </div>
        <label className="text-xs font-medium" style={{ color: T.inkMuted }}>Data
          <input type="date" value={form.date} onChange={(e) => set({ date: e.target.value })}
            className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
        </label>
        <div className="grid grid-cols-2 gap-2">
          <label className="text-xs font-medium" style={{ color: T.inkMuted }}>Início
            <input type="time" value={form.start} onChange={(e) => setStart(e.target.value)}
              className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
          </label>
          <label className="text-xs font-medium" style={{ color: T.inkMuted }}>Fim
            <input type="time" value={form.end} onChange={(e) => set({ end: e.target.value })}
              className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
          </label>
        </div>
        <div className="text-xs font-medium" style={{ color: T.inkMuted }}>
          Equipe <span style={{ color: staffShort ? T.danger : T.accentDark }}>(essa atividade precisa de {times.staff})</span>
          {/* Só quem tem o nível exigido no método aparece na lista — oferecer
              todo mundo convidava a montar uma reserva que a regra reprova.
              Quem está de férias/folga naquela data também sai: o encaixe pode
              furar horário (vira hora extra), mas não pode furar ausência. */}
          <div className="mt-1"><MultiSearchPick
            options={data.collaborators.filter((c) => c.active
              && (!form.activityId || (c.levels?.[form.activityId] || 0) >= (activity?.minLevel || 0))
              && !(form.date && absenceOn(data.calendar, c.id, form.date, form.start, form.end)))}
            values={form.collaboratorIds} onChange={(v) => set({ collaboratorIds: v })} placeholder="Adicionar colaborador qualificado..." /></div>
          {form.activityId && data.collaborators.filter((c) => c.active && (c.levels?.[form.activityId] || 0) >= (activity?.minLevel || 0)).length === 0 && (
            <div className="text-[10px] mt-1" style={{ color: T.danger }}>
              Ninguém tem o nível exigido em {activity?.name}. Peça treinamento em Treinamentos antes de encaixar.
            </div>
          )}
        </div>
        <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Médico(a) <span style={{ fontWeight: 400 }}>(se precisar)</span>
          <div className="mt-1"><SearchPick options={data.doctors.filter((d) => d.active
            && !(form.date && absenceOn(data.calendar, d.id, form.date, form.start, form.end)))}
            value={form.doctorId} onChange={(v) => set({ doctorId: v })} placeholder="Buscar médico..." /></div>
        </div>
        <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Equipamento <span style={{ fontWeight: 400 }}>(opcional)</span>
          <div className="mt-1"><SearchPick options={data.equipment.filter((e) => !e.isAccessory && e.active)} value={form.equipmentId} onChange={(v) => set({ equipmentId: v, accessoryIds: [] })} placeholder="Buscar equipamento..." /></div>
          {accessoryOptions.length > 0 && (
            <div className="mt-1 flex flex-wrap gap-1">
              {accessoryOptions.map((acc) => {
                const on = (form.accessoryIds || []).includes(acc.id);
                return (
                  <button key={acc.id} onClick={() => set({ accessoryIds: on ? form.accessoryIds.filter((x) => x !== acc.id) : [...(form.accessoryIds || []), acc.id] })}
                    className="text-[10px] px-2 py-0.5 rounded-full"
                    style={{ background: on ? T.accent : T.subtle, color: on ? "#fff" : T.inkMuted }}>{acc.name}</button>
                );
              })}
            </div>
          )}
        </div>
        <label className="text-xs font-medium" style={{ color: T.inkMuted }}>Participantes
          <input type="number" min={0} value={form.participants} onChange={(e) => set({ participants: e.target.value ? Number(e.target.value) : "" })}
            placeholder={participantLimit(location, activity) ? `até ${participantLimit(location, activity)}` : "opcional"}
            className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
        </label>
        <label className="text-xs font-medium sm:col-span-2" style={{ color: T.inkMuted }}>Motivo do encaixe
          <input value={form.reason} onChange={(e) => set({ reason: e.target.value })} placeholder="ex.: voluntário só pode nesse horário"
            className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
        </label>
      </div>

      {!validTime && <div className="text-[11px]" style={{ color: T.danger }}>O fim precisa ser depois do início.</div>}
      {staffShort && <div className="text-[11px]" style={{ color: T.danger }}>Faltam {times.staff - team.length} pessoa(s) — essa atividade exige {times.staff} ao mesmo tempo.</div>}
      {validTime && (times.setup > 0 || times.teardown > 0) && (
        <div className="text-[11px]" style={{ color: T.inkMuted }}>
          <Timer size={11} className="inline -mt-0.5 mr-1" />
          Com preparo e desmontagem, ocupa de {blk.start} a {blk.end} — é essa janela que precisa estar livre.
        </div>
      )}

      {conflicts.length > 0 && (
        <div style={{ background: T.dangerSoft, border: `1px solid ${T.danger}` }} className="rounded-lg p-2.5 space-y-1">
          <div className="text-[11px] font-medium" style={{ color: T.danger }}><AlertTriangle size={11} className="inline -mt-0.5 mr-1" />Conflito de agenda — encaixe não pode sobrepor reserva existente:</div>
          {conflicts.map((c, i) => <div key={i} className="text-[11px]" style={{ color: T.danger }}>• {c}</div>)}
        </div>
      )}

      {/* Demais regras do motor (nível, sala do método, calibração, acessório,
          capacidade) — as mesmas da edição de reserva. */}
      {blockingErrors.length > 0 && (
        <div style={{ background: T.dangerSoft, border: `1px solid ${T.danger}` }} className="rounded-lg p-2.5 space-y-1">
          <div className="text-[11px] font-medium" style={{ color: T.danger }}><AlertTriangle size={11} className="inline -mt-0.5 mr-1" />Não dá pra encaixar assim:</div>
          {blockingErrors.map((e, i) => <div key={i} className="text-[11px]" style={{ color: T.danger }}>• {e}</div>)}
        </div>
      )}
      {/* Se o que está no caminho é uma pré-reserva, mostra de quem é e
          oferece a saída — igual à edição de reserva em Estudos. */}
      <EstimateBlockerNotice blockers={check?.blockers} estimates={estimates} data={data}
        canSegurar={canSegurarEstimativa} onLiberar={onLiberarEstimativa} />
      {check?.warnings.length > 0 && blockingErrors.length === 0 && (
        <div style={{ background: T.goldSoft, border: `1px solid ${T.gold}` }} className="rounded-lg p-2.5 space-y-1">
          {check.warnings.map((w, i) => <div key={i} className="text-[11px]" style={{ color: T.gold }}>• {w}</div>)}
        </div>
      )}

      {conflicts.length === 0 && validTime && (
        needsOvertime ? (
          <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-lg p-2.5 space-y-1">
            <div className="text-[11px]" style={{ color: T.warn }}>
              <Timer size={11} className="inline -mt-0.5 mr-1" />
              Fora do horário normal de {staffOutside.map((o) => o.name).join(" e ")} — vai como <strong>solicitação de hora extra</strong>, não como reserva direta.
            </div>
            <div className="text-[10px]" style={{ color: T.inkMuted }}>A reserva só é criada depois que a pessoa aceitar e o gestor aprovar, em "Horas Extras".</div>
            {locationOutside && (
              <div className="text-[10px]" style={{ color: T.warn }}>Obs.: {location?.name} também está fora do horário cadastrado — confirme se a sala pode ser aberta.</div>
            )}
          </div>
        ) : locationOutside ? (
          // Sala fora do horário mas ninguém de fora: não existe hora extra de sala
          // (não há quem aceitar), então segue como reserva direta — mas avisando,
          // senão o usuário marca 19h numa sala que fecha às 18h sem perceber.
          <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-lg p-2.5 space-y-1">
            <div className="text-[11px]" style={{ color: T.warn }}>
              <AlertTriangle size={11} className="inline -mt-0.5 mr-1" />
              {location?.name} está fora do horário cadastrado nesse dia — confirme se a sala pode ser aberta.
            </div>
            <div className="text-[10px]" style={{ color: T.inkMuted }}>A equipe escolhida está dentro do horário dela, então isso vira <strong>reserva direta</strong>, sem hora extra.</div>
          </div>
        ) : (
          <div style={{ background: T.accentSoft, border: `1px solid ${T.accent}` }} className="rounded-lg p-2.5">
            <div className="text-[11px]" style={{ color: T.accentDark }}>
              <Check size={11} className="inline -mt-0.5 mr-1" />
              Dentro do horário normal de todo mundo — vai ser criada como <strong>reserva direta</strong>, sem precisar de hora extra.
            </div>
          </div>
        )
      )}

      <div className="flex gap-2">
        <Btn icon={needsOvertime ? Timer : Check} disabled={!canSubmit}
          onClick={() => onSubmit({ ...form, needsOvertime, staffOutside, study, activity, location, doctor,
            // Escolher um médico no encaixe marca a reserva como "exige médico",
            // pra ninguém removê-lo depois numa edição sem o sistema perceber.
            needDoctor: !!form.doctorId,
            blockStart: blk.start, blockEnd: blk.end })}>
          {needsOvertime ? "Solicitar hora extra" : "Criar reserva"}
        </Btn>
        <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
      </div>
    </div>
  );
}

/* A barra de filtros do Cronograma.
 *
 * Virou componente porque aparece em duas vistas e precisa ser a MESMA: filtro
 * que se perde ao trocar de vista faz a pessoa acreditar que a agenda mudou.
 *
 * As pastilhas de filtro ligado desligam UMA a uma. Antes só havia "limpar
 * tudo", que obrigava a refazer os outros três pra soltar um. */
function FiltroDoDia({ filters, setFilters, FILTROS_VAZIOS, ligados, data, studies,
  situacaoFiltro, setSituacaoFiltro, dayBookings, atividadeDe }) {
  const SITUACOES = [
    { id: "tudo", rotulo: "Tudo" },
    { id: "falta_equipe", rotulo: "Falta equipe" },
    { id: "pronta", rotulo: "Pronta" },
    { id: "andamento", rotulo: "Em andamento" },
    { id: "concluida", rotulo: "Concluída" },
  ];
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-3">
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Filtrar por:</div>
        {ligados.length > 0 && (
          <Btn small variant="ghost" icon={X} onClick={() => setFilters(FILTROS_VAZIOS)}>Limpar todos</Btn>
        )}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
        <SearchPick options={studies} value={filters.studyId} onChange={(v) => setFilters({ ...filters, studyId: v })} placeholder="Estudo..." />
        <SearchPick options={data.sponsors} value={filters.sponsorId} onChange={(v) => setFilters({ ...filters, sponsorId: v })} placeholder="Patrocinador..." />
        <SearchPick options={data.activities} value={filters.activityId} onChange={(v) => setFilters({ ...filters, activityId: v })} placeholder="Atividade..." />
        <SearchPick options={data.locations} value={filters.locationId} onChange={(v) => setFilters({ ...filters, locationId: v })} placeholder="Sala..." />
        <SearchPick options={data.equipment} value={filters.equipmentId} onChange={(v) => setFilters({ ...filters, equipmentId: v })} placeholder="Equipamento..."
          badge={(o) => o.accessoryIds?.length ? <Chip tone="gold">+{o.accessoryIds.length}</Chip> : null} />
        <SearchPick options={data.collaborators} value={filters.collaboratorId} onChange={(v) => setFilters({ ...filters, collaboratorId: v })} placeholder="Colaborador..." />
        <SearchPick options={data.doctors} value={filters.doctorId} onChange={(v) => setFilters({ ...filters, doctorId: v })} placeholder="Médico..." />
      </div>

      <div className="flex items-center gap-1.5 flex-wrap">
        <span className="text-xs font-medium" style={{ color: T.inkMuted }}>Situação:</span>
        {SITUACOES.map((f) => {
          const n = f.id === "tudo" ? dayBookings.length
            : dayBookings.filter((b) => situacaoDaReserva(b, atividadeDe(b)) === f.id).length;
          return (
            <button key={f.id} onClick={() => setSituacaoFiltro(f.id)} className="text-xs font-medium px-3 py-1.5 rounded-lg"
              style={{ background: situacaoFiltro === f.id ? T.accent : T.bg, color: situacaoFiltro === f.id ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>
              {f.rotulo} ({n})
            </button>
          );
        })}
      </div>

      {ligados.length > 0 && (
        <div className="flex items-center gap-1.5 flex-wrap pt-1" style={{ borderTop: `1px solid ${T.line}` }}>
          <span className="text-[10px] uppercase tracking-wide" style={{ color: T.inkMuted }}>Ligados:</span>
          {ligados.map((f) => (
            <button key={f.chave} onClick={() => setFilters({ ...filters, [f.chave]: null })}
              className="text-[11px] font-medium px-2 py-1 rounded-full flex items-center gap-1"
              style={{ background: T.accentSoft, color: T.accentDark }}>
              {f.rotulo}: {f.nome} <X size={10} />
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* A vista POR SALA — o dia como ele acontece.
 *
 * A agenda em grade responde "quando", mas não "o que está rolando ali". Numa
 * sala com três medições simultâneas e doze voluntárias, a grade mostra três
 * barras empilhadas e deixa a pessoa remontar de cabeça que aquilo é UMA cena.
 * Aqui cada quadro é uma sala num intervalo, com tudo que acontece dentro. */
function VistaPorSala({ blocos, data, studies, date, selectedBookingId, onSelectBooking }) {
  if (!blocos.length) {
    return (
      <div style={{ background: T.surface, border: `1px dashed ${T.line}` }} className="rounded-xl p-6 text-center text-xs">
        <span style={{ color: T.inkMuted }}>Nada marcado em {weekdayLabel(date)} com esses filtros.</span>
      </div>
    );
  }
  const nome = (lista, id, fallback) => (lista || []).find((x) => x.id === id)?.name || fallback;
  return (
    <div className="space-y-3">
      {blocos.map((bl) => {
        const varios = bl.bookings.length > 1;
        const estudosDoBloco = bl.estudos.map((id) => nome(studies, id, "sem estudo"));
        const dividida = bl.estudos.length > 1;
        const pessoas = [...new Set(bl.bookings.flatMap((b) => b.collaboratorIds || []))];
        return (
          <div key={`${bl.locationId}-${bl.start}`} style={{ background: T.surface, border: `1px solid ${dividida ? T.gold : varios ? T.accent : T.line}` }}
            className="rounded-xl overflow-hidden">
            <div className="px-4 py-2.5 flex items-center justify-between gap-3 flex-wrap"
              style={{ background: dividida ? T.goldSoft : varios ? T.accentSoft : T.subtle }}>
              <div className="text-sm font-semibold flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
                <Building2 size={14} style={{ color: T.accentDark }} />
                {nome(data.locations, bl.locationId, "sem sala")}
                <span className="text-xs font-normal" style={{ color: T.inkMuted, fontFamily: "'JetBrains Mono', monospace" }}>
                  {bl.start}–{bl.end}
                </span>
              </div>
              <div className="flex items-center gap-2 flex-wrap text-[11px]" style={{ color: T.inkMuted }}>
                <span>{bl.bookings.length} atividade(s)</span>
                {bl.participantes > 0 && <span>· {bl.participantes} participante(s)</span>}
                {pessoas.length > 0 && <span>· {pessoas.length} da equipe</span>}
                {dividida && <Chip tone="gold">sala dividida entre {bl.estudos.length} estudos</Chip>}
                {!dividida && estudosDoBloco[0] && <Chip tone="neutral">{estudosDoBloco[0]}</Chip>}
              </div>
            </div>

            <div className="p-2 space-y-1.5">
              {bl.bookings.map((b) => {
                const act = data.activities.find((a) => a.id === b.activityId);
                const sit = situacaoDaReserva(b, act);
                const meta = SITUACAO_META[sit];
                const escolhida = b.id === selectedBookingId;
                return (
                  <button key={b.id} onClick={() => onSelectBooking(b)} className="w-full text-left rounded-lg px-3 py-2"
                    style={{ background: escolhida ? T.accentSoft : T.bg, border: `1px solid ${escolhida ? T.accent : "transparent"}`,
                             borderLeft: `3px solid ${meta.cor}` }}>
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                      <div className="text-xs font-semibold flex items-center gap-1.5">
                        {act?.mestre && <Lock size={11} style={{ color: T.danger }} />}
                        {act?.name || "atividade"}
                        <span style={{ color: T.inkMuted, fontWeight: 400, fontFamily: "'JetBrains Mono', monospace" }}>{b.start}–{b.end}</span>
                        {(b.blockStart !== b.start || b.blockEnd !== b.end) && (
                          <span className="text-[10px]" style={{ color: T.inkMuted }}>
                            (ocupa {b.blockStart}–{b.blockEnd} com preparo)
                          </span>
                        )}
                      </div>
                      <div className="flex items-center gap-1.5">
                        {dividida && <Chip tone="neutral">{nome(studies, b.studyId, b.studyName || "sem estudo")}</Chip>}
                        <Chip tone={meta.tone}>{meta.rotulo}</Chip>
                      </div>
                    </div>
                    <div className="text-[10px] mt-1 flex flex-wrap gap-x-3" style={{ color: T.inkMuted }}>
                      <span><Users size={9} className="inline -mt-0.5 mr-1" />
                        {(b.collaboratorIds || []).length
                          ? (b.collaboratorIds || []).map((id) => nome(data.collaborators, id, "?")).join(", ")
                          : "sem equipe"}</span>
                      {b.equipmentId && <span><Package size={9} className="inline -mt-0.5 mr-1" />{nome(data.equipment, b.equipmentId, "aparelho")}</span>}
                      {b.doctorId && <span><Stethoscope size={9} className="inline -mt-0.5 mr-1" />{nome(data.doctors, b.doctorId, "médico")}</span>}
                      {b.participantCount > 0 && <span>{b.participantCount} participante(s)</span>}
                      {b.encaixe && <span style={{ color: T.warn }}>encaixe</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Schedule({ data, bookings, studies, onUpdateBookings, onCreateBookingAtomic, onDeleteBookingsAtomic, onRecordCancellation, canPlanejar, canSolicitarHoraExtra, onCreateOvertimeRequest, actorName, canGerenciar, myPersonId, podeSupervisionar,
  estimates, canSegurarEstimativa, onLiberarEstimativa }) {
  const [date, setDate] = useState(todayStr());
  const FILTROS_VAZIOS = { locationId: null, equipmentId: null, collaboratorId: null, doctorId: null, sponsorId: null, studyId: null, activityId: null };
  const [filters, setFilters] = useState(FILTROS_VAZIOS);
  const [situacaoFiltro, setSituacaoFiltro] = useState("tudo");
  const [studySearch, setStudySearch] = useState("");
  const [completingId, setCompletingId] = useState(null);
  const [actualEndInput, setActualEndInput] = useState("");
  const [viewMode, setViewMode] = useState("agenda"); // "agenda" | "planta"
  const [tipoFiltro, setTipoFiltro] = useState("tudo"); // nível de compromisso
  const [agendaCategory, setAgendaCategory] = useState("location");
  const [selectedBookingId, setSelectedBookingId] = useState(null);
  const [encaixe, setEncaixe] = useState(null); // null = fechado; objeto = valores iniciais do formulário
  const [encaixeMsg, setEncaixeMsg] = useState("");

  // Abre o formulário de encaixe já preenchido com o que o usuário clicou na Agenda
  // (recurso + hora da faixa fora do horário) — é o caminho que o pedido descreve:
  // ver o buraco fora do expediente e pedir ali mesmo.
  const openEncaixe = (preset = {}) => {
    setEncaixeMsg("");
    setEncaixe({ date, start: "18:00", end: "19:00", locationId: null, collaboratorId: null, doctorId: null, ...preset });
  };
  const submitEncaixe = async (payload) => {
    if (payload.needsOvertime) {
      // Fora do horário de alguém: vira pedido de hora extra carregando tudo que a
      // reserva vai precisar depois (ver criarReservaDeHoraExtra no OvertimeBoard).
      const person = payload.staffOutside[0];
      const req = {
        id: genId("ovt"), origin: "encaixe", studyId: payload.studyId, studyName: payload.study?.name || "Estudo sem nome",
        activityId: payload.activityId, activityName: payload.activity?.name || "—",
        date: payload.date, start: payload.start, end: payload.end,
        locationId: payload.locationId, locationName: payload.location?.name || "—",
        role: person.kind === "doctor" ? "doctor" : "collaborator", personId: person.id, personName: person.name,
        collaboratorIds: payload.collaboratorIds || [], doctorId: payload.doctorId,
        equipmentId: payload.equipmentId || null, accessoryIds: payload.accessoryIds || [],
        participantCount: payload.participants || null,
        blockStart: payload.blockStart, blockEnd: payload.blockEnd,
        sponsorId: payload.study?.sponsorId || null, minLevel: payload.activity?.minLevel ?? 0, reason: payload.reason,
        requestedBy: actorName || "usuário sem identificação", requestedAt: new Date().toISOString(),
        status: "pendente", decidedAt: null, decidedBy: null, approvedAt: null, approvedBy: null, bookingId: null,
      };
      // Fechar o formulário e dizer "solicitada" só depois de gravar de fato.
      const ok = await onCreateOvertimeRequest(req);
      if (ok === false) return;
      setEncaixe(null);
      setEncaixeMsg(`Hora extra solicitada pra ${person.name} — acompanhe em "Horas Extras".`);
      return;
    }
    const booking = {
      id: genId("bk"), studyId: payload.studyId, timepointId: null, studyName: payload.study?.name || "Estudo sem nome",
      sponsorId: payload.study?.sponsorId || null, date: payload.date, start: payload.start, end: payload.end,
      blockStart: payload.blockStart, blockEnd: payload.blockEnd,
      locationId: payload.locationId, equipmentId: payload.equipmentId || null, accessoryIds: payload.accessoryIds || [],
      activityId: payload.activityId, minLevel: payload.activity?.minLevel ?? 0,
      collaboratorIds: payload.collaboratorIds || [], doctorId: payload.doctorId || null,
      needDoctor: !!payload.needDoctor,
      participantCount: payload.participants || null,
      createdBy: actorName || "usuário sem identificação",
      status: bookingStatusFor({
        collaboratorIds: payload.collaboratorIds || [], needDoctor: !!payload.needDoctor, doctorId: payload.doctorId || null,
      }, payload.activity),
      encaixe: true, encaixeReason: payload.reason,
    };
    // Reserva + baixa de estoque numa transação só, e mensagem/fechamento da
    // tela só depois que ENTROU. Antes eram duas gravações separadas (a segunda
    // podia falhar) e a tela dizia "Encaixe criado" de qualquer jeito.
    const ok = await onCreateBookingAtomic(booking);
    if (!ok) return;
    setEncaixe(null);
    setDate(payload.date);
    setEncaixeMsg("Encaixe criado como reserva.");
  };

  const dayBookings = bookings.filter((b) => b.date === date).sort((a, b) => a.start.localeCompare(b.start));
  const removeBooking = async (id) => {
    const removed = bookings.find((b) => b.id === id);
    if (!removed) return;
    // Exclusão e devolução de estoque na mesma transação.
    // O registro de cancelamento entra na mesma transação (motivo "excluído").
    await onDeleteBookingsAtomic([removed], [], "excluído");
  };
  const startCompleting = (b) => { setCompletingId(b.id); setActualEndInput(nowHHMM()); };
  const markCompleted = async (booking) => {
    // Se a atividade foi iniciada pelo botão, o começo real é a hora do clique;
    // senão cai no horário planejado (reserva antiga, ou quem só marcou o fim).
    const next = bookings.map((b) => b.id === booking.id
      ? { ...b, actualStart: b.actualStart || b.start, actualEnd: actualEndInput, completedAt: new Date().toISOString() }
      : b);
    const gravou = await onUpdateBookings(next);
    if (gravou === false) return;
    setCompletingId(null);
  };
  // Iniciar/finalizar: quem está na sala confirma que a atividade começou e
  // terminou de fato. Além da confirmação em si, é isso que alimenta a duração
  // real usada pra melhorar as próximas sugestões (avgActualDuration).
  const startActivity = async (booking) => {
    await onUpdateBookings(bookings.map((b) => b.id === booking.id
      ? { ...b, actualStart: nowHHMM(), startedAt: new Date().toISOString() } : b));
  };
  const undoStart = async (booking) => {
    await onUpdateBookings(bookings.map((b) => {
      if (b.id !== booking.id) return b;
      const c = { ...b }; delete c.actualStart; delete c.startedAt; return c;
    }));
  };

  const filtersActive = Object.values(filters).some(Boolean);
  /* Filtro por nível de compromisso: a agenda passou a misturar três coisas
   * diferentes, e quem está resolvendo o dia de hoje quase sempre quer ver
   * só o que é compromisso de verdade. */
  const TIPO_FILTROS = [
    { id: "tudo", label: "Tudo", teste: () => true },
    { id: "reservas", label: "Só reservas", teste: (b) => bookingTypeOf(b) === "reservation" },
    { id: "estimativas", label: "Só estimativas", teste: (b) => bookingTypeOf(b) === "estimate" },
    { id: "segurando", label: "Só o que bloqueia", teste: (b) => bookingOccupies(b) },
    { id: "treinamentos", label: "Só treinamentos", teste: (b) => bookingTypeOf(b) === "training" },
  ];
  const testeTipo = TIPO_FILTROS.find((f) => f.id === tipoFiltro).teste;
  const atividadeDe = (b) => data.activities.find((a) => a.id === b.activityId);
  const filteredDayBookings = dayBookings.filter((b) =>
    testeTipo(b)
    && (situacaoFiltro === "tudo" || situacaoDaReserva(b, atividadeDe(b)) === situacaoFiltro)
    && (!filters.locationId || b.locationId === filters.locationId)
    && (!filters.equipmentId || bookingMatchesResource(b, "equipment", filters.equipmentId))
    && (!filters.collaboratorId || (b.collaboratorIds || []).includes(filters.collaboratorId))
    && (!filters.doctorId || b.doctorId === filters.doctorId)
    && (!filters.sponsorId || b.sponsorId === filters.sponsorId)
    && (!filters.studyId || b.studyId === filters.studyId)
    && (!filters.activityId || b.activityId === filters.activityId));

  const resumo = useMemo(() => resumoDoDia(dayBookings, data), [dayBookings, data]);
  const blocosDoDia = useMemo(() => blocosDeSala(filteredDayBookings, data.activities), [filteredDayBookings, data.activities]);
  /* Os filtros ligados, em pastilhas que se desligam uma a uma. Um botão único
   * de "limpar tudo" obriga a refazer os outros três pra soltar um só. */
  const CAMPOS_FILTRO = [
    { chave: "studyId", rotulo: "Estudo", lista: studies },
    { chave: "sponsorId", rotulo: "Patrocinador", lista: data.sponsors },
    { chave: "activityId", rotulo: "Atividade", lista: data.activities },
    { chave: "locationId", rotulo: "Sala", lista: data.locations },
    { chave: "equipmentId", rotulo: "Equipamento", lista: data.equipment },
    { chave: "collaboratorId", rotulo: "Colaborador", lista: data.collaborators },
    { chave: "doctorId", rotulo: "Médico", lista: data.doctors },
  ];
  const ligados = CAMPOS_FILTRO.filter((f) => filters[f.chave])
    .map((f) => ({ ...f, nome: (f.lista || []).find((x) => x.id === filters[f.chave])?.name || "?" }));

  const studyMatches = useMemo(() => {
    if (!studySearch.trim()) return [];
    return bookings.filter((b) => b.studyName.toLowerCase().includes(studySearch.toLowerCase()))
      .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))
      .map((b) => ({ booking: b }));
  }, [studySearch, bookings]);

  return (
    <div className="space-y-5">
      <Section icon={CalendarClock} title="Cronograma" subtitle="Visão diária de ocupação e sugestões de otimização"
        right={<div className="flex items-center gap-1">
          {(canPlanejar || canSolicitarHoraExtra) && !encaixe && (
            <Btn small variant="subtle" icon={Zap} onClick={() => openEncaixe()} title="Reserva avulsa — inclusive fora do horário normal, virando pedido de hora extra">Encaixe</Btn>
          )}
          <Btn small variant="ghost" icon={ChevronLeft} onClick={() => setDate(addDays(date, -1))} />
          <div style={{ border: `1px solid ${T.line}` }} className="text-xs px-3 py-1.5 rounded-lg font-medium">{weekdayLabel(date)}</div>
          <Btn small variant="ghost" icon={ChevronRight} onClick={() => setDate(addDays(date, 1))} />
        </div>} />

      {encaixeMsg && (
        <div style={{ background: T.accentSoft, border: `1px solid ${T.accent}`, color: T.accentDark }} className="rounded-xl p-3 text-xs flex items-center justify-between gap-2">
          <span className="flex items-center gap-2"><Check size={13} /> {encaixeMsg}</span>
          <button onClick={() => setEncaixeMsg("")}><X size={13} /></button>
        </div>
      )}

      {encaixe && (
        <EncaixeForm data={data} bookings={bookings} studies={studies} initial={encaixe}
          onSubmit={submitEncaixe} onCancel={() => setEncaixe(null)}
          estimates={estimates} canSegurarEstimativa={canSegurarEstimativa} onLiberarEstimativa={onLiberarEstimativa} />
      )}

      {/* O dia em números. Cada um responde uma pergunta que alguém faz de
          manhã — e os que apontam problema levam direto ao filtro que os
          isola, em vez de mandar a pessoa procurar. */}
      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl px-4 py-3 flex items-center gap-6 flex-wrap">
        {[
          [resumo.atividades, "atividades", null, null],
          [resumo.salas, "salas em uso", null, null],
          [resumo.pessoas, "pessoas escaladas", null, null],
          [resumo.estudos, "estudos", null, null],
          [resumo.participantes || "—", "participantes", null, null],
          [`${resumo.horas}h`, "de ocupação", null, null],
          [resumo.andamento, "em andamento", resumo.andamento ? T.accent : null, () => setSituacaoFiltro("andamento")],
          [resumo.faltando, "sem equipe completa", resumo.faltando ? T.warn : null, () => setSituacaoFiltro("falta_equipe")],
          [resumo.concluidas, "concluídas", null, () => setSituacaoFiltro("concluida")],
          ...(resumo.previsoes ? [[resumo.previsoes, "previsões sem bloqueio", T.gold, () => setTipoFiltro("estimativas")]] : []),
        ].map(([v, r, cor, acao]) => (
          <button key={r} onClick={acao || undefined} disabled={!acao}
            className="text-left" style={{ cursor: acao ? "pointer" : "default" }}>
            <div className="text-lg font-bold" style={{ color: cor || T.ink, fontFamily: "'Space Grotesk', sans-serif" }}>{v}</div>
            <div className="text-[10px] uppercase tracking-wide" style={{ color: T.inkMuted }}>{r}</div>
          </button>
        ))}
      </div>

      <div className="flex items-center gap-1.5 flex-wrap">
        <span className="text-xs font-medium" style={{ color: T.inkMuted }}>Visão:</span>
        {[{ id: "agenda", label: "Agenda", icon: CalendarClock }, { id: "salas", label: "Por sala", icon: Layers }, { id: "planta", label: "Planta baixa", icon: Building2 }].map((v) => (
          <button key={v.id} onClick={() => setViewMode(v.id)} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg"
            style={{ background: viewMode === v.id ? T.accent : T.surface, color: viewMode === v.id ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>
            <v.icon size={13} /> {v.label}
          </button>
        ))}
      </div>

      {/* Study lookup */}
      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-3">
        <div className="flex items-center gap-2">
          <Search size={14} style={{ color: T.inkMuted }} />
          <input value={studySearch} onChange={(e) => setStudySearch(e.target.value)} placeholder="Buscar por nome do estudo/protocolo — ver todas as reservas dele, em qualquer data..."
            className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
          {studySearch && <Btn small variant="ghost" icon={X} onClick={() => setStudySearch("")}>Limpar</Btn>}
        </div>
        {studySearch.trim() && (
          <div className="rounded-lg overflow-hidden" style={{ border: `1px solid ${T.line}` }}>
            {studyMatches.length === 0 && <div className="px-3 py-3 text-xs" style={{ color: T.inkMuted }}>Nenhuma reserva encontrada para "{studySearch}".</div>}
            {studyMatches.map(({ booking }) => (
              <BookingRow key={booking.id} b={booking} data={data} bookings={bookings}
                completingId={completingId} actualEndInput={actualEndInput} onSetActualEnd={setActualEndInput}
                onStartCompleting={startCompleting} onMarkCompleted={markCompleted} onCancelCompleting={() => setCompletingId(null)}
                onRemove={removeBooking} onStartActivity={startActivity} onUndoStart={undoStart}
                canGerenciar={canGerenciar} myPersonId={myPersonId} podeSupervisionar={podeSupervisionar} />
            ))}
          </div>
        )}
      </div>

      {viewMode === "agenda" && (() => {
        const AGENDA_CATS = [
          { id: "location", label: "Locais", icon: Building2, items: data.locations },
          { id: "equipment", label: "Equipamentos", icon: Package, items: data.equipment },
          { id: "collaborator", label: "Colaboradores", icon: Users, items: data.collaborators },
          { id: "doctor", label: "Médicos", icon: Stethoscope, items: data.doctors },
        ];
        const activeAgendaCat = AGENDA_CATS.find((c) => c.id === agendaCategory);
        const categoryFilterKey = { location: "locationId", equipment: "equipmentId", collaborator: "collaboratorId", doctor: "doctorId" }[agendaCategory];
        const itemsToShow = categoryFilterKey && filters[categoryFilterKey]
          ? activeAgendaCat.items.filter((i) => i.id === filters[categoryFilterKey])
          : activeAgendaCat.items;
        return (
          <React.Fragment>
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-medium" style={{ color: T.inkMuted }}>Linhas por:</span>
              {AGENDA_CATS.map((c) => (
                <button key={c.id} onClick={() => setAgendaCategory(c.id)} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg"
                  style={{ background: agendaCategory === c.id ? T.accent : T.surface, color: agendaCategory === c.id ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>
                  <c.icon size={13} /> {c.label}
                </button>
              ))}
            </div>
            {/* Filtro por nível de compromisso. Fica junto do "linhas por"
                porque é a mesma decisão: o que eu quero enxergar agora. */}
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-medium" style={{ color: T.inkMuted }}>Mostrar:</span>
              {TIPO_FILTROS.map((f) => {
                const n = dayBookings.filter(f.teste).length;
                return (
                  <button key={f.id} onClick={() => setTipoFiltro(f.id)} className="text-xs font-medium px-3 py-1.5 rounded-lg"
                    style={{ background: tipoFiltro === f.id ? T.accent : T.surface, color: tipoFiltro === f.id ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>
                    {f.label} ({n})
                  </button>
                );
              })}
            </div>

            <FiltroDoDia filters={filters} setFilters={setFilters} FILTROS_VAZIOS={FILTROS_VAZIOS}
              ligados={ligados} data={data} studies={studies}
              situacaoFiltro={situacaoFiltro} setSituacaoFiltro={setSituacaoFiltro}
              dayBookings={dayBookings} atividadeDe={atividadeDe} />

            <AgendaView items={itemsToShow} bookings={filteredDayBookings} category={agendaCategory} dateStr={date}
              onSelectBooking={(b) => setSelectedBookingId(b.id === selectedBookingId ? null : b.id)} selectedBookingId={selectedBookingId}
              onRequestEncaixe={(canPlanejar || canSolicitarHoraExtra) ? ((item, start) => {
                const preset = { date, start, end: addMinutes(start, 60) };
                if (agendaCategory === "location") preset.locationId = item.id;
                if (agendaCategory === "collaborator") preset.collaboratorId = item.id;
                if (agendaCategory === "doctor") preset.doctorId = item.id;
                openEncaixe(preset);
              }) : null} />

            <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
              <div className="px-4 py-2.5 text-sm font-medium" style={{ borderBottom: `1px solid ${T.line}`, fontFamily: "'Space Grotesk', sans-serif" }}>
                Reservas de {weekdayLabel(date)}{filtersActive && <span style={{ color: T.inkMuted, fontWeight: 400 }}> · filtradas</span>}
              </div>
              {filteredDayBookings.length === 0 && <div className="px-4 py-4 text-xs" style={{ color: T.inkMuted }}>Nenhuma reserva {filtersActive ? "com esses filtros" : "neste dia"}.</div>}
              {filteredDayBookings.map((b) => (
                <BookingRow key={b.id} b={b} data={data} bookings={bookings}
                  completingId={completingId} actualEndInput={actualEndInput} onSetActualEnd={setActualEndInput}
                  onStartCompleting={startCompleting} onMarkCompleted={markCompleted} onCancelCompleting={() => setCompletingId(null)}
                  onRemove={removeBooking} onStartActivity={startActivity} onUndoStart={undoStart}
                canGerenciar={canGerenciar} myPersonId={myPersonId} podeSupervisionar={podeSupervisionar} />
              ))}
            </div>
          </React.Fragment>
        );
      })()}

      {viewMode === "salas" && (
        <React.Fragment>
          <FiltroDoDia filters={filters} setFilters={setFilters} FILTROS_VAZIOS={FILTROS_VAZIOS}
            ligados={ligados} data={data} studies={studies}
            situacaoFiltro={situacaoFiltro} setSituacaoFiltro={setSituacaoFiltro}
            dayBookings={dayBookings} atividadeDe={atividadeDe} />
          <VistaPorSala blocos={blocosDoDia} data={data} studies={studies} date={date}
            selectedBookingId={selectedBookingId}
            onSelectBooking={(b) => setSelectedBookingId(b.id === selectedBookingId ? null : b.id)} />
        </React.Fragment>
      )}

      {viewMode === "planta" && <FloorPlanView locations={data.locations} bookings={bookings} dateStr={date} />}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Registry (Cadastro) — admin gated                                       */
/* ---------------------------------------------------------------------- */
function Registry({ data, bookings, canCadastro, onUpdateCat }) {
  const [cat, setCat] = useState("locations");
  const [editing, setEditing] = useState(null);
  const [avisoExclusao, setAvisoExclusao] = useState("");

  const CATS = [
    { id: "locations", label: "Locais", icon: Building2 },
    { id: "equipment", label: "Equipamentos", icon: Package },
    { id: "accessories", label: "Acessórios", icon: Tag },
    { id: "activities", label: "Atividades", icon: ClipboardList },
    { id: "doctors", label: "Médicos", icon: Stethoscope },
    { id: "collaborators", label: "Colaboradores", icon: Users },
    { id: "supplies", label: "Suprimentos", icon: Boxes },
    { id: "niches", label: "Nichos", icon: Tag },
    { id: "sponsors", label: "Patrocinadores", icon: Briefcase },
    { id: "trainingTypes", label: "Tipos de treinamento", icon: GraduationCap },
  ];

  const realCat = (c) => (c === "accessories" ? "equipment" : c);
  const itemsFor = (c) => {
    if (c === "equipment") return data.equipment.filter((e) => !e.isAccessory);
    if (c === "accessories") return data.equipment.filter((e) => e.isAccessory);
    // Base semeada antes dos tipos de treinamento existirem não tem a coleção.
    return data[c] || [];
  };
  const currentItems = itemsFor(cat);

  const upsert = (item) => {
    const rc = realCat(cat);
    const list = data[rc];
    const exists = list.some((x) => x.id === item.id);
    onUpdateCat(rc, exists ? list.map((x) => (x.id === item.id ? item : x)) : [...list, item]);
    setEditing(null);
  };
  // Recurso que já apareceu numa reserva NÃO pode ser excluído de verdade —
  // reserva histórica ficaria apontando pra um id que não existe mais, e num
  // sistema clínico o histórico precisa continuar legível. Nesse caso a
  // exclusão vira inativação, que é o que já resolve na prática: o recurso
  // some das sugestões e continua nomeável no que já passou.
  const usadoEmReserva = (id) => (bookings || []).some((b) =>
    b.locationId === id || b.equipmentId === id || b.doctorId === id
    || (b.accessoryIds || []).includes(id) || (b.collaboratorIds || []).includes(id));
  const remove = (id) => {
    const rc = realCat(cat);
    const item = data[rc].find((x) => x.id === id);
    if (item && usadoEmReserva(id)) {
      setAvisoExclusao(`"${item.name}" já foi usado em reservas e não pode ser excluído — foi INATIVADO. Ele some das sugestões e o histórico continua legível.`);
      onUpdateCat(rc, data[rc].map((x) => (x.id === id ? { ...x, active: false } : x)));
      return;
    }
    onUpdateCat(rc, data[rc].filter((x) => x.id !== id));
  };
  const toggleDay = (item, day) => upsert({ ...item, availability: { ...item.availability, [day]: !item.availability[day] } });
  const toggleActive = (item) => upsert({ ...item, active: !item.active });

  const hasAvailability = ["locations", "equipment", "accessories", "doctors", "collaborators"].includes(cat);

  // Atividade "sem regra decidida" é a que não tem nenhum dos dois campos —
  // diferente de decidida como "nem mestre nem cedível", que é escolha válida.
  const semRegraDecidida = (data.activities || []).filter((a) => a.mestre === undefined && a.cedivel === undefined).length;
  const aplicarRegrasSugeridas = () => {
    const { next, mudadas } = aplicarSugestaoDeRegras(data.activities || []);
    if (mudadas) onUpdateCat("activities", next);
  };

  return (
    <div className="space-y-5">
      {!canCadastro && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 flex items-center gap-2 text-xs">
          <Lock size={14} /> Modo somente leitura — seu usuário não tem permissão pra incluir, editar ou excluir itens.
        </div>
      )}

      <div className="flex gap-1.5 flex-wrap">
        {CATS.map((c) => (
          <button key={c.id} onClick={() => { setCat(c.id); setEditing(null); }} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg"
            style={{ background: cat === c.id ? T.accent : T.surface, color: cat === c.id ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>
            <c.icon size={13} /> {c.label} <Chip tone="neutral">{itemsFor(c.id).length}</Chip>
          </button>
        ))}
      </div>

      {/* Cadastro criado antes de a regra de troca existir não tem os campos —
          e a semeadura não reescreve cadastro em uso, com razão. O botão faz a
          ponte, uma vez, com quem clicou sabendo o que gravou. Some depois de
          todas as atividades estarem decididas. */}
      {cat === "activities" && canCadastro && semRegraDecidida > 0 && (
        <div style={{ background: T.goldSoft, border: `1px solid ${T.gold}` }} className="rounded-xl p-3 flex items-center justify-between gap-3 flex-wrap">
          <div className="text-xs" style={{ color: T.ink }}>
            <strong>{semRegraDecidida} atividade(s) sem regra de troca definida.</strong> Sem isso, ninguém é
            cedível nem mestre, e a coluna de disponibilidade só oferece "pedir".
          </div>
          <Btn small variant="subtle" icon={Wand2} onClick={aplicarRegrasSugeridas}
            title="Marca Apoio e Fluxo como cedíveis e as avaliações com aparelho como mestres. Não mexe no que você já decidiu.">
            Aplicar o combinado padrão
          </Btn>
        </div>
      )}

      {cat === "accessories" && (
        <div style={{ background: T.accentSoft, border: `1px solid ${T.accent}`, color: T.accentDark }} className="rounded-xl p-3 text-xs">
          Acessórios são cadastrados aqui, separados dos equipamentos. Depois, na aba <strong>Equipamentos</strong>, você vincula quais acessórios cada equipamento tem disponível.
        </div>
      )}

      {avisoExclusao && (
        <div style={{ background: T.goldSoft, border: `1px solid ${T.gold}`, color: T.gold }} className="rounded-xl p-3 text-xs flex items-start justify-between gap-2">
          <span><Info size={13} className="inline -mt-0.5 mr-1" />{avisoExclusao}</span>
          <button onClick={() => setAvisoExclusao("")}><X size={13} /></button>
        </div>
      )}

      {canCadastro && <ItemForm cat={cat} data={data} editing={editing} onSubmit={upsert} onCancel={() => setEditing(null)} />}

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        {currentItems.map((item) => (
          <div key={item.id} style={{ background: T.surface, border: `1px solid ${T.line}`, opacity: item.active === false ? 0.55 : 1 }} className="rounded-xl p-3.5">
            <div className="flex items-start justify-between">
              <div className="min-w-0">
                <div className="text-sm font-medium truncate">{item.name}</div>
                <div className="text-[11px]" style={{ color: T.inkMuted }}>
                  {cat === "equipment" && (item.accessoryIds?.length ? `${item.accessoryIds.length} acessório(s) vinculado(s)` : "sem acessórios vinculados")}
                  {cat === "accessories" && "acessório vinculável a equipamentos"}
                  {cat === "collaborators" && Object.keys(item.levels || {}).length + " atividade(s) habilitada(s)"}
                  {cat === "sponsors" && (data.niches.find((n) => n.id === item.nicheId)?.name || "—")}
                  {cat === "niches" && "catálogo de nicho"}
                  {cat === "activities" && <span className="inline-flex items-center gap-1.5">Nível exigido: <Stars level={item.minLevel || 0} /> · {item.durationMin ?? 60} min</span>}
                  {(cat === "locations" || cat === "doctors") && "recurso agendável"}
                  {cat === "supplies" && `${item.quantity ?? 0} ${item.unit || "un"} em estoque · mínimo ${item.minThreshold ?? 0}`}
                  {cat === "trainingTypes" && `${item.durationMin || TRAINING_DEFAULT_MIN} min · nível ${item.requiredLevel ?? 3}${item.activityId ? ` · ${data.activities.find((a) => a.id === item.activityId)?.name || "?"}` : ""}`}
                </div>
                {cat === "collaborators" && Object.keys(item.levels || {}).length > 0 && (
                  <div className="mt-1.5 space-y-0.5">
                    {Object.entries(item.levels).slice(0, 4).map(([actId, star]) => {
                      const act = data.activities.find((a) => a.id === actId);
                      return <div key={actId} className="flex items-center gap-1.5 text-[11px]"><span className="truncate max-w-[140px]" style={{ color: T.inkMuted }}>{act?.name}</span><Stars level={star} /></div>;
                    })}
                  </div>
                )}
                {cat === "activities" && (item.mestre || item.cedivel) && (
                  <div className="mt-1.5">
                    {item.mestre ? <Chip tone="danger">mestre — equipe fixa</Chip> : <Chip tone="accent">cedível</Chip>}
                  </div>
                )}
                {cat === "activities" && (
                  <div className="flex flex-wrap gap-1 mt-1.5">
                    {(item.locationIds || []).length === 0 ? <span className="text-[10px]" style={{ color: T.inkMuted }}>qualquer sala</span> :
                      item.locationIds.map((id) => <Chip key={id}>{data.locations.find((l) => l.id === id)?.name || "?"}</Chip>)}
                  </div>
                )}
                {cat === "equipment" && item.accessoryIds?.length > 0 && (
                  <div className="flex flex-wrap gap-1 mt-1.5">{item.accessoryIds.map((id) => <Chip key={id}>{data.equipment.find((e) => e.id === id)?.name || "?"}</Chip>)}</div>
                )}
                {cat === "accessories" && (() => {
                  const usedBy = data.equipment.filter((e) => !e.isAccessory && (e.accessoryIds || []).includes(item.id));
                  return usedBy.length > 0 ? (
                    <div className="flex flex-wrap gap-1 mt-1.5">
                      <span className="text-[10px]" style={{ color: T.inkMuted }}>usado em:</span>
                      {usedBy.map((e) => <Chip key={e.id} tone="gold">{e.name}</Chip>)}
                    </div>
                  ) : <div className="text-[10px] mt-1" style={{ color: T.inkMuted }}>ainda não vinculado a nenhum equipamento</div>;
                })()}
                {(cat === "equipment" || cat === "accessories") && (() => {
                  const av = windowFreeCount(item.id, data.equipment, bookings, todayStr(), todayStr());
                  return (
                    <div className="mt-1.5 text-[11px] flex items-center gap-1" style={{ color: T.inkMuted }}>
                      <Boxes size={11} /> {av.free} de {av.total} do mesmo tipo disponíveis agora · {av.total - av.free} agendado(s) hoje
                    </div>
                  );
                })()}
                {/* Quais atividades a sala recebe. É o MESMO vínculo que o
                    método já tinha ("salas permitidas"), só que editável pelo
                    lado da sala — que é como a pessoa pensa ao cadastrar. Grava
                    em activity.locationIds pra não existirem duas verdades. */}
                {cat === "locations" && (() => {
                  const recebe = data.activities.filter((a) => (a.locationIds || []).includes(item.id));
                  const toggle = (act) => {
                    const on = (act.locationIds || []).includes(item.id);
                    onUpdateCat("activities", data.activities.map((a) => (a.id !== act.id ? a : {
                      ...a, locationIds: on ? a.locationIds.filter((id) => id !== item.id) : [...(a.locationIds || []), item.id],
                    })));
                  };
                  return (
                    <div className="mt-2">
                      <div className="text-[10px] font-medium" style={{ color: T.inkMuted }}>
                        Atividades que esta sala recebe {recebe.length > 0 && `(${recebe.length})`}
                      </div>
                      {!canCadastro ? (
                        <div className="flex flex-wrap gap-1 mt-1">
                          {recebe.length === 0
                            ? <span className="text-[10px]" style={{ color: T.danger }}>nenhuma — esta sala não entra em nenhum agendamento</span>
                            : recebe.map((a) => <Chip key={a.id}>{a.name}</Chip>)}
                        </div>
                      ) : (
                        <div className="flex flex-wrap gap-1 mt-1 max-h-28 overflow-y-auto">
                          {data.activities.map((a) => {
                            const on = (a.locationIds || []).includes(item.id);
                            return (
                              <button key={a.id} onClick={() => toggle(a)} className="text-[10px] px-2 py-0.5 rounded-full"
                                style={{ background: on ? T.accent : T.subtle, color: on ? "#fff" : T.inkMuted }}>{a.name}</button>
                            );
                          })}
                        </div>
                      )}
                      {recebe.length === 0 && canCadastro && (
                        <div className="text-[10px] mt-1" style={{ color: T.danger }}>
                          Sem nenhuma atividade marcada, esta sala nunca é escolhida no agendamento.
                        </div>
                      )}
                    </div>
                  );
                })()}
                {cat === "locations" && (() => {
                  const week = freeDaysCount(item.id, bookings, todayStr(), 7);
                  const month = freeDaysCount(item.id, bookings, todayStr(), 30);
                  return (
                    <div className="mt-1.5 text-[11px] flex items-center gap-1" style={{ color: T.inkMuted }}>
                      <CalendarRange size={11} /> {week} vaga(s) livre(s) essa semana · {month} no mês
                    </div>
                  );
                })()}
                {(cat === "equipment" || cat === "accessories") && (() => {
                  const cal = calibrationStatus(item);
                  if (!cal) return null;
                  const tone = cal.status === "vencido" ? "danger" : cal.status === "vencendo" ? "warn" : "accent";
                  const label = cal.status === "vencido" ? `calibração vencida (${weekdayLabel(cal.due)})` : cal.status === "vencendo" ? `calibração vence em ${cal.daysLeft}d` : `calibração ok até ${weekdayLabel(cal.due)}`;
                  return <div className="mt-1.5"><Chip tone={tone}><History size={10} className="inline -mt-0.5 mr-0.5" />{label}</Chip></div>;
                })()}
                {cat === "supplies" && (item.quantity ?? 0) <= (item.minThreshold ?? 0) && (
                  <div className="mt-1.5"><Chip tone="danger"><AlertTriangle size={10} className="inline -mt-0.5 mr-0.5" />estoque baixo</Chip></div>
                )}
                {["locations", "equipment", "accessories", "collaborators"].includes(cat) && item.hourlyCost != null && (
                  <div className="mt-1.5 text-[11px] flex items-center gap-1" style={{ color: T.inkMuted }}>
                    <Wallet size={11} /> R$ {item.hourlyCost.toFixed(2)}/h
                  </div>
                )}
              </div>
              {canCadastro && (
                <div className="flex gap-1 shrink-0">
                  <button onClick={() => setEditing(item)} style={{ color: T.accentDark }}><Pencil size={14} /></button>
                  <button onClick={() => remove(item.id)} style={{ color: T.danger }}><Trash2 size={14} /></button>
                </div>
              )}
            </div>
            {hasAvailability && (
              <div className="flex gap-1 mt-2.5 items-center flex-wrap">
                {["mon", "tue", "wed", "thu", "fri", "sat", "sun"].map((d) => (
                  <button key={d} disabled={!canCadastro} onClick={() => toggleDay(item, d)} className="text-[10px] w-7 h-7 rounded-md font-medium uppercase disabled:cursor-default"
                    style={{ background: item.availability[d] ? T.accentSoft : T.subtle, color: item.availability[d] ? T.accentDark : T.inkMuted }}>{d.slice(0, 2)}</button>
                ))}
                <span className="text-[11px] ml-1" style={{ color: T.inkMuted, fontFamily: "'JetBrains Mono', monospace" }}>{item.availability.start}–{item.availability.end}</span>
                {canCadastro && <button onClick={() => toggleActive(item)} className="ml-auto"><Chip tone={item.active === false ? "danger" : "accent"}>{item.active === false ? "inativo" : "ativo"}</Chip></button>}
              </div>
            )}
          </div>
        ))}
        {currentItems.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhum item cadastrado ainda.</div>}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Custos — edição rápida de R$/h sem abrir o formulário completo de cada  */
/* item; agrega locais + equipamentos + colaboradores numa lista só.       */
/* ---------------------------------------------------------------------- */
function CostsEditor({ data, onUpdateCat, canCustos }) {
  const [drafts, setDrafts] = useState({});
  const groups = [
    { cat: "locations", label: "Locais", icon: Building2, items: data.locations },
    { cat: "equipment", label: "Equipamentos", icon: Package, items: data.equipment.filter((e) => !e.isAccessory) },
    { cat: "collaborators", label: "Colaboradores", icon: Users, items: data.collaborators },
  ];
  const draftKey = (cat, id) => `${cat}:${id}`;
  const commit = (cat, item) => {
    const key = draftKey(cat, item.id);
    if (drafts[key] === undefined) return;
    const val = drafts[key] === "" ? null : Number(drafts[key]);
    onUpdateCat(cat, data[cat].map((x) => (x.id === item.id ? { ...x, hourlyCost: val } : x)));
    setDrafts((d) => { const n = { ...d }; delete n[key]; return n; });
  };
  return (
    <div className="space-y-4">
      {!canCustos && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 text-xs flex items-center gap-2">
          <Lock size={13} /> Modo somente leitura — seu usuário não tem permissão pra alterar os valores.
        </div>
      )}
      {groups.map((g) => (
        <div key={g.cat} style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
          <div className="px-4 py-2.5 text-sm font-medium flex items-center gap-1.5" style={{ borderBottom: `1px solid ${T.line}`, fontFamily: "'Space Grotesk', sans-serif" }}>
            <g.icon size={14} /> {g.label}
          </div>
          {g.items.length === 0 && <div className="px-4 py-3 text-xs" style={{ color: T.inkMuted }}>Nenhum item cadastrado ainda.</div>}
          {g.items.map((item) => {
            const key = draftKey(g.cat, item.id);
            const value = drafts[key] !== undefined ? drafts[key] : (item.hourlyCost ?? "");
            return (
              <div key={item.id} className="flex items-center justify-between gap-3 px-4 py-2" style={{ borderBottom: `1px solid ${T.line}` }}>
                <div className="text-xs truncate">{item.name}</div>
                <div className="flex items-center gap-1 shrink-0">
                  <span className="text-xs" style={{ color: T.inkMuted }}>R$</span>
                  <input type="number" min={0} step="0.01" placeholder="—" disabled={!canCustos} value={value}
                    onChange={(e) => setDrafts((d) => ({ ...d, [key]: e.target.value }))}
                    onBlur={() => commit(g.cat, item)}
                    className="w-24 text-xs px-2 py-1 rounded-md outline-none text-right disabled:opacity-50" style={{ border: `1px solid ${T.line}` }} />
                  <span className="text-xs" style={{ color: T.inkMuted }}>/h</span>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Calibração — visão focada só em quem precisa de atenção (ordenado por    */
/* urgência), com o botão de confirmação que faltava: até aqui o status só  */
/* aparecia como leitura no Cadastro, sem jeito de registrar a renovação.   */
/* ---------------------------------------------------------------------- */
function CalibrationPanel({ data, onUpdateCat, canCalibracao }) {
  const [renewing, setRenewing] = useState(null);
  const [renewDate, setRenewDate] = useState(todayStr());

  const items = data.equipment.filter((e) => e.calibrationIntervalDays)
    .map((e) => ({ ...e, cal: calibrationStatus(e) }))
    .sort((a, b) => {
      const rank = (c) => (!c ? -1 : c.status === "vencido" ? 0 : c.status === "vencendo" ? 1 : 2);
      return rank(a.cal) - rank(b.cal) || (a.cal?.daysLeft ?? -999) - (b.cal?.daysLeft ?? -999);
    });

  const confirmRenewal = (item) => {
    onUpdateCat("equipment", data.equipment.map((e) => (e.id === item.id ? { ...e, lastCalibration: renewDate } : e)));
    setRenewing(null);
  };

  return (
    <div className="space-y-4">
      {!canCalibracao && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 text-xs flex items-center gap-2">
          <Lock size={13} /> Modo somente leitura — peça a um gestor ou administrador pra confirmar renovações.
        </div>
      )}
      {items.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhum equipamento com validade de calibração cadastrada — defina em Cadastro → Equipamentos.</div>}
      <div className="space-y-2">
        {items.map((item) => {
          const tone = !item.cal ? "danger" : item.cal.status === "vencido" ? "danger" : item.cal.status === "vencendo" ? "warn" : "accent";
          const label = !item.cal ? "nunca calibrado" : item.cal.status === "vencido" ? `vencida desde ${weekdayLabel(item.cal.due)}` : item.cal.status === "vencendo" ? `vence em ${item.cal.daysLeft}d (${weekdayLabel(item.cal.due)})` : `ok até ${weekdayLabel(item.cal.due)}`;
          return (
            <div key={item.id} style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3.5 flex items-center justify-between gap-3 flex-wrap">
              <div className="min-w-0">
                <div className="text-sm font-medium truncate">{item.name}{item.isAccessory && <span style={{ color: T.inkMuted, fontWeight: 400 }}> · acessório</span>}</div>
                <div className="text-[11px] mt-1 flex items-center gap-1.5" style={{ color: T.inkMuted }}>
                  <History size={11} /> Última: {item.lastCalibration ? weekdayLabel(item.lastCalibration) : "—"} <Chip tone={tone}>{label}</Chip>
                </div>
              </div>
              {canCalibracao && (
                renewing === item.id ? (
                  <div className="flex items-center gap-1.5">
                    <input type="date" value={renewDate} onChange={(e) => setRenewDate(e.target.value)}
