        <div className="flex items-center justify-between">
          <div className="text-xs font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Visitas do protocolo</div>
          <Btn small icon={Plus} variant="subtle" onClick={addTp}>Adicionar visita</Btn>
        </div>
        {tps.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhuma visita ainda — use um modelo acima ou adicione uma.</div>}
        {sorted.map((tp) => {
          // Duas janelas: a do protocolo (pura) e a que sobra depois do prazo.
          const puro = timepointWindow(tp, d0.date);
          const w = timepointWindow(tp, d0.date, form);
          return (
            <div key={tp.id} style={{ background: T.bg, border: `1px solid ${T.line}` }} className="rounded-lg p-2.5 flex items-end gap-2 flex-wrap">
              <label className="text-[11px]" style={{ color: T.inkMuted }}>Nome da visita
                <input value={tp.label} onChange={(e) => setTp(tp.id, { label: e.target.value })}
                  className="mt-0.5 block text-xs px-2 py-1.5 rounded-md outline-none w-40" style={{ border: `1px solid ${T.line}` }} />
              </label>
              <label className="text-[11px]" style={{ color: T.inkMuted }}>Dias após o D0
                <input type="number" min={0} value={tp.offsetDays} onChange={(e) => setTp(tp.id, { offsetDays: Number(e.target.value) || 0 })}
                  className="mt-0.5 block text-xs px-2 py-1.5 rounded-md outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
              </label>
              <label className="text-[11px]" style={{ color: T.inkMuted }}>Tolerância (±dias)
                <input type="number" min={0} value={tp.toleranceDays} onChange={(e) => setTp(tp.id, { toleranceDays: Number(e.target.value) || 0 })}
                  className="mt-0.5 block text-xs px-2 py-1.5 rounded-md outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
              </label>
              <div className="text-[11px] flex-1 min-w-[180px]" style={{ color: w.fits ? T.accentDark : T.danger }}>
                <CalendarRange size={11} className="inline -mt-0.5 mr-1" />
                {!w.fits
                  ? <>não cabe no prazo (seria {weekdayLabel(puro.dateMin)})</>
                  : w.dateMin === w.dateMax ? weekdayLabel(w.dateMin) : <>{weekdayLabel(w.dateMin)} a {weekdayLabel(w.dateMax)}</>}
                {w.fits && w.clipped && (
                  <span className="block" style={{ color: T.warn }}>janela cortada pelo prazo (ia até {weekdayLabel(puro.dateMax)})</span>
                )}
              </div>
              <button onClick={() => removeTp(tp.id)} style={{ color: T.danger }} title="Remover visita"><Trash2 size={14} /></button>
            </div>
          );
        })}
      </div>

      {/* ---- Grupos do estudo ----------------------------------------
          O número de participantes deixa de ser digitado em cada reserva e
          passa a vir daqui. É o que permite a checagem de capacidade da sala
          valer contra o grupo de verdade, e não contra um número que alguém
          lembrou de digitar. */}
      <div style={{ background: T.bg, border: `1px solid ${T.line}` }} className="rounded-xl p-3 space-y-2">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div>
            <div className="text-xs font-semibold" style={{ color: T.ink }}>Grupos do estudo</div>
            <div className="text-[10px]" style={{ color: T.inkMuted }}>
              Divida as voluntárias em grupos com tamanho próprio. A capacidade da sala é conferida contra o grupo.
            </div>
          </div>
          <Btn small variant="ghost" icon={Plus}
            onClick={() => setGrupos([...grupos, { id: genId("grp"), name: `Grupo ${String.fromCharCode(65 + grupos.length)}`, size: 1 }])}>
            Adicionar grupo
          </Btn>
        </div>

        {grupos.length === 0 ? (
          <div className="text-[11px]" style={{ color: T.inkMuted }}>
            Nenhum grupo ainda. Sem grupos, o sistema não tem contra o que conferir a capacidade da sala.
          </div>
        ) : (
          <div className="text-[11px]" style={{ color: T.accentDark }}>
            <strong>{totalGrupos}</strong> participante(s) no total, em {grupos.length} grupo(s).
          </div>
        )}

        {grupos.map((g, i) => (
          <div key={g.id} className="flex items-end gap-2 flex-wrap">
            <label className="text-[10px]" style={{ color: T.inkMuted }}>Nome
              <input value={g.name} onChange={(e) => setGrupos(grupos.map((x, j) => (j === i ? { ...x, name: e.target.value } : x)))}
                className="mt-0.5 block text-xs px-2 py-1 rounded-md outline-none w-44" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-[10px]" style={{ color: T.inkMuted }}>Pessoas
              <input type="number" min={1} value={g.size}
                onChange={(e) => setGrupos(grupos.map((x, j) => (j === i ? { ...x, size: e.target.value === "" ? "" : Number(e.target.value) } : x)))}
                className="mt-0.5 block text-xs px-2 py-1 rounded-md outline-none w-20" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <button onClick={() => setGrupos(grupos.filter((_, j) => j !== i))} title="Remover grupo"
              className="mb-1 p-1.5 rounded-md" style={{ color: T.danger, border: `1px solid ${T.line}` }}><Trash2 size={12} /></button>
          </div>
        ))}

        {problemasGrupos.length > 0 && (
          <div className="text-[11px] space-y-0.5" style={{ color: T.danger }}>
            {problemasGrupos.map((m, i) => <div key={i}>· {m}</div>)}
          </div>
        )}
      </div>

      <div className="flex gap-2">
        <Btn icon={Check} disabled={!canSave || problemasGrupos.length > 0} onClick={() => onSubmit(
          { ...form, endDate: form.endDate || null,
            technicianId: form.technicianId || null,
            // Âncora do protocolo enquanto nada está marcado; assim que a
            // primeira visita entrar na agenda, quem manda é a data dela.
            baselineDate: d0.date,
            groups: grupos.map((g) => ({ ...g, size: Number(g.size) || 0 })),
            // Com grupos, o total é a soma deles — guardado junto pra quem lê o
            // estudo não precisar somar, e pra tela antiga continuar funcionando.
            participantsPlanned: grupos.length ? grupos.reduce((t, g) => t + (Number(g.size) || 0), 0)
              : (form.participantsPlanned === "" ? null : Number(form.participantsPlanned)) },
          sorted.map((tp) => ({ ...tp, existing: undefined })))}>
          {isNew ? "Criar estudo" : "Salvar alterações"}
        </Btn>
        <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Estudos — visão amarrando Estudo → Timepoints → Reservas                */
/* ---------------------------------------------------------------------- */
function StudiesView({ data, bookings, studies, timepoints, trainingRequests, onNewTimepoint, canPlanejar, canVerCustos, onUpdateBookings, onDeleteBookingsAtomic, canAprovarPrazo, deadlineRequests, onCreateDeadlineRequest, onDecideDeadlineRequest, onNegotiateStudyDeadline, actorName, onRecordCancellation, onSaveStudies, onSaveTimepoints, onSaveStudyWithTimepoints, canGerenciar, onUpdateBookingsAtomic, cancellationEntry,
  estimates, canSegurarEstimativa, onLiberarEstimativa }) {
  const [studyForm, setStudyForm] = useState(null);
  const [showClosed, setShowClosed] = useState(false);
  const [requestingTpId, setRequestingTpId] = useState(null);
  const [requestDraft, setRequestDraft] = useState({ date: "", reason: "" });

  const submitDeadlineRequest = async (tp, study) => {
    if (!requestDraft.date) return;
    // So fecha o formulario depois de gravar: falhando, a pessoa perdia tudo que
    // tinha preenchido.
    const ok = await onCreateDeadlineRequest({
      id: genId("dlr"), scope: "timepoint",
      studyId: study.id, timepointId: tp.id, timepointLabel: tp.label, studyName: study.name,
      requestedBy: actorName || "usuário sem identificação", currentDateMax: tp.dateMax, requestedDateMax: requestDraft.date,
      reason: requestDraft.reason.trim(), status: "pendente", requestedAt: new Date().toISOString(),
    });
    if (ok === false) return;
    setRequestingTpId(null); setRequestDraft({ date: "", reason: "" });
  };
  /* Prazo do ESTUDO INTEIRO. É o que o Fonseca descreveu: quando o protocolo
   * não cabe no período combinado, alguém renegocia com o cliente e o gestor
   * aprova a data nova. Mesma coleção e mesmo fluxo de aprovação do prazo de
   * visita — muda só o alvo, marcado em `scope`. */
  const [requestingStudyId, setRequestingStudyId] = useState(null);
  const [studyRequestDraft, setStudyRequestDraft] = useState({ date: "", reason: "" });
  const submitStudyDeadlineRequest = async (study) => {
    if (!studyRequestDraft.date) return;
    // Quem tem alçada fecha na hora — é ele que fala com o cliente. Quem não
    // tem, abre pedido. O registro no histórico é o mesmo nos dois caminhos.
    if (canAprovarPrazo) {
      const ok = await onNegotiateStudyDeadline(study, studyRequestDraft.date, studyRequestDraft.reason.trim());
      if (ok === false) return;
      setRequestingStudyId(null); setStudyRequestDraft({ date: "", reason: "" });
      return;
    }
    const ok = await onCreateDeadlineRequest({
      id: genId("dlr"), scope: "study",
      studyId: study.id, timepointId: null, timepointLabel: null, studyName: study.name,
      requestedBy: actorName || "usuário sem identificação",
      currentDateMax: study.endDate || null, requestedDateMax: studyRequestDraft.date,
      reason: studyRequestDraft.reason.trim(), status: "pendente", requestedAt: new Date().toISOString(),
    });
    if (ok === false) return;
    setRequestingStudyId(null); setStudyRequestDraft({ date: "", reason: "" });
  };
  const [expanded, setExpanded] = useState({});
  const [search, setSearch] = useState("");
  const [editingBookingId, setEditingBookingId] = useState(null);
  const [editDraft, setEditDraft] = useState({});

  const startEdit = (b) => {
    setEditingBookingId(b.id);
    setEditDraft({ date: b.date, start: b.start, end: b.end, locationId: b.locationId, collaboratorIds: b.collaboratorIds || [], doctorId: b.doctorId });
  };
  // Edição manual passa pelo MESMO motor de validação da criação automática. Sem
  // isso, bastava digitar outro horário pra criar conflito de sala, equipamento,
  // colaborador ou médico sem o sistema perceber. Erro trava o salvamento;
  // aviso (fora do horário, sem treinamento) deixa salvar mas fica visível.
  // Monta como TODA a reserva (e o grupo dela) ficaria com a edição aplicada.
  // Atividades simultâneas são um bloco: mexer em data, início ou sala de uma
  // move o grupo inteiro — senão dava pra desmanchar o grupo em silêncio, as
  // duas continuando com o mesmo groupId (e por isso fora da checagem de
  // conflito de sala entre si) já estando em horários ou salas diferentes.
  // Cada uma mantém a própria duração.
  const propostaDaEdicao = (b) => {
    const mates = b.groupId ? bookings.filter((x) => x.groupId === b.groupId && x.id !== b.id) : [];
    const deltaDia = editDraft.date !== b.date, deltaInicio = editDraft.start !== b.start, deltaSala = editDraft.locationId !== b.locationId;
    const principal = { ...b, ...editDraft };
    const wp = blockedWindow(principal.start, principal.end, data.activities.find((a) => a.id === principal.activityId));
    const movidas = mates.map((x) => {
      const dur = toMin(x.end) - toMin(x.start);
      const novoInicio = deltaInicio ? editDraft.start : x.start;
      const m = {
        ...x,
        date: deltaDia ? editDraft.date : x.date,
        start: novoInicio,
        end: deltaInicio ? addMinutes(novoInicio, dur) : x.end,
        locationId: deltaSala ? editDraft.locationId : x.locationId,
      };
      const w = blockedWindow(m.start, m.end, data.activities.find((a) => a.id === m.activityId));
      return { ...m, blockStart: w.start, blockEnd: w.end };
    });
    return [{ ...principal, blockStart: wp.start, blockEnd: wp.end }, ...movidas];
  };
  // Edição manual passa pelo MESMO motor de validação da criação automática, e
  // valida TODO o grupo proposto — não só a reserva aberta na tela. Mover A+B
  // para um horário em que a pessoa da B já está ocupada precisa ser barrado
  // pela checagem da B, que ninguém fazia.
  const editCheck = (b) => {
    if (!b || editingBookingId !== b.id) return null;
    const proposta = propostaDaEdicao(b);
    const idsPropostos = new Set(proposta.map((p) => p.id));
    const universo = [...bookings.filter((x) => !idsPropostos.has(x.id)), ...proposta];
    const errors = [], warnings = [], blockers = [];
    proposta.forEach((p, i) => {
      const v = validateBooking({ ...p, participants: p.participantCount }, data, universo, p.id);
      const prefixo = i === 0 ? "" : `${data.activities.find((a) => a.id === p.activityId)?.name || "atividade do grupo"}: `;
      v.errors.forEach((e) => errors.push(prefixo + e));
      v.warnings.forEach((w) => warnings.push(prefixo + w));
      // Quem está bloqueando por PRÉ-RESERVA é diferente de quem está
      // bloqueando por reserva de verdade: a primeira é uma decisão que
      // alguém pode rever, e é isso que o diálogo abaixo oferece.
      (v.blockers || []).forEach((bl) => blockers.push(bl));
    });
    const principal = proposta[0];
    return { errors, warnings, blockers, blockStart: principal.blockStart, blockEnd: principal.blockEnd, proposta };
  };
  const saveEdit = async (b) => {
    const check = editCheck(b);
    if (!check || check.errors.length) return;
    const rescheduled = editDraft.date !== b.date || editDraft.start !== b.start || editDraft.end !== b.end || editDraft.locationId !== b.locationId;
    const porId = new Map(check.proposta.map((p) => [p.id, p]));
    const next = bookings.map((x) => {
      const p = porId.get(x.id);
      if (!p) return x;
      // O status é recalculado: tirar gente de uma reserva confirmada tem que
      // rebaixá-la, não deixá-la mentindo que está pronta.
      return { ...p, status: bookingStatusFor(p, data.activities.find((a) => a.id === p.activityId)) };
    });
    // O registro de reagendamento entra na MESMA transação da alteração — é
    // dele que sai o indicador de "perda por reagendamento".
    const gravou = await onUpdateBookingsAtomic(next, rescheduled ? [cancellationEntry(b, "reagendado")] : []);
    if (gravou === false) return;
    setEditingBookingId(null);
  };
  const deleteBooking = async (b) => {
    // Excluir uma atividade de um grupo simultâneo leva o grupo junto: deixar a
    // outra sozinha com o mesmo groupId manteria a isenção de conflito de sala
    // sem existir mais grupo nenhum.
    const doGrupo = b.groupId ? bookings.filter((x) => x.groupId === b.groupId) : [b];
    await onDeleteBookingsAtomic(doGrupo, [], "excluído");
  };

  // Estudo concluído/cancelado some da lista por padrão — senão, em alguns meses,
  // a tela vira um cemitério de protocolo encerrado misturado com o que está em
  // andamento. O filtro deixa ver os fechados quando precisar.
  const filteredStudies = studies
    .filter((s) => s.name.toLowerCase().includes(search.toLowerCase()))
    .filter((s) => (showClosed ? true : isStudyOpen(s)))
    .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  const closedCount = studies.filter((s) => !isStudyOpen(s)).length;
  const toggle = (id) => setExpanded((e) => ({ ...e, [id]: !e[id] }));

  const submitStudy = async (study, tpRows) => {
    const { nextStudies, nextTimepoints } = studySavePayload({ study, tpRows, studies, timepoints, bookings });
    const ok = await onSaveStudyWithTimepoints(nextStudies, nextTimepoints);
    if (!ok) return;
    setStudyForm(null);
  };

  return (
    <div className="space-y-5">
      <Section icon={Layers} title="Estudos" subtitle="Cada estudo é um protocolo: visitas por deslocamento a partir do baseline, e tudo que já foi agendado nelas."
        right={canPlanejar && !studyForm ? <Btn icon={Plus} onClick={() => setStudyForm({})}>Novo estudo</Btn> : null} />

      {studyForm && (
        <StudyForm data={data} studies={studies} editing={studyForm} bookings={bookings}
          existingTimepoints={studyForm.id ? timepoints.filter((tp) => tp.studyId === studyForm.id) : []}
          onSubmit={submitStudy} onCancel={() => setStudyForm(null)} />
      )}

      <div className="flex items-center gap-2">
        <Search size={14} style={{ color: T.inkMuted }} />
        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar estudo..."
          className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
        {closedCount > 0 && (
          <Btn small variant={showClosed ? "subtle" : "ghost"} onClick={() => setShowClosed((v) => !v)}>
            {showClosed ? "Ocultar encerrados" : `Ver encerrados (${closedCount})`}
          </Btn>
        )}
      </div>
      {filteredStudies.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhum estudo cadastrado ainda — crie um em "Planejar estudo".</div>}
      <div className="space-y-3">
        {filteredStudies.map((study) => {
          const sponsor = data.sponsors.find((s) => s.id === study.sponsorId);
          const studyTimepoints = timepoints.filter((tp) => tp.studyId === study.id).sort((a, b) => a.dateMin.localeCompare(b.dateMin));
          const studyBookings = bookings.filter((b) => b.studyId === study.id);
          const pendingTraining = trainingRequests.filter((r) => r.studyName === study.name && r.status === "pendente").length;
          const declinedTraining = trainingRequests.filter((r) => r.studyName === study.name && r.status === "recusado").length;
          const isOpen = !!expanded[study.id];
          const spent = bookingsCost(studyBookings, data);
          const postponedCount = studyTimepoints.filter((tp) => tp.postponed).length;
          const pendingDeadlineReqs = deadlineRequests.filter((r) => r.studyId === study.id && r.status === "pendente");
          // Janela contratada: cabe no prazo? qual visita ficou de fora?
          const fit = studyFit(study, studyTimepoints);
          const foraDoPrazo = studyBookings.filter((b) => fit.endDate && b.date > fit.endDate);
          const pedindoPrazoEstudo = requestingStudyId === study.id;
          return (
            <div key={study.id} style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-2">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <div className="cursor-pointer" onClick={() => toggle(study.id)}>
                  <div className="text-sm font-semibold flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
                    {study.name}
                    <Chip tone={STUDY_STATUS_META[study.status || "ativo"]?.tone || "neutral"}>{STUDY_STATUS_META[study.status || "ativo"]?.label || study.status}</Chip>
                  </div>
                  <div className="text-[11px]" style={{ color: T.inkMuted }}>
                    {sponsor?.name} · {studyTimepoints.length} visita(s) · {studyBookings.length} reserva(s)
                    {study.baselineDate && ` · D0 em ${weekdayLabel(study.baselineDate)}`}
                    {study.participantsPlanned ? ` · ${study.participantsPlanned} participantes` : ""}
                  </div>
                  {/* A janela combinada em datas, não em jargão: é a primeira
                      coisa que alguém quer saber olhando um estudo. */}
                  {fit.endDate && (
                    <div className="text-[11px] flex items-center gap-1" style={{ color: fit.ok ? T.inkMuted : T.warn }}>
                      <CalendarRange size={11} />
                      Combinado: começar {fit.startMin === fit.startMax ? `em ${weekdayLabel(fit.startMin)}` : `entre ${weekdayLabel(fit.startMin)} e ${weekdayLabel(fit.startMax)}`}
                      {" · "}terminar até {weekdayLabel(fit.endDate)}
                    </div>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  {canVerCustos && spent > 0 && <Chip tone="neutral">{fmtBRL(spent)} de custo operacional</Chip>}
                  {declinedTraining > 0 && <Chip tone="danger"><AlertTriangle size={10} className="inline -mt-0.5 mr-0.5" />{declinedTraining} treinamento(s) recusado(s)</Chip>}
                  {pendingTraining > 0 && <Chip tone="gold">{pendingTraining} treinamento(s) pendente(s)</Chip>}
                  {pendingDeadlineReqs.length > 0 && <Chip tone="gold"><CalendarRange size={10} className="inline -mt-0.5 mr-0.5" />{pendingDeadlineReqs.length} prazo(s) em análise</Chip>}
                  {postponedCount > 0 && <Chip tone="warn"><CalendarRange size={10} className="inline -mt-0.5 mr-0.5" />{postponedCount} timepoint(s) postergado(s)</Chip>}
                  {!fit.ok && <Chip tone="danger"><AlertTriangle size={10} className="inline -mt-0.5 mr-0.5" />fora do prazo combinado</Chip>}
                  {study.deadlineExtended && <Chip tone="gold">prazo renegociado (era {study.deadlineExtendedFrom})</Chip>}
                  {canPlanejar && <Btn small icon={Pencil} variant="ghost" onClick={() => setStudyForm(study)}>Editar protocolo</Btn>}
                  {canPlanejar && <Btn small icon={Plus} variant="subtle" onClick={() => onNewTimepoint(study.id)}>Agendar visita</Btn>}
                  <Btn small variant="ghost" onClick={() => toggle(study.id)}>{isOpen ? "Recolher" : "Detalhes"}</Btn>
                </div>
              </div>
              {isOpen && (
                <div className="space-y-2 pt-2" style={{ borderTop: `1px dashed ${T.line}` }}>
                  {/* Pedido de prazo do ESTUDO inteiro fica aqui em cima, e
                      não dentro de uma visita — porque ele não é de nenhuma
                      visita: aprovar reabre a janela de todas. */}
                  {pendingDeadlineReqs.filter((r) => r.scope === "study").map((r) => (
                    <div key={r.id} style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-md p-2 space-y-1">
                      <div className="text-[11px]" style={{ color: T.warn }}>
                        <CalendarRange size={11} className="inline -mt-0.5 mr-1" />
                        {r.requestedBy} pediu prazo do estudo até <strong>{weekdayLabel(r.requestedDateMax)}</strong>
                        {r.currentDateMax ? ` (era ${weekdayLabel(r.currentDateMax)})` : ""}{r.reason && ` — ${r.reason}`}
                      </div>
                      {canAprovarPrazo ? (
                        <div className="flex gap-1.5">
                          <Btn small icon={Check} onClick={() => onDecideDeadlineRequest(r, true)}>Aprovar novo prazo</Btn>
                          <Btn small variant="danger" icon={ThumbsDown} onClick={() => onDecideDeadlineRequest(r, false)}>Recusar</Btn>
                        </div>
                      ) : (
                        <div className="text-[10px]" style={{ color: T.inkMuted }}>Aguardando aprovação do gestor.</div>
                      )}
                    </div>
                  ))}
                  {/* ---- Prazo do estudo -------------------------------- */}
                  {(!fit.ok || foraDoPrazo.length > 0) && (
                    <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-lg p-2.5 space-y-1.5">
                      <div className="text-[11px] font-medium flex items-center gap-1.5" style={{ color: T.warn }}>
                        <AlertTriangle size={12} /> O cronograma não cabe no período combinado
                      </div>
                      {fit.problems.map((p, i) => <div key={i} className="text-[11px]" style={{ color: T.inkMuted }}>• {p}</div>)}
                      {foraDoPrazo.length > 0 && (
                        <div className="text-[11px]" style={{ color: T.inkMuted }}>
                          • {foraDoPrazo.length} reserva(s) já marcada(s) depois do prazo: {foraDoPrazo.slice(0, 3).map((b) => weekdayLabel(b.date)).join(", ")}
                          {foraDoPrazo.length > 3 ? "…" : ""}
                        </div>
                      )}
                      {fit.impossivel
                        ? <div className="text-[11px]" style={{ color: T.inkMuted }}>
                            O protocolo leva {fit.span} dia(s) e a janela combinada é menor que isso — mexer na data do D0 não resolve.
                            É preciso um prazo novo com o cliente, ou encurtar o protocolo.
                          </div>
                        : fit.latestFeasibleBaseline && (
                            <div className="text-[11px]" style={{ color: T.inkMuted }}>
                              Ainda caberia começando até {weekdayLabel(fit.latestFeasibleBaseline)} — dá pra ajustar o D0 em "Editar protocolo".
                            </div>
                          )}
                      {/* Renegociar é decisão comercial: quem planeja PEDE, o
                          gestor aprova. Mesma separação da hora extra. */}
                      {(canPlanejar || canAprovarPrazo) && !pedindoPrazoEstudo && !pendingDeadlineReqs.some((r) => r.scope === "study") && (
                        <Btn small variant="subtle" icon={CalendarRange} onClick={() => {
                          setRequestingStudyId(study.id);
                          // Sugere o prazo que faria o cronograma caber — é o
                          // número que a pessoa vai levar pro cliente.
                          setStudyRequestDraft({ date: fit.protocolEnd || "", reason: "" });
                        }}>{canAprovarPrazo ? "Registrar novo prazo negociado" : "Pedir novo prazo ao gestor"}</Btn>
                      )}
                      {pendingDeadlineReqs.some((r) => r.scope === "study") && <Chip tone="gold">Prazo novo em análise pelo gestor</Chip>}
                      {pedindoPrazoEstudo && (
                        <div className="space-y-1.5 pt-1">
                          <div className="flex items-end gap-2 flex-wrap">
                            <label className="text-[10px]" style={{ color: T.inkMuted }}>Novo prazo final
                              <input type="date" value={studyRequestDraft.date} onChange={(e) => setStudyRequestDraft((d) => ({ ...d, date: e.target.value }))}
                                className="mt-0.5 block text-xs px-2 py-1.5 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                            </label>
                            <input value={studyRequestDraft.reason} onChange={(e) => setStudyRequestDraft((d) => ({ ...d, reason: e.target.value }))}
                              placeholder="O que o cliente disse? (opcional)"
                              className="flex-1 min-w-[200px] text-xs px-2 py-1.5 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                          </div>
                          <div className="flex gap-1.5">
                            <Btn small icon={Check} disabled={!studyRequestDraft.date} onClick={() => submitStudyDeadlineRequest(study)}>
                              {canAprovarPrazo ? "Salvar novo prazo" : "Enviar pedido"}
                            </Btn>
                            <Btn small variant="ghost" onClick={() => setRequestingStudyId(null)}>Cancelar</Btn>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                  {declinedTraining > 0 && (
                    <div style={{ background: T.dangerSoft, border: `1px solid ${T.danger}` }} className="rounded-lg p-2.5 space-y-1">
                      <div className="text-[11px] font-medium flex items-center gap-1.5" style={{ color: T.danger }}>
                        <AlertTriangle size={12} /> Treinamento recusado — indique outro colaborador ou reavalie a data em "Treinamentos"
                      </div>
                      {trainingRequests.filter((r) => r.studyName === study.name && r.status === "recusado").map((r) => (
                        <div key={r.id} className="text-[11px]" style={{ color: T.inkMuted }}>{r.activityName}{r.collaboratorName ? ` · indicado(a): ${r.collaboratorName}` : ""}</div>
                      ))}
                    </div>
                  )}
                  {studyTimepoints.length === 0 && <div className="text-xs" style={{ color: T.inkMuted }}>Nenhum timepoint confirmado ainda.</div>}
                  {studyTimepoints.map((tp) => {
                    const tpBookings = studyBookings.filter((b) => b.timepointId === tp.id).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
                    // Desvio de protocolo: compara a data agendada com o alvo
                    // (baseline + offset). Olha TODAS as reservas da visita e
                    // fica com a pior — num timepoint distribuído, a primeira
                    // podia estar em dia e outra bem fora, e a tela mostrava só
                    // a primeira, dando a visita como dentro do protocolo.
                    const devs = tpBookings.map((b) => protocolDeviation(tp, study.baselineDate, b.date)).filter(Boolean);
                    const dev = devs.length
                      ? devs.reduce((pior, d) => (Math.abs(d.diff) > Math.abs(pior.diff) ? d : pior))
                      : null;
                    const foraDaJanela = devs.filter((d) => d.outOfWindow).length;
                    return (
                      <div key={tp.id} style={{ background: T.bg, border: `1px solid ${T.line}` }} className="rounded-lg p-3 space-y-1.5">
                        <div className="flex items-center justify-between flex-wrap gap-1.5">
                          <div className="text-xs font-medium flex items-center gap-1.5 flex-wrap">{tp.label}
                            <span style={{ color: T.inkMuted, fontWeight: 400 }}> · {weekdayLabel(tp.dateMin)}{tp.dateMax !== tp.dateMin ? ` a ${weekdayLabel(tp.dateMax)}` : ""}</span>
                            {tp.offsetDays != null && <Chip tone="neutral">D{tp.offsetDays}{tp.toleranceDays ? `±${tp.toleranceDays}` : ""}</Chip>}
                            {tp.postponed && <Chip tone="warn">postergado (era até {weekdayLabel(tp.postponedFrom)})</Chip>}
                            {dev && dev.outOfWindow && (
                              <Chip tone="danger">
                                {foraDaJanela === devs.length ? "fora do protocolo" : `${foraDaJanela} de ${devs.length} reserva(s) fora do protocolo`}
                                {": "}{dev.diff > 0 ? `+${dev.diff}` : dev.diff} dia(s) no pior caso
                              </Chip>
                            )}
                            {dev && !dev.outOfWindow && dev.diff !== 0 && <Chip tone="accent">{dev.diff > 0 ? `+${dev.diff}` : dev.diff}d, dentro da tolerância</Chip>}
                            {tpBookings.length === 0 && <Chip tone="gold">sem agendamento</Chip>}
                          </div>
                          {!deadlineRequests.some((r) => r.timepointId === tp.id && r.status === "pendente") && (
                            <button onClick={() => { setRequestingTpId(tp.id); setRequestDraft({ date: tp.dateMax, reason: "" }); }}
                              className="text-[10px] underline" style={{ color: T.inkMuted }}>Solicitar novo prazo</button>
                          )}
                        </div>

                        {requestingTpId === tp.id && (
                          <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-md p-2 space-y-1.5">
                            <div className="text-[10px] font-medium" style={{ color: T.warn }}>Pedir mais prazo pro gerente aprovar — dá margem pra achar novas datas.</div>
                            <div className="grid grid-cols-2 gap-1.5">
                              <label className="text-[10px]" style={{ color: T.inkMuted }}>Novo prazo (atual: {weekdayLabel(tp.dateMax)})
                                <input type="date" min={tp.dateMax} value={requestDraft.date} onChange={(e) => setRequestDraft({ ...requestDraft, date: e.target.value })}
                                  className="mt-0.5 w-full text-xs px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                              </label>
                              <label className="text-[10px]" style={{ color: T.inkMuted }}>Motivo (opcional)
                                <input value={requestDraft.reason} onChange={(e) => setRequestDraft({ ...requestDraft, reason: e.target.value })}
                                  className="mt-0.5 w-full text-xs px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                              </label>
                            </div>
                            <div className="flex gap-1.5">
                              <Btn small icon={Check} onClick={() => submitDeadlineRequest(tp, study)}>Enviar solicitação</Btn>
                              <Btn small variant="ghost" onClick={() => setRequestingTpId(null)}>Cancelar</Btn>
                            </div>
                          </div>
                        )}

                        {deadlineRequests.filter((r) => r.timepointId === tp.id && r.status === "pendente").map((r) => (
                          <div key={r.id} style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-md p-2 space-y-1">
                            <div className="text-[11px]" style={{ color: T.warn }}>
                              <CalendarRange size={11} className="inline -mt-0.5 mr-1" />
                              {r.requestedBy} pediu prazo até <strong>{weekdayLabel(r.requestedDateMax)}</strong> (era {weekdayLabel(r.currentDateMax)}){r.reason && ` — ${r.reason}`}
                            </div>
                            {canAprovarPrazo ? (
                              <div className="flex gap-1.5">
                                <Btn small icon={Check} onClick={() => onDecideDeadlineRequest(r, true)}>Aprovar</Btn>
                                <Btn small variant="danger" icon={ThumbsDown} onClick={() => onDecideDeadlineRequest(r, false)}>Recusar</Btn>
                              </div>
                            ) : (
                              <div className="text-[10px]" style={{ color: T.inkMuted }}>Aguardando aprovação do gestor.</div>
                            )}
                          </div>
                        ))}
                        <div className="space-y-1">
                          {tpBookings.map((b) => {
                            const loc = data.locations.find((l) => l.id === b.locationId);
                            const activity = data.activities.find((a) => a.id === b.activityId);
                            const cols = (b.collaboratorIds || []).map((id) => data.collaborators.find((c) => c.id === id)).filter(Boolean);
                            const isFuture = b.date >= todayStr();
                            const isEditing = editingBookingId === b.id;
                            if (isEditing) {
                              const check = editCheck(b);
                              return (
                                <div key={b.id} style={{ background: T.surface, border: `1px dashed ${T.accent}` }} className="rounded-lg p-2.5 space-y-1.5">
                                  <div className="text-[11px] font-medium" style={{ color: T.inkMuted }}>{activity?.name} — editando</div>
                                  {b.groupId && bookings.some((x) => x.groupId === b.groupId && x.id !== b.id) && (
                                    <div className="text-[10px] rounded-md px-2 py-1" style={{ background: T.accentSoft, color: T.accentDark }}>
                                      Esta atividade roda junto com{" "}
                                      {bookings.filter((x) => x.groupId === b.groupId && x.id !== b.id)
                                        .map((x) => data.activities.find((a) => a.id === x.activityId)?.name).filter(Boolean).join(", ")}
                                      . Mudar data, início ou sala move as duas juntas.
                                    </div>
                                  )}
                                  <div className="grid grid-cols-3 gap-1.5">
                                    <label className="text-[10px]" style={{ color: T.inkMuted }}>Data
                                      <input type="date" value={editDraft.date} onChange={(e) => setEditDraft({ ...editDraft, date: e.target.value })}
                                        className="mt-0.5 w-full text-xs px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                                    </label>
                                    <label className="text-[10px]" style={{ color: T.inkMuted }}>Início
                                      <input type="time" value={editDraft.start} onChange={(e) => setEditDraft({ ...editDraft, start: e.target.value })}
                                        className="mt-0.5 w-full text-xs px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                                    </label>
                                    <label className="text-[10px]" style={{ color: T.inkMuted }}>Fim
                                      <input type="time" value={editDraft.end} onChange={(e) => setEditDraft({ ...editDraft, end: e.target.value })}
                                        className="mt-0.5 w-full text-xs px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                                    </label>
                                  </div>
                                  <div className="text-[10px] font-medium" style={{ color: T.inkMuted }}>Sala
                                    <div className="mt-0.5"><SearchPick options={data.locations} value={editDraft.locationId} onChange={(v) => setEditDraft({ ...editDraft, locationId: v })} placeholder="Sala..." /></div>
                                  </div>
                                  <div className="text-[10px] font-medium" style={{ color: T.inkMuted }}>Colaboradores
                                    <div className="mt-0.5"><MultiSearchPick options={data.collaborators} values={editDraft.collaboratorIds} onChange={(v) => setEditDraft({ ...editDraft, collaboratorIds: v })} placeholder="Adicionar colaborador..." /></div>
                                  </div>
                                  {check?.errors.length > 0 && (
                                    <div className="rounded-md px-2 py-1.5 text-[10px] leading-relaxed" style={{ background: T.dangerSoft, color: T.danger, border: `1px solid ${T.danger}` }}>
                                      <strong>Não dá pra salvar assim:</strong>
                                      <ul className="mt-0.5 list-disc list-inside">{check.errors.map((e, i) => <li key={i}>{e}</li>)}</ul>
                                    </div>
                                  )}
                                  {check?.warnings.length > 0 && (
                                    <div className="rounded-md px-2 py-1.5 text-[10px] leading-relaxed" style={{ background: T.goldSoft, color: T.gold, border: `1px solid ${T.gold}` }}>
                                      <strong>Atenção:</strong>
                                      <ul className="mt-0.5 list-disc list-inside">{check.warnings.map((w, i) => <li key={i}>{w}</li>)}</ul>
                                    </div>
                                  )}
                                  {/* Bloqueio por pré-reserva não é uma parede:
                                      é uma decisão que alguém pode rever. */}
                                  <EstimateBlockerNotice blockers={check?.blockers} estimates={estimates} data={data}
                                    canSegurar={canSegurarEstimativa} onLiberar={onLiberarEstimativa} />
                                  {check && !check.errors.length && (check.blockStart !== editDraft.start || check.blockEnd !== editDraft.end) && (
                                    <div className="text-[10px]" style={{ color: T.inkMuted }}>
                                      Com preparo e desmontagem, ocupa <strong style={{ fontFamily: "'JetBrains Mono', monospace" }}>{check.blockStart}–{check.blockEnd}</strong>.
                                    </div>
                                  )}
                                  <div className="flex gap-1.5 pt-0.5">
                                    <Btn small icon={Check} disabled={!check || check.errors.length > 0} onClick={() => saveEdit(b)}>Salvar</Btn>
                                    <Btn small variant="ghost" onClick={() => setEditingBookingId(null)}>Cancelar</Btn>
                                  </div>
                                </div>
                              );
                            }
                            return (
                              <div key={b.id} className="text-[11px] flex items-center gap-2 flex-wrap justify-between" style={{ color: T.inkMuted }}>
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span style={{ fontFamily: "'JetBrains Mono', monospace", color: T.accentDark }}>{weekdayLabel(b.date)} {b.start}–{b.end}</span>
                                  <span>{activity?.name}</span>
                                  <span><MapPin size={10} className="inline -mt-0.5" /> {loc?.name}</span>
                                  {cols.length > 0 && <span>{cols.map((c) => c.name).join(", ")}</span>}
                                  {b.status === "pendente_equipe" && <Chip tone="gold">falta equipe</Chip>}
                                  {b.groupId && <Chip tone="accent">mesma sala, simultânea</Chip>}
                                  {!isFuture && <Chip tone="neutral">já realizada</Chip>}
                                </div>
                                {/* MESMA regra do Cronograma: editar e excluir são
                                    de quem gerencia a agenda. Sem isso, quem não
                                    conseguia apagar lá vinha apagar por aqui. */}
                                {isFuture && canGerenciar && !isTrainingBooking(b) && (
                                  <div className="flex items-center gap-1 shrink-0">
                                    <button onClick={() => startEdit(b)} title="Editar data/horário/sala/equipe" style={{ color: T.accentDark }}><Pencil size={12} /></button>
                                    <button onClick={() => deleteBooking(b)} title="Excluir esta atividade" style={{ color: T.danger }}><Trash2 size={12} /></button>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* ESTUDO — cadastrar, planejar e acompanhar no mesmo lugar                 */
/*                                                                          */
/* Antes eram duas telas: "Estudos" cadastrava e "Planejar estudo"          */
/* agendava. Duas telas para o mesmo objeto obrigam a pessoa a decorar em   */
/* qual delas está cada coisa, e — pior — fizeram os dois formulários       */
/* divergirem: quando grupos e técnico foram criados, só um dos dois ganhou */
/* os campos.                                                               */
/*                                                                          */
/* Aqui o estudo é o centro: escolhe-se um, e tudo que diz respeito a ele   */
/* está na mesma página — dados, visitas do protocolo, o que já está        */
/* agendado, quem está livre no dia e o assistente que monta o cronograma.  */
/*                                                                          */
/* O cadastro continua sendo o MESMO `StudyForm`, e o planejamento o MESMO  */
/* `BookingWizard`: esta tela é a moldura que junta os dois, não uma        */
/* terceira implementação. Reescrever qualquer um dos dois recriaria        */
/* exatamente a divergência que ela existe pra acabar.                      */
/* ---------------------------------------------------------------------- */

/* MONTAGEM DA VISITA — a coluna do meio
 *
 * O assistente antigo era um formulário de quatro passos: você preenchia tudo
 * e só no fim descobria se fechava. Para montar uma visita com quatro
 * atividades isso significava percorrer o formulário quatro vezes, sem nunca
 * ver a visita inteira.
 *
 * Aqui a ordem é a da cabeça de quem planeja: escolhe a atividade, e sala,
 * equipe e aparelho aparecem na hora, do lado. A reserva nasce assim que a
 * atividade entra — incompleta, marcada como tal — e vai sendo preenchida aos
 * cliques. Isso não é um detalhe de implementação: é o que faz "puxar" e
 * "pedir" funcionarem aqui dentro, porque os dois precisam de uma reserva de
 * destino que exista de verdade.
 *
 * Atividades que dividem sala e horário aparecem num quadro só — é como elas
 * acontecem no mundo, e ver três linhas soltas obriga a pessoa a remontar de
 * cabeça o que o sistema já sabe. */
function MontagemDaVisita({
  estudo, tp, data, bookings, studies, canPlanejar, reservaSelId, onSelecionarReserva,
  onCriarReserva, onExcluirReserva, onSugerir, aviso,
}) {
  const [novaAtividade, setNovaAtividade] = useState("");
  const [hora, setHora] = useState("09:00");
  const [grupoSel, setGrupoSel] = useState("");

  const dasVisita = useMemo(() => bookings.filter((b) => b.timepointId === tp?.id), [bookings, tp]);
  const blocos = useMemo(() => blocosDeSala(dasVisita, data.activities), [dasVisita, data.activities]);
  const grupos = studyGroups(estudo);
  const dataAlvo = dasVisita.length
    ? [...dasVisita].sort((a, b) => a.date.localeCompare(b.date))[0].date
    : (tp?.dateMin || null);

  const nomeSala = (id) => data.locations.find((l) => l.id === id)?.name || "sem sala";
  const nomeAtiv = (id) => data.activities.find((a) => a.id === id)?.name || "atividade";
  const nomePessoa = (id) => data.collaborators.find((c) => c.id === id)?.name || "?";

  if (!tp) {
    return (
      <div style={{ background: T.surface, border: `1px dashed ${T.line}` }} className="rounded-xl p-6 text-center">
        <div className="text-sm font-medium mb-1">Este protocolo ainda não tem visitas.</div>
        <div className="text-xs" style={{ color: T.inkMuted }}>
          Use "Editar informações" para montar o protocolo — cada visita é um deslocamento em dias a partir do D0.
        </div>
      </div>
    );
  }

  const criar = () => {
    if (!novaAtividade || !dataAlvo) return;
    onCriarReserva({ activityId: novaAtividade, date: dataAlvo, start: hora, studyGroupId: grupoSel || null });
    setNovaAtividade("");
  };

  return (
    <div className="space-y-3">
      {/* ---- o que é esta visita ---- */}
      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3">
        <div className="flex items-start justify-between gap-2 flex-wrap">
          <div>
            <div className="text-sm font-semibold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{tp.label}</div>
            <div className="text-[11px]" style={{ color: T.inkMuted }}>
              A visita pode acontecer entre <strong>{tp.dateMin ? weekdayLabel(tp.dateMin) : "—"}</strong>
              {tp.dateMax && tp.dateMax !== tp.dateMin ? <> e <strong>{weekdayLabel(tp.dateMax)}</strong></> : null}
              {dataAlvo ? <> · marcada para <strong style={{ color: T.accentDark }}>{weekdayLabel(dataAlvo)}</strong></> : null}
            </div>
          </div>
          {canPlanejar && dasVisita.length > 0 && (
            <Btn small variant="subtle" icon={Wand2} onClick={onSugerir}>Preencher o que falta</Btn>
          )}
        </div>
      </div>

      {aviso && (
        <div className="text-[11px] rounded-lg px-3 py-2"
          style={{ background: aviso.erro ? T.dangerSoft : T.accentSoft, color: aviso.erro ? T.danger : T.accentDark }}>
          {aviso.texto}
        </div>
      )}

      {/* ---- acrescentar atividade ---- */}
      {canPlanejar && (
        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3">
          <div className="text-[11px] font-bold uppercase tracking-wide mb-2" style={{ color: T.accentDark }}>
            Acrescentar atividade nesta visita
          </div>
          <div className="flex gap-2 items-end flex-wrap">
            <label className="text-[10px]" style={{ color: T.inkMuted }}>Atividade / método
              <select value={novaAtividade} onChange={(e) => setNovaAtividade(e.target.value)}
                className="mt-0.5 block text-xs px-2 py-1.5 rounded-md outline-none w-56" style={{ border: `1px solid ${T.line}` }}>
                <option value="">— escolha —</option>
                {data.activities.map((a) => (
                  <option key={a.id} value={a.id}>
                    {a.name}{a.mestre ? " · mestre" : a.cedivel ? " · cedível" : ""} ({a.durationMin ?? 60} min)
                  </option>
                ))}
              </select>
            </label>
            <label className="text-[10px]" style={{ color: T.inkMuted }}>Começa às
              <input type="time" step={900} value={hora} onChange={(e) => setHora(e.target.value)}
                className="mt-0.5 block text-xs px-2 py-1.5 rounded-md outline-none w-28" style={{ border: `1px solid ${T.line}` }} />
            </label>
            {grupos.length > 0 && (
              <label className="text-[10px]" style={{ color: T.inkMuted }}>Grupo
                <select value={grupoSel} onChange={(e) => setGrupoSel(e.target.value)}
                  className="mt-0.5 block text-xs px-2 py-1.5 rounded-md outline-none w-36" style={{ border: `1px solid ${T.line}` }}>
                  <option value="">— todos —</option>
                  {grupos.map((g) => <option key={g.id} value={g.id}>{g.name} ({g.size})</option>)}
                </select>
              </label>
            )}
            <Btn small icon={Plus} disabled={!novaAtividade || !dataAlvo} onClick={criar}>Acrescentar</Btn>
          </div>
          <div className="text-[10px] mt-1.5" style={{ color: T.inkMuted }}>
            A atividade entra já com sala sugerida e sem equipe. Clique nela e preencha pela coluna da direita.
          </div>
        </div>
      )}

      {/* ---- o que já está montado, agrupado por sala ---- */}
      {!dasVisita.length && (
        <div style={{ background: T.surface, border: `1px dashed ${T.line}` }} className="rounded-xl p-5 text-center">
          <div className="text-xs" style={{ color: T.inkMuted }}>
            Nada marcado nesta visita ainda. Acrescente a primeira atividade acima.
          </div>
        </div>
      )}

      {blocos.map((bl) => {
        const varios = bl.bookings.length > 1;
        return (
          <div key={`${bl.locationId}-${bl.start}`} style={{ background: T.surface, border: `1px solid ${varios ? T.accent : T.line}` }} className="rounded-xl overflow-hidden">
            {/* O cabeçalho do bloco é a sala: é ela que junta as atividades. */}
            <div className="px-3 py-2 flex items-center justify-between gap-2 flex-wrap"
              style={{ background: varios ? T.accentSoft : T.subtle }}>
              <div className="text-xs font-semibold flex items-center gap-1.5">
                <Building2 size={13} style={{ color: T.accentDark }} />
                {nomeSala(bl.locationId)}
                <span style={{ color: T.inkMuted, fontWeight: 400 }}>· {bl.start}–{bl.end}</span>
              </div>
              <div className="text-[10px]" style={{ color: T.inkMuted }}>
                {varios ? `${bl.bookings.length} atividades ao mesmo tempo na mesma sala` : "1 atividade"}
                {bl.participantes ? ` · ${bl.participantes} participante(s)` : ""}
              </div>
            </div>

            <div className="p-2 space-y-1.5">
              {bl.bookings.map((b) => {
                const act = data.activities.find((a) => a.id === b.activityId);
                const precisa = Math.max(1, act?.staffCount ?? 1);
                const tem = (b.collaboratorIds || []).length;
                const completa = tem >= precisa && (!b.needDoctor || b.doctorId);
                const escolhida = b.id === reservaSelId;
                return (
                  <button key={b.id} onClick={() => onSelecionarReserva(b.id)}
                    className="w-full text-left rounded-lg px-2.5 py-2"
                    style={{ background: escolhida ? T.accentSoft : T.bg,
                             border: `1px solid ${escolhida ? T.accent : "transparent"}` }}>
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                      <div className="text-xs font-semibold flex items-center gap-1.5">
                        {act?.mestre && <Lock size={11} style={{ color: T.danger }} title="atividade mestre" />}
                        {nomeAtiv(b.activityId)}
                        <span style={{ color: T.inkMuted, fontWeight: 400 }}>{b.start}–{b.end}</span>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <Chip tone={completa ? "accent" : "gold"}>{completa ? "completa" : `falta ${precisa - tem}`}</Chip>
                        {canPlanejar && (
                          <span onClick={(e) => { e.stopPropagation(); onExcluirReserva(b); }}
                            style={{ color: T.danger }} title="tirar esta atividade da visita">
                            <Trash2 size={13} />
                          </span>
                        )}
                      </div>
                    </div>
                    <div className="text-[10px] mt-1 flex flex-wrap gap-x-3" style={{ color: T.inkMuted }}>
                      <span><Users size={9} className="inline -mt-0.5 mr-1" />
                        {tem ? (b.collaboratorIds || []).map(nomePessoa).join(", ") : "sem equipe"}</span>
                      {b.equipmentId && <span><Package size={9} className="inline -mt-0.5 mr-1" />
                        {data.equipment.find((e) => e.id === b.equipmentId)?.name || "aparelho"}</span>}
                      {b.doctorId && <span><Stethoscope size={9} className="inline -mt-0.5 mr-1" />
                        {data.doctors.find((d) => d.id === b.doctorId)?.name || "médico"}</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* Situação de uma visita, para a bolha da linha do tempo. */
function visitaSituacao(tp, bookings, data) {
  const doTp = (bookings || []).filter((b) => b.timepointId === tp.id);
  if (!doTp.length) return { cor: "vazia", texto: "não agendada" };
  const incompleta = doTp.some((b) => b.status === "pendente_equipe");
  const concluidas = doTp.filter((b) => b.completedAt).length;
  if (concluidas === doTp.length) return { cor: "ok", texto: `${doTp.length} atividade(s) · concluída` };
  if (incompleta) return { cor: "falta", texto: `${doTp.length} atividade(s) · falta equipe` };
  return { cor: "ok", texto: `${doTp.length} atividade(s) · agendada` };
}

/* A COLUNA DA DIREITA — o que dá pra encaixar, e o que fazer a respeito
 *
 * Antes ela só respondia "quem está livre". Faltava metade da pergunta: sem
 * saber que sala atende o método e que aparelho está calibrado, a pessoa
 * escolhia a equipe e descobria o resto do problema depois, no erro de
 * gravação.
 *
 * Agora as três listas ficam lado a lado, todas presas à ATIVIDADE escolhida
 * na coluna do meio — porque disponibilidade sem atividade não quer dizer
 * nada: a mesma sala serve pra um método e não serve pro outro. */
function LinhaRecurso({ nome, detalhe, situacao, acao, onAcao, marca, desabilitado }) {
  const m = ENCAIXE_META[situacao] || ENCAIXE_META.fora;
  return (
    <div className="rounded-lg px-2 py-1.5 flex items-center justify-between gap-2"
      style={{ background: m.fundo === "transparent" ? T.bg : m.fundo,
               border: `1px solid ${T.line}`, borderLeft: `3px solid ${m.cor}`,
               opacity: situacao === "fora" ? 0.65 : 1 }}>
      <div className="min-w-0">
        <div className="text-xs font-medium truncate">{nome}</div>
        <div className="text-[10px] truncate" style={{ color: T.inkMuted }}>{detalhe}</div>
      </div>
      {marca ? (
        <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full shrink-0"
          style={{ background: T.accent, color: "#fff" }}>{marca}</span>
      ) : acao && !desabilitado ? (
        <button onClick={onAcao} className="text-[10px] font-semibold px-2 py-1 rounded-md shrink-0"
          style={{ background: m.cor, color: "#fff" }}>{acao}</button>
      ) : (
        <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full shrink-0"
          style={{ background: m.cor, color: "#fff" }}>{m.rotulo}</span>
      )}
    </div>
  );
}

function PainelDisponibilidade({
  data, bookings, studies, reserva, atividade, participantes, staffRequests,
  podeNegociar, onPuxar, onPedir, onEscolherSala, onEscolherEquipamento, onEscolherMedico,
  onPedirTreinamento, onPedirHoraExtra,
}) {
  const [secao, setSecao] = useState("equipe");
  const [recado, setRecado] = useState(null);
  const [ocupada, setOcupada] = useState(null);

  const opcoes = useMemo(() => (atividade && reserva
    ? encaixeOpcoes({ activity: atividade, date: reserva.date, start: reserva.start,
        data, bookings, studies, participants: participantes, excludeId: reserva.id })
    : { salas: [], pessoas: [], equipamentos: [], medicos: [] }),
  [atividade, reserva, data, bookings, studies, participantes]);

  if (!atividade || !reserva) {
    return (
      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3">
        <div className="text-[11px] font-bold uppercase tracking-wide mb-1" style={{ color: T.accentDark }}>Quem está livre</div>
        <div className="text-[11px]" style={{ color: T.inkMuted }}>
          Escolha uma atividade na coluna do meio. A disponibilidade depende dela: a mesma sala
          atende um método e não atende outro, e o nível exigido muda quem pode entrar.
        </div>
      </div>
    );
  }

  const naReserva = new Set(reserva.collaboratorIds || []);
  const faltam = Math.max(0, (activityTimes(atividade).staff || 1) - naReserva.size);

  const agir = async (fn, linha, rotulo) => {
    setOcupada(linha.item.id);
    try {
      const r = await fn();
      if (r && r.ok === false) setRecado({ erro: true, texto: (r.problemas || ["não deu"]).join(" · ") });
      else setRecado({ erro: false, texto: `${linha.item.name} ${rotulo}.` });
    } catch (e) {
      setRecado({ erro: true, texto: e?.message || "não deu pra concluir" });
    } finally { setOcupada(null); }
  };

  const SECOES = [
    { id: "equipe", rotulo: `Equipe${faltam ? ` · falta ${faltam}` : ""}`, n: opcoes.pessoas.filter((p) => p.situacao === "livre").length },
    { id: "salas", rotulo: "Salas", n: opcoes.salas.filter((x) => x.situacao === "livre").length },
    { id: "equip", rotulo: "Equipamentos", n: opcoes.equipamentos.filter((x) => x.situacao === "livre").length },
    ...(atividade.requiresDoctor ? [{ id: "medicos", rotulo: "Médicos", n: opcoes.medicos.filter((x) => x.situacao === "livre").length }] : []),
  ];

  return (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-3">
      <div className="text-[11px] font-bold uppercase tracking-wide" style={{ color: T.accentDark }}>
        Disponível para {atividade.name}
      </div>
      <div className="text-[10px] mb-2" style={{ color: T.inkMuted }}>
        {weekdayLabel(reserva.date)} · {reserva.start}–{reserva.end}
        {faltam > 0 && <span style={{ color: T.warn }}> · falta {faltam} pessoa(s)</span>}
      </div>

      <div className="flex gap-1 mb-2 flex-wrap">
        {SECOES.map((s) => (
          <button key={s.id} onClick={() => setSecao(s.id)}
            className="text-[10px] font-semibold px-2 py-1 rounded-md"
            style={{ background: secao === s.id ? T.accent : T.subtle, color: secao === s.id ? "#fff" : T.inkMuted }}>
            {s.rotulo} <span style={{ opacity: 0.75 }}>({s.n})</span>
          </button>
        ))}
      </div>

      {recado && (
        <div className="text-[10px] rounded-md px-2 py-1.5 mb-2"
          style={{ background: recado.erro ? T.dangerSoft : T.accentSoft, color: recado.erro ? T.danger : T.accentDark }}>
          {recado.texto}
        </div>
      )}

      <div className="space-y-1 max-h-[420px] overflow-y-auto pr-0.5">
        {secao === "equipe" && opcoes.pessoas.map((p) => {
          const pedido = (staffRequests || []).find((r) => r.status === "pendente"
            && r.collaboratorId === p.item.id && r.bookingId === reserva.id);
          if (naReserva.has(p.item.id)) {
            return <LinhaRecurso key={p.item.id} nome={p.item.name} detalhe="já está nesta atividade" situacao="livre" marca="escalada" />;
          }
          if (pedido) return <LinhaRecurso key={p.item.id} nome={p.item.name} detalhe="aguardando resposta" situacao="pedir" marca="pedido enviado" />;
          /* Nível insuficiente não é beco: o atalho manda o pedido de
           * treinamento com a atividade já preenchida. */
          if (p.situacao === "fora" && p.faltaNivel > 0) {
            return <LinhaRecurso key={p.item.id} nome={p.item.name} detalhe={p.detalhe} situacao="fora"
              acao={onPedirTreinamento ? "treinar" : null} desabilitado={ocupada === p.item.id}
              onAcao={() => agir(() => onPedirTreinamento(p.item, atividade), p, "entrou na fila de treinamento")} />;
          }
          if (p.situacao === "horario") {
            return <LinhaRecurso key={p.item.id} nome={p.item.name} detalhe={p.detalhe} situacao="horario"
              acao={onPedirHoraExtra ? "hora extra" : null} desabilitado={ocupada === p.item.id}
              onAcao={() => agir(() => onPedirHoraExtra(p.item, reserva), p, "recebeu pedido de hora extra")} />;
          }
          const acao = p.situacao === "livre" ? "escolher" : p.situacao === "cedivel" ? "puxar" : p.situacao === "pedir" ? "pedir" : null;
          if (!acao || !podeNegociar) return <LinhaRecurso key={p.item.id} nome={p.item.name} detalhe={p.detalhe} situacao={p.situacao} />;
          const fn = p.situacao === "pedir" ? onPedir : onPuxar;
          return <LinhaRecurso key={p.item.id} nome={p.item.name} detalhe={p.detalhe} situacao={p.situacao}
            acao={acao} desabilitado={ocupada === p.item.id}
            onAcao={() => agir(() => fn({ collaboratorId: p.item.id, destino: reserva }), p,
              p.situacao === "pedir" ? "— pedido enviado" : `entrou em ${atividade.name}`)} />;
        })}

        {secao === "salas" && opcoes.salas.map((l) => (
          <LinhaRecurso key={l.item.id} nome={l.item.name} detalhe={l.detalhe} situacao={l.situacao}
            marca={reserva.locationId === l.item.id ? "em uso" : null}
            acao={l.situacao === "livre" && onEscolherSala ? "usar" : null}
            desabilitado={ocupada === l.item.id}
            onAcao={() => agir(() => onEscolherSala(reserva, l.item), l, "virou a sala desta atividade")} />
        ))}

        {secao === "equip" && (opcoes.equipamentos.length ? opcoes.equipamentos.map((e) => (
          <LinhaRecurso key={e.item.id} nome={e.item.name} detalhe={e.detalhe} situacao={e.situacao}
            marca={reserva.equipmentId === e.item.id ? "em uso" : null}
            acao={e.situacao === "livre" && onEscolherEquipamento ? "usar" : null}
            desabilitado={ocupada === e.item.id}
            onAcao={() => agir(() => onEscolherEquipamento(reserva, e.item), e, "virou o aparelho desta atividade")} />
        )) : <div className="text-[11px]" style={{ color: T.inkMuted }}>Nenhum equipamento cadastrado.</div>)}

        {secao === "medicos" && opcoes.medicos.map((d) => (
          <LinhaRecurso key={d.item.id} nome={d.item.name} detalhe={d.detalhe} situacao={d.situacao}
            marca={reserva.doctorId === d.item.id ? "escalado" : null}
            acao={d.situacao === "livre" && onEscolherMedico ? "escalar" : null}
            desabilitado={ocupada === d.item.id}
            onAcao={() => agir(() => onEscolherMedico(reserva, d.item), d, "foi escalado")} />
        ))}
      </div>

      <div className="text-[10px] mt-2 pt-2" style={{ color: T.inkMuted, borderTop: `1px solid ${T.line}` }}>
        <strong>Livre</strong> entra direto. <strong>Cedível</strong> é quem está numa atividade marcada
        como tal no Cadastro — puxa sem pedir, porque a permissão já foi combinada.
        <strong> Precisa pedir</strong> vira solicitação ao outro agendador.
        <strong> Não sai</strong> é atividade mestre, atividade já iniciada ou ausência.
      </div>
    </div>
  );
}


/* Caixa de pedidos de equipe. Os dois lados na mesma lista, porque quem pede
 * também precisa ver o que já pediu — senão pede duas vezes, ou fica esperando
 * uma resposta que já veio. */
function PedidosDeEquipe({ staffRequests, data, studies, bookings, actorName, onDecidir, onCancelar, podeResponder }) {
  const [resposta, setResposta] = useState({});
  const [ocupado, setOcupado] = useState(null);
  const [erro, setErro] = useState("");
  const pendentes = (staffRequests || []).filter((r) => r.status === "pendente");
  const recentes = (staffRequests || []).filter((r) => r.status !== "pendente").slice(0, 5);
  if (!pendentes.length && !recentes.length) return null;

  const nome = (id, lista) => (lista || []).find((x) => x.id === id)?.name || "—";
  const decidir = async (req, aceitar) => {
    setOcupado(req.id); setErro("");
    const r = await onDecidir(req, { aceitar, resposta: resposta[req.id] || "" });
    setOcupado(null);
    if (!r?.ok) setErro((r?.problemas || ["não foi possível responder"]).join(" · "));
  };

  return (
    <div style={{ background: T.surface, border: `1px solid ${pendentes.length ? T.gold : T.line}` }} className="rounded-xl p-3 space-y-2">
      <div className="text-[11px] font-bold uppercase tracking-wide" style={{ color: T.accentDark }}>
        Pedidos de equipe {pendentes.length ? `(${pendentes.length} esperando resposta)` : ""}
      </div>
      {erro && <div className="text-[10px] px-2 py-1 rounded" style={{ background: T.dangerSoft, color: T.danger }}>{erro}</div>}
      {pendentes.map((r) => {
        const meu = r.requestedBy === actorName;
        const est = studies.find((s) => s.id === r.studyId);
        return (
          <div key={r.id} className="rounded-lg px-2.5 py-2" style={{ background: T.goldSoft, border: `1px solid ${T.gold}` }}>
            <div className="text-xs font-medium">
              {nome(r.collaboratorId, data.collaborators)} — {nome(r.activityId, data.activities)}
            </div>
            <div className="text-[10px] mt-0.5" style={{ color: T.inkMuted }}>
              {r.date ? weekdayLabel(r.date) : "—"} {r.start}–{r.end} · para {est?.name || "outro estudo"} · pedido por {r.requestedBy}
              {r.origemStudyIds?.length ? ` · sairia de ${r.origemStudyIds.map((id) => studies.find((s) => s.id === id)?.name || "?").join(", ")}` : ""}
            </div>
            {r.motivo && <div className="text-[10px] mt-0.5 italic" style={{ color: T.inkMuted }}>"{r.motivo}"</div>}
            <div className="flex gap-1.5 mt-1.5 items-center flex-wrap">
              {meu ? (
                <>
                  <span className="text-[10px]" style={{ color: T.inkMuted }}>você pediu — aguardando resposta</span>
                  <Btn small variant="ghost" onClick={() => onCancelar(r)}>Cancelar pedido</Btn>
                </>
              ) : podeResponder ? (
                <>
                  <input value={resposta[r.id] || ""} onChange={(e) => setResposta((s) => ({ ...s, [r.id]: e.target.value }))}
                    placeholder="resposta (opcional)" className="text-[11px] rounded px-1.5 py-1 flex-1 min-w-[120px]"
                    style={{ border: `1px solid ${T.line}`, background: T.surface }} />
                  <Btn small disabled={ocupado === r.id} onClick={() => decidir(r, true)}>Aceitar e remanejar</Btn>
                  <Btn small variant="ghost" disabled={ocupado === r.id} onClick={() => decidir(r, false)}>Recusar</Btn>
                </>
              ) : (
                <span className="text-[10px]" style={{ color: T.inkMuted }}>sem permissão para responder</span>
              )}
            </div>
          </div>
        );
      })}
      {recentes.map((r) => {
        const meta = STAFF_REQUEST_STATUS[r.status] || {};
        return (
          <div key={r.id} className="rounded-lg px-2.5 py-1.5 flex items-center justify-between gap-2" style={{ background: T.bg }}>
            <div className="min-w-0">
              <div className="text-[11px] truncate">{nome(r.collaboratorId, data.collaborators)} — {nome(r.activityId, data.activities)}</div>
              <div className="text-[10px] truncate" style={{ color: T.inkMuted }}>
                {r.decidedBy ? `${r.decidedBy} respondeu` : "encerrado"}{r.resposta ? `: "${r.resposta}"` : ""}
              </div>
            </div>
            <Chip tone={meta.tone || "neutral"}>{meta.label || r.status}</Chip>
          </div>
        );
      })}
    </div>
  );
}

/* Uma falha aqui dentro não pode derrubar o sistema inteiro. Sem isto, um
 * erro nesta tela deixa a página em branco e a pessoa sem nada — nem o
 * Cronograma, nem o Painel, nem como sair. */
class LimiteDeErro extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  render() {
    if (!this.state.erro) return this.props.children;
    return (
      <div style={{ background: T.dangerSoft, border: `1px solid ${T.danger}` }} className="rounded-xl p-4 space-y-2">
        <div className="text-sm font-semibold" style={{ color: T.danger }}>Esta tela encontrou um erro.</div>
        <div className="text-xs" style={{ color: T.ink }}>
          O resto do sistema continua funcionando — use o menu ao lado. Detalhe técnico:
          <code className="block mt-1 text-[11px]">{String(this.state.erro?.message || this.state.erro)}</code>
        </div>
        <Btn small variant="ghost" icon={RefreshCw} onClick={() => this.setState({ erro: null })}>Tentar de novo</Btn>
      </div>
    );
  }
}

function EstudoView(props) {
  const { data, studies, timepoints, bookings, canGerenciar, canVerCustos, onSaveStudyWithTimepoints,
    staffRequests = [], onPuxarColaborador, onPedirColaborador, onDecidirPedidoEquipe, onCancelarPedidoEquipe,
    onCreateBookingAtomic, onDeleteBookingsAtomic, onUpdateBookingsAtomic,
    onCreateTrainingRequest, onCreateOvertimeRequest, actorName } = props;
  const [selId, setSelId] = useState(null);
  const [aba, setAba] = useState("planejar");
  const [editando, setEditando] = useState(null); // objeto do estudo, ou {} para novo
  const [visitaSel, setVisitaSel] = useState(null);

  const estudo = studies.find((s) => s.id === selId) || null;
  const doEstudo = useMemo(() => timepoints.filter((tp) => tp.studyId === selId)
    .sort((a, b) => (a.offsetDays ?? 0) - (b.offsetDays ?? 0)), [timepoints, selId]);
  const reservasDoEstudo = useMemo(() => bookings.filter((b) => b.studyId === selId), [bookings, selId]);
  const tpSel = doEstudo.find((tp) => tp.id === visitaSel) || doEstudo[0] || null;

  /* A reserva que está sendo preenchida. TUDO na coluna da direita depende
   * dela: disponibilidade sem atividade não quer dizer nada, porque a mesma
   * sala serve pra um método e não serve pro outro. */
  const [reservaSelId, setReservaSelId] = useState(null);
  const [aviso, setAviso] = useState(null);
  const daVisita = useMemo(() => bookings.filter((b) => b.timepointId === tpSel?.id), [bookings, tpSel]);
  /* Escolha automática quando a pessoa ainda não clicou em nada: a que está
   * faltando gente é a que ela veio resolver. */
  const reservaSel = useMemo(() => daVisita.find((b) => b.id === reservaSelId)
    || daVisita.find((b) => b.status === "pendente_equipe") || daVisita[0] || null, [daVisita, reservaSelId]);
  const atividadeSel = useMemo(() => (reservaSel
    ? data.activities.find((a) => a.id === reservaSel.activityId) : null), [reservaSel, data.activities]);
  const participantesDaReserva = reservaSel?.participantCount
    || studyGroupById(estudo, reservaSel?.studyGroupId)?.size
    || studyParticipantsTotal(estudo) || 0;

  // Ao trocar de visita, a seleção antiga não vale mais.
  useEffect(() => { setReservaSelId(null); setAviso(null); }, [tpSel?.id]);

  const dizer = (texto, erro) => setAviso({ texto, erro: !!erro });

  /* Criar já com a sala sugerida. Deixar a reserva nascer sem sala pareceria
   * mais simples, mas jogaria pra pessoa um trabalho que o sistema faz melhor:
   * ele já sabe quais salas atendem o método e quais estão livres. */
  const criarReserva = async ({ activityId, date, start, studyGroupId }) => {
    const act = data.activities.find((a) => a.id === activityId);
    if (!act) return;
    const end = addMinutes(start, act.durationMin ?? 60);
    const blk = blockedWindow(start, end, act);
    const grupo = studyGroupById(estudo, studyGroupId);
    const participantes = grupo?.size || studyParticipantsTotal(estudo) || 0;
    /* Atividade que acontece junto com outra da MESMA visita fica na MESMA
     * sala, de propósito. É como a coisa acontece: as voluntárias entram numa
     * sala e as medições rodam ali. Espalhar por salas diferentes só porque a
     * primeira "está ocupada" inventaria um deslocamento que ninguém faz — e
     * era o que acontecia enquanto a escolha olhava só pra sala vazia.
     *
     * `groupId` é o que diz ao motor que essas reservas dividem a sala de
     * propósito; sem ele, a segunda seria recusada por conflito. */
    const vizinhas = daVisita.filter((b) => b.date === date && b.locationId
      && overlaps(toMin(blk.start), toMin(blk.end), bookingBlock(b).s, bookingBlock(b).e));
    const permitidas = act.locationIds?.length ? new Set(act.locationIds) : null;
    const juntar = vizinhas.find((b) => !permitidas || permitidas.has(b.locationId));

    let locationId = null, groupId = null, comoEscolheu = "";
    if (juntar) {
      locationId = juntar.locationId;
      groupId = juntar.groupId || genId("grp");
      comoEscolheu = "na mesma sala da atividade que já estava nesse horário";
    } else {
      const opcoes = encaixeOpcoes({ activity: act, date, start, data, bookings, studies, participants: participantes });
      const salaLivre = opcoes.salas.find((l) => l.situacao === "livre");
      if (!salaLivre) {
        const ocupadas = opcoes.salas.filter((l) => l.situacao === "pedir").length;
        dizer(ocupadas
          ? `Nenhuma sala livre para ${act.name} às ${start} — ${ocupadas} está(ão) ocupada(s) nesse horário. Veja em "Salas", na coluna da direita, com quem falar.`
          : `Nenhuma sala cadastrada atende ${act.name} nesse horário.`, true);
        return;
      }
      locationId = salaLivre.item.id;
      comoEscolheu = "";
    }
    const nomeSala = data.locations.find((l) => l.id === locationId)?.name || "a sala";

    const nova = {
      id: genId("bk"), studyId: estudo.id, studyName: estudo.name, timepointId: tpSel.id,
      activityId, date, start, end, blockStart: blk.start, blockEnd: blk.end,
      locationId, groupId, collaboratorIds: [], accessoryIds: [],
      doctorId: null, needDoctor: !!act.requiresDoctor, equipmentId: null,
      studyGroupId: studyGroupId || null, participantCount: participantes || null,
      status: "pendente_equipe", createdBy: actorName, createdAt: new Date().toISOString(),
    };
    /* Se está entrando num grupo novo, a vizinha precisa ganhar o mesmo
     * `groupId` — senão só a nova ficaria isenta do conflito de sala, e a
     * isenção de um lado só é justamente o estado que não descreve nada. */
    const precisaMarcarVizinha = juntar && !juntar.groupId;
    /* A reserva nova NÃO entra na lista comparada: a checagem de conflito
     * dispensa quem tem o `excludeId`, não quem tem o mesmo id do assunto — e
     * mandar a própria reserva junto a fazia conflitar consigo mesma. */
    const universo = bookings.map((b) => (precisaMarcarVizinha && b.id === juntar.id ? { ...b, groupId } : b));
    const v = validateBooking(nova, { ...data, studies }, universo, nova.id);
    if (v.errors.length) { dizer(`Não deu pra encaixar ${act.name}: ${v.errors[0]}`, true); return; }

    const ok = precisaMarcarVizinha
      ? await onUpdateBookingsAtomic([...bookings.map((b) => (b.id === juntar.id ? { ...b, groupId } : b)), nova])
      : await onCreateBookingAtomic(nova);
    if (ok === false) return;
    setReservaSelId(nova.id);
    dizer(`${act.name} entrou na visita, em ${nomeSala}${comoEscolheu ? ` — ${comoEscolheu}` : ""}. Agora preencha a equipe pela coluna da direita.`);
  };

  const excluirReserva = async (b) => {
    const ok = await onDeleteBookingsAtomic([b]);
    if (ok !== false && b.id === reservaSelId) setReservaSelId(null);
  };

  /* Trocar um recurso de uma reserva que já existe. Passa pela validação
   * inteira: a troca pode criar exatamente o conflito que a tela existe pra
   * impedir. */
  const trocarNaReserva = async (b, patch, comoDescrever) => {
    const nova = { ...b, ...patch };
    const universo = bookings.map((x) => (x.id === b.id ? nova : x));
    const v = validateBooking(nova, { ...data, studies }, universo, b.id);
    if (v.errors.length) return { ok: false, problemas: v.errors };
    const act = data.activities.find((a) => a.id === nova.activityId);
    const comStatus = { ...nova, status: nova.completedAt ? nova.status : bookingStatusFor(nova, act) };
    const ok = await onUpdateBookingsAtomic(bookings.map((x) => (x.id === b.id ? comStatus : x)));
    return { ok: ok !== false, problemas: ok === false ? ["a gravação não foi concluída"] : [] };
  };

  const escolherSala = (b, sala) => trocarNaReserva(b, { locationId: sala.id });
  const escolherEquipamento = (b, eq) => trocarNaReserva(b, { equipmentId: eq.id });
  const escolherMedico = (b, med) => trocarNaReserva(b, { doctorId: med.id, needDoctor: true });

  /* Os dois atalhos que evitam sair da tela: quem não tem nível entra na fila
   * de treinamento, e quem está fora do horário recebe pedido de hora extra.
   * Sem eles, a pessoa via o impedimento aqui e tinha que ir procurar a tela
   * certa — e normalmente não ia. */
  const pedirTreinamento = async (pessoa, act) => {
    if (!onCreateTrainingRequest) return { ok: false, problemas: ["treinamento não disponível para o seu usuário"] };
    const req = {
      id: genId("trq"), collaboratorId: pessoa.id, activityId: act.id,
