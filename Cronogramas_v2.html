      id: genId("train"), studyName: derm.name, activityId: actBy("Io - Instilação") || actTecnica,
      activityName: "Io - Instilação", collaboratorId: colBy("Rodrigo Assis")?.id || null, collaboratorName: "Rodrigo Assis",
      requiredLevel: 3, deadlineDate: addDays(t, 3), status: "recusado",
      scheduledDate: null, scheduledStart: null, requestedAt: daysAgoIso(4), confirmedBy: null,
    },
  ];

  // Horas extras: uma em cada estado do fluxo de 2 passos, pra tela nascer
  // mostrando as três seções (aguardando aprovação / aguardando resposta / aprovada).
  const camila = colBy("Camila Rocha");
  const larissa = colBy("Larissa Menezes");
  const overtimeRequests = [
    {
      id: genId("ovt"), origin: "encaixe", studyId: solar.id, studyName: solar.name,
      activityId: actApoio, activityName: "Apoio", date: addDays(t, 2), start: "18:30", end: "20:00",
      locationId: data.locations[0].id, locationName: data.locations[0].name,
      role: "collaborator", personId: larissa?.id, personName: larissa?.name || "—",
      collaboratorIds: [larissa?.id].filter(Boolean), doctorId: null,
      sponsorId: solar.sponsorId, minLevel: 3, reason: "voluntário só consegue vir após o expediente",
      requestedBy: "Gestor", requestedAt: daysAgoIso(1),
      status: "disponivel", decidedBy: larissa?.name || "—", decidedAt: daysAgoIso(0),
      approvedAt: null, approvedBy: null, bookingId: null,
    },
    {
      id: genId("ovt"), origin: "plano", studyId: null, studyName: derm.name,
      activityId: actTecnica, activityName: "Avaliação Técnica", date: addDays(t, 4), start: "18:00", end: "19:00",
      locationId: data.locations[3].id, locationName: data.locations[3].name,
      role: "collaborator", personId: camila?.id, personName: camila?.name || "—",
      requestedBy: "Gestor", requestedAt: daysAgoIso(0),
      status: "pendente", decidedAt: null, decidedBy: null, approvedAt: null, approvedBy: null, bookingId: null,
    },
  ];

  /* `collaborators` só vem preenchido quando o pacote precisou garantir algum
   * nível — é a lista NOVA, com objetos novos, pra a carga regravar e o
   * adaptador enxergar a diferença. Ver `equipePara`. */
  const collaborators = niveisGarantidos.size
    ? data.collaborators.map((c) => (niveisGarantidos.has(c.id)
        ? { ...c, levels: { ...c.levels, ...niveisGarantidos.get(c.id) } } : c))
    : null;
  return { studies, timepoints, bookings, trainingRequests, overtimeRequests, collaborators };
}

/* ---------------------------------------------------------------------- */
/* GRUPOS DO ESTUDO                                                         */
/*                                                                          */
/* Antes, o número de participantes era digitado à mão em cada reserva. Isso */
/* põe a mesma informação em vinte lugares: um estudo com 24 voluntárias     */
/* divididas em dois grupos de 12 obrigava quem agenda a lembrar "12" toda   */
/* vez, e errar uma vez significava marcar numa sala que não cabe.           */
/*                                                                          */
/* Agora o grupo é cadastrado UMA vez no estudo, com nome e tamanho, e a     */
/* reserva aponta pra ele. A capacidade da sala passa a ser conferida contra */
/* o grupo de verdade.                                                       */
/*                                                                          */
/* O campo na reserva chama `studyGroupId`, e NÃO `groupId`: esse último já  */
/* existe e quer dizer outra coisa (atividades simultâneas na mesma sala).   */
/* São dois "grupos" diferentes no mesmo sistema — o de gente e o de         */
/* atividades —, e trocá-los faria a validação de conflito de sala ignorar   */
/* reservas que deveria comparar.                                            */
/*                                                                          */
/* A reserva guarda TAMBÉM o número (`participantCount`), copiado do grupo   */
/* no momento em que foi marcada. Não é redundância à toa: é o que aconteceu */
/* de fato naquele dia. Se alguém mudar o tamanho do grupo depois, o passado */
/* não se reescreve sozinho — `staleGroupBookings` acha as reservas futuras  */
/* que ficaram para trás e deixa a pessoa decidir.                           */
/* ---------------------------------------------------------------------- */
const studyGroups = (study) => (Array.isArray(study?.groups) ? study.groups : []);
const studyGroupById = (study, groupId) => studyGroups(study).find((g) => g.id === groupId) || null;

// Total de participantes do estudo: a soma dos grupos quando existem, senão o
// número solto que já era cadastrado antes dos grupos existirem.
function studyParticipantsTotal(study) {
  const grupos = studyGroups(study);
  if (!grupos.length) return study?.participantsPlanned ?? null;
  return grupos.reduce((soma, g) => soma + (Number(g.size) || 0), 0);
}

/* Problemas no cadastro dos grupos. Sai daqui e não da tela pra poder ser
 * testado — e pra a mesma regra valer se um dia isso virar API. */
function studyGroupProblems(groups) {
  const out = [];
  const lista = Array.isArray(groups) ? groups : [];
  const vistos = new Set();
  lista.forEach((g, i) => {
    const nome = String(g?.name || "").trim();
    if (!nome) out.push(`o grupo ${i + 1} está sem nome`);
    else {
      const chave = nome.toLowerCase();
      if (vistos.has(chave)) out.push(`existe mais de um grupo chamado "${nome}"`);
      vistos.add(chave);
    }
    const n = Number(g?.size);
    if (!Number.isFinite(n) || n <= 0) out.push(`${nome || `o grupo ${i + 1}`} precisa de um número de pessoas maior que zero`);
  });
  return out;
}

/* A sala comporta esse grupo? Devolve a mensagem pronta ou null.
 * Reaproveita `participantLimit`, que já combina a capacidade da sala com o
 * máximo de participantes do método — o menor dos dois é quem manda. */
function groupRoomProblem(size, location, activity) {
  const n = Number(size) || 0;
  if (n <= 0) return null;
  const lim = participantLimit(location, activity);
  if (lim == null || n <= lim) return null;
  return `${location?.name || "a sala"} comporta ${lim} participante(s), o grupo tem ${n}`;
}

/* Reservas FUTURAS cujo número de participantes não bate mais com o tamanho
 * atual do grupo. Só o futuro: reserva que já aconteceu registra o que
 * aconteceu, e corrigir isso seria reescrever a história. */
function staleGroupBookings(bookings, studies, hoje) {
  const ref = hoje || todayStr();
  const out = [];
  (bookings || []).forEach((b) => {
    if (!b?.studyGroupId || b.date < ref) return;
    const study = (studies || []).find((s) => s.id === b.studyId);
    const grupo = studyGroupById(study, b.studyGroupId);
    if (!grupo) { out.push({ booking: b, motivo: "o grupo foi excluído do estudo", esperado: null, atual: b.participantCount ?? null }); return; }
    const tamanho = Number(grupo.size) || 0;
    if ((b.participantCount ?? null) !== tamanho) {
      out.push({ booking: b, motivo: `o grupo "${grupo.name}" agora tem ${tamanho}`, esperado: tamanho, atual: b.participantCount ?? null });
    }
  });
  return out;
}

/* ---------------------------------------------------------------------- */
/* TÉCNICO DO ESTUDO E ATIVIDADES MESTRES                                   */
/*                                                                          */
/* Três estados possíveis para uma atividade, e a diferença entre eles é o   */
/* quanto se pode mexer em quem está nela:                                   */
/*                                                                          */
/*   mestre    é o núcleo do estudo. Ninguém sai, nem pedindo. Quem começa   */
/*             é quem termina, e a pessoa é a MESMA em todas as visitas.     */
/*   cedivel   Apoio, Fluxo e afins. Outro agendador puxa a pessoa DIRETO,   */
/*             sem pedir permissão — é a regra combinada.                    */
/*   (nenhum)  o caso do meio: dá pra negociar, mas só com pedido.           */
/*                                                                          */
/* Por que "mestre" existe: numa atividade mestre a leitura depende de quem  */
/* executa. Trocar a pessoa no meio do protocolo introduz variação entre     */
/* medidas que deveriam ser comparáveis — o dado do estudo perde valor, e    */
/* não há como recuperar depois. Não é preferência de agenda, é integridade  */
/* do resultado. Por isso é bloqueio, e não aviso.                           */
/*                                                                          */
/* O TÉCNICO é escolhido no estudo, não na reserva. Escolher por reserva     */
/* seria pedir que alguém lembrasse de repetir a mesma pessoa em doze        */
/* visitas — e esquecer uma vez estraga o estudo inteiro em silêncio.        */
/* ---------------------------------------------------------------------- */
const isMasterActivity = (act) => !!act?.mestre;
const isYieldableActivity = (act) => !!act?.cedivel && !act?.mestre;

/* ---------------------------------------------------------------------- */
/* O QUE O SISTEMA DEDUZ SOZINHO — situação, D0 e técnico                  */
/* ---------------------------------------------------------------------- */
/* Três coisas saíam do cadastro do estudo e não deveriam: a situação, a data
 * do D0 e o técnico. Todas as três já estão escritas na agenda — perguntar de
 * novo é pedir que alguém repita o que o sistema sabe, e criar a chance de as
 * duas respostas divergirem. Estudo marcado "em planejamento" com dez visitas
 * agendadas é pior que não ter campo nenhum.
 *
 * O que sobra no cadastro é o que só a pessoa sabe: o nome do protocolo, o
 * patrocinador, o formato das visitas e o prazo combinado com o cliente. */

/* A visita que ancora o protocolo: a de menor deslocamento — o D0. */
function baselineTimepoint(studyId, timepoints) {
  return (timepoints || [])
    .filter((tp) => tp.studyId === studyId)
    .sort((a, b) => (a.offsetDays ?? 0) - (b.offsetDays ?? 0))[0] || null;
}

/* O D0 do estudo.
 *
 *   real: true   a primeira visita já está marcada — a data é fato
 *   real: false  ainda é projeção, contada do início do período combinado
 *
 * Enquanto ninguém marcou nada, o D0 é uma intenção; o dia em que a primeira
 * visita entra na agenda é o dia em que ele vira compromisso. Mostrar os dois
 * como se fossem a mesma coisa foi o que fez o planejador digitar uma data que
 * ele ainda não tinha. */
function studyBaseline(study, timepoints, bookings) {
  const tp0 = baselineTimepoint(study?.id, timepoints);
  if (tp0) {
    const marcadas = (bookings || [])
      .filter((b) => b.timepointId === tp0.id && b.date)
      .sort((a, b) => a.date.localeCompare(b.date));
    if (marcadas.length) return { date: marcadas[0].date, real: true, timepointId: tp0.id };
  }
  // Sem visita marcada: vale o que já estava gravado (base antiga) ou o começo
  // do período combinado.
  const previsto = study?.baselineDate || study?.startMin || todayStr();
  return { date: previsto, real: false, timepointId: tp0?.id || null };
}

/* A situação do estudo, lida da agenda.
 *
 * "cancelado" continua sendo decisão de gente: é um ato, não uma dedução — e
 * um estudo cancelado não volta a ficar ativo só porque sobrou reserva. */
function studyStatusAuto(study, timepoints, bookings) {
  if (study?.status === "cancelado") return "cancelado";
  const meus = (timepoints || []).filter((tp) => tp.studyId === study?.id);
  const reservas = (bookings || []).filter((b) => b.studyId === study?.id && bookingOccupies(b));
  if (!meus.length || !reservas.length) return "planejamento";
  const todasVisitasMarcadas = meus.every((tp) => reservas.some((b) => b.timepointId === tp.id));
  const tudoConcluido = reservas.every((b) => b.completedAt);
  if (todasVisitasMarcadas && tudoConcluido) return "concluido";
  return "ativo";
}

/* Quem faz uma atividade mestre neste estudo.
 *
 * A primeira visita marcada define a pessoa para o protocolo inteiro: é o
 * sentido da atividade mestre — a leitura carrega o jeito de quem mede, e
 * trocar no meio introduz variação entre medidas que deveriam ser comparáveis.
 * Antes de existir a primeira, não há a quem obedecer, e é por isso que a
 * função devolve null em vez de reclamar. */
function studyMasterTechnician(studyId, activityId, bookings, excludeId) {
  if (!studyId || !activityId) return null;
  const doEstudo = (bookings || [])
    .filter((b) => b.studyId === studyId && b.activityId === activityId && b.id !== excludeId
      && (b.collaboratorIds || []).length)
    .sort((a, b) => `${a.date || ""}${a.start || ""}`.localeCompare(`${b.date || ""}${b.start || ""}`));
  return doEstudo.length ? doEstudo[0].collaboratorIds[0] : null;
}

/* Todas as atividades mestres do estudo e quem ficou com cada uma. Serve pro
 * cabeçalho: é a resposta honesta para "quem é o técnico deste estudo". */
function studyTechnicians(study, bookings, activities) {
  const mestres = (activities || []).filter((a) => isMasterActivity(a));
  return mestres
    .map((a) => ({ activity: a, collaboratorId: studyMasterTechnician(study?.id, a.id, bookings) }))
    .filter((x) => x.collaboratorId);
}

/* Como a pessoa está presa nessa reserva. Devolve o motivo ou null.
 *
 * `mestre` não depende de campo nenhum no cadastro: a atividade é o núcleo do
 * protocolo, então quem está nela não sai por conveniência de agenda. Trocar
 * exige trocar em todas as visitas, e isso é outra operação. */
function collaboratorLockReason(collaboratorId, booking, study, activity) {
  if (!collaboratorId || !booking) return null;
  if (!(booking.collaboratorIds || []).includes(collaboratorId)) return null;
  if (isMasterActivity(activity)) return "atividade mestre — a equipe não pode ser trocada";
  if (booking.completedAt) return "a atividade já foi concluída";
  if (booking.startedAt) return "a atividade já começou";
  return null;
}

// Quem, nesta reserva, não pode ser trocado por outra pessoa.
function lockedCollaboratorIds(booking, study, activity) {
  return (booking?.collaboratorIds || []).filter((id) => collaboratorLockReason(id, booking, study, activity));
}

/* O técnico do estudo tem que estar escalado nas atividades mestres. É a
 * regra "quem começa é quem termina", conferida onde dá pra corrigir.
 *
 * Reserva que JÁ ACONTECEU não é cobrada: o que foi executado foi executado, e
 * apontar erro no passado só produz alerta que ninguém consegue resolver. */
function technicianProblems(booking, study, activity, hoje, bookings) {
  const out = [];
  if (!isMasterActivity(activity)) return out;
  if (booking?.completedAt) return out;
  if (booking?.date && booking.date < (hoje || todayStr())) return out;
  /* Quem já faz essa atividade no estudo. `study.technicianId` sobrevive só
   * como base antiga: o campo saiu do cadastro. Sem ninguém ainda, esta é a
   * primeira visita — ela DEFINE o técnico, não desobedece a ninguém. */
  const tecnico = studyMasterTechnician(booking?.studyId, booking?.activityId, bookings, booking?.id)
    || study?.technicianId || null;
  if (!tecnico) return out;
  if (!(booking?.collaboratorIds || []).includes(tecnico)) {
    out.push(`${activity?.name || "a atividade"} é mestre e já tem quem a faça neste estudo — trocar no meio do protocolo altera a leitura. Para trocar, troque em todas as visitas.`);
  }
  return out;
}

/* Trocar o técnico do estudo. Devolve o PLANO da troca, não a troca feita:
 * quem chama decide se aplica, e a tela mostra antes o que vai acontecer.
 *
 * A cascata é o ponto do item 3: trocar só numa visita deixaria o protocolo
 * com duas pessoas diferentes medindo a mesma coisa, que é exatamente o que a
 * atividade mestre existe pra impedir.
 *
 *   alteradas    reservas futuras de atividade mestre que passam ao novo
 *   intocadas    as que já aconteceram — o passado não se reescreve
 *   conflitos    onde o novo técnico já está ocupado no mesmo horário
 */
function technicianSwapPlan({ study, bookings, activities, novoTecnicoId, hoje }) {
  const ref = hoje || todayStr();
  const doEstudo = (bookings || []).filter((b) => b.studyId === study?.id);
  const daAtividade = (b) => (activities || []).find((a) => a.id === b.activityId);
  const mestres = doEstudo.filter((b) => isMasterActivity(daAtividade(b)));

  const intocadas = mestres.filter((b) => b.date < ref || b.completedAt);
  const candidatas = mestres.filter((b) => b.date >= ref && !b.completedAt);

  const conflitos = [];
  const alteradas = [];
  candidatas.forEach((b) => {
    const act = daAtividade(b);
    const blk = blockedWindow(b.start, b.end, act);
    // O novo técnico já está em outra coisa nesse horário? A checagem exclui
    // as próprias reservas deste estudo que a cascata vai reescrever.
    const outras = (bookings || []).filter((x) => !candidatas.some((c) => c.id === x.id));
    if (!fieldFree(novoTecnicoId, "collaborator", b.date, blk.start, blk.end, outras)) {
      conflitos.push({ booking: b, motivo: `já tem reserva em ${b.date} ${b.start}` });
      return;
    }
    const equipe = (b.collaboratorIds || []).filter((id) => id !== study?.technicianId);
    alteradas.push({ ...b, collaboratorIds: [...new Set([novoTecnicoId, ...equipe])] });
  });

  return {
    alteradas, intocadas, conflitos,
    podeAplicar: conflitos.length === 0,
    resumo: `${alteradas.length} visita(s) futura(s) passam ao novo técnico`
      + (intocadas.length ? `, ${intocadas.length} já aconteceram e ficam como estão` : "")
      + (conflitos.length ? `, ${conflitos.length} com conflito de agenda` : ""),
  };
}

/* Quem pode ser técnico de um estudo: tem nível nas atividades mestres que o
 * protocolo usa. Sem isso a lista ofereceria gente que a validação recusaria
 * na sequência — e escolher para depois ser recusado é pior que não escolher. */
function technicianCandidates(study, bookings, data) {
  const doEstudo = (bookings || []).filter((b) => b.studyId === study?.id);
  const mestres = doEstudo
    .map((b) => (data?.activities || []).find((a) => a.id === b.activityId))
    .filter(isMasterActivity);
  const exigidos = [...new Map(mestres.map((a) => [a.id, a])).values()];
  return (data?.collaborators || []).filter((c) => c.active !== false
    && exigidos.every((act) => (c.levels?.[act.id] || 0) >= (act.minLevel || 0)));
}

/* ---------------------------------------------------------------------- */
/* NEGOCIAÇÃO DE EQUIPE — puxar sem pedir, ou pedir                        */
/*                                                                          */
/* A agenda vive cheia de gente ocupada com atividade que termina antes do   */
/* estudo inteiro. Sem um caminho pra isso, o agendador vê "ninguém livre",  */
/* desiste, e a pessoa fica parada num apoio enquanto outro estudo trava.    */
/*                                                                          */
/* Quem decide qual caminho é a REGRA cadastrada na atividade, não o cargo   */
/* de quem pede:                                                            */
/*                                                                          */
/*   cedivel   puxa direto. Foi combinado uma vez, no Cadastro, e vale pra   */
/*             todo mundo — pedir de novo a cada vez seria pedir permissão   */
/*             pra uma permissão que já foi dada.                            */
/*   nem uma   nem outra: vira solicitação ao outro agendador.               */
/*   mestre    não sai. Nem pedindo (ver o bloco acima).                     */
/*                                                                          */
/* O plano é devolvido, não aplicado: a tela mostra o que vai acontecer      */
/* ANTES de acontecer. Tirar alguém de uma reserva alheia sem mostrar o      */
/* estrago é como o agendador perde a confiança no sistema uma vez só.       */
/* ---------------------------------------------------------------------- */

/* Onde a pessoa está presa no horário de uma reserva de destino. */
function conflictingBookingsFor(collaboratorId, destino, bookings, activities) {
  if (!collaboratorId || !destino) return [];
  const alvoAct = (activities || []).find((a) => a.id === destino.activityId);
  const blk = blockedWindow(destino.start, destino.end, alvoAct);
  const s = toMin(blk.start), e = toMin(blk.end);
  return (bookings || []).filter((b) => {
    if (b.id === destino.id) return false;
    if (b.date !== destino.date) return false;
    if (!bookingOccupies(b)) return false;
    if (!(b.collaboratorIds || []).includes(collaboratorId)) return false;
    const o = bookingBlock(b);
    return overlaps(s, e, o.s, o.e);
  });
}

/* Plano de trazer uma pessoa para uma reserva.
 *
 *   modo          "livre" | "puxar" | "pedir" | "impossivel"
 *   saidas        reservas reescritas SEM a pessoa (com o status recalculado:
 *                 tirar alguém pode deixar a outra reserva sem equipe, e isso
 *                 tem que aparecer lá, não sumir)
 *   entrada       a reserva de destino COM a pessoa
 *   impedimentos  por que não dá — vazio quando dá
 */
function pullPlan({ collaboratorId, destino, bookings, activities, studies, calendar, hoje }) {
  const impedimentos = [];
  const alvoAct = (activities || []).find((a) => a.id === destino?.activityId);
  if (!collaboratorId || !destino) return { modo: "impossivel", saidas: [], entrada: null, impedimentos: ["faltou a pessoa ou a atividade de destino"] };
  if ((destino.collaboratorIds || []).includes(collaboratorId)) {
    return { modo: "impossivel", saidas: [], entrada: null, impedimentos: ["a pessoa já está nessa reserva"] };
  }
  if (destino.completedAt) impedimentos.push("essa reserva já foi concluída");

  const blk = blockedWindow(destino.start, destino.end, alvoAct);
  const ausente = absenceOn(calendar, collaboratorId, destino.date, blk.start, blk.end);
  if (ausente) impedimentos.push(absenceLabel(ausente));

  const presas = conflictingBookingsFor(collaboratorId, destino, bookings, activities);
  const detalhes = presas.map((b) => {
    const act = (activities || []).find((a) => a.id === b.activityId);
    const est = (studies || []).find((s) => s.id === b.studyId) || null;
    return { booking: b, act, study: est, trava: collaboratorLockReason(collaboratorId, b, est, act), cedivel: isYieldableActivity(act) };
  });
  detalhes.filter((d) => d.trava).forEach((d) => {
    impedimentos.push(`${d.act?.name || "a atividade"}${d.study ? ` (${d.study.name})` : ""}: ${d.trava}`);
  });

  if (impedimentos.length) return { modo: "impossivel", saidas: [], entrada: null, impedimentos, ocupacoes: detalhes };

  const saidas = detalhes.map((d) => {
    const semEla = (d.booking.collaboratorIds || []).filter((id) => id !== collaboratorId);
    const nova = { ...d.booking, collaboratorIds: semEla };
    return { ...nova, status: nova.completedAt ? nova.status : bookingStatusFor(nova, d.act) };
  });
  const entradaBruta = { ...destino, collaboratorIds: [...new Set([...(destino.collaboratorIds || []), collaboratorId])] };
  const entrada = { ...entradaBruta, status: entradaBruta.completedAt ? entradaBruta.status : bookingStatusFor(entradaBruta, alvoAct) };

  const modo = !detalhes.length ? "livre" : (detalhes.every((d) => d.cedivel) ? "puxar" : "pedir");
  return { modo, saidas, entrada, impedimentos: [], ocupacoes: detalhes };
}

/* Ciclo de vida de um pedido de equipe entre agendadores.
 *
 * `pendente` é o único estado em que o pedido vale: aceitar depois que a
 * agenda mudou aplicaria um plano montado sobre uma realidade que já passou,
 * então a aceitação recalcula o plano do zero antes de gravar. */
const STAFF_REQUEST_STATUS = {
  pendente: { label: "Aguardando resposta", tone: "gold" },
  aceito: { label: "Aceito", tone: "accent" },
  recusado: { label: "Recusado", tone: "danger" },
  cancelado: { label: "Cancelado", tone: "neutral" },
};

function staffRequestBlank({ collaboratorId, destino, plano, actorName, motivo }) {
  return {
    id: genId("sreq"),
    collaboratorId,
    bookingId: destino?.id || null,
    studyId: destino?.studyId || null,
    date: destino?.date || null,
    start: destino?.start || null,
    end: destino?.end || null,
    activityId: destino?.activityId || null,
    // De onde a pessoa sai — é o que o outro agendador precisa ver pra decidir.
    origemStudyIds: [...new Set((plano?.ocupacoes || []).map((o) => o.booking.studyId).filter(Boolean))],
    status: "pendente",
    motivo: motivo || "",
    requestedBy: actorName || "—",
    requestedAt: new Date().toISOString(),
    decidedBy: null, decidedAt: null, resposta: "",
  };
}

/* Um pedido pendente que perdeu o sentido — a reserva sumiu, a pessoa já
 * entrou, a data passou — não pode ficar esperando resposta pra sempre. */
function staleStaffRequests(requests, bookings, hoje) {
  const ref = hoje || todayStr();
  return (requests || []).filter((r) => r.status === "pendente").map((r) => {
    const b = (bookings || []).find((x) => x.id === r.bookingId);
    if (!b) return { req: r, motivo: "a reserva de destino não existe mais" };
    if ((b.collaboratorIds || []).includes(r.collaboratorId)) return { req: r, motivo: "a pessoa já está escalada" };
    if (b.date < ref) return { req: r, motivo: "a data já passou" };
    return null;
  }).filter(Boolean);
}

/* O que gravar quando um estudo é salvo: as DUAS listas inteiras, já
 * reconciliadas.
 *
 * Estudo e visitas gravam juntos porque mudar o baseline recalcula a janela de
 * todas as visitas — salvar um sem o outro deixaria protocolo novo com visitas
 * do protocolo antigo.
 *
 * Virou função separada depois de a tela nova chamar a gravação passando um
 * estudo só, onde se esperava a lista: o estado do app virou um objeto onde
 * devia haver um array, o React quebrou no render seguinte e o resultado foi
 * tela branca — sem erro visível, porque o estrago acontece um passo depois de
 * onde foi causado. Com uma função só, quem chama não tem como errar a forma.
 */
function studySavePayload({ study, tpRows, studies, timepoints, bookings }) {
  const existe = (studies || []).some((s) => s.id === study.id);
  const nextStudies = existe
    ? studies.map((s) => (s.id === study.id ? { ...s, ...study } : s))
    : [...(studies || []), study];

  /* Visita removida no formulário sai junto — mas só se não tiver reserva
   * presa nela, senão viraria reserva órfã apontando pra visita que não
   * existe mais. */
  const keptIds = new Set((tpRows || []).map((t) => t.id));
  const comReserva = new Set((bookings || []).filter((b) => b.studyId === study.id).map((b) => b.timepointId));
  const outros = (timepoints || []).filter((tp) => tp.studyId !== study.id);
  const meus = (timepoints || []).filter((tp) => tp.studyId === study.id);
  const preservados = meus.filter((tp) => !keptIds.has(tp.id) && comReserva.has(tp.id));
  const novos = (tpRows || []).map((t) => {
    const w = timepointWindow(t, study.baselineDate);
    const antes = meus.find((x) => x.id === t.id);
    return {
      ...(antes || {}), id: t.id, studyId: study.id, label: t.label,
      offsetDays: t.offsetDays, toleranceDays: t.toleranceDays,
      dateMin: w.dateMin, dateMax: w.dateMax,
      createdAt: antes?.createdAt || new Date().toISOString(),
    };
  });
  return { nextStudies, nextTimepoints: [...outros, ...preservados, ...novos] };
}

/* ---------------------------------------------------------------------- */
/* O QUE DÁ PRA ENCAIXAR AGORA — sala, equipe e equipamento de uma vez     */
/* ---------------------------------------------------------------------- */
/* O motor de sugestão (`suggestCombo`) responde "achei" ou "não achei". Quem
 * está montando uma visita precisa da resposta do meio: a lista inteira, com
 * o estado de cada um e o que dá pra fazer a respeito.
 *
 * A diferença não é cosmética. "Nenhuma sala livre" faz a pessoa desistir;
 * "Sala Verde está com o SOLAR-88 das 9h às 10h" faz ela ir negociar. É o
 * mesmo dado — o que muda é o sistema devolver o motivo em vez de engolir.
 *
 * Devolve, para CADA recurso cadastrado, uma situação e uma frase pronta.
 * As situações são as mesmas em toda a tela, de propósito:
 *   livre      dá pra escolher agora
 *   cedivel    ocupado, mas a regra permite puxar sem pedir
 *   pedir      ocupado; sai com pedido ao outro agendador
 *   travado    não sai de jeito nenhum (mestre, já começou, ausência)
 *   fora       não serve pra essa atividade (sala não permitida, sem nível)
 *   horario    serviria, mas está fora do horário — cabe hora extra
 */
const ENCAIXE_META = {
  livre: { rotulo: "livre", cor: "var(--accent)", fundo: "transparent", ordem: 0 },
  cedivel: { rotulo: "cedível", cor: "var(--gold)", fundo: "var(--gold-soft)", ordem: 1 },
  pedir: { rotulo: "precisa pedir", cor: "var(--warn)", fundo: "var(--warn-soft)", ordem: 2 },
  horario: { rotulo: "fora do horário", cor: "var(--warn)", fundo: "transparent", ordem: 3 },
  travado: { rotulo: "não sai", cor: "var(--danger)", fundo: "transparent", ordem: 4 },
  fora: { rotulo: "não serve", cor: "var(--ink-muted)", fundo: "transparent", ordem: 5 },
};

function encaixeOpcoes({ activity, date, start, data, bookings, studies, participants, excludeId }) {
  const vazio = { salas: [], pessoas: [], equipamentos: [], medicos: [], janela: null };
  if (!activity || !date || !start) return vazio;

  const times = activityTimes(activity);
  const end = addMinutes(start, activity.durationMin ?? 60);
  const blk = blockedWindow(start, end, activity);
  const bs = blk.start, be = blk.end;

  const nomeEstudo = (b) => b.studyName || (studies || []).find((s) => s.id === b.studyId)?.name || "sem estudo";
  const nomeAtiv = (b) => (data.activities || []).find((a) => a.id === b.activityId)?.name || "atividade";
  /* Quem ocupa o recurso na janela BLOQUEADA — preparo e desmontagem contam:
   * é durante ela que a sala está de fato indisponível. */
  const quemOcupa = (id, field) => (bookings || []).filter((b) => b.date === date && b.id !== excludeId
    && bookingOccupies(b) && bookingMatchesResource(b, field, id)
    && overlaps(toMin(bs), toMin(be), bookingBlock(b).s, bookingBlock(b).e));
  const porOrdem = (a, b) => (ENCAIXE_META[a.situacao].ordem - ENCAIXE_META[b.situacao].ordem)
    || (a.item.name || "").localeCompare(b.item.name || "");

  /* ---- salas ---- */
  const permitidas = activity.locationIds?.length ? new Set(activity.locationIds) : null;
  const salas = (data.locations || []).filter((l) => l.active !== false).map((l) => {
    const ocupacoes = quemOcupa(l.id, "location");
    const au = absenceOn(data.calendar, l.id, date, bs, be);
    const lim = participantLimit(l, activity);
    if (permitidas && !permitidas.has(l.id)) return { item: l, situacao: "fora", detalhe: "não atende esse método", ocupacoes };
    if (au) return { item: l, situacao: "travado", detalhe: absenceLabel(au), ocupacoes };
    if (participants > 0 && lim != null && participants > lim) {
      return { item: l, situacao: "fora", detalhe: `comporta ${lim}, o grupo tem ${participants}`, ocupacoes };
    }
    if (ocupacoes.length) {
      return { item: l, situacao: "pedir", detalhe: `${nomeAtiv(ocupacoes[0])} · ${nomeEstudo(ocupacoes[0])}`, ocupacoes };
    }
    if (!withinAvailability(l, date, bs, be)) {
      return { item: l, situacao: "horario", detalhe: times.setup || times.teardown ? "fora do horário contando preparo e desmontagem" : "fora do horário de funcionamento", ocupacoes };
    }
    return { item: l, situacao: "livre", detalhe: lim != null ? `livre · comporta ${lim}` : "livre", ocupacoes };
  }).sort(porOrdem);

  /* ---- equipe ----
   *
   * Nível insuficiente vira "fora" e NÃO some da lista: é justamente daí que
   * sai o pedido de treinamento, e uma lista que esconde quem quase pode
   * esconde também a solução. */
  const pessoas = (data.collaborators || []).filter((c) => c.active !== false).map((c) => {
    const nivel = c.levels?.[activity.id] || 0;
    const falta = (activity.minLevel || 0) - nivel;
    const ocupacoes = quemOcupa(c.id, "collaborator");
    const au = absenceOn(data.calendar, c.id, date, bs, be);
    const base = { item: c, nivel, faltaNivel: falta > 0 ? falta : 0, ocupacoes };
    if (au) return { ...base, situacao: "travado", detalhe: absenceLabel(au) };
    if (falta > 0) return { ...base, situacao: "fora", detalhe: `nível ${nivel} de ${activity.minLevel} exigido` };
    if (ocupacoes.length) {
      const detalhes = ocupacoes.map((b) => {
        const act = (data.activities || []).find((a) => a.id === b.activityId);
        const est = (studies || []).find((x) => x.id === b.studyId) || null;
        return { booking: b, act, trava: collaboratorLockReason(c.id, b, est, act), cedivel: isYieldableActivity(act) };
      });
      const preso = detalhes.find((d) => d.trava);
      if (preso) return { ...base, situacao: "travado", detalhe: `${preso.act?.name || "atividade"}: ${preso.trava}` };
      const ref = detalhes[0];
      const resumo = `${ref.act?.name || "atividade"} · ${nomeEstudo(ref.booking)}${detalhes.length > 1 ? ` (+${detalhes.length - 1})` : ""}`;
      return { ...base, situacao: detalhes.every((d) => d.cedivel) ? "cedivel" : "pedir", detalhe: resumo };
    }
    if (!withinAvailability(c, date, bs, be)) {
      return { ...base, situacao: "horario", detalhe: "fora do horário dela — cabe hora extra" };
    }
    return { ...base, situacao: "livre", detalhe: `livre · nível ${nivel}` };
  }).sort(porOrdem);

  /* ---- equipamentos ---- */
  const equipamentos = (data.equipment || []).filter((e) => e.active !== false && !e.isAccessory).map((e) => {
    const ocupacoes = quemOcupa(e.id, "equipment");
    const cal = calibrationStatus(e, date);
    const au = absenceOn(data.calendar, e.id, date, bs, be);
    if (cal?.status === "vencido") return { item: e, situacao: "fora", detalhe: `calibração vencida desde ${weekdayLabel(cal.due)}`, ocupacoes };
    if (au) return { item: e, situacao: "travado", detalhe: absenceLabel(au), ocupacoes };
    if (ocupacoes.length) return { item: e, situacao: "pedir", detalhe: `${nomeAtiv(ocupacoes[0])} · ${nomeEstudo(ocupacoes[0])}`, ocupacoes };
    if (e.availability && !withinAvailability(e, date, bs, be)) return { item: e, situacao: "horario", detalhe: "fora do horário de uso", ocupacoes };
    return { item: e, situacao: "livre", detalhe: cal?.status === "vencendo" ? `livre · calibração vence em ${cal.daysLeft} dia(s)` : "livre", ocupacoes };
  }).sort(porOrdem);

  /* ---- médicos ---- */
  const medicos = (data.doctors || []).filter((d) => d.active !== false).map((d) => {
    const ocupacoes = quemOcupa(d.id, "doctor");
    const au = absenceOn(data.calendar, d.id, date, bs, be);
    if (au) return { item: d, situacao: "travado", detalhe: absenceLabel(au), ocupacoes };
    if (ocupacoes.length) return { item: d, situacao: "pedir", detalhe: `${nomeAtiv(ocupacoes[0])} · ${nomeEstudo(ocupacoes[0])}`, ocupacoes };
    if (!withinAvailability(d, date, bs, be)) return { item: d, situacao: "horario", detalhe: "fora do horário dele — cabe hora extra", ocupacoes };
    return { item: d, situacao: "livre", detalhe: "livre", ocupacoes };
  }).sort(porOrdem);

  return { salas, pessoas, equipamentos, medicos, janela: { start, end, blockStart: bs, blockEnd: be, staff: times.staff } };
}

/* Em que pé está uma reserva. É diferente de `status` (que só sabe se a equipe
 * está completa) porque inclui o que já aconteceu no dia — e é isso que a
 * pessoa quer filtrar quando abre o Cronograma às onze da manhã. */
const SITUACAO_META = {
  concluida: { rotulo: "concluída", tone: "neutral", cor: "var(--ink-muted)" },
  andamento: { rotulo: "em andamento", tone: "accent", cor: "var(--accent)" },
  falta_equipe: { rotulo: "falta equipe", tone: "gold", cor: "var(--warn)" },
  falta_medico: { rotulo: "falta médico", tone: "gold", cor: "var(--warn)" },
  pronta: { rotulo: "pronta", tone: "accent", cor: "var(--accent-dark)" },
};
function situacaoDaReserva(b, activity) {
  if (b?.completedAt) return "concluida";
  if (b?.startedAt) return "andamento";
  const precisa = Math.max(1, activity?.staffCount ?? 1);
  if ((b?.collaboratorIds || []).length < precisa) return "falta_equipe";
  if (b?.needDoctor && !b?.doctorId) return "falta_medico";
  return "pronta";
}

/* O dia em números, pra caber numa faixa no alto da tela.
 *
 * Existe porque a agenda mostra tudo e não resume nada: pra saber se o dia
 * está pesado era preciso contar barras na tela. Cada número aqui responde uma
 * pergunta que alguém realmente faz de manhã — quantas salas vão rodar, quanta
 * gente está escalada, o que ainda está faltando. */
function resumoDoDia(bookings, data) {
  const ocupam = (bookings || []).filter((b) => bookingOccupies(b));
  const act = (b) => (data?.activities || []).find((a) => a.id === b.activityId);
  const situacoes = ocupam.map((b) => situacaoDaReserva(b, act(b)));
  const conta = (t) => situacoes.filter((x) => x === t).length;
  const pessoas = new Set();
  ocupam.forEach((b) => (b.collaboratorIds || []).forEach((id) => pessoas.add(id)));
  const minutos = ocupam.reduce((t, b) => {
    const blk = bookingBlock(b);
    return t + Math.max(0, blk.e - blk.s);
  }, 0);
  return {
    atividades: ocupam.length,
    salas: new Set(ocupam.map((b) => b.locationId).filter(Boolean)).size,
    pessoas: pessoas.size,
    estudos: new Set(ocupam.map((b) => b.studyId).filter(Boolean)).size,
    participantes: ocupam.reduce((t, b) => t + (b.participantCount || 0), 0),
    horas: Math.round((minutos / 60) * 10) / 10,
    faltando: conta("falta_equipe") + conta("falta_medico"),
    andamento: conta("andamento"),
    concluidas: conta("concluida"),
    // Previsão que não segura recurso não entra nas contas acima, mas precisa
    // aparecer: o dia "vazio" pode estar cheio de orçamento em negociação.
    previsoes: (bookings || []).length - ocupam.length,
  };
}

/* Atividades que dividem a MESMA SALA no MESMO horário. É o que o usuário
 * enxerga como "a visita acontecendo": três medições rodando juntas numa sala
 * são uma coisa só pra quem olha a agenda, e mostrá-las como três linhas
 * soltas obriga a pessoa a remontar na cabeça o que o sistema já sabe. */
function blocosDeSala(bookings, activities) {
  const porSala = new Map();
  (bookings || []).filter((b) => bookingOccupies(b)).forEach((b) => {
    const chave = `${b.date}|${b.locationId || "sem-sala"}`;
    if (!porSala.has(chave)) porSala.set(chave, []);
    porSala.get(chave).push(b);
  });
  const blocos = [];
  porSala.forEach((lista, chave) => {
    const [date, locationId] = chave.split("|");
    // Encosta uma na outra = mesmo bloco. Não exige horário idêntico: 9h–10h e
    // 9h30–10h30 na mesma sala é uma cena só.
    const ordenadas = [...lista].sort((a, b) => bookingBlock(a).s - bookingBlock(b).s);
    let atual = null;
    ordenadas.forEach((b) => {
      const blk = bookingBlock(b);
      if (atual && blk.s < atual.fimMin) {
        atual.bookings.push(b);
        atual.fimMin = Math.max(atual.fimMin, blk.e);
      } else {
        atual = { date, locationId: locationId === "sem-sala" ? null : locationId, bookings: [b], inicioMin: blk.s, fimMin: blk.e };
        blocos.push(atual);
      }
    });
  });
  return blocos.map((bl) => ({
    ...bl,
    start: minToHHMM(bl.inicioMin), end: minToHHMM(bl.fimMin),
    participantes: bl.bookings.reduce((t, b) => Math.max(t, b.participantCount || 0), 0),
    estudos: [...new Set(bl.bookings.map((b) => b.studyId).filter(Boolean))],
    atividades: bl.bookings.map((b) => (activities || []).find((a) => a.id === b.activityId)?.name || "atividade"),
  })).sort((a, b) => a.inicioMin - b.inicioMin);
}

/* ---------------------------------------------------------------------- */
/* CONTINUIDADE DO OPERADOR DO EQUIPAMENTO                                  */
/*                                                                          */
/* Regra: quem COMEÇOU a operar um equipamento num estudo termina o estudo   */
/* com ele. Trocar o operador no meio muda a leitura — dois técnicos medem   */
/* a mesma pele com a mesma sonda e não dão o mesmo número —, e a variação   */
/* entra no resultado sem aparecer em lugar nenhum. Não dá pra corrigir      */
/* depois: o dado já foi coletado.                                          */
/*                                                                          */
/* Isto é DIFERENTE da atividade mestre, e as duas coisas convivem:          */
/*                                                                          */
/*   mestre     é configuração — alguém marcou "aqui ninguém troca".         */
/*   operador   é histórico — ninguém marcou nada, mas a pessoa já operou    */
/*              aquele aparelho neste estudo, e isso por si só amarra.       */
/*                                                                          */
/* A segunda existe porque a primeira depende de alguém lembrar de           */
/* configurar. Um método novo entra no cadastro sem a marca, é usado com um  */
/* Corneometer, e a continuidade se perde sem ninguém perceber. Deduzir do   */
/* que já aconteceu não depende de memória de ninguém.                       */
/* ---------------------------------------------------------------------- */

/* Quem já operou este equipamento neste estudo, ou null.
 *
 * Só conta reserva que REALMENTE aconteceu (começou ou terminou). Reserva
 * futura é plano, e plano ainda pode mudar de pessoa livremente — a amarra
 * nasce no momento em que o aparelho é ligado pela primeira vez.
 *
 * Quando a primeira execução teve várias pessoas e o estudo não tem técnico
 * definido, não há como saber qual delas operou o aparelho, e a função
 * devolve null em vez de chutar. Amarrar a pessoa errada seria pior que não
 * amarrar: bloquearia a agenda de quem nunca encostou no equipamento. */
function equipmentOperatorFor(studyId, equipmentId, bookings, study, excludeId) {
  if (!studyId || !equipmentId) return null;
  const executadas = (bookings || [])
    .filter((b) => b.studyId === studyId && b.equipmentId === equipmentId
      && b.id !== excludeId && (b.startedAt || b.completedAt || b.actualStart))
    .sort((a, b) => `${a.date}${a.start || ""}`.localeCompare(`${b.date}${b.start || ""}`));
  if (!executadas.length) return null;
  const equipe = executadas[0].collaboratorIds || [];
  const tecnico = study?.technicianId || null;
  if (tecnico && equipe.includes(tecnico)) return tecnico;
  return equipe.length === 1 ? equipe[0] : null;
}

/* O problema, pronto pra mostrar. Vazio quando está tudo certo.
 *
 * Só cobra o que ainda dá pra mudar: reserva concluída ou de data passada
 * registra o que aconteceu, e apontar erro lá só gera alerta que ninguém
 * consegue resolver. */
function equipmentOperatorProblems(booking, study, bookings, data, hoje) {
  const out = [];
  if (!booking?.equipmentId || !booking?.studyId) return out;
  if (booking.completedAt) return out;
  if (booking.date && booking.date < (hoje || todayStr())) return out;

  const operador = equipmentOperatorFor(booking.studyId, booking.equipmentId, bookings, study, booking.id);
  if (!operador) return out;
  if ((booking.collaboratorIds || []).includes(operador)) return out;

  const nome = (data?.collaborators || []).find((c) => c.id === operador)?.name || "quem começou";
  const eq = (data?.equipment || []).find((e) => e.id === booking.equipmentId)?.name || "esse equipamento";
  out.push(`${nome} já operou ${eq} neste estudo — trocar de operador no meio altera a leitura. Mantenha a mesma pessoa até o fim do protocolo.`);
  return out;
}

/* Trocar o operador do equipamento — só ANTES de ele começar, e sempre no
 * estudo inteiro.
 *
 * As duas metades da regra, que são opostas de propósito:
 *
 *   depois de começar   não troca. O aparelho já rodou na mão daquela pessoa
 *                       e a série de medidas já carrega o jeito dela. Trocar
 *                       aqui contamina o dado, e o dado não volta.
 *   antes de começar    troca livre, MAS em cascata: quem entra assume TODAS
 *                       as visitas do estudo com aquele equipamento. Trocar só
 *                       na visita disputada produziria exatamente o que a
 *                       regra existe pra impedir — duas pessoas medindo a
 *                       mesma coisa ao longo do protocolo.
 *
 * É por isso que "roubar" alguém de um estudo não é uma decisão sobre UMA
 * reserva. Ou o substituto vale para o protocolo todo, ou a troca não pode
 * acontecer. A tela mostra esse plano antes de aplicar.
 */
function operatorSwapPlan({ study, bookings, activities, equipmentId, saiId, novoOperadorId, hoje }) {
  const ref = hoje || todayStr();
  const doEstudo = (bookings || []).filter((b) => b.studyId === study?.id && b.equipmentId === equipmentId);
  const executadas = doEstudo.filter((b) => b.startedAt || b.completedAt || b.actualStart);
  const operadorAtual = equipmentOperatorFor(study?.id, equipmentId, bookings, study);

  if (executadas.length) {
    return {
      alteradas: [], intocadas: doEstudo, conflitos: [],
      podeAplicar: false, jaComecou: true, operadorAtual,
      resumo: "o equipamento já foi operado neste estudo — o operador não muda mais até o fim do protocolo",
    };
  }

  /* Quem SAI. Antes de o aparelho rodar ainda não existe operador amarrado —
   * `equipmentOperatorFor` devolve null, e é justamente por isso que a troca é
   * permitida. Então quem sai vem de fora: é a pessoa que o outro agendador
   * está tentando levar, e só quem pediu sabe quem é. Sem `saiId`, cai no
   * operador amarrado (o caso de já ter começado, que é recusado adiante). */
  const substituido = saiId || operadorAtual;

  const daAtividade = (b) => (activities || []).find((a) => a.id === b.activityId);
  // Só as visitas em que essa pessoa está: a cascata substitui quem sai, não
  // reescreve a equipe de reservas que nada têm a ver com ela.
  const comEla = doEstudo.filter((b) => !substituido || (b.collaboratorIds || []).includes(substituido));
  const futuras = comEla.filter((b) => b.date >= ref);
  const intocadas = comEla.filter((b) => b.date < ref);

  const conflitos = [];
  const alteradas = [];
  futuras.forEach((b) => {
    const blk = blockedWindow(b.start, b.end, daAtividade(b));
    // O novo operador está livre nesse horário? Ignora as próprias reservas
    // que a cascata vai reescrever.
    const outras = (bookings || []).filter((x) => !futuras.some((f) => f.id === x.id));
    if (!fieldFree(novoOperadorId, "collaborator", b.date, blk.start, blk.end, outras)) {
      conflitos.push({ booking: b, motivo: `já tem reserva em ${b.date} ${b.start}` });
      return;
    }
    const equipe = (b.collaboratorIds || []).filter((id) => id !== substituido);
    alteradas.push({ ...b, collaboratorIds: [...new Set([novoOperadorId, ...equipe])] });
  });

  return {
    alteradas, intocadas, conflitos, operadorAtual, jaComecou: false,
    // Cascata é tudo ou nada: aplicar só parte deixaria duas pessoas operando
    // o mesmo aparelho no mesmo estudo, que é o defeito que se quer evitar.
    podeAplicar: conflitos.length === 0 && alteradas.length > 0,
    resumo: conflitos.length
      ? `${conflitos.length} visita(s) com conflito de agenda — a troca não pode ser parcial`
      : `${alteradas.length} visita(s) do estudo passam ao novo operador`,
  };
}

/* Todas as amarras de operador que um estudo já criou: equipamento → pessoa.
 * É o que a tela de planejamento usa pra decidir, ANTES de sugerir, que
 * aquele aparelho já tem dono neste estudo. */
function studyEquipmentOperators(study, bookings) {
  const mapa = new Map();
  (bookings || [])
    .filter((b) => b.studyId === study?.id && b.equipmentId && (b.startedAt || b.completedAt || b.actualStart))
    .forEach((b) => {
      if (mapa.has(b.equipmentId)) return;
      const quem = equipmentOperatorFor(study.id, b.equipmentId, bookings, study);
      if (quem) mapa.set(b.equipmentId, quem);
    });
  return mapa;
}

/* ---------------------------------------------------------------------- */
/* TIPOS DE TREINAMENTO                                                     */
/*                                                                          */
/* Uma aula de Corneometria sempre precisa do mesmo aparelho, da mesma sala  */
/* e dura o mesmo tanto. Antes isso era redigitado a cada solicitação, e     */
/* redigitar é onde nasce o erro: a aula marcada sem o equipamento, ou numa  */
/* sala que não tem o que treinar.                                           */
/*                                                                          */
/* O tipo guarda esse combinado uma vez. Ao solicitar, os campos já vêm      */
/* preenchidos — e continuam EDITÁVEIS, porque a exceção existe: a sala está */
/* em manutenção, o aparelho foi pra calibração, a turma é maior. O tipo é   */
/* um ponto de partida, não uma amarra.                                      */
/*                                                                          */
/* Nada aqui muda `trainingBookingFrom`: ele já lê `locationId`,             */
/* `equipmentId`, `accessoryIds`, `durationMin` e `trainerId` da própria     */
/* solicitação. O tipo só preenche esses campos antes.                       */
/* ---------------------------------------------------------------------- */
function trainingTypeBlank() {
  return {
    id: genId("ttype"), name: "", activityId: null, durationMin: TRAINING_DEFAULT_MIN,
    locationId: null, equipmentId: null, accessoryIds: [], trainerId: null,
    requiredLevel: 3, notes: "", active: true,
  };
}

/* Aplica o tipo sobre uma solicitação. `over` é o que a pessoa já preencheu e
 * NÃO pode ser sobrescrito — escolher o tipo depois de ajustar a data não
 * pode apagar a data. */
function trainingRequestFromType(type, over = {}) {
  const base = {
    trainingTypeId: type?.id || null,
    activityId: type?.activityId ?? null,
    durationMin: type?.durationMin ?? TRAINING_DEFAULT_MIN,
    locationId: type?.locationId ?? null,
    equipmentId: type?.equipmentId ?? null,
    accessoryIds: [...(type?.accessoryIds || [])],
    trainerId: type?.trainerId ?? null,
    requiredLevel: type?.requiredLevel ?? 3,
  };
  const limpo = {};
  Object.entries(over).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== "") limpo[k] = v; });
  return { ...base, ...limpo };
}

/* Referência morta é o defeito que já derrubou este sistema antes: o tipo
 * aponta pra uma sala excluída, a aula nasce sem sala e ninguém entende por
 * quê. Conferido no cadastro, onde dá pra consertar. */
function trainingTypeProblems(type, data) {
  const out = [];
  if (!String(type?.name || "").trim()) out.push("o tipo precisa de um nome");
  const n = Number(type?.durationMin);
  if (!Number.isFinite(n) || n <= 0) out.push("a duração precisa ser maior que zero");
  const existe = (lista, id) => !id || (lista || []).some((x) => x.id === id);
  if (!existe(data?.activities, type?.activityId)) out.push("a atividade desse tipo não existe mais");
  if (!existe(data?.locations, type?.locationId)) out.push("a sala desse tipo não existe mais");
  if (!existe(data?.equipment, type?.equipmentId)) out.push("o equipamento desse tipo não existe mais");
  (type?.accessoryIds || []).forEach((id) => {
    if (!existe(data?.equipment, id)) out.push("um acessório desse tipo não existe mais");
  });
  if (!existe(data?.collaborators, type?.trainerId)) out.push("o instrutor desse tipo não existe mais");
  // Acessório precisa pertencer ao aparelho escolhido — mesma regra da reserva.
  if (type?.equipmentId) {
    const principal = (data?.equipment || []).find((e) => e.id === type.equipmentId);
    (type?.accessoryIds || []).forEach((accId) => {
      if (principal && !(principal.accessoryIds || []).includes(accId)) {
        const acc = (data?.equipment || []).find((e) => e.id === accId);
        out.push(`${acc?.name || "o acessório"} não pertence a ${principal.name}`);
      }
    });
  }
  return out;
}

/* ---------------------------------------------------------------------- */
/* AVISOS — o que está esperando ESTA pessoa                                */
/*                                                                          */
/* Função PURA de propósito: recebe os dados e quem está logado, devolve a   */
/* lista do que diz respeito a essa pessoa. Fica fora do React porque é a    */
/* única parte disso que tem regra de verdade — QUEM recebe O QUÊ —, e       */
/* regra sem teste é regra que ninguém confere. A parte de React em cima     */
/* disso só conta e mostra.                                                  */
/*                                                                          */
/* O destinatário NÃO é configurado aqui: sai da mesma capacidade que já     */
/* governa quem enxerga o botão. Quem pode aprovar prazo é quem é avisado    */
/* do prazo. Assim a matriz de permissões que o Admin já edita passa a       */
/* controlar as notificações também, sem uma segunda tela pra manter — e     */
/* tirar a capacidade de alguém tira o aviso junto, sem ninguém lembrar.     */
/*                                                                          */
/* O `id` carrega o ESTADO, não só o registro. Uma hora extra que vai de     */
/* "pendente" para "aprovada" gera um id novo, então o aviso do resultado    */
/* chega mesmo que o pedido já tenha sido avisado antes. É por isso que      */
/* dá pra guardar só uma lista de ids já notificados, sem histórico.         */
/*                                                                          */
/* `acao` separa duas coisas que parecem a mesma e não são:                 */
/*                                                                          */
/*   acao: true   alguém está TRAVADO esperando você. Sai da lista sozinho  */
/*                quando você resolve. É isto que vira número no menu.      */
/*   acao: false  recado: "sua hora extra foi aprovada", "marcaram uma      */
/*                reserva pra você". Merece o balão na hora, mas NUNCA o    */
/*                número — porque não some quando você lê. Contar isso      */
/*                deixaria um "28" permanente no menu, e um contador que    */
/*                nunca zera é um contador que ninguém mais olha.           */
/* ---------------------------------------------------------------------- */
const AVISO_JANELA_VISITA_DIAS = 10; // visita vencendo sem ninguém ter marcado
const AVISO_JANELA_HOLD_DIAS = 3;    // pré-reserva prestes a expirar
// Avisos do mesmo grupo viram UM balão só ("3 novas reservas na sua agenda").
// Reserva nova é o evento mais frequente do sistema: sem agrupar, um dia de
// planejamento vira vinte notificações e a pessoa desliga tudo pra sempre.
const AVISO_GRUPO_AGENDA = "agenda";

function pendingActionsFor(ctx = {}) {
  const {
    hoje = todayStr(), actorName = "", myPersonId = null, myPersonRole = null,
    isAdmin = false, isGestor = false, can = () => false,
    overtimeRequests = [], trainingRequests = [], deadlineRequests = [],
    bookings = [], studies = [], timepoints = [], estimates = [],
    staffRequests = [], collaborators = [],
  } = ctx;

  const out = [];
  const add = (id, kind, tab, title, body, opts = {}) => out.push({
    id, kind, tab, title, body,
    acao: opts.acao !== false, group: opts.group || null,
  });
  const gestao = isAdmin || isGestor;
  // `requestedBy` guarda o NOME de quem pediu, não o id — é assim que o
  // registro já nasce hoje. Comparar por nome basta para avisar a pessoa do
  // resultado; o pior caso é dois homônimos receberem o aviso um do outro,
  // que é bem menos grave do que ninguém receber.
  const euPedi = (nome) => !!actorName && nome === actorName;

  /* --- 1. Hora extra pedida PRA MIM: preciso dizer se topo ------------- */
  if (myPersonId && can("hora_extra_responder")) {
    overtimeRequests.filter((r) => r.status === "pendente" && r.personId === myPersonId).forEach((r) => {
      add(`ovt-responder:${r.id}`, "hora_extra", "overtime",
        "Hora extra esperando sua resposta",
        `${r.activityName || "Atividade"} · ${r.date} ${r.start}–${r.end}${r.reason ? ` — ${r.reason}` : ""}`);
    });
  }

  /* --- 2. A pessoa topou; falta a gestão aprovar ----------------------- */
  if (gestao) {
    overtimeRequests.filter((r) => r.status === "disponivel").forEach((r) => {
      add(`ovt-aprovar:${r.id}`, "hora_extra", "overtime",
        "Hora extra aguardando sua aprovação",
        `${r.personName || "Colaborador"} aceitou — ${r.date} ${r.start}–${r.end}`);
    });
  }

  /* --- 3. Resultado da hora extra volta para quem pediu ---------------- */
  overtimeRequests.filter((r) => euPedi(r.requestedBy)
    && ["confirmado", "recusado", "dispensado"].includes(r.status)).forEach((r) => {
    const veredito = r.status === "confirmado" ? "aprovada" : r.status === "recusado" ? "recusada" : "dispensada";
    add(`ovt-resultado:${r.id}:${r.status}`, "hora_extra", "overtime",
      `Hora extra ${veredito}`,
      `${r.personName || "Colaborador"} · ${r.date} ${r.start}–${r.end}`, { acao: false });
  });

  /* --- 4. Treinamento pedido, esperando a equipe marcar ---------------- */
  if (can("treinamento_confirmar")) {
    trainingRequests.filter((r) => r.status === "pendente").forEach((r) => {
      const atrasado = r.deadlineDate && r.deadlineDate < hoje;
      add(`trn-agendar:${r.id}${atrasado ? ":atrasado" : ""}`, "treinamento", "training",
        atrasado ? "Treinamento com prazo VENCIDO" : "Treinamento esperando agendamento",
        `${r.collaboratorName || "Colaborador"} · ${r.activityName || "atividade"}${r.deadlineDate ? ` · prazo ${r.deadlineDate}` : ""}`);
    });
  }

  /* --- 5. Meu treinamento foi marcado ---------------------------------- */
  if (myPersonId) {
    trainingRequests.filter((r) => r.status === "agendado" && r.collaboratorId === myPersonId && r.scheduledDate)
      .forEach((r) => {
        // A data entra no id: remarcar a aula avisa de novo, que é o certo.
        add(`trn-marcado:${r.id}:${r.scheduledDate}:${r.scheduledStart || ""}`, "treinamento", "training",
          "Seu treinamento foi agendado",
          `${r.activityName || "Atividade"} · ${r.scheduledDate}${r.scheduledStart ? ` às ${r.scheduledStart}` : ""}`, { acao: false });
      });
  }

  /* --- 5b. Pedido de equipe entre agendadores -------------------------- */
  {
    const quemE = (id) => collaborators.find((c) => c.id === id)?.name || "Colaborador";
    const doEstudo = (id) => studies.find((s) => s.id === id)?.name || "outro estudo";
    if (can("planejar_estudo")) {
      staffRequests.filter((r) => r.status === "pendente" && !euPedi(r.requestedBy)).forEach((r) => {
        add(`equipe-responder:${r.id}`, "equipe", "studies",
          "Pedido de equipe esperando sua resposta",
          `${r.requestedBy} quer ${quemE(r.collaboratorId)} em ${doEstudo(r.studyId)}${r.date ? ` · ${r.date} ${r.start}–${r.end}` : ""}`);
      });
    }
    // Quem pediu recebe o resultado — sem isto o pedido some e ninguém sabe.
    staffRequests.filter((r) => euPedi(r.requestedBy) && ["aceito", "recusado"].includes(r.status)).forEach((r) => {
      add(`equipe-resultado:${r.id}:${r.status}`, "equipe", "studies",
        `Pedido de equipe ${r.status === "aceito" ? "aceito" : "recusado"}`,
        `${quemE(r.collaboratorId)} · ${doEstudo(r.studyId)}${r.resposta ? ` — "${r.resposta}"` : ""}`, { acao: false });
    });
  }

  /* --- 6. Pedido de novo prazo esperando o gestor ---------------------- */
  if (can("aprovar_prazo")) {
    deadlineRequests.filter((r) => r.status === "pendente").forEach((r) => {
      add(`prz-aprovar:${r.id}`, "prazo", "studies",
        "Pedido de novo prazo aguardando aprovação",
        `${r.studyName || "Estudo"} · ${r.timepointLabel || "visita"} — até ${r.requestedDateMax}${r.reason ? ` (${r.reason})` : ""}`);
    });
  }

  /* --- 7. Resultado do prazo volta para quem pediu --------------------- */
  deadlineRequests.filter((r) => euPedi(r.requestedBy) && ["aprovado", "recusado"].includes(r.status))
    .forEach((r) => {
      add(`prz-resultado:${r.id}:${r.status}`, "prazo", "studies",
        `Pedido de prazo ${r.status === "aprovado" ? "aprovado" : "recusado"}`,
        `${r.studyName || "Estudo"} · ${r.timepointLabel || "visita"}`, { acao: false });
    });

  /* --- 8. Visita do protocolo vencendo e ninguém marcou ---------------- */
  /* Este é o único que fala de algo que NÃO aconteceu — e é justamente o
   * mais caro: visita fora da janela do protocolo é desvio, e desvio em
   * estudo clínico custa mais que qualquer hora extra. Hoje só aparece para
   * quem abre o Painel. */
  if (gestao || can("planejar_estudo")) {
    const limite = addDays(hoje, AVISO_JANELA_VISITA_DIAS);
    const abertos = new Set(studies.filter((s) => s.status === "ativo").map((s) => s.id));
    timepoints.filter((tp) => abertos.has(tp.studyId) && tp.dateMax >= hoje && tp.dateMax <= limite
      && !bookings.some((b) => b.timepointId === tp.id)).forEach((tp) => {
      const study = studies.find((s) => s.id === tp.studyId);
      add(`tp-sem-agenda:${tp.id}`, "visita", "studies",
        "Visita do protocolo sem agendamento",
        `${study?.name || "Estudo"} · ${tp.label} — prazo ${tp.dateMax}`);
    });
  }

  /* --- 9. Pré-reserva prestes a expirar -------------------------------- */
  /* Quando o prazo vence, o horário volta a ficar livre sozinho e ninguém
   * fica sabendo — o recurso deixa de estar segurado sem nenhuma decisão. */
  if (can("estimativa_segurar")) {
    const limite = addDays(hoje, AVISO_JANELA_HOLD_DIAS);
    estimates.filter((e) => estimateEffectiveStatus(e) === "pre_reserva"
      && e.holdUntil && e.holdUntil <= limite).forEach((e) => {
      add(`est-expira:${e.id}:${e.holdUntil}`, "estimativa", "estimates",
        "Pré-reserva prestes a expirar",
        `${e.name} — recursos segurados até ${e.holdUntil}`);
    });
  }

  /* --- 10. Reserva nova na minha agenda -------------------------------- */
  /* Agrupado: o balão vira "3 novas reservas na sua agenda". Ver
   * AVISO_GRUPO_AGENDA. Só o que ainda vai acontecer — avisar de reserva de
   * ontem não serve pra nada. */
  if (myPersonId) {
    bookings.filter((b) => b.date >= hoje && b.bookingType !== "estimate"
      && (myPersonRole === "doctor" ? b.doctorId === myPersonId : (b.collaboratorIds || []).includes(myPersonId)))
      .forEach((b) => {
        add(`agenda:${b.id}:${b.date}:${b.start}`, "agenda", "myday",
          "Nova reserva na sua agenda",
          `${b.studyName || "Reserva"} · ${b.date} ${b.start}–${b.end}`,
          { acao: false, group: AVISO_GRUPO_AGENDA });
      });
  }

  return out;
}

/* ---------------------------------------------------------------------- */
/* Avisos — a parte que fala com o navegador                                */
/*                                                                          */
/* A REGRA de quem recebe o quê está em `pendingActionsFor`, acima, e é      */
/* testada. Aqui em baixo só tem encanamento: guardar o que já foi avisado,  */
/* agrupar e pedir o balão pro sistema operacional.                          */
/*                                                                          */
/* HTTPS: a notificação do navegador só existe em CONTEXTO SEGURO — `https`  */
/* ou `http://localhost`. Servindo em `http://192.168.x.x`, que é como a     */
/* equipe acessa, o navegador nem oferece a permissão. Por isso a contagem   */
/* no menu e o título da aba funcionam SEMPRE, e o balão é um extra que se   */
/* liga sozinho no dia em que houver certificado. Nada aqui quebra sem ele;  */
/* o botão do sino simplesmente explica por que não dá.                      */
/* ---------------------------------------------------------------------- */
const AVISO_NOTIFICADOS_KEY = "crb2-avisos-notificados";
// Acima disso vira um balão só. Ninguém lê seis balões empilhados, e o
// Windows os empilha de qualquer forma.
const AVISO_MAX_BALOES = 3;

const notificacaoDisponivel = () => typeof window !== "undefined"
  && "Notification" in window && window.isSecureContext;

function dispararBaloes(novos, aoClicar) {
  // Agrupa o que tem grupo (reserva nova é o caso): um dia de planejamento
  // gera vinte reservas pra mesma pessoa, e vinte balões seguidos fazem
  // qualquer um desligar a notificação e nunca mais ligar.
  const grupos = new Map();
  const soltos = [];
  novos.forEach((a) => {
    if (!a.group) { soltos.push(a); return; }
    grupos.set(a.group, [...(grupos.get(a.group) || []), a]);
  });
  const baloes = [
    ...soltos.map((a) => ({ title: a.title, body: a.body, tab: a.tab })),
    ...[...grupos.values()].map((g) => (g.length === 1
      ? { title: g[0].title, body: g[0].body, tab: g[0].tab }
      : { title: `${g.length} novas reservas na sua agenda`, body: g.slice(0, 3).map((x) => x.body).join("\n"), tab: g[0].tab })),
  ];
  const mostrar = baloes.length > AVISO_MAX_BALOES
    ? [{ title: `${baloes.length} avisos novos`, body: "Abra a Central de Recursos para ver.", tab: "dashboard" }]
    : baloes;

  mostrar.forEach((b) => {
    try {
      // `tag` faz o sistema SUBSTITUIR um balão de mesmo título em vez de
      // empilhar — importante com o poll de 5s, que pode reavisar.
      const n = new Notification(b.title, { body: b.body, tag: b.title, lang: "pt-BR" });
      n.onclick = () => { try { window.focus(); } catch { /* sem foco, tudo bem */ } aoClicar?.(b.tab); n.close(); };
    } catch { /* navegador recusou; a contagem no menu continua valendo */ }
  });
}

/* Recebe a lista de avisos já calculada e cuida do resto.
 *   `escopo`  quem está logado. Trocar de usuário zera o controle: o que é
 *             novidade pra um não é pro outro, e os dois usam o mesmo
 *             navegador em computador compartilhado. */
function useAvisos(itens, escopo, aoClicar) {
  const [permissao, setPermissao] = useState(() => (notificacaoDisponivel() ? Notification.permission : "indisponivel"));
  const notificadosRef = React.useRef(null);
  const escopoRef = React.useRef(null);

  const pedirPermissao = useCallback(async () => {
    if (!notificacaoDisponivel()) return;
    try { setPermissao(await Notification.requestPermission()); } catch { /* a pessoa fechou o diálogo */ }
  }, []);

  useEffect(() => {
    if (!escopo) { notificadosRef.current = null; escopoRef.current = null; return; }
    const chave = `${AVISO_NOTIFICADOS_KEY}:${escopo}`;
    const idsAgora = itens.map((a) => a.id);

    /* Primeira carga deste usuário neste navegador: o que JÁ EXISTE não é
     * novidade. Sem isto, entrar num sistema com doze pendências dispara doze
     * balões de uma vez — e a primeira impressão do recurso vira "isso me
     * enche o saco", que é de onde ninguém volta. */
    if (escopoRef.current !== chave) {
      escopoRef.current = chave;
      let guardados = null;
      try { guardados = JSON.parse(localStorage.getItem(chave) || "null"); } catch { guardados = null; }
      const primeiraVez = !Array.isArray(guardados);
      notificadosRef.current = new Set(primeiraVez ? idsAgora : guardados);
      if (primeiraVez) {
        try { localStorage.setItem(chave, JSON.stringify(idsAgora)); } catch { /* modo anônimo */ }
        return;
      }
    }

    const jaAvisados = notificadosRef.current;
    const novos = itens.filter((a) => !jaAvisados.has(a.id));
    if (!novos.length) return;

    /* Guarda só o que ainda está pendente. A lista some junto com o aviso —
     * senão ela cresce pra sempre no navegador de quem usa isso todo dia. E o
     * efeito colateral é o certo: se a mesma pendência voltar, avisa de novo. */
    const manter = idsAgora.filter((id) => jaAvisados.has(id) || novos.some((n) => n.id === id));
    notificadosRef.current = new Set(manter);
    try { localStorage.setItem(chave, JSON.stringify(manter)); } catch { /* modo anônimo */ }

    // Quem está com a tela na frente já vê o número no menu. Balão é pra quem
    // está em outra aba, em outra janela ou com o navegador minimizado.
    const olhando = !document.hidden && document.hasFocus();
    if (olhando || permissao !== "granted" || !notificacaoDisponivel()) return;
    dispararBaloes(novos, aoClicar);
  }, [itens, escopo, permissao, aoClicar]);

  return { permissao, pedirPermissao, disponivel: notificacaoDisponivel() };
}

/* ---------------------------------------------------------------------- */
/* Small UI atoms                                                          */
/* ---------------------------------------------------------------------- */
function Chip({ children, tone = "neutral" }) {
  const map = {
    neutral: { bg: T.subtle, fg: T.inkMuted }, accent: { bg: T.accentSoft, fg: T.accentDark },
    warn: { bg: T.warnSoft, fg: T.warn }, danger: { bg: T.dangerSoft, fg: T.danger },
    gold: { bg: T.goldSoft, fg: T.gold },
  };
  const s = map[tone];
  return <span style={{ background: s.bg, color: s.fg, fontFamily: "'JetBrains Mono', monospace" }} className="text-[11px] px-2 py-0.5 rounded-full whitespace-nowrap">{children}</span>;
}
function Stars({ level, max = 5 }) {
  return (
    <span className="inline-flex items-center gap-0.5">
      {Array.from({ length: max }).map((_, i) => (
        <Star key={i} size={12} fill={i < level ? T.gold : "none"} color={i < level ? T.gold : T.line} />
      ))}
    </span>
  );
}
function Section({ icon: Icon, title, subtitle, right }) {
  return (
    <div className="flex items-start justify-between mb-4 flex-wrap gap-2">
      <div className="flex items-start gap-3">

function Btn({ children, onClick, variant = "primary", icon: Icon, disabled, small, title }) {

  const size = small ? "text-xs px-2.5 py-1.5" : "text-sm px-3.5 py-2";

function SearchPick({ options, value, onChange, placeholder, badge }) {
  const [query, setQuery] = useState(""); const [open, setOpen] = useState(false);
  const wrapRef = React.useRef(null);
  const selected = options.find((o) => o.id === value);
  const filtered = options.filter((o) => o.name.toLowerCase().includes(query.toLowerCase())).slice(0, 8);

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, [open]);

  return (
    <div className="relative" ref={wrapRef}>
      <input value={open ? query : (selected?.name || "")} onFocus={() => { setOpen(true); setQuery(""); }}
        onChange={(e) => setQuery(e.target.value)} placeholder={placeholder}
        className="w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
      {open && (
        <div className="absolute z-20 mt-1 w-full rounded-lg shadow-lg max-h-48 overflow-auto" style={{ background: T.surface, border: `1px solid ${T.line}` }}>
          {value && <div onClick={() => { onChange(null); setOpen(false); }} className="px-3 py-1.5 text-xs cursor-pointer" style={{ color: T.danger }}>Limpar seleção</div>}
          {filtered.length === 0 && <div className="px-3 py-2 text-xs" style={{ color: T.inkMuted }}>Nenhum resultado</div>}
          {filtered.map((o) => (
            <div key={o.id} onClick={() => { onChange(o.id); setOpen(false); }} className="px-3 py-2 text-xs cursor-pointer hover:bg-gray-50 flex items-center justify-between gap-2">
              <span className="truncate">{o.name}</span>
              {badge && badge(o)}
            </div>
          ))}
          <div onClick={() => setOpen(false)} className="px-3 py-1.5 text-[10px] text-center cursor-pointer" style={{ color: T.inkMuted }}>Fechar</div>
        </div>
      )}
    </div>
  );
}
function MultiSearchPick({ options, values, onChange, placeholder, badge }) {
  const chosen = values.map((id) => options.find((o) => o.id === id)).filter(Boolean);
  const remaining = options.filter((o) => !values.includes(o.id));
  return (
    <div>
      <SearchPick options={remaining} value={null} onChange={(id) => { if (id) onChange([...values, id]); }} placeholder={placeholder} badge={badge} />
      {chosen.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mt-2">

        </div>

  );
}

const screenCap = (id) => `ver_${id}`;
const SCREEN_CAPS = SCREENS.map((s) => screenCap(s.id));
/* O padrão reproduz exatamente o que cada nível já enxergava antes disso
 * existir — ligar a configuração não pode mudar o que ninguém pediu. */
const TELAS_DO_DIA_A_DIA = ["dashboard", "studies", "schedule", "calendar", "training", "overtime", "history"].map(screenCap);
const DEFAULT_ROLE_SCREENS = {
  /* O Gestor vê o assistente porque é lá que a ESTIMATIVA é montada — orçar
   * é planejar. Continua sem `planejar_estudo`, então o modo "estudo
   * confirmado" fica desligado pra ele: monta orçamento, não cria estudo
   * oficial direto. Mesma separação de sempre. */
  gestor: [...TELAS_DO_DIA_A_DIA, screenCap("booking"), screenCap("estimates"), screenCap("kpis"), screenCap("resources")],
  treinador: TELAS_DO_DIA_A_DIA,
  agendador: [...TELAS_DO_DIA_A_DIA, screenCap("booking"), screenCap("estimates")],
  colaborador: [...TELAS_DO_DIA_A_DIA, screenCap("myday")],
  medico: [...TELAS_DO_DIA_A_DIA, screenCap("myday")],
};
/* Migração defensiva: matriz salva antes disso não tem nenhum `ver_*`, e sem
 * isso todo mundo ficaria sem menu nenhum. Nível sem NENHUMA tela marcada
 * adota o padrão dele. Idempotente — depois de rodar uma vez, não muda mais.
 *
 * Um nível que o admin deixou sem tela nenhuma DE PROPÓSITO continua com o
 * Painel, que é o mínimo pra pessoa entrar e ver que não tem acesso, em vez
 * de cair numa tela em branco sem explicação. */
function normalizeRoleCapabilities(rc) {
  let changed = false;
  const next = { ...(rc || {}) };
  Object.keys(DEFAULT_ROLE_SCREENS).forEach((role) => {
    const atual = next[role] || [];
    if (atual.some((c) => SCREEN_CAPS.includes(c))) return;
    next[role] = [...atual, ...DEFAULT_ROLE_SCREENS[role]];
    changed = true;
  });
  return { roleCapabilities: next, changed };
}

/* ---------------------------------------------------------------------- */
/* Entry gate — login de verdade: escolhe o usuário cadastrado (ver         */
/* KEYS.users) e informa o PIN. O nível desse usuário já libera             */
/* automaticamente o que ele pode ver/fazer no resto do app (ver canI em    */
/* App) — substitui os 4 logins separados que existiam antes (admin,        */
/* treinamento, gestor, PIN por pessoa em Meu dia/Horas Extras).            */
/* ---------------------------------------------------------------------- */
/* A versão aparece TAMBÉM na tela de login: quem abriu o arquivo errado
 * descobre antes de digitar o PIN, não depois de procurar a funcionalidade
 * nova em cinco telas. */
function EntryGate({ users, lastUserId, onEnter }) {
  const [userId, setUserId] = useState(lastUserId && users.some((u) => u.id === lastUserId) ? lastUserId : (users[0]?.id || ""));
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const bubbles = useMemo(() => Array.from({ length: 10 }).map((_, i) => ({
    left: (i * 37 + 6) % 94, size: 5 + (i % 4) * 3, dur: 10 + (i % 5) * 2.6, delay: -(i * 1.9),
  })), []);
  const submit = () => {
    const user = users.find((u) => u.id === userId);
    if (!user || !user.pin || user.pin !== pin) { setErr("PIN incorreto."); return; }
    onEnter(user);
  };

  return (
    <div className="entry-screen">
      <style>{FONTS}{SPLASH_CSS}</style>
      <div className="entry-bg" aria-hidden="true">
        <div className="entry-blob b1" /><div className="entry-blob b2" /><div className="entry-blob b3" />
        {bubbles.map((b, i) => (
          <span key={i} className="entry-bubble" style={{ left: `${b.left}%`, width: b.size, height: b.size, animationDuration: `${b.dur}s`, animationDelay: `${b.delay}s` }} />
        ))}
      </div>
      <div className="entry-card">
        <div className="entry-mark"><Gauge size={26} color="#fff" /></div>
        <h1>Central de Recursos</h1>
        <div className="entry-sub">Entre com seu usuário pra acessar o sistema</div>
        <div className="field">
          <label>Usuário</label>
          <select value={userId} onChange={(e) => { setUserId(e.target.value); setErr(""); }}>
            {users.length === 0 && <option value="">Nenhum usuário cadastrado</option>}
            {users.map((u) => <option key={u.id} value={u.id}>{u.name} · {LEVEL_LABELS[u.level]}</option>)}
          </select>
        </div>
        <div className="field">
          <label>PIN</label>
          <input type="password" autoFocus value={pin} onChange={(e) => { setPin(e.target.value); setErr(""); }}
            onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="····" />
        </div>
        <button className="entry-btn" onClick={submit}>Entrar no sistema</button>
        {err && <div className="entry-hint" style={{ color: "#C0503F" }}>{err}</div>}
        <div className="entry-hint">Seu acesso é definido pelo administrador — fale com ele se seu usuário não estiver na lista ou o nível estiver errado.</div>
      </div>
    </div>
  );
}

  const [stockEntries, setStockEntries] = useState(null);
  const [overtimeRequests, setOvertimeRequests] = useState(null);
  const [staffRequests, setStaffRequests] = useState(null);
  /* Dado descartado por estar em formato inválido. Fica em estado próprio, e
   * não em `err`, porque `err` é apagado pela leitura seguinte — e a leitura

  const [reparos, setReparos] = useState([]);

  const [myPersonRole, setMyPersonRole] = useState(null); // "collaborator" | "doctor" | null
  const [myPersonId, setMyPersonId] = useState(null);
  const [entered, setEntered] = useState(false);
  const [minSplashDone, setMinSplashDone] = useState(false);
  // Mantém a tela de carregamento visível um tempo mínimo — os dados vêm do
  // localStorage e resolvem quase instantâneo, mas sumir em 20ms pareceria um
  // "flash" e não uma tela de carregamento de verdade.
  useEffect(() => { const t = setTimeout(() => setMinSplashDone(true), 1100); return () => clearTimeout(t); }, []);
  /* Vigia da tela de carregamento: se passou disto e ainda não entrou, alguma
   * coisa deu errado e a pessoa precisa saber o quê. */
  const [demorouDemais, setDemorouDemais] = useState(false);
  useEffect(() => { const t = setTimeout(() => setDemorouDemais(true), 6000); return () => clearTimeout(t); }, []);

  // Alertas: calculado uma vez aqui (não em cada tela) pra alimentar tanto o badge
  // do nav quanto o painel no Dashboard com a mesma lista. Precisa ficar antes de
  // qualquer "return" condicional (loading/entry gate) — hook não pode ser pulado
  // em alguns renders e chamado em outros, senão o React perde a conta dos hooks.
  const alerts = useMemo(() => {
    if (!data || !trainingRequests) return [];
    const out = [];
    data.equipment.forEach((eq) => {
      const cal = calibrationStatus(eq);
      if (!cal) return;
      if (cal.status === "vencido") out.push({ tone: "danger", kind: "calibração", text: `${eq.name}: calibração vencida desde ${weekdayLabel(cal.due)}` });
      else if (cal.status === "vencendo") out.push({ tone: "warn", kind: "calibração", text: `${eq.name}: calibração vence em ${cal.daysLeft} dia(s)` });
    });
    (data.supplies || []).forEach((s) => {
      if ((s.quantity ?? 0) <= (s.minThreshold ?? 0)) out.push({ tone: "danger", kind: "estoque", text: `${s.name}: estoque baixo (${s.quantity} ${s.unit})` });

    trainingRequests.filter((r) => r.status === "pendente").forEach((r) => {

      if (daysLeft < 0) out.push({ tone: "danger", kind: "treinamento", text: `${r.activityName} (${r.studyName}): prazo já passou` });
      else if (daysLeft <= 7) out.push({ tone: "warn", kind: "treinamento", text: `${r.activityName} (${r.studyName}): prazo em ${daysLeft} dia(s)` });
    });
