            {win.clipped && win.fits && (
              <div className="text-[10px] mt-1" style={{ color: T.warn }}>
                <AlertTriangle size={10} className="inline -mt-0.5 mr-1" />
                O protocolo permitiria até {weekdayLabel(janelaPura.dateMax)}, mas o prazo combinado com o cliente termina antes.
              </div>
            )}
            {!win.fits && (
              <div className="text-[10px] mt-1" style={{ color: T.danger }}>
                <AlertTriangle size={10} className="inline -mt-0.5 mr-1" />
                Pelo protocolo seria {weekdayLabel(janelaPura.dateMin)}, depois do prazo do estudo.
                É preciso antecipar o D0 ou renegociar o prazo em Estudos.
              </div>
            )}
          </div>

          <div className="flex items-center justify-between pt-1">
            <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Atividades / métodos</div>
            <Btn small icon={Plus} variant="subtle" onClick={addRow}>Adicionar atividade</Btn>
          </div>

          {/* Checagem imediata dos grupos: pra rodarem juntas, as atividades
              precisam de uma sala que atenda TODAS. Avisar aqui (e não só depois
              de o plano falhar) mostra na hora que o problema é o cadastro. */}
          {groupRows(draft.rows).filter((g) => g.length > 1).map((g) => {
            const acts = g.map((r) => data.activities.find((a) => a.id === r.activityId)).filter(Boolean);
            const comuns = data.locations.filter((l) => l.active !== false
              && acts.every((a) => !a.locationIds?.length || a.locationIds.includes(l.id)));
            const nomes = acts.map((a) => a.name).join(" + ");
            return (
              <div key={g[0].groupKey} className="text-[11px] rounded-lg px-2.5 py-2"
                style={comuns.length
                  ? { background: T.accentSoft, color: T.accentDark }
                  : { background: T.dangerSoft, color: T.danger, border: `1px solid ${T.danger}` }}>
                <strong>Grupo {g[0].groupKey}</strong> — {nomes}:{" "}
                {comuns.length
                  ? <>{comuns.length} sala(s) recebem as {acts.length} juntas ({comuns.slice(0, 3).map((l) => l.name).join(", ")}{comuns.length > 3 ? "…" : ""}).</>
                  : <>nenhuma sala recebe as {acts.length} atividades juntas. Marque uma sala que atenda todas em <strong>Configurações → Cadastro → Locais</strong>, ou tire uma delas do grupo.</>}
              </div>
            );
          })}

          <div className="space-y-3">
            {draft.rows.map((row, ridx) => {
              const activity = data.activities.find((a) => a.id === row.activityId);
              const allowedRooms = activity?.locationIds?.length ? data.locations.filter((l) => activity.locationIds.includes(l.id)) : data.locations;
              const availableAccessories = row.equipmentId ? equipAccessoryOptions(row.equipmentId, data.equipment) : [];
              const eqAvail = row.equipmentId ? windowFreeCount(row.equipmentId, data.equipment, bookings, dateMin, dateMax) : null;
              // Quem mais está no mesmo grupo — usado só pra explicar na tela.
              const mates = row.groupKey ? draft.rows.filter((r) => r.rowId !== row.rowId && r.groupKey === row.groupKey) : [];
              const trained = row.activityId ? data.collaborators.filter((c) => c.active !== false && (c.levels?.[row.activityId] || 0) >= (activity?.minLevel || 0)).length : 0;
              return (
                <div key={row.rowId}
                  style={{ background: T.bg, border: row.groupKey ? `1px solid ${T.accent}` : `1px dashed ${T.line}` }}
                  className="rounded-lg p-3 space-y-2">
                  <div className="flex items-center justify-between">
                    <div className="text-[11px] font-medium uppercase tracking-wide" style={{ color: T.inkMuted }}>Atividade {ridx + 1}</div>
                    {draft.rows.length > 1 && <button onClick={() => removeRow(row.rowId)} style={{ color: T.danger }}><Trash2 size={13} /></button>}
                  </div>

                  <select value={row.activityId || ""} onChange={(e) => setRowActivity(row.rowId, e.target.value || null)}
                    className="w-full text-sm px-2.5 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }}>
                    {data.activities.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
                  </select>

                  {/* Agrupamento explícito: atividades com a mesma letra rodam
                      juntas, na mesma sala e no mesmo horário, cada uma com a
                      sua própria pessoa. Fica logo abaixo da atividade porque é
                      a decisão principal desta tela, junto com qual método é. */}
                  {draft.rows.length > 1 && (
                    <div className="space-y-1">
                      <div className="text-[11px] font-medium" style={{ color: T.inkMuted }}>Acontece ao mesmo tempo que outra atividade?</div>
                      <div className="flex items-center gap-1.5 flex-wrap text-[11px]">
                        <button onClick={() => updateRow(row.rowId, { groupKey: null })} className="px-2 py-0.5 rounded-full"
                          style={{ background: !row.groupKey ? T.accent : T.subtle, color: !row.groupKey ? "#fff" : T.inkMuted }}>Não, roda sozinha</button>
                        {GROUP_KEYS.map((k) => (
                          <button key={k} onClick={() => updateRow(row.rowId, { groupKey: k })} className="px-2 py-0.5 rounded-full"
                            style={{ background: row.groupKey === k ? T.accent : T.subtle, color: row.groupKey === k ? "#fff" : T.inkMuted }}>Sim, grupo {k}</button>
                        ))}
                      </div>
                    </div>
                  )}
                  {row.groupKey && (
                    <div className="text-[10px]" style={{ color: mates.length ? T.accentDark : T.warn }}>
                      {mates.length
                        ? <>Mesma sala e mesmo horário que {mates.map((m) => data.activities.find((a) => a.id === m.activityId)?.name || "outra atividade").join(", ")} — cada uma com a sua própria pessoa.</>
                        : <>Grupo {row.groupKey} tem só esta atividade. Marque outra como <strong>grupo {row.groupKey}</strong>, ou volte pra "roda sozinha".</>}
                    </div>
                  )}

                  {activity && (
                    <div className="text-[11px] flex items-center gap-1.5 flex-wrap" style={{ color: T.inkMuted }}>
                      <span>Nível mínimo: <Stars level={activity.minLevel} /></span>
                      {/* A sala não é escolhida aqui: ela sai do que está
                          cadastrado no método. Mostrar quantas atendem já avisa
                          quando o cadastro está incompleto. */}
                      <span>· {activity.locationIds?.length ? `${allowedRooms.length} sala(s) atendem esse método` : "qualquer sala atende"}</span>
                      <span>· {trained} pessoa(s) treinada(s)</span>
                    </div>
                  )}
                  {activity && activity.locationIds?.length > 0 && allowedRooms.length === 0 && (
                    <div className="text-[10px] rounded-md px-2 py-1" style={{ background: T.dangerSoft, color: T.danger }}>
                      Nenhuma sala cadastrada atende "{activity.name}". Ajuste em Configurações → Cadastro → Locais.
                    </div>
                  )}

                  <label className="flex items-center gap-2 text-[11px]" style={{ color: T.inkMuted }}>Duração (min)
                    <input type="number" min={15} step={15} value={row.durationMin} onChange={(e) => updateRow(row.rowId, { durationMin: Number(e.target.value) || 60 })}
                      className="w-20 text-xs px-2 py-1 rounded-md outline-none" style={{ border: `1px solid ${T.line}` }} />
                  </label>
                  {(() => {
                    const learned = row.activityId ? avgActualDuration(row.activityId, bookings) : null;
                    if (!learned || learned.avgMin === row.durationMin) return null;
                    return (
                      <div className="text-[10px] flex items-center gap-1.5" style={{ color: T.gold }}>
                        <Info size={10} />Nas últimas {learned.sampleSize} vezes essa atividade levou {learned.avgMin} min em média (planejado: {row.durationMin} min).
                        <button onClick={() => updateRow(row.rowId, { durationMin: learned.avgMin })} className="underline">Usar {learned.avgMin} min</button>
                      </div>
                    );
                  })()}

                  <SearchPick options={mainEquipment} value={row.equipmentId} onChange={(v) => setRowEquipment(row.rowId, v)} placeholder="Equipamento (opcional)..."
                    badge={(o) => o.accessoryIds?.length ? <Chip tone="gold">tem {o.accessoryIds.length} acessório(s)</Chip> : null} />

                  {eqAvail && (
                    <div className="text-[11px] flex items-center gap-1" style={{ color: eqAvail.free > 0 ? T.accentDark : T.danger }}>
                      <Layers size={11} /> {eqAvail.free} de {eqAvail.total} unidade(s) do tipo "{baseTypeName(data.equipment.find((e) => e.id === row.equipmentId)?.name || "")}" sem reserva na janela
                    </div>
                  )}

                  {availableAccessories.length > 0 && (
                    <div className="flex flex-wrap gap-1.5">
                      {availableAccessories.map((a) => {
                        const on = (row.accessoryIds || []).includes(a.id);
                        const accAvail = windowFreeCount(a.id, data.equipment, bookings, dateMin, dateMax);
                        return (
                          <button key={a.id} onClick={() => toggleRowAccessory(row.rowId, a.id)} className="text-[11px] px-2.5 py-1 rounded-full"
                            style={{ background: on ? T.accent : T.subtle, color: on ? "#fff" : T.inkMuted }}>
                            {a.name} · {accAvail.free}/{accAvail.total} livres
                          </button>
                        );
                      })}
                    </div>
                  )}

                  <label className="flex items-center gap-2 text-[11px] font-medium" style={{ color: T.inkMuted }}>
                    <input type="checkbox" checked={row.needDoctor} onChange={(e) => updateRow(row.rowId, { needDoctor: e.target.checked })} /> Requer médico investigador
                  </label>
                </div>
              );
            })}
          </div>

          <Btn icon={Sparkles} onClick={generatePlans}>Sugerir cronograma deste timepoint</Btn>
        </div>

        <div className="lg:col-span-3 space-y-3">
          <div className="text-xs font-semibold flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
            <span style={{ background: draft.plans ? T.accent : T.subtle, color: draft.plans ? "#fff" : T.inkMuted }}
              className="w-4 h-4 rounded-full text-[10px] flex items-center justify-center">3</span>
            Como o sistema encaixou
          </div>
          {/* Antes essa coluna ficava vazia e nada dizia que era o botão ao
              lado que a preenchia. */}
          {!draft.plans && (
            <div style={{ background: T.bg, border: `1px dashed ${T.line}` }} className="rounded-xl p-4 text-center space-y-1.5">
              <Sparkles size={20} style={{ color: T.inkMuted }} className="mx-auto" />
              <div className="text-xs" style={{ color: T.inkMuted }}>
                Termine de escolher as atividades ao lado e clique em <strong>"Sugerir cronograma"</strong>.
              </div>
              <div className="text-[10px]" style={{ color: T.inkMuted }}>
                O sistema procura sala, equipe qualificada, médico e equipamento livres dentro da janela da visita,
                respeitando preparo, desmontagem, férias e feriados — e mostra duas opções: tudo no mesmo dia ou distribuído.
              </div>
            </div>
          )}
          {draft.plans && (
            <div className="space-y-3">
              <PlanCard mode="sameDay" label="Tudo no mesmo dia" plan={draft.plans.sameDay}
                draft={draft} data={data} overtimeRequests={overtimeRequests} canSolicitarHoraExtra={canSolicitarHoraExtra}
                onSetTrainingPick={setTrainingPick} onRequestTraining={requestTraining} onRequestOvertime={requestOvertime}
                onRegenerate={regenerate} onConfirm={onConfirm} ehEstimativa={ehEstimativa} />
              <PlanCard mode="spread" label="Distribuído na janela" plan={draft.plans.spread}
                draft={draft} data={data} overtimeRequests={overtimeRequests} canSolicitarHoraExtra={canSolicitarHoraExtra}
                onSetTrainingPick={setTrainingPick} onRequestTraining={requestTraining} onRequestOvertime={requestOvertime}
                onRegenerate={regenerate} onConfirm={onConfirm} ehEstimativa={ehEstimativa} />
              {!draft.plans.sameDay && !draft.plans.spread && (
                <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}` }} className="rounded-xl p-4 space-y-2">
                  <div className="flex items-center gap-2 text-sm font-medium" style={{ color: T.warn }}><AlertTriangle size={16} /> Não fechou nenhum cronograma nessa janela</div>
                  {draft.diagnostics && (
                    <div className="space-y-1.5">
                      {draft.diagnostics.map((d) => {
                        const row = draft.rows.find((r) => r.rowId === d.rowId);
                        const activity = data.activities.find((a) => a.id === row?.activityId);
                        return (
                          <div key={d.rowId} className="text-xs" style={{ color: T.inkMuted }}>
                            {activity?.name}: {d.ok ? "encaixa isoladamente (o conflito é com outra atividade do mesmo timepoint)" : d.collaboratorMissing ? "sala/equipamento livres, mas sem colaborador treinado na janela" : (d.missing || ["sem combinação livre na janela"]).join("; ")}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* Fita de passos do assistente. Não navega: só diz onde a pessoa está e o
 * que vem depois. Clicar não faz sentido porque cada passo depende do
 * anterior estar preenchido. */
function Passos({ atual }) {
  const PASSOS = [
    { n: 1, label: "Qual estudo" },
    { n: 2, label: "O que precisa acontecer" },
    { n: 3, label: "Ver a sugestão" },
    { n: 4, label: "Confirmar" },
  ];
  return (
    <div className="flex items-center gap-1 flex-wrap">
      {PASSOS.map((p, i) => {
        const feito = p.n < atual, agora = p.n === atual;
        return (
          <React.Fragment key={p.n}>
            {i > 0 && <div className="w-4 h-px" style={{ background: T.line }} />}
            <div className="flex items-center gap-1.5 px-2 py-1 rounded-lg"
              style={agora ? { background: T.accentSoft } : {}}>
              <span className="w-4 h-4 rounded-full text-[10px] flex items-center justify-center"
                style={feito || agora ? { background: T.accent, color: "#fff" } : { background: T.subtle, color: T.inkMuted }}>
                {feito ? "✓" : p.n}
              </span>
              <span className="text-[11px]" style={{ color: agora ? T.accentDark : T.inkMuted, fontWeight: agora ? 600 : 400 }}>{p.label}</span>
            </div>
          </React.Fragment>
        );
      })}
    </div>
  );
}

function BookingWizard({ data, bookings, onCreate, actorName, trainingRequests, onCreateTrainingRequest, studies, onCreateStudy, timepoints, onCreateTimepoint, onUpdateSupplies, onConfirmTimepoint, presetStudyId, onConsumePreset, onIrParaEstudos, estudoFixo, canSolicitarHoraExtra, onCreateOvertimeRequest, overtimeRequests, estimates, onCreateEstimate, canEstimar, canSegurar, canPlanejar }) {
  /* O estudo NÃO é criado aqui. Cadastrar estudo virou responsabilidade de
   * uma tela só — Estudos —, porque existiam dois formulários gravando na
   * mesma coleção, com campos diferentes: quando os grupos e o técnico foram
   * criados, só um dos dois ganhou os campos, e o assistente passou a gravar
   * estudo incompleto sem ninguém perceber. Dois formulários para a mesma
   * coisa divergem — é questão de tempo, não de cuidado.
   *
   * `studySource` continua existindo por causa da ESTIMATIVA: uma
   * oportunidade ainda não é estudo, tem nome próprio e é montada aqui
   * mesmo. Em modo estudo, o valor é sempre "existing". */
  const [studySource, setStudySource] = useState("existing");
  const [selectedStudyId, setSelectedStudyId] = useState(presetStudyId || null);
  const [newStudyName, setNewStudyName] = useState("");
  const [newSponsorId, setNewSponsorId] = useState(data.sponsors[0]?.id || null);
  const [newBaselineDate, setNewBaselineDate] = useState(todayStr());
  // Período combinado com o cliente, pro estudo criado aqui nascer igual ao
  // criado no cadastro — sem isso, todo estudo do assistente ficava sem prazo.
  const [newStartMin, setNewStartMin] = useState(todayStr());
  const [newStartMax, setNewStartMax] = useState(todayStr());
  const [newEndDate, setNewEndDate] = useState("");
  /* Modo do assistente: o mesmo motor serve pra montar uma RESERVA (estudo
   * confirmado) e uma ESTIMATIVA (oportunidade ainda não aprovada). Muda o
   * nível de compromisso do que é gravado, não a forma de planejar. */
  // Quem não pode criar estudo oficial cai direto no modo estimativa (e
  // vice-versa): a tela nunca oferece um modo que a pessoa não pode usar.
  const [modo, setModo] = useState(canPlanejar ? "reserva" : "estimativa");
  const [estimativaId, setEstimativaId] = useState(() => genId("est"));
  const [cliente, setCliente] = useState("");
  const [responsavelId, setResponsavelId] = useState(null);
  const [valorEstimado, setValorEstimado] = useState("");
  const [observacoes, setObservacoes] = useState("");
  const [segurarRecursos, setSegurarRecursos] = useState(false);
  const [segurarAte, setSegurarAte] = useState("");
  const [drafts, setDrafts] = useState([makeTimepointDraft(data, 1)]);

  useEffect(() => {
    if (presetStudyId) { setStudySource("existing"); setSelectedStudyId(presetStudyId); if (!estudoFixo) onConsumePreset(); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [presetStudyId]);

  const studyOptions = studies.map((s) => ({ id: s.id, name: s.name }));
  const currentStudy = studySource === "existing" ? studies.find((s) => s.id === selectedStudyId) : null;
  // Baseline (D0) do estudo — é a âncora de todas as visitas. Estudo antigo,
  // criado antes do protocolo existir, adota a data de criação como baseline.
  const baselineDate = studySource === "existing"
    ? (currentStudy?.baselineDate || currentStudy?.createdAt?.slice(0, 10) || todayStr())
    : newBaselineDate;
  const effectiveSponsorId = studySource === "existing" ? currentStudy?.sponsorId : newSponsorId;
  const effectiveStudyName = studySource === "existing" ? (currentStudy?.name || "") : newStudyName;
  /* Janela contratada usada pra aparar as janelas das visitas. Estudo já
   * cadastrado traz a dele; estudo novo usa o que está sendo digitado agora,
   * pra a tela reagir enquanto a pessoa preenche. */
  const studyForWindow = studySource === "existing"
    ? currentStudy
    : { baselineDate: newBaselineDate, startMin: newStartMin || newBaselineDate, startMax: newStartMax || newBaselineDate, endDate: newEndDate || null };
  const sponsor = data.sponsors.find((s) => s.id === effectiveSponsorId);
  const niche = data.niches.find((n) => n.id === sponsor?.nicheId);
  const readyToPlan = studySource === "existing" ? !!selectedStudyId : newStudyName.trim().length > 0;

  const updateDraft = (tpId, patch) => setDrafts((ds) => ds.map((d) => (d.tpId === tpId ? { ...d, ...patch } : d)));
  const addTimepoint = () => setDrafts((ds) => [...ds, makeTimepointDraft(data, ds.length + 1)]);
  const removeTimepoint = (tpId) => setDrafts((ds) => (ds.length > 1 ? ds.filter((d) => d.tpId !== tpId) : ds));

  // Estudo criado pelo assistente nasce igual ao criado no cadastro: com
  // baseline e status. Não existe mais "estudo sem protocolo" no sistema.
  //
  // NÃO grava aqui: devolve `novo` pra confirmação incluir o estudo na mesma
  // transação das reservas. Gravar antes deixava reserva apontando pra estudo
  // que não entrou (se a gravação falhasse) ou estudo vazio (se a transação
  // seguinte falhasse).
  const resolveStudy = () => {
    if (studySource === "existing" && selectedStudyId) {
      // Devolve o estudo INTEIRO: a janela contratada dele é o que apara as
      // janelas das visitas em `draftWindow`.
      return { estudo: { ...currentStudy, id: selectedStudyId, baselineDate }, novo: null };
    }
    const s = {
      id: genId("study"), name: newStudyName.trim() || "Estudo sem nome", sponsorId: newSponsorId,
      baselineDate: newBaselineDate,
      startMin: newStartMin || newBaselineDate, startMax: newStartMax || newBaselineDate,
      endDate: newEndDate || null,
      status: "ativo", createdAt: new Date().toISOString(),
    };
    return { estudo: s, novo: s };
  };

  const [confirmError, setConfirmError] = useState(null);

  // Limpa o plano velho pra que o assistente recalcule contra os dados atuais.
  const regenerateFor = (tpId, mode) => updateDraft(tpId, { plans: null, diagnostics: null });

  const confirmTimepoint = async (tpId, mode) => {
    const draft = drafts.find((d) => d.tpId === tpId);
    const plan = draft?.plans?.[mode];
    if (!plan) return;
    setConfirmError(null);

    // REVALIDA antes de gravar. Entre gerar a sugestão e clicar em confirmar
    // pode ter passado tempo, e outra pessoa pode ter pego a mesma sala, o
    // mesmo colaborador ou o mesmo aparelho. "Estava livre quando consultei"
    // não é o mesmo que "continua livre agora".
    //
    // As reservas do plano são validadas contra a lista atual MAIS as que o
    // próprio plano vai criar — senão duas linhas do mesmo plano não veriam
    // uma à outra. Reservas do mesmo grupo simultâneo dividem a sala e por
    // isso carregam o groupId já aqui.
    const provisorias = plan.items.map((it) => ({
      id: `check_${it.rowId}`, date: it.date, start: it.start, end: it.end,
      blockStart: it.blockStart || it.start, blockEnd: it.blockEnd || it.end,
      locationId: it.location?.id, equipmentId: it.equipment?.id || it.row.equipmentId,
      accessoryIds: it.row.accessoryIds || [], activityId: it.row.activityId,
      collaboratorIds: (it.collaborators || (it.collaborator ? [it.collaborator] : [])).map((c) => c.id),
      doctorId: it.doctor?.id || null, participants: it.row.participants ?? null,
      groupId: it.groupSize > 1 ? `plan:${it.groupId}` : null,
    }));
    const universo = [...bookings, ...provisorias];
    const problemas = [];
    provisorias.forEach((prov, i) => {
      const v = validateBooking(prov, data, universo, prov.id);
      // Fora do horário cadastrado é aviso (hora extra), não bloqueia — esse
      // caminho já tem a própria aprovação.
      v.errors.forEach((e) => problemas.push(`${data.activities.find((a) => a.id === prov.activityId)?.name || `atividade ${i + 1}`}: ${e}`));
    });
    if (problemas.length) {
      setConfirmError({ tpId, mode, problemas });
      return;
    }

    const { estudo: study, novo: novoEstudo } = resolveStudy();
    // A visita é gravada em termos de protocolo (deslocamento + tolerância); as
    // datas vão junto só como cache da janela derivada.
    const w = draftWindow(draft, study.baselineDate || baselineDate, study);
    const tp = {
      id: tpId, studyId: study.id, label: draft.label,
      offsetDays: draft.offsetDays, toleranceDays: draft.toleranceDays,
      dateMin: w.dateMin, dateMax: w.dateMax, createdAt: new Date().toISOString(),
    };
    const newBookings = plan.items.map((it) => ({
      id: genId("bk"), studyId: study.id, timepointId: tp.id, studyName: study.name, sponsorId: study.sponsorId,
      date: it.date, start: it.start, end: it.end,
      // Janela realmente bloqueada na agenda (com preparo/desmontagem) — é o que os
      // testes de conflito olham daqui pra frente.
      blockStart: it.blockStart || it.start, blockEnd: it.blockEnd || it.end,
      // A unidade de equipamento é a que o motor escolheu (pode não ser o
      // patrimônio pedido — a busca é por tipo, "um Corneometer qualquer").
      locationId: it.location.id, equipmentId: it.equipment?.id || it.row.equipmentId,
      // Atividades simultâneas dividem a sala DE PROPÓSITO. Sem guardar o
      // grupo, a validação da edição manual acusaria uma como conflito da
      // outra, já que as duas ocupam a mesma sala no mesmo horário.
      groupId: it.groupSize > 1 ? `${tp.id}:${it.groupId}` : null,
      accessoryIds: it.row.accessoryIds || [], activityId: it.row.activityId, minLevel: it.row.minLevel,
      collaboratorIds: (it.collaborators || (it.collaborator ? [it.collaborator] : [])).map((c) => c.id),
      // needDoctor viaja com a reserva: sem isso a exigência se perdia depois do
      // planejamento e dava pra tirar o médico na edição sem ninguém saber que
      // ele era obrigatório.
      needDoctor: !!it.row.needDoctor,
      doctorId: it.doctor?.id || null, participantCount: it.row.participants ?? null,
      createdBy: actorName || "usuário sem identificação",
      // Só nasce "confirmado" quem tem a equipe (e o médico) completa. Sem
      // ninguém qualificado, fica "pendente_equipe": segura sala e equipamento
      // sem afirmar que a reserva está pronta pra executar.
      status: bookingStatusFor({
        collaboratorIds: (it.collaborators || (it.collaborator ? [it.collaborator] : [])).map((c) => c.id),
        needDoctor: !!it.row.needDoctor, doctorId: it.doctor?.id || null,
      }, data.activities.find((a) => a.id === it.row.activityId)),
    }));
    // Visita + reservas + baixa de estoque numa transação só: ou entra tudo, ou
    // não entra nada. O estoque vai como delta ("consome N"), calculado pelo
    // servidor a partir do valor atual — nunca como quantidade nova vinda daqui.
    const consumo = new Map();
    newBookings.forEach((b) => {
      const act = data.activities.find((a) => a.id === b.activityId);
      (act?.supplyUsage || []).forEach((u) => consumo.set(u.supplyId, (consumo.get(u.supplyId) || 0) + u.qty));
    });
    const supplyDeltas = [...consumo.entries()].map(([id, qtd]) => ({ id, field: "quantity", delta: -qtd, min: 0 }));

    // Liga cada pedido de treinamento à reserva que ele existe pra viabilizar.
    // É esse vínculo que faz "treinamento concluído" preencher a equipe que
    // estava faltando, em vez de a reserva ficar "falta equipe" pra sempre.
    // Vários pedidos podem apontar pra MESMA reserva (atividade de N pessoas
    // com N faltando): cada conclusão vai somando uma pessoa à equipe até a
    // reserva sair de "pendente_equipe".
    const vinculos = [];
    plan.items.forEach((it, i) => {
      pickList(draft.requestedTraining[`${it.rowId}-${it.date}`])
        .forEach((reqId) => { if (typeof reqId === "string") vinculos.push({ reqId, bookingId: newBookings[i].id }); });
    });

    /* MODO ESTIMATIVA: mesmo motor, mesmo plano, mesma revalidação — só muda
     * o nível de compromisso do que é gravado. Nenhuma linha do planejamento
     * acima sabe que existe estimativa; a diferença começa aqui.
     *
     * Não cria estudo nem visita, e NÃO mexe em estoque: previsão não
     * consome nada. O protocolo fica guardado na própria estimativa, e é
     * dele que a conversão reconstrói estudo + visitas. */
    if (modo === "estimativa") {
      // Pré-reserva sem prazo é bloqueio que ninguém consegue tirar da agenda
      // — a mesma regra que o servidor aplica, checada aqui pra dar a resposta
      // na hora em vez de depois de uma ida ao banco.
      if (segurarRecursos && !segurarAte) {
        setConfirmError({ tpId, mode, problemas: ["marque até quando os recursos ficam segurados"] });
        return;
      }
      const jaExiste = estimates.find((e) => e.id === estimativaId);
      const estimativa = jaExiste ? { ...jaExiste } : {
        id: estimativaId, name: effectiveStudyName || "Oportunidade sem nome",
        client: cliente.trim() || null, sponsorId: effectiveSponsorId,
        responsibleId: responsavelId || null,
        status: segurarRecursos ? "pre_reserva" : "aberta",
        baselineDate, startMin: newStartMin || baselineDate, startMax: newStartMax || baselineDate,
        endDate: newEndDate || null,
        protocol: [],
        holdsResources: !!segurarRecursos, holdUntil: segurarRecursos ? (segurarAte || null) : null,
        estimatedValue: valorEstimado === "" ? null : Number(valorEstimado),
        notes: observacoes.trim() || null,
        createdAt: new Date().toISOString(), createdBy: actorName || "usuário sem identificação",
        convertedStudyId: null, convertedAt: null, cancelledAt: null, cancelledBy: null, cancellationReason: null,
      };
      // A visita entra no protocolo da estimativa (sem duplicar, se a pessoa
      // reconfirmar depois de mexer no plano).
      estimativa.protocol = [
        ...(estimativa.protocol || []).filter((v) => v.tpId !== tpId),
        { tpId, label: draft.label, offsetDays: draft.offsetDays, toleranceDays: draft.toleranceDays },
      ];
      const previstas = newBookings.map((b) => ({
        ...b,
        bookingType: "estimate", estimateId: estimativa.id, estimateVisitId: tpId,
        holdsResources: !!segurarRecursos, holdUntil: segurarRecursos ? (segurarAte || null) : null,
        // Sem estudo ainda: o nome vem da oportunidade, pra a agenda não
        // mostrar uma reserva anônima.
        studyId: null, timepointId: null, studyName: estimativa.name,
      }));
      const okE = await onCreateEstimate(estimativa, previstas);
      if (okE === false) return;
      setEstimativaId(estimativa.id);
      updateDraft(tpId, { confirmed: { mode, items: plan.items, estimativa: true }, plans: null });
      return;
    }

    const ok = await onConfirmTimepoint({ novoEstudo, timepoint: tp, newBookings, supplyDeltas, vinculosTreinamento: vinculos });
    if (!ok) return;
    // Só depois de gravar de verdade o assistente passa a tratar o estudo como
    // existente — senão um erro deixaria a tela achando que ele foi criado.
    if (novoEstudo) { setStudySource("existing"); setSelectedStudyId(novoEstudo.id); }
    updateDraft(tpId, { confirmed: { mode, items: plan.items }, plans: null });
  };

  return (
    <div className="space-y-5">
      <Section icon={Wand2} title="Planejar estudo" subtitle="Você diz o que precisa acontecer; o sistema procura sala, equipe, médico e equipamento livres e monta o cronograma." />

      {/* Os passos deixam claro onde a pessoa está e o que vem depois — antes
          a tela mostrava tudo de uma vez e a coluna da direita ficava vazia
          sem explicar que era o botão "Sugerir cronograma" que a preenchia. */}
      <Passos atual={!readyToPlan ? 1 : (drafts.some((d) => d.confirmed) ? 4 : (drafts.some((d) => d.plans) ? 3 : 2))} />

      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-3">
        <div className="text-xs font-semibold flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
          <span style={{ background: T.accent, color: "#fff" }} className="w-4 h-4 rounded-full text-[10px] flex items-center justify-center">1</span>
          {modo === "estimativa" ? "Qual oportunidade" : "Qual estudo"}
        </div>

        {/* Nível de compromisso — a decisão que muda o que vai ser gravado no
            fim. Fica em cima de tudo justamente porque muda o significado dos
            campos seguintes. */}
        {canEstimar && canPlanejar && (
          <div className="flex gap-1.5 flex-wrap">
            <Btn small variant={modo === "reserva" ? "primary" : "ghost"} icon={CalendarCheck} onClick={() => { setModo("reserva"); setStudySource("existing"); }}>Estudo confirmado</Btn>
            <Btn small variant={modo === "estimativa" ? "primary" : "ghost"} icon={Wallet} onClick={() => { setModo("estimativa"); setStudySource("new"); }}>Estimativa / orçamento</Btn>
          </div>
        )}
        {!canPlanejar && !canEstimar && (
          <div className="text-[11px] rounded-md px-2 py-1.5" style={{ background: T.warnSoft, color: T.warn }}>
            Você pode acompanhar o planejamento, mas não criar estudo nem estimativa. Fale com o administrador.
          </div>
        )}
        {modo === "estimativa" && (
          <div className="text-[11px] rounded-md px-2 py-1.5" style={{ background: T.goldSoft, color: T.gold }}>
            Estimativa é previsão: entra em custo, capacidade e estoque previsto, mas <strong>não</strong> tira o horário de ninguém —
            a menos que você marque "segurar recursos" abaixo. Vira estudo oficial só quando for convertida.
          </div>
        )}

        {/* Sem estudo escolhido não há o que agendar. Em vez de oferecer um
            segundo formulário de cadastro, aponta para onde ele mora. */}
        {modo === "reserva" && !selectedStudyId && !estudoFixo && (
          <div className="rounded-lg p-3 flex items-start justify-between gap-3 flex-wrap"
            style={{ background: T.accentSoft, border: `1px solid ${T.accent}` }}>
            <div className="text-[11px]" style={{ color: T.accentDark }}>
              <div className="font-semibold mb-0.5">Escolha um estudo já cadastrado para agendar.</div>
              O cadastro do estudo — protocolo, período, grupos de participantes e técnico —
              fica em <strong>Estudos</strong>. Depois de cadastrado, ele aparece na lista abaixo.
            </div>
            {onIrParaEstudos && (
              <Btn small icon={Layers} onClick={onIrParaEstudos}>Ir para Estudos</Btn>
            )}
          </div>
        )}

        {studySource === "new" ? (
          <div className="space-y-3">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <label className="text-xs font-medium" style={{ color: T.inkMuted }}>Nome do estudo / protocolo
                <input value={newStudyName} onChange={(e) => setNewStudyName(e.target.value)} placeholder="ex.: Protocolo XPTO-102"
                  className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
              </label>
              <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Patrocinador
                <div className="mt-1"><SearchPick options={data.sponsors} value={newSponsorId} onChange={setNewSponsorId} placeholder="Buscar patrocinador..." /></div>
              </div>
              <label className="text-xs font-medium" style={{ color: T.inkMuted }}>Dia da primeira visita (D0)
                <input type="date" value={newBaselineDate} onChange={(e) => setNewBaselineDate(e.target.value)}
                  className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
                <span className="block text-[10px] font-normal mt-0.5">todas as outras visitas são contadas a partir dele</span>
              </label>
            </div>
            {/* Período combinado: o assistente é a porta de entrada mais usada,
                então o prazo tem que ser perguntado AQUI, não só no cadastro. */}
            <div className="rounded-lg p-2.5" style={{ background: T.bg, border: `1px solid ${T.line}` }}>
              <div className="text-[11px] font-medium mb-2 flex items-center gap-1.5" style={{ color: T.inkMuted }}>
                <CalendarRange size={12} /> Período combinado com o cliente
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <label className="text-[11px]" style={{ color: T.inkMuted }}>Pode começar a partir de
                  <input type="date" value={newStartMin}
                    onChange={(e) => { setNewStartMin(e.target.value); if (newStartMax < e.target.value) setNewStartMax(e.target.value); }}
                    className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
                </label>
                <label className="text-[11px]" style={{ color: T.inkMuted }}>Precisa começar até
                  <input type="date" min={newStartMin} value={newStartMax} onChange={(e) => setNewStartMax(e.target.value)}
                    className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
                </label>
                <label className="text-[11px]" style={{ color: T.inkMuted }}>Precisa terminar até
                  <input type="date" min={newStartMin} value={newEndDate} onChange={(e) => setNewEndDate(e.target.value)}
                    className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
                  <span className="block text-[10px] mt-0.5">deixe vazio se ainda não há prazo fechado</span>
                </label>
              </div>
            </div>

            {/* ---- Dados comerciais da oportunidade --------------------- */}
            {modo === "estimativa" && (
              <div className="rounded-lg p-2.5 space-y-2.5" style={{ background: T.bg, border: `1px solid ${T.line}` }}>
                <div className="text-[11px] font-medium flex items-center gap-1.5" style={{ color: T.inkMuted }}>
                  <Wallet size={12} /> Dados da oportunidade
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <label className="text-[11px]" style={{ color: T.inkMuted }}>Cliente
                    <input value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="quem está pedindo o orçamento"
                      className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
                  </label>
                  <div className="text-[11px]" style={{ color: T.inkMuted }}>Responsável
                    <div className="mt-1"><SearchPick options={data.collaborators.filter((c) => c.active !== false)}
                      value={responsavelId} onChange={setResponsavelId} placeholder="quem está tocando isso..." /></div>
                  </div>
                  <label className="text-[11px]" style={{ color: T.inkMuted }}>Valor estimado (R$)
                    <input type="number" min={0} step="0.01" value={valorEstimado} onChange={(e) => setValorEstimado(e.target.value)} placeholder="opcional"
                      className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
                  </label>
                </div>
                <label className="text-[11px] block" style={{ color: T.inkMuted }}>Observações
                  <input value={observacoes} onChange={(e) => setObservacoes(e.target.value)} placeholder="opcional"
                    className="mt-1 w-full text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
                </label>

                {/* A decisão que separa previsão de pré-reserva. */}
                <div className="rounded-md p-2" style={{ background: segurarRecursos ? T.goldSoft : T.subtle }}>
                  <label className="flex items-start gap-2 text-xs" style={{ cursor: canSegurar ? "pointer" : "not-allowed" }}>
                    <input type="checkbox" className="mt-0.5" checked={segurarRecursos} disabled={!canSegurar}
                      onChange={(e) => { setSegurarRecursos(e.target.checked); if (e.target.checked && !segurarAte) setSegurarAte(addDays(todayStr(), 7)); }} />
                    <span>
                      <strong>Segurar recursos</strong> — bloqueia sala, equipe e equipamento de verdade até a data abaixo.
                      <span className="block text-[10px]" style={{ color: T.inkMuted }}>
                        Sem marcar, a estimativa só calcula: outra reserva pode ocupar o mesmo horário.
                        {!canSegurar && " Você não tem permissão pra segurar recursos — peça ao gestor."}
                      </span>
                    </span>
                  </label>
                  {segurarRecursos && (
                    <label className="text-[11px] block mt-1.5" style={{ color: T.gold }}>Segurar até
                      <input type="date" min={todayStr()} value={segurarAte} onChange={(e) => setSegurarAte(e.target.value)}
                        className="mt-1 text-sm px-3 py-2 rounded-lg outline-none" style={{ border: `1px solid ${segurarAte ? T.line : T.danger}` }} />
                      <span className="block text-[10px] mt-0.5" style={{ color: T.inkMuted }}>
                        Depois dessa data o bloqueio cai sozinho e os recursos voltam a ficar livres. A estimativa fica no histórico.
                      </span>
                    </label>
                  )}
                </div>
              </div>
            )}
          </div>
        ) : estudoFixo ? null : (
          /* Quando o estudo vem da tela de Estudos (`estudoFixo`), o seletor
             some: escolher de novo, dentro da página do próprio estudo, é a
             mesma duplicação que se acabou de tirar. */
          <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Buscar estudo já cadastrado
            <div className="mt-1">
              {studyOptions.length === 0 ? <div className="text-xs" style={{ color: T.inkMuted }}>Nenhum estudo cadastrado ainda — comece em "Novo estudo".</div> :
                <SearchPick options={studyOptions} value={selectedStudyId} onChange={setSelectedStudyId} placeholder="Buscar por nome do estudo..." />}
            </div>
          </div>
        )}
        {sponsor && (
          <div className="flex items-center gap-2 text-xs flex-wrap" style={{ color: T.inkMuted }}>
            {effectiveStudyName && <Chip tone="accent">{effectiveStudyName}</Chip>}
            <span>{sponsor.name}</span>
            {niche && <Chip tone={niche.name === "Padrão" ? "accent" : "gold"}>{niche.name}</Chip>}
          </div>
        )}
        {/* Resumo em DATAS do que foi combinado, com o diagnóstico de prazo —
            é o que responde "isso cabe?" sem a pessoa ter que contar dias. */}
        {readyToPlan && (() => {
          const visitas = drafts.map((d) => ({ offsetDays: d.offsetDays, toleranceDays: d.toleranceDays }));
          const fit = studyFit({ ...studyForWindow, baselineDate }, visitas);
          return (
            <div className="text-[11px] space-y-1" style={{ color: T.inkMuted }}>
              <div className="flex items-center gap-1.5 flex-wrap">
                <CalendarRange size={12} />
                <span>D0 em <strong style={{ color: T.accentDark }}>{weekdayLabel(baselineDate)}</strong>.</span>
                {fit.protocolEnd && <span>Com as {visitas.length} visita(s) abaixo, o estudo termina em <strong style={{ color: T.accentDark }}>{weekdayLabel(fit.protocolEnd)}</strong>.</span>}
                {fit.endDate && <span>Prazo combinado: {weekdayLabel(fit.endDate)}.</span>}
              </div>
              {studySource === "existing" && !currentStudy?.baselineDate && <div>Esse estudo ainda não tinha D0; adotamos a data de criação.</div>}
              {fit.problems.length > 0 && (
                <div className="rounded-md px-2 py-1.5 space-y-0.5" style={{ background: T.warnSoft, color: T.warn }}>
                  {fit.problems.map((p, i) => <div key={i}><AlertTriangle size={11} className="inline -mt-0.5 mr-1" />{p}</div>)}
                  <div>As visitas continuam podendo ser agendadas dentro do prazo — o que passar dele precisa de renegociação em Estudos.</div>
                </div>
              )}
            </div>
          );
        })()}
      </div>

      {!readyToPlan && (
        <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, color: T.warn }} className="rounded-xl p-3 text-xs flex items-center gap-2">
          <AlertTriangle size={14} /> {studySource === "new" ? "Dê um nome ao estudo pra continuar." : "Escolha um estudo já cadastrado pra continuar."}
        </div>
      )}

      {/* A sugestão pode envelhecer entre gerar e confirmar: outra pessoa pode
          ter pego a sala, a pessoa ou o aparelho nesse meio-tempo. */}
      {confirmError && (
        <div style={{ background: T.dangerSoft, border: `1px solid ${T.danger}`, color: T.danger }} className="rounded-xl p-3 space-y-1.5">
          <div className="text-sm font-medium flex items-center gap-2"><AlertTriangle size={15} /> Esse plano não vale mais</div>
          <div className="text-[11px]">Alguma coisa mudou desde que a sugestão foi gerada — provavelmente outra pessoa reservou antes. Nada foi gravado.</div>
          <ul className="text-[11px] list-disc list-inside">{confirmError.problemas.map((p, i) => <li key={i}>{p}</li>)}</ul>
          <Btn small icon={RefreshCw} onClick={() => { setConfirmError(null); regenerateFor(confirmError.tpId, confirmError.mode); }}>Gerar nova sugestão</Btn>
        </div>
      )}

      {readyToPlan && (
        <div className="space-y-4">
          {drafts.map((draft) => (
            <TimepointPlanner key={draft.tpId} draft={draft} data={data} bookings={bookings}
              onChange={(patch) => updateDraft(draft.tpId, patch)}
              onRemove={() => removeTimepoint(draft.tpId)} canRemove={drafts.length > 1}
              onConfirm={(mode) => confirmTimepoint(draft.tpId, mode)}
              onCreateTrainingRequest={onCreateTrainingRequest} studyNameHint={effectiveStudyName} baselineDate={baselineDate}
              study={studyForWindow} ehEstimativa={modo === "estimativa"}
              canSolicitarHoraExtra={canSolicitarHoraExtra} onCreateOvertimeRequest={onCreateOvertimeRequest} overtimeRequests={overtimeRequests} actorName={actorName} />
          ))}
          <Btn small icon={Plus} variant="subtle" onClick={addTimepoint}>Adicionar outro timepoint a este estudo</Btn>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Agenda — uma linha por recurso, com blocos proporcionais ao horário       */
/* coloridos por patrocinador e com o nome do estudo escrito dentro. Uma     */
/* linha vertical marca "agora" quando a data exibida é hoje, e os recursos  */
/* com reserva no dia sobem pro topo. Substitui a antiga dupla Lista +       */
/* Linha do tempo — nenhuma das duas deixava claro o que estava agendado     */
/* sem clicar em cada barra (v1: só leitura — arrastar pra reagendar fica    */
/* pra depois, porque exige refazer a checagem de conflito em tempo real).   */
/* ---------------------------------------------------------------------- */
function sponsorColor(sponsorId) {
  let h = 0;
  const s = sponsorId || "";
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function AgendaView({ items, bookings, category, dateStr, onSelectBooking, selectedBookingId, onRequestEncaixe }) {
  const startHour = 7, endHour = 20, totalMin = (endHour - startHour) * 60;
  const hours = Array.from({ length: endHour - startHour + 1 }, (_, i) => startHour + i);
  const isToday = dateStr === todayStr();
  const now = new Date();
  const nowPct = ((now.getHours() * 60 + now.getMinutes() - startHour * 60) / totalMin) * 100;
  const showNow = isToday && nowPct >= 0 && nowPct <= 100;

  // Faixa de disponibilidade cadastrada do recurso naquele dia da semana, em % da
  // régua — o que sobra fora dela é o "fora do horário", que a gente sombreia pra
  // ficar visível que ali ainda cabe coisa, só que custa hora extra.
  const availBand = (item) => {
    const avail = item.availability || DEFAULT_AVAIL;
    if (!avail[weekdayKey(dateStr)]) return null; // não trabalha nesse dia: tudo é fora
    const s = Math.max(toMin(avail.start) - startHour * 60, 0);
    const e = Math.min(toMin(avail.end) - startHour * 60, totalMin);
    if (e <= s) return null;
    return { startPct: (s / totalMin) * 100, endPct: (e / totalMin) * 100 };
  };
  // Converte a posição do clique na régua em horário, arredondando pra meia hora —
  // o usuário clica "por volta das 19h" e o formulário abre já com 19:00.
  const timeFromClick = (e, el) => {
    const rect = el.getBoundingClientRect();
    const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    const mins = startHour * 60 + Math.round((pct * totalMin) / 30) * 30;
    return `${String(Math.floor(mins / 60)).padStart(2, "0")}:${String(mins % 60).padStart(2, "0")}`;
  };

  const rows = items
    .map((item) => ({ item, itemBookings: bookings.filter((b) => b.date === dateStr && bookingMatchesResource(b, category, item.id)).sort((a, b) => a.start.localeCompare(b.start)) }))
    .sort((a, b) => b.itemBookings.length - a.itemBookings.length || a.item.name.localeCompare(b.item.name));

  return (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl overflow-hidden">
      <div className="overflow-x-auto">
        <div style={{ minWidth: 780 }}>
          <div className="flex px-4 py-2 items-center" style={{ borderBottom: `1px solid ${T.line}` }}>
            <div style={{ width: 170, color: T.inkMuted }} className="text-[11px] font-medium uppercase tracking-wide shrink-0">Recurso</div>
            <div className="flex-1 flex">
              {hours.map((h) => <div key={h} style={{ flex: 1, color: T.inkMuted }} className="text-[10px] text-center">{h}h</div>)}
            </div>
          </div>
          {rows.length === 0 && <div className="px-4 py-4 text-xs" style={{ color: T.inkMuted }}>Nada cadastrado nessa categoria ainda.</div>}
          {rows.map(({ item, itemBookings }) => {
            const band = availBand(item);
            const outsideZones = band
              ? [{ from: 0, to: band.startPct }, { from: band.endPct, to: 100 }].filter((z) => z.to - z.from > 0.5)
              : [{ from: 0, to: 100 }];
            return (
            <div key={item.id} className="flex items-center px-4 py-2" style={{ borderBottom: `1px solid ${T.line}` }}>
              <div style={{ width: 170 }} className="text-xs font-medium truncate pr-2 shrink-0 flex items-center gap-1.5">
                <span className="truncate">{item.name}</span>
                {itemBookings.length > 0 && <Chip tone="accent">{itemBookings.length}</Chip>}
              </div>
              <div className="flex-1 relative" style={{ height: 44, background: T.subtle, borderRadius: 8 }}>
                {/* Fora do horário cadastrado: hachurado. Clicável (quando permitido)
                    porque é exatamente ali que se pede encaixe/hora extra. */}
                {outsideZones.map((z, i) => (
                  <div key={i}
                    onClick={onRequestEncaixe ? (e) => onRequestEncaixe(item, timeFromClick(e, e.currentTarget.parentElement)) : undefined}
                    title={onRequestEncaixe ? "Fora do horário normal — clique pra pedir um encaixe aqui" : "Fora do horário normal"}
                    style={{
                      position: "absolute", left: `${z.from}%`, width: `${z.to - z.from}%`, top: 0, bottom: 0,
                      background: `repeating-linear-gradient(45deg, rgba(127,142,145,.30), rgba(127,142,145,.30) 4px, transparent 4px, transparent 8px)`,
                      borderRadius: 8, cursor: onRequestEncaixe ? "copy" : "default",
                    }} />
                ))}
                {hours.map((h, i) => i > 0 && (
                  <div key={h} style={{ position: "absolute", left: `${(i / (endHour - startHour)) * 100}%`, top: 0, bottom: 0, width: 1, background: T.gridLine }} />
                ))}
                {showNow && <div style={{ position: "absolute", left: `${nowPct}%`, top: -3, bottom: -3, width: 2, background: T.danger, zIndex: 2, borderRadius: 1 }} />}
                {itemBookings.map((b) => {
                  const s = Math.max(toMin(b.start) - startHour * 60, 0);
                  const e = Math.min(toMin(b.end) - startHour * 60, totalMin);
                  if (e <= s) return null;
                  const selected = selectedBookingId === b.id;
                  /* Três níveis de compromisso, três desenhos diferentes — e
                   * nenhum depende só de cor: o ícone e o título dizem o
                   * mesmo. Previsão fica translúcida e tracejada (não ocupa
                   * de verdade); pré-reserva fica sólida com borda dourada
                   * (ocupa, mas por prazo); reserva é o bloco cheio de
                   * sempre. */
                  const tipo = bookingTypeOf(b);
                  const ocupa = bookingOccupies(b);
                  const previsao = tipo === "estimate" && !ocupa;
                  const preReserva = tipo === "estimate" && ocupa;
                  const marca = tipo === "training" ? "🎓" : previsao ? "◇" : preReserva ? "◈" : "";
                  const explica = previsao
                    ? "Estimativa sem bloqueio (previsão — não ocupa)"
                    : preReserva ? `Pré-reserva de estimativa até ${b.holdUntil}`
                    : tipo === "training" ? "Treinamento" : "Reserva confirmada";
                  return (
                    <div key={b.id} onClick={() => onSelectBooking(b)} title={`${explica}\n${b.studyName} · ${b.start}–${b.end}`}
                      style={{
                        position: "absolute", left: `${(s / totalMin) * 100}%`, width: `${((e - s) / totalMin) * 100}%`, top: 3, bottom: 3,
                        background: sponsorColor(b.sponsorId), borderRadius: 6, cursor: "pointer", overflow: "hidden",
                        opacity: previsao ? 0.45 : 1,
                        border: previsao ? `1.5px dashed ${T.ink}` : preReserva ? `2px solid ${T.gold}` : "none",
                        display: "flex", alignItems: "center", gap: 3, padding: "0 6px",
                        boxShadow: selected ? `0 0 0 2px ${T.ink}` : "none",
                      }}>
                      {marca && <span className="text-[9px] shrink-0" style={{ color: "#fff", textShadow: "0 1px 2px rgba(0,0,0,0.45)" }}>{marca}</span>}
                      <span className="truncate text-[10px] font-medium" style={{ color: "#fff", textShadow: "0 1px 2px rgba(0,0,0,0.45)" }}>{b.studyName}</span>
                    </div>
                  );
                })}
              </div>
            </div>
            );
          })}
        </div>
      </div>
      <div className="px-4 py-2 flex items-center gap-4 flex-wrap text-[11px]" style={{ color: T.inkMuted, borderTop: `1px solid ${T.line}` }}>
        {showNow && <span className="flex items-center gap-1.5"><div style={{ width: 14, height: 2, background: T.danger, borderRadius: 1 }} /> Agora</span>}
        {/* Legenda dos níveis de compromisso — cor sozinha não basta. */}
        <span className="flex items-center gap-1.5"><div style={{ width: 14, height: 10, borderRadius: 2, background: T.inkMuted }} /> Reserva confirmada</span>
        <span className="flex items-center gap-1.5"><div style={{ width: 14, height: 10, borderRadius: 2, background: T.inkMuted, border: `2px solid ${T.gold}` }} /> ◈ Pré-reserva de estimativa</span>
        <span className="flex items-center gap-1.5"><div style={{ width: 14, height: 10, borderRadius: 2, background: T.inkMuted, opacity: 0.45, border: `1.5px dashed ${T.ink}` }} /> ◇ Estimativa sem bloqueio</span>
        <span className="flex items-center gap-1.5">🎓 Treinamento</span>
        <span className="flex items-center gap-1.5">
          <div style={{ width: 14, height: 10, borderRadius: 2, background: `repeating-linear-gradient(45deg, rgba(127,142,145,.30), rgba(127,142,145,.30) 4px, transparent 4px, transparent 8px)` }} />
          Fora do horário normal{onRequestEncaixe ? " — clique pra pedir encaixe" : ""}
        </span>
      </div>
    </div>
  );
}
