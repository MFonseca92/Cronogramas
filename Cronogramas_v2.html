/* ---------------------------------------------------------------------- */
/* Indicadores — visão financeira/operacional do setor, só pra Gestor pra   */
/* cima (capacidade `indicadores`). Tudo period-scoped (mês ou ano, com     */
/* navegação): dinheiro agendado por categoria, custo de hora extra         */
/* confirmada, perda por reagendamento vs cancelamento (só "perda           */
/* confirmada" — cancellationOutcome já existe e decide isso), e métricas   */
/* de otimização (ocupação de sala, carga por pessoa, taxa de cancelamento).*/
/* ---------------------------------------------------------------------- */
const MONTH_NAMES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function IndicatorsView({ data, bookings, cancellations, overtimeRequests, estimates }) {
  const [periodType, setPeriodType] = useState("month"); // "month" | "year"
  const [refDate, setRefDate] = useState(todayStr());
  const [costCategory, setCostCategory] = useState("sponsor");

  const shiftPeriod = (dir) => {
    const d = new Date(refDate + "T00:00:00");
    if (periodType === "month") d.setMonth(d.getMonth() + dir); else d.setFullYear(d.getFullYear() + dir);
    setRefDate(fmtDate(d));
  };
  const periodLabel = periodType === "month" ? `${MONTH_NAMES[Number(refDate.slice(5, 7)) - 1]} de ${refDate.slice(0, 4)}` : refDate.slice(0, 4);
  const inPeriod = (dateStr) => (periodType === "month" ? dateStr.slice(0, 7) === refDate.slice(0, 7) : dateStr.slice(0, 4) === refDate.slice(0, 4));

  // Treinamento é custo do SETOR, não custo de execução de estudo. Misturar
  // inflaria o custo atribuído aos protocolos com uma hora que não foi
  // gasta neles — por isso entra numa linha própria, não no total agendado.
  const todasDoPeriodo = useMemo(() => bookings.filter((b) => inPeriod(b.date)), [bookings, periodType, refDate]);
  /* Estimativa é PREVISÃO e sai de todo número de execução. Somar orçamento
   * com o que está confirmado responderia uma pergunta que ninguém fez, e
   * inflaria o custo do setor com estudo que talvez nem aconteça. */
  const estimativasDoPeriodo = useMemo(() => todasDoPeriodo.filter(isEstimateBooking), [todasDoPeriodo]);
  const confirmadasDoPeriodo = useMemo(() => todasDoPeriodo.filter((b) => !isEstimateBooking(b)), [todasDoPeriodo]);
  const periodBookings = useMemo(() => confirmadasDoPeriodo.filter((b) => !isTrainingBooking(b)), [confirmadasDoPeriodo]);
  const treinamentosDoPeriodo = useMemo(() => confirmadasDoPeriodo.filter(isTrainingBooking), [confirmadasDoPeriodo]);
  const totalScheduled = useMemo(() => bookingsCost(periodBookings, data), [periodBookings, data]);
  const custoTreinamento = useMemo(() => bookingsCost(treinamentosDoPeriodo, data), [treinamentosDoPeriodo, data]);
  const custoEstimado = useMemo(() => bookingsCost(estimativasDoPeriodo, data), [estimativasDoPeriodo, data]);
  // Horas seguradas AGORA por oportunidade não aprovada — a capacidade que
  // está fora do mercado esperando uma decisão comercial.
  const horasSeguradas = useMemo(() => estimativasDoPeriodo
    .filter((b) => bookingOccupies(b))
    .reduce((s, b) => s + (toMin(b.end) - toMin(b.start)) / 60, 0), [estimativasDoPeriodo]);
  const conv = useMemo(() => conversionStats(estimates, (e) => inPeriod((e.createdAt || "").slice(0, 10))), [estimates, periodType, refDate]);
  const reuso = useMemo(() => capacityReuse(estimates, bookings), [estimates, bookings]);
  // Taxa de conversão por cliente — é a pergunta de quem quer saber onde
  // vale a pena investir tempo de orçamento.
  const porCliente = useMemo(() => {
    const chaves = [...new Set((estimates || []).map((e) => e.client).filter(Boolean))];
    return chaves.map((c) => ({ cliente: c, ...conversionStats(estimates, (e) => e.client === c) }))
      .filter((x) => x.encerradas > 0).sort((a, b) => b.taxa - a.taxa).slice(0, 6);
  }, [estimates]);

  const COST_CATEGORY_OPTIONS = [
    { id: "sponsor", label: "Patrocinador", icon: Briefcase },
    { id: "location", label: "Locais", icon: Building2 },
    { id: "equipment", label: "Equipamentos", icon: Package },
    { id: "collaborator", label: "Colaboradores", icon: Users },
  ];
  const costByCategory = useMemo(() => {
    const totals = {};
    const bump = (id, name, val) => { if (!id || !(val > 0)) return; if (!totals[id]) totals[id] = { name, total: 0 }; totals[id].total += val; };
    periodBookings.forEach((b) => {
      const durH = (toMin(b.end) - toMin(b.start)) / 60;
      if (costCategory === "sponsor") bump(b.sponsorId, data.sponsors.find((s) => s.id === b.sponsorId)?.name || "—", bookingCost(b, data));
      else if (costCategory === "location") { const loc = data.locations.find((l) => l.id === b.locationId); if (loc) bump(loc.id, loc.name, (loc.hourlyCost || 0) * durH); }
      else if (costCategory === "equipment") { const eq = data.equipment.find((e) => e.id === b.equipmentId); if (eq) bump(eq.id, eq.name, (eq.hourlyCost || 0) * durH); }
      else if (costCategory === "collaborator") (b.collaboratorIds || []).forEach((cid) => { const c = data.collaborators.find((x) => x.id === cid); if (c) bump(c.id, c.name, (c.hourlyCost || 0) * durH); });
    });
    return Object.values(totals).map((t) => ({ name: t.name.length > 18 ? t.name.slice(0, 17) + "…" : t.name, custo: Math.round(t.total * 100) / 100 }))
      .sort((a, b) => b.custo - a.custo).slice(0, 8);
  }, [periodBookings, data, costCategory]);

  // Custo de hora extra: só entra na conta quem tem hourlyCost cadastrado (médico
  // geralmente não tem — mesmo critério silencioso do bookingCost) e só reservas
  // "confirmado" pelo gestor contam como custo real; pendente/disponível é só
  // sinalização, ainda pode não acontecer.
  const overtimeCost = (req) => {
    if (!req.personId) return 0;
    const person = req.role === "doctor" ? data.doctors.find((d) => d.id === req.personId) : data.collaborators.find((c) => c.id === req.personId);
    if (!person?.hourlyCost) return 0;
    return person.hourlyCost * ((toMin(req.end) - toMin(req.start)) / 60);
  };
  const periodOvertime = useMemo(() => overtimeRequests.filter((r) => inPeriod(r.date)), [overtimeRequests, periodType, refDate]);
  const overtimeStats = useMemo(() => {
    const confirmed = periodOvertime.filter((r) => r.status === "confirmado");
    const aguardando = periodOvertime.filter((r) => r.status === "pendente" || r.status === "disponivel");
    return { total: confirmed.reduce((s, r) => s + overtimeCost(r), 0), confirmedCount: confirmed.length, aguardandoCount: aguardando.length };
  }, [periodOvertime, data]);

  // Só "perda confirmada" conta aqui (cancellationOutcome já decide isso — data já
  // passou, sem reaproveitamento, aviso curto demais). "Em risco" é só um alerta à
  // parte, ainda pode se resolver.
  const periodCancellations = useMemo(() => (cancellations || []).filter((c) => inPeriod(c.date)).map((c) => ({ ...c, outcome: cancellationOutcome(c, bookings) })), [cancellations, bookings, periodType, refDate]);
  const lossStats = useMemo(() => {
    const reagend = periodCancellations.filter((c) => c.kind === "reagendado" && c.outcome.status === "perda");
    const cancel = periodCancellations.filter((c) => c.kind === "excluído" && c.outcome.status === "perda");
    const emRisco = periodCancellations.filter((c) => c.outcome.status === "em_risco");
    return {
      reagendTotal: reagend.reduce((s, c) => s + (c.cost || 0), 0), reagendCount: reagend.length,
      cancelTotal: cancel.reduce((s, c) => s + (c.cost || 0), 0), cancelCount: cancel.length,
      emRiscoTotal: emRisco.reduce((s, c) => s + (c.cost || 0), 0), emRiscoCount: emRisco.length,
    };
  }, [periodCancellations]);

  const utilizationStats = useMemo(() => {
    const perLoc = data.locations.map((loc) => {
      let pct;
      if (periodType === "month") pct = monthlyCapacityPct(loc, bookings, refDate);
      else {
        const year = refDate.slice(0, 4);
        const vals = Array.from({ length: 12 }).map((_, i) => monthlyCapacityPct(loc, bookings, `${year}-${String(i + 1).padStart(2, "0")}-01`)).filter((v) => v != null);
        pct = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
      }
      return { name: loc.name, pct };
    }).filter((r) => r.pct != null);
    const avg = perLoc.length ? Math.round(perLoc.reduce((s, r) => s + r.pct, 0) / perLoc.length) : null;
    const sorted = [...perLoc].sort((a, b) => b.pct - a.pct);
    return { avg, top: sorted.slice(0, 3), bottom: perLoc.length >= 6 ? sorted.slice(-3).reverse() : [] };
  }, [data.locations, bookings, periodType, refDate]);

  const workloadStats = useMemo(() => {
    const counts = {};
    periodBookings.forEach((b) => {
      (b.collaboratorIds || []).forEach((id) => { counts[id] = (counts[id] || 0) + 1; });
      if (b.doctorId) counts[b.doctorId] = (counts[b.doctorId] || 0) + 1;
    });
    const people = [...data.collaborators.filter((c) => c.active).map((c) => ({ id: c.id, name: c.name, role: "collaborator" })),
      ...data.doctors.filter((d) => d.active).map((d) => ({ id: d.id, name: d.name, role: "doctor" }))];
    const ranked = people.map((p) => ({ ...p, count: counts[p.id] || 0 })).sort((a, b) => b.count - a.count);
    return { top: ranked.slice(0, 5), idle: ranked.filter((p) => p.count === 0).length, totalPeople: people.length };
  }, [periodBookings, data.collaborators, data.doctors]);

  const cancelRate = periodBookings.length + periodCancellations.length > 0
    ? Math.round((periodCancellations.length / (periodBookings.length + periodCancellations.length)) * 100) : null;

  const stat = (label, value, Icon, tone = "accent") => (
    <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 flex items-center gap-3">
      <div style={{ background: tone === "danger" ? T.dangerSoft : tone === "gold" ? T.goldSoft : T.accentSoft, color: tone === "danger" ? T.danger : tone === "gold" ? T.gold : T.accentDark }} className="p-2.5 rounded-lg"><Icon size={18} /></div>
      <div className="min-w-0"><div style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-xl font-bold truncate">{value}</div>
        <div className="text-xs" style={{ color: T.inkMuted }}>{label}</div></div>
    </div>
  );

  return (
    <div className="space-y-5">
      <Section icon={TrendingUp} title="Indicadores" subtitle="Visão financeira e operacional do setor — visível só pra gestão." />

      <div className="flex items-center gap-2 flex-wrap">
        <div className="flex gap-1.5">
          <button onClick={() => setPeriodType("month")} className="text-xs font-medium px-3 py-1.5 rounded-lg" style={{ background: periodType === "month" ? T.accent : T.surface, color: periodType === "month" ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>Mês</button>
          <button onClick={() => setPeriodType("year")} className="text-xs font-medium px-3 py-1.5 rounded-lg" style={{ background: periodType === "year" ? T.accent : T.surface, color: periodType === "year" ? "#fff" : T.inkMuted, border: `1px solid ${T.line}` }}>Ano</button>
        </div>
        <div className="flex items-center gap-1">
          <Btn small variant="ghost" icon={ChevronLeft} onClick={() => shiftPeriod(-1)} />
          <div className="text-sm font-medium px-2 min-w-[130px] text-center capitalize" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{periodLabel}</div>
          <Btn small variant="ghost" icon={ChevronRight} onClick={() => shiftPeriod(1)} />
        </div>
        {refDate !== todayStr() && <Btn small variant="ghost" onClick={() => setRefDate(todayStr())}>Hoje</Btn>}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {stat("Execução de estudos", fmtBRL(totalScheduled), Wallet, "accent")}
        {/* Treinamento é custo do setor, separado da execução dos protocolos —
            somar os dois atribuiria aos estudos uma hora que não foi deles. */}
        {stat("Treinamento", fmtBRL(custoTreinamento), GraduationCap, "gold")}
        {stat("Custo de hora extra", fmtBRL(overtimeStats.total), Timer, "gold")}
        {stat("Perda por cancelamento", fmtBRL(lossStats.cancelTotal), AlertTriangle, "danger")}
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        {stat("Perda por reagendamento", fmtBRL(lossStats.reagendTotal), CalendarRange, "danger")}
        {stat("Total do setor", fmtBRL(totalScheduled + custoTreinamento), Wallet, "neutral")}
      </div>

      <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4">
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold">Dinheiro agendado por categoria</div>
          <div className="flex gap-1.5 flex-wrap">
            {COST_CATEGORY_OPTIONS.map((c) => (
              <button key={c.id} onClick={() => setCostCategory(c.id)} className="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-lg"
                style={{ background: costCategory === c.id ? T.accent : T.subtle, color: costCategory === c.id ? "#fff" : T.inkMuted }}>
                <c.icon size={12} /> {c.label}
              </button>
            ))}
          </div>
        </div>
        {costByCategory.length === 0 ? (
          <div className="text-xs py-6 text-center" style={{ color: T.inkMuted }}>Nada agendado com custo cadastrado nesse período.</div>
        ) : (
          <div style={{ height: Math.max(160, costByCategory.length * 32) }}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={costByCategory} layout="vertical" margin={{ left: 10, right: 10 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={T.gridLine} horizontal={false} />
                <XAxis type="number" tick={{ fontSize: 11, fill: T.inkMuted }} />
                <YAxis type="category" dataKey="name" width={130} tick={{ fontSize: 10, fill: T.inkMuted }} />
                <Tooltip formatter={(v) => fmtBRL(v)} contentStyle={{ fontSize: 12, borderRadius: 8, border: `1px solid ${T.line}` }} />
                <Bar dataKey="custo" radius={[0, 4, 4, 0]}>{costByCategory.map((_, i) => <Cell key={i} fill={PALETTE[i % PALETTE.length]} />)}</Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        )}
        <div className="text-[11px] mt-2" style={{ color: T.inkMuted }}>
          {costCategory === "sponsor" ? "Custo total das reservas (sala + equipamento + colaboradores) atribuído ao patrocinador do estudo."
            : "Só a fatia de custo/hora do próprio recurso — não conta sala/equipamento/outras pessoas da mesma reserva."}
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-2">
          <div className="flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}><Timer size={15} style={{ color: T.gold }} /><span className="text-sm font-semibold">Horas extras</span></div>
          <div className="text-xs" style={{ color: T.inkMuted }}>{overtimeStats.confirmedCount} confirmada(s) no período · {overtimeStats.aguardandoCount} ainda em aberto (pedida ou aguardando sua aprovação)</div>
          <div className="text-2xl font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif", color: T.gold }}>{fmtBRL(overtimeStats.total)}</div>
          <div className="text-[11px]" style={{ color: T.inkMuted }}>Soma duração × custo/hora de quem topou a hora extra — só médico/colaborador com custo cadastrado entra na conta.</div>
        </div>

        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-2">
          <div className="flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}><AlertTriangle size={15} style={{ color: T.danger }} /><span className="text-sm font-semibold">Perdas confirmadas</span></div>
          <div className="flex items-center justify-between text-xs"><span style={{ color: T.inkMuted }}>Reagendamento ({lossStats.reagendCount})</span><span style={{ color: T.danger, fontWeight: 600 }}>{fmtBRL(lossStats.reagendTotal)}</span></div>
          <div className="flex items-center justify-between text-xs"><span style={{ color: T.inkMuted }}>Cancelamento ({lossStats.cancelCount})</span><span style={{ color: T.danger, fontWeight: 600 }}>{fmtBRL(lossStats.cancelTotal)}</span></div>
          {lossStats.emRiscoCount > 0 && <div className="flex items-center justify-between text-xs pt-1" style={{ borderTop: `1px dashed ${T.line}` }}><span style={{ color: T.gold }}>Em risco, ainda não confirmada ({lossStats.emRiscoCount})</span><span style={{ color: T.gold, fontWeight: 600 }}>{fmtBRL(lossStats.emRiscoTotal)}</span></div>}
          <div className="text-[11px]" style={{ color: T.inkMuted }}>Reserva cancelada/reagendada com menos de 48h de aviso e cuja sala/horário ninguém mais ocupou — o custo do recurso parado.</div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-2">
          <div className="flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}><Building2 size={15} style={{ color: T.accentDark }} /><span className="text-sm font-semibold">Ocupação de salas</span></div>
          <div className="text-2xl font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{utilizationStats.avg != null ? `${utilizationStats.avg}%` : "—"}</div>
          <div className="text-[11px]" style={{ color: T.inkMuted }}>média entre as salas com horário cadastrado, no período</div>
          {utilizationStats.top.length > 0 && (
            <div className="pt-1 space-y-1">
              {utilizationStats.top.map((r) => <div key={r.name} className="text-xs flex items-center justify-between"><span className="truncate" style={{ color: T.ink }}>{r.name}</span><span style={{ color: T.accentDark, fontWeight: 600 }}>{r.pct}%</span></div>)}
              {utilizationStats.bottom.map((r) => <div key={r.name} className="text-xs flex items-center justify-between"><span className="truncate" style={{ color: T.inkMuted }}>{r.name}</span><span style={{ color: T.inkMuted }}>{r.pct}%</span></div>)}
            </div>
          )}
        </div>

        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-2">
          <div className="flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}><Users size={15} style={{ color: T.accentDark }} /><span className="text-sm font-semibold">Carga por pessoa</span></div>
          <div className="text-[11px] mb-1" style={{ color: T.inkMuted }}>{workloadStats.idle} de {workloadStats.totalPeople} sem nenhuma reserva no período</div>
          <div className="space-y-1">
            {workloadStats.top.filter((p) => p.count > 0).map((p) => (
              <div key={p.id} className="text-xs flex items-center justify-between gap-2">
                <span className="truncate flex items-center gap-1" style={{ color: T.ink }}>{p.role === "doctor" ? <Stethoscope size={11} /> : <Users size={11} />} {p.name}</span>
                <span style={{ color: T.accentDark, fontWeight: 600 }}>{p.count}</span>
              </div>
            ))}
            {workloadStats.top.every((p) => p.count === 0) && <div className="text-xs" style={{ color: T.inkMuted }}>Ninguém com reserva nesse período.</div>}
          </div>
        </div>

        <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-2">
          <div className="flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif" }}><RefreshCw size={15} style={{ color: T.accentDark }} /><span className="text-sm font-semibold">Cancelamento/reagendamento</span></div>
          <div className="text-2xl font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{cancelRate != null ? `${cancelRate}%` : "—"}</div>
          <div className="text-[11px]" style={{ color: T.inkMuted }}>{periodCancellations.length} cancelamento(s)/reagendamento(s) pra {periodBookings.length} reserva(s) no período</div>
        </div>
      </div>

      {/* ---- Oportunidades ------------------------------------------------ */}
      <div className="pt-1">
        <div className="text-sm font-semibold mb-2 flex items-center gap-1.5" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>
          <Wallet size={15} style={{ color: T.accentDark }} /> Oportunidades (estimativas)
        </div>
        <div className="text-[11px] mb-2" style={{ color: T.inkMuted }}>
          Nada aqui entra nos números acima: previsão não é execução, e somar as duas responderia uma pergunta que ninguém fez.
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-1.5">
            <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Criadas em {periodLabel}</div>
            <div className="text-2xl font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{conv.total}</div>
            <div className="text-[11px] space-y-0.5" style={{ color: T.inkMuted }}>
              <div>{conv.abertas} em aberto · {conv.convertidas} convertida(s)</div>
              <div>{conv.canceladas} cancelada(s) · {conv.expiradas} expirada(s)</div>
              {conv.valorAberto > 0 && <div>Valor em aberto: <strong style={{ color: T.gold }}>{fmtBRL(conv.valorAberto)}</strong></div>}
              {conv.valorConvertido > 0 && <div>Valor convertido: <strong style={{ color: T.accentDark }}>{fmtBRL(conv.valorConvertido)}</strong></div>}
            </div>
          </div>

          <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-1.5">
            <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Taxa de conversão</div>
            <div className="text-2xl font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{conv.taxa != null ? `${conv.taxa}%` : "—"}</div>
            <div className="text-[11px]" style={{ color: T.inkMuted }}>
              {conv.convertidas} de {conv.encerradas} encerrada(s).
              {" "}<span title="Estimativa ainda aberta não conta como fracasso — ela só não foi decidida ainda.">As {conv.abertas} em aberto ficam de fora da conta.</span>
            </div>
            {porCliente.length > 0 && (
              <div className="pt-1 space-y-0.5">
                <div className="text-[10px] uppercase tracking-wide" style={{ color: T.inkMuted }}>Por cliente (todo o histórico)</div>
                {porCliente.map((c) => (
                  <div key={c.cliente} className="text-[11px] flex items-center justify-between gap-2">
                    <span className="truncate">{c.cliente}</span>
                    <span style={{ color: T.accentDark, fontWeight: 600 }}>{c.convertidas}/{c.encerradas} · {c.taxa}%</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div style={{ background: T.surface, border: `1px solid ${T.line}` }} className="rounded-xl p-4 space-y-1.5">
            <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Capacidade segurada e devolvida</div>
            <div className="text-2xl font-bold" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{horasSeguradas.toFixed(1)}h</div>
            <div className="text-[11px]" style={{ color: T.inkMuted }}>
              seguradas em {periodLabel} por oportunidade ainda não aprovada
              {custoEstimado > 0 && <> · custo previsto {fmtBRL(custoEstimado)}</>}
            </div>
            {/* Cancelar uma oportunidade e encaixar outro estudo no mesmo
                horário não é perda nenhuma — por isso as três linhas. */}
            <div className="pt-1 text-[11px] space-y-0.5" style={{ color: T.inkMuted }}>
              <div className="text-[10px] uppercase tracking-wide">Depois que a estimativa soltou o horário</div>
              <div>Liberadas: <strong>{reuso.liberadas.toFixed(1)}h</strong></div>
              <div style={{ color: T.accentDark }}>Reaproveitadas: <strong>{reuso.reaproveitadas.toFixed(1)}h</strong> — outro estudo ocupou</div>
              <div style={{ color: T.warn }}>Não reaproveitadas: <strong>{reuso.naoReaproveitadas.toFixed(1)}h</strong> — o dia chegou e ficou vazio</div>
              {reuso.emAberto > 0 && <div>Ainda em aberto: {reuso.emAberto.toFixed(1)}h — a data não chegou, cedo pra julgar</div>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* ItemForm — um formulário só, reaproveitado por todas as categorias do    */
/* Cadastro (locais, equipamentos, atividades, médicos, colaboradores...);  */
/* os campos que aparecem mudam conforme `cat`.                            */
/* ---------------------------------------------------------------------- */
function ItemForm({ cat, data, editing, onSubmit, onCancel }) {
  const blank = () => {
    if (cat === "locations") return { id: genId(cat), name: "", availability: { ...DEFAULT_AVAIL }, active: true, hourlyCost: null, capacity: null };
    if (cat === "doctors") return { id: genId(cat), name: "", availability: { ...DEFAULT_AVAIL }, active: true, hourlyCost: null };
    if (cat === "equipment") return { id: genId("eq"), name: "", isAccessory: false, accessoryIds: [], availability: { ...DEFAULT_AVAIL }, active: true, lastCalibration: null, calibrationIntervalDays: null, hourlyCost: null };
    if (cat === "accessories") return { id: genId("eq"), name: "", isAccessory: true, availability: { ...DEFAULT_AVAIL }, active: true, lastCalibration: null, calibrationIntervalDays: null, hourlyCost: null };
    if (cat === "activities") return { id: genId("act"), name: "", minLevel: 3, locationIds: [], durationMin: 60, supplyUsage: [], setupMin: 0, teardownMin: 0, minGapMin: 0, staffCount: 1, maxParticipants: null, mestre: false, cedivel: false };
    if (cat === "collaborators") return { id: genId("col"), name: "", levels: {}, availability: { ...DEFAULT_AVAIL }, active: true, hourlyCost: null };
    if (cat === "niches") return { id: genId("niche"), name: "" };
    if (cat === "sponsors") return { id: genId("sp"), name: "", nicheId: data.niches[0]?.id || null };
    if (cat === "supplies") return { id: genId("sup"), name: "", quantity: 0, minThreshold: 0, unit: "un", active: true };
    if (cat === "trainingTypes") return trainingTypeBlank();
    return { id: genId(cat), name: "" };
  };
  const [item, setItem] = useState(editing || blank());
  useEffect(() => { setItem(editing || blank()); }, [editing, cat]);

  const [pendingActivity, setPendingActivity] = useState(data.activities[0]?.id || "");
  const [pendingLevel, setPendingLevel] = useState(3);
  const [pendingSupply, setPendingSupply] = useState("");
  const [pendingQty, setPendingQty] = useState(1);

  const submit = () => { if (!item.name.trim()) return; onSubmit(item); };

  return (
    <div style={{ background: T.surface, border: `1px dashed ${T.line}` }} className="rounded-xl p-3.5 space-y-3">
      <div className="flex flex-wrap gap-2 items-end">
        <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Nome</div>
          <input value={item.name} onChange={(e) => setItem({ ...item, name: e.target.value })} className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-64" style={{ border: `1px solid ${T.line}` }} />
        </label>

        {cat === "activities" && (
          <div className="w-full space-y-1.5">
            <div className="text-xs" style={{ color: T.inkMuted }}>O quanto se pode mexer em quem está nesta atividade</div>
            <div className="flex flex-wrap gap-1.5">
              {[
                { id: "mestre", label: "Mestre — ninguém sai, nem pedindo",
                  desc: "Núcleo do protocolo. A leitura depende de quem executa, então trocar a pessoa no meio introduz variação entre medidas que deveriam ser comparáveis. O técnico do estudo é obrigatório aqui." },
                { id: "cedivel", label: "Cedível — outro agendador puxa direto",
                  desc: "Apoio, Fluxo e afins. Quem precisa da pessoa para uma atividade maior leva sem pedir permissão." },
              ].map((op) => {
                const ligado = !!item[op.id];
                return (
                  <button key={op.id} title={op.desc}
                    onClick={() => setItem({
                      ...item,
                      // Mestre e cedível são opostos: marcar um desmarca o outro.
                      mestre: op.id === "mestre" ? !ligado : false,
                      cedivel: op.id === "cedivel" ? !ligado : false,
                    })}
                    className="text-[11px] px-2.5 py-1.5 rounded-lg text-left"
                    style={{ background: ligado ? (op.id === "mestre" ? T.dangerSoft : T.accentSoft) : T.subtle,
                             color: ligado ? (op.id === "mestre" ? T.danger : T.accentDark) : T.inkMuted }}>
                    {op.label}
                  </button>
                );
              })}
            </div>
            {!item.mestre && !item.cedivel && (
              <div className="text-[10px]" style={{ color: T.inkMuted }}>
                Sem marcação: dá para negociar a pessoa, mas só com pedido ao outro agendador.
              </div>
            )}
          </div>
        )}

        {cat === "trainingTypes" && (
          <React.Fragment>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Atividade treinada</div>
              <select value={item.activityId || ""} onChange={(e) => setItem({ ...item, activityId: e.target.value || null })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-56" style={{ border: `1px solid ${T.line}` }}>
                <option value="">— nenhuma —</option>
                {data.activities.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Duração (min)</div>
              <input type="number" min={15} step={15} value={item.durationMin ?? TRAINING_DEFAULT_MIN}
                onChange={(e) => setItem({ ...item, durationMin: Number(e.target.value) || TRAINING_DEFAULT_MIN })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Nível que a aula habilita</div>
              <div className="flex gap-1">
                {[1, 2, 3, 4, 5].map((nv) => (
                  <button key={nv} onClick={() => setItem({ ...item, requiredLevel: nv })} className="text-xs w-7 h-7 rounded-md font-medium"
                    style={{ background: item.requiredLevel === nv ? T.gold : T.subtle, color: item.requiredLevel === nv ? "#fff" : T.inkMuted }}>{nv}</button>
                ))}
              </div>
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Sala</div>
              <select value={item.locationId || ""} onChange={(e) => setItem({ ...item, locationId: e.target.value || null })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-56" style={{ border: `1px solid ${T.line}` }}>
                <option value="">— sem sala fixa —</option>
                {data.locations.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
              </select>
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Equipamento</div>
              {/* Trocar o aparelho zera os acessórios: sonda do MPA A não serve
                  no MPA B, e deixar a lista antiga criaria um tipo inválido. */}
              <select value={item.equipmentId || ""} onChange={(e) => setItem({ ...item, equipmentId: e.target.value || null, accessoryIds: [] })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-56" style={{ border: `1px solid ${T.line}` }}>
                <option value="">— sem equipamento —</option>
                {data.equipment.filter((e) => !e.isAccessory).map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Instrutor padrão</div>
              <select value={item.trainerId || ""} onChange={(e) => setItem({ ...item, trainerId: e.target.value || null })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-56" style={{ border: `1px solid ${T.line}` }}>
                <option value="">— definir na hora —</option>
                {data.collaborators.filter((c) => c.active !== false).map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </label>
          </React.Fragment>
        )}
        {cat === "trainingTypes" && item.equipmentId && (
          <div className="w-full">
            <div className="text-xs mb-1" style={{ color: T.inkMuted }}>Acessórios do aparelho que a aula usa</div>
            <div className="flex flex-wrap gap-1.5">
              {(data.equipment.find((e) => e.id === item.equipmentId)?.accessoryIds || []).map((accId) => {
                const acc = data.equipment.find((e) => e.id === accId);
                const marcado = (item.accessoryIds || []).includes(accId);
                return (
                  <button key={accId} onClick={() => setItem({ ...item, accessoryIds: marcado ? item.accessoryIds.filter((x) => x !== accId) : [...(item.accessoryIds || []), accId] })}
                    className="text-[11px] px-2 py-1 rounded-full" style={{ background: marcado ? T.accentSoft : T.subtle, color: marcado ? T.accentDark : T.inkMuted }}>
                    {acc?.name || "?"}
                  </button>
                );
              })}
              {!(data.equipment.find((e) => e.id === item.equipmentId)?.accessoryIds || []).length && (
                <span className="text-[11px]" style={{ color: T.inkMuted }}>esse aparelho não tem acessórios cadastrados</span>
              )}
            </div>
          </div>
        )}
        {cat === "trainingTypes" && (
          <label className="text-xs w-full"><div className="mb-1" style={{ color: T.inkMuted }}>Observações</div>
            <input value={item.notes || ""} onChange={(e) => setItem({ ...item, notes: e.target.value })} placeholder="opcional"
              className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-full" style={{ border: `1px solid ${T.line}` }} />
          </label>
        )}

        {cat === "activities" && (
          <React.Fragment>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Nível mínimo exigido para realizar</div>
              <div className="flex gap-1">
                {[0, 1, 2, 3, 4, 5].map((n) => (
                  <button key={n} onClick={() => setItem({ ...item, minLevel: n })} className="text-xs w-7 h-7 rounded-md font-medium"
                    style={{ background: item.minLevel === n ? T.gold : T.subtle, color: item.minLevel === n ? "#fff" : T.inkMuted }}>{n}</button>
                ))}
              </div>
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Duração padrão (min)</div>
              <input type="number" min={15} step={15} value={item.durationMin ?? 60} onChange={(e) => setItem({ ...item, durationMin: Number(e.target.value) || 60 })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Preparo antes (min)</div>
              <input type="number" min={0} step={5} value={item.setupMin ?? 0} onChange={(e) => setItem({ ...item, setupMin: Number(e.target.value) || 0 })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Desmontagem depois (min)</div>
              <input type="number" min={0} step={5} value={item.teardownMin ?? 0} onChange={(e) => setItem({ ...item, teardownMin: Number(e.target.value) || 0 })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Intervalo até a próxima (min)</div>
              <input type="number" min={0} step={5} value={item.minGapMin ?? 0} onChange={(e) => setItem({ ...item, minGapMin: Number(e.target.value) || 0 })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Pessoas necessárias</div>
              <input type="number" min={1} max={10} value={item.staffCount ?? 1} onChange={(e) => setItem({ ...item, staffCount: Math.max(1, Number(e.target.value) || 1) })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Máx. participantes</div>
              <input type="number" min={0} placeholder="sem limite" value={item.maxParticipants ?? ""} onChange={(e) => setItem({ ...item, maxParticipants: e.target.value ? Number(e.target.value) : null })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-28" style={{ border: `1px solid ${T.line}` }} />
            </label>
          </React.Fragment>
        )}

        {cat === "locations" && (
          <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Capacidade (participantes)</div>
            <input type="number" min={0} placeholder="sem limite" value={item.capacity ?? ""} onChange={(e) => setItem({ ...item, capacity: e.target.value ? Number(e.target.value) : null })}
              className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-28" style={{ border: `1px solid ${T.line}` }} />
          </label>
        )}

        {cat === "sponsors" && (
          <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Nicho</div>
            <select value={item.nicheId || ""} onChange={(e) => setItem({ ...item, nicheId: e.target.value })} className="text-sm px-2.5 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }}>
              {data.niches.map((n) => <option key={n.id} value={n.id}>{n.name}</option>)}
            </select>
          </label>
        )}

        {(cat === "equipment" || cat === "accessories") && (
          <React.Fragment>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Última calibração</div>
              <input type="date" value={item.lastCalibration || ""} onChange={(e) => setItem({ ...item, lastCalibration: e.target.value || null })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Validade (dias)</div>
              <input type="number" min={1} placeholder="não rastreado" value={item.calibrationIntervalDays ?? ""}
                onChange={(e) => setItem({ ...item, calibrationIntervalDays: e.target.value ? Number(e.target.value) : null })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-28" style={{ border: `1px solid ${T.line}` }} />
            </label>
          </React.Fragment>
        )}

        {(cat === "locations" || cat === "equipment" || cat === "accessories" || cat === "collaborators" || cat === "doctors") && (
          <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Custo por hora (R$)</div>
            <input type="number" min={0} step="0.01" placeholder="opcional" value={item.hourlyCost ?? ""}
              onChange={(e) => setItem({ ...item, hourlyCost: e.target.value ? Number(e.target.value) : null })}
              className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
          </label>
        )}

        {cat === "supplies" && (
          <React.Fragment>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Quantidade em estoque</div>
              <input type="number" min={0} value={item.quantity ?? 0} onChange={(e) => setItem({ ...item, quantity: Number(e.target.value) || 0 })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-28" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Limite mínimo</div>
              <input type="number" min={0} value={item.minThreshold ?? 0} onChange={(e) => setItem({ ...item, minThreshold: Number(e.target.value) || 0 })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
            </label>
            <label className="text-xs"><div className="mb-1" style={{ color: T.inkMuted }}>Unidade</div>
              <input value={item.unit || ""} placeholder="un, L, par..." onChange={(e) => setItem({ ...item, unit: e.target.value })}
                className="text-sm px-2.5 py-1.5 rounded-lg outline-none w-24" style={{ border: `1px solid ${T.line}` }} />
            </label>
          </React.Fragment>
        )}

        <Btn small icon={Check} onClick={submit}>{editing ? "Salvar alterações" : "Adicionar"}</Btn>
        {editing && <Btn small variant="ghost" icon={X} onClick={onCancel}>Cancelar</Btn>}
      </div>

      {cat === "equipment" && (
        <div>
          <div className="text-xs font-medium mb-1.5" style={{ color: T.inkMuted }}>Acessórios vinculados (o usuário poderá escolher incluí-los ou não na hora de reservar)</div>
          {data.equipment.filter((e) => e.isAccessory).length === 0 ? (
            <div className="text-xs" style={{ color: T.inkMuted }}>Nenhum acessório cadastrado ainda — cadastre em "Acessórios" primeiro.</div>
          ) : (
            <div className="flex flex-wrap gap-1.5">
              {data.equipment.filter((e) => e.isAccessory).map((e) => {
                const active = (item.accessoryIds || []).includes(e.id);
                return (
                  <button key={e.id} onClick={() => setItem({ ...item, accessoryIds: active ? item.accessoryIds.filter((id) => id !== e.id) : [...(item.accessoryIds || []), e.id] })}
                    className="text-xs px-2.5 py-1 rounded-full" style={{ background: active ? T.accent : T.subtle, color: active ? "#fff" : T.inkMuted }}>{e.name}</button>
                );
              })}
            </div>
          )}
        </div>
      )}

      {cat === "activities" && (
        <div>
          <div className="text-xs font-medium mb-1.5" style={{ color: T.inkMuted }}>Salas onde esse método pode ser executado (deixe vazio para permitir qualquer sala)</div>
          <div className="flex flex-wrap gap-1.5">
            {data.locations.map((l) => {
              const active = (item.locationIds || []).includes(l.id);
              return (
                <button key={l.id} onClick={() => setItem({ ...item, locationIds: active ? item.locationIds.filter((id) => id !== l.id) : [...(item.locationIds || []), l.id] })}
                  className="text-xs px-2.5 py-1 rounded-full" style={{ background: active ? T.accent : T.subtle, color: active ? "#fff" : T.inkMuted }}>{l.name}</button>
              );
            })}
          </div>
        </div>
      )}

      {cat === "activities" && (data.supplies || []).length > 0 && (
        <div className="space-y-2">
          <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Suprimentos consumidos por execução (opcional)</div>
          <div className="flex flex-wrap gap-2 items-end">
            <select value={pendingSupply} onChange={(e) => setPendingSupply(e.target.value)} className="text-xs px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }}>
              <option value="">Escolher suprimento...</option>
              {data.supplies.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <input type="number" min={1} value={pendingQty} onChange={(e) => setPendingQty(Number(e.target.value) || 1)}
              className="text-xs px-2 py-1.5 rounded-lg outline-none w-16" style={{ border: `1px solid ${T.line}` }} />
            <Btn small icon={Plus} disabled={!pendingSupply} onClick={() => {
              const rest = (item.supplyUsage || []).filter((u) => u.supplyId !== pendingSupply);
              setItem({ ...item, supplyUsage: [...rest, { supplyId: pendingSupply, qty: pendingQty }] });
            }}>Adicionar</Btn>
          </div>
          <div className="flex flex-wrap gap-1.5">
            {(item.supplyUsage || []).map((u) => {
              const s = data.supplies.find((x) => x.id === u.supplyId);
              return (
                <span key={u.supplyId} className="text-[11px] px-2 py-1 rounded-full flex items-center gap-1.5" style={{ background: T.accentSoft, color: T.accentDark }}>
                  {s?.name || "?"} · {u.qty} {s?.unit}
                  <button onClick={() => setItem({ ...item, supplyUsage: item.supplyUsage.filter((x) => x.supplyId !== u.supplyId) })}><X size={11} /></button>
                </span>
              );
            })}
          </div>
        </div>
      )}

      {cat === "collaborators" && (
        <div className="space-y-2">
          <div className="text-xs font-medium" style={{ color: T.inkMuted }}>Níveis de treinamento por atividade (0–5 estrelas)</div>
          <div className="flex flex-wrap gap-2 items-end">
            <select value={pendingActivity} onChange={(e) => setPendingActivity(e.target.value)} className="text-xs px-2 py-1.5 rounded-lg outline-none" style={{ border: `1px solid ${T.line}` }}>
              {data.activities.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
            <div className="flex gap-0.5">{[0, 1, 2, 3, 4, 5].map((n) => (
              <button key={n} onClick={() => setPendingLevel(n)} className="text-xs w-6 h-6 rounded-md font-medium" style={{ background: pendingLevel === n ? T.gold : T.subtle, color: pendingLevel === n ? "#fff" : T.inkMuted }}>{n}</button>
            ))}</div>
            <Btn small icon={Plus} onClick={() => setItem({ ...item, levels: { ...item.levels, [pendingActivity]: pendingLevel } })}>Adicionar nível</Btn>
          </div>
          <div className="flex flex-wrap gap-1.5">
            {Object.entries(item.levels || {}).map(([actId, star]) => {
              const act = data.activities.find((a) => a.id === actId);
              return (
                <span key={actId} className="text-[11px] px-2 py-1 rounded-full flex items-center gap-1.5" style={{ background: T.accentSoft, color: T.accentDark }}>
                  {act?.name} <Stars level={star} />
                  <button onClick={() => { const l = { ...item.levels }; delete l[actId]; setItem({ ...item, levels: l }); }}><X size={11} /></button>
                </span>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>

<noscript>Este teste precisa de JavaScript habilitado no navegador.</noscript>
</body>
</html>
